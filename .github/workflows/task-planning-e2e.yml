name: Task planning browser E2E
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: task-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    if: github.head_ref == 'feature/product-improvements-stage1-tasks'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tili
          POSTGRES_PASSWORD: tili
          POSTGRES_DB: task_browser_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tili -d task_browser_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tili:tili@127.0.0.1:5432/task_browser_test
      E2E_FIXTURE_FILE: /tmp/task-browser-fixture.json
      E2E_RESULT_DIR: /tmp/task-browser-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked application dependencies
        run: |
          set -euo pipefail
          corepack enable && corepack prepare pnpm@10.34.5 --activate
          for dir in 'Тили-тили/app' 'Тили-тили/backend'; do
            (cd "$dir" && printf '\nminimum-release-age=0\n' >> .npmrc && pnpm install --frozen-lockfile --node-linker=hoisted)
          done
      - name: Install isolated browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Migrate disposable database
        working-directory: Тили-тили/backend
        run: DATABASE_URL="$TEST_DATABASE_URL" node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m migrations up
      - name: Exercise two browser sessions against the real API
        run: |
          set -euo pipefail
          mkdir -p "$E2E_RESULT_DIR"
          (cd 'Тили-тили/backend' && node node_modules/tsx/dist/cli.mjs scripts/task-e2e-server.mts) > "$RUNNER_TEMP/task-api.log" 2>&1 & api=$!
          (cd 'Тили-тили/app' && node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 3000) > "$RUNNER_TEMP/task-vite.log" 2>&1 & ui=$!
          trap 'kill "$api" "$ui" 2>/dev/null || true; rm -f "$E2E_FIXTURE_FILE"' EXIT
          for attempt in $(seq 1 60); do
            if test -f "$E2E_FIXTURE_FILE" && curl --fail --silent http://127.0.0.1:3001/health/ready >/dev/null && curl --fail --silent http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 1
          done
          python 'Тили-тили/backend/scripts/task-e2e-browser.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-planning-browser-evidence
          path: ${{ env.E2E_RESULT_DIR }}
          retention-days: 7
          if-no-files-found: warn
