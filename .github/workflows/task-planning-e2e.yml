name: Task planning browser E2E
permissions:
  contents: read
concurrency:
  group: task-browser-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  browser:
    # Уникальное имя проверки: три job'а `browser` давали в PR три одинаковых
    # строки, их нельзя было различить и сделать обязательными по имени.
    name: task-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tili
          POSTGRES_PASSWORD: tili
          POSTGRES_DB: task_browser_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U tili -d task_browser_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tili:tili@127.0.0.1:5432/task_browser_test
      E2E_FIXTURE_FILE: /tmp/task-browser-fixture.json
      E2E_RESULT_DIR: /tmp/task-browser-evidence
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install locked application dependencies
      run: |
        set -euo pipefail
        corepack enable && corepack prepare pnpm@10.34.5 --activate
        for dir in 'Тили-тили/app' 'Тили-тили/backend'; do
          (cd "$dir" && printf '\nminimum-release-age=0\n' >> .npmrc && pnpm install --frozen-lockfile --node-linker=hoisted)
        done
    - name: Install isolated browser test tooling
      run: bash .github/scripts/install-ci-chromium.sh
    - name: Migrate disposable database
      working-directory: Тили-тили/backend
      run: DATABASE_URL="$TEST_DATABASE_URL" node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m migrations up
    - name: Exercise two browser sessions against the real API
      run: |
        set -euo pipefail
        mkdir -p "$E2E_RESULT_DIR"
        rm -f "$E2E_FIXTURE_FILE"
        unset SERVICE_PLANS_JSON
        (
          cd 'Тили-тили/backend'
          export E2E_SC001=yes E2E_SC013=yes E2E_SC015=yes E2E_SC017_PROGRAM=yes E2E_CONTRACT_ACCESS=yes
          export E2E_WP01_PDF=yes E2E_WP04=yes E2E_WP05=yes E2E_WP06=yes E2E_WP09=yes E2E_WP12=yes
          exec node --import tsx scripts/task-e2e-server.mts
        ) > "$RUNNER_TEMP/task-api.log" 2>&1 & api=$!
        (cd 'Тили-тили/app' && exec node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 3000 --strictPort) > "$RUNNER_TEMP/task-vite.log" 2>&1 & ui=$!
        trap 'kill "$api" "$ui" 2>/dev/null || true; rm -f "$E2E_FIXTURE_FILE"' EXIT
        # This fixture runs the real reminder function directly, without Redis.
        # Bootstrap SQL must finish (private fixture file), then HTTP must be live.
        # Production /health/ready semantics are intentionally unchanged.
        wait_for_fixture() {
          for attempt in $(seq 1 60); do
            if ! kill -0 "$api" 2>/dev/null || ! kill -0 "$ui" 2>/dev/null; then break; fi
            if test -s "$E2E_FIXTURE_FILE" && curl --fail --silent http://127.0.0.1:3001/health >/dev/null && curl --fail --silent http://127.0.0.1:3000 >/dev/null; then return 0; fi
            sleep 1
          done
          python - <<'PYCODE'
        import json,os,pathlib,re
        result={'error':'Fixture services did not become ready','logs':{}}
        for name in ('task-api','task-vite'):
            p=pathlib.Path(os.environ['RUNNER_TEMP'])/(name+'.log')
            text=p.read_text(errors='replace')[-12000:] if p.exists() else 'No log created'
            text=re.sub(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+','[redacted-token]',text)
            text=re.sub(r'postgres(?:ql)?://[^\s"\x27]+','[redacted-db]',text)
            text=re.sub(r'\+7\d{10}','[redacted-phone]',text)
            result['logs'][name]=text
        (pathlib.Path(os.environ['E2E_RESULT_DIR'])/'startup-error.json').write_text(json.dumps(result,indent=2))
        print('Fixture startup failed; see redacted startup-error.json, not fixture credentials')
        PYCODE
          exit 1
        }
        wait_for_fixture
        python 'Тили-тили/backend/scripts/task-e2e-browser.py'
        python 'Тили-тили/backend/scripts/sc001-e2e-browser.py'
        python 'Тили-тили/backend/scripts/sc013-e2e-browser.py'
        python 'Тили-тили/backend/scripts/wp13-conflict-e2e-browser.py'
        python 'Тили-тили/backend/scripts/sc015-e2e-browser.py'
        python 'Тили-тили/backend/scripts/sc017-program-e2e-browser.py'
        python 'Тили-тили/backend/scripts/wp05-calendar-e2e-browser.py'
        python 'Тили-тили/backend/scripts/wp06-delivery-e2e-browser.py'
        python 'Тили-тили/backend/scripts/wp01-private-pdf-e2e-browser.py'
        python 'Тили-тили/backend/scripts/wp04-event-rsvp-e2e-browser.py'
        python 'Тили-тили/backend/scripts/wp09-delegations-e2e-browser.py'
        python 'Тили-тили/backend/scripts/wp12-price-e2e-browser.py'
        python 'Тили-тили/backend/scripts/wp11-catalog-e2e-browser.py'
        kill "$api"
        wait "$api"
        rm -f "$E2E_FIXTURE_FILE"
        export SERVICE_PLANS_JSON="$(cat 'Тили-тили/backend/scripts/wp11-catalog.fixture.json')"
        (cd 'Тили-тили/backend' && exec node --import tsx scripts/task-e2e-server.mts) > "$RUNNER_TEMP/task-api.log" 2>&1 & api=$!
        wait_for_fixture
        python 'Тили-тили/backend/scripts/wp11-catalog-e2e-browser.py'
        python - <<'PYCODE'
        import json,os,pathlib
        r=json.loads((pathlib.Path(os.environ['E2E_RESULT_DIR'])/'browser-result.json').read_text())
        required={'notification-inbox-changes-account','contract-access-rechecked-after-offline-and-focus',
                  'archive-list-rechecked-after-offline-and-focus','deal-reads-rechecked-after-offline-and-focus',
                  'move-consent-rechecked-before-submit-and-after-revocation','order-terms-rechecked-after-offline-and-focus',
                  'order-draft-preserves-input-only-after-access-recheck','order-delivery-materials-rechecked-after-offline-and-focus',
                  'order-resource-plan-and-booking-rechecked-after-offline-and-focus','legacy-calendar-bounds-rechecked-after-offline-and-focus',
                  'order-price-preview-rechecked-without-automatic-calculation',
                  'search-candidates-hidden-after-network-loss-and-membership-revocation',
                  'guest-selected-programme-rechecked-and-forgotten-after-invitation-revocation',
                  'staff-and-delegated-tasks-hidden-after-offline-and-revocation',
                  'additional-event-keyboard-and-conflict-ru','additional-event-keyboard-and-conflict-en',
                  'contract-approval-keyboard-cancel-and-exact-receipts','contract-pdf-keyboard-retry-and-verified-bytes',
                  'tilly-action-keyboard-preview-retry-ru','tilly-action-keyboard-preview-retry-en'}
        assert len(r['passed'])==37 and required<=set(r['passed']) and not r['page_errors'] and 'error' not in r
        sc001=json.loads((pathlib.Path(os.environ['E2E_RESULT_DIR'])/'sc001-browser-result.json').read_text())
        assert sc001['passed']==['date-keyboard-ru','date-keyboard-en','undated','short'] and not sc001['page_errors']
        sc013=json.loads((pathlib.Path(os.environ['E2E_RESULT_DIR'])/'sc013-browser-result.json').read_text())
        assert sc013['passed']==['planb-activation-and-guest-visibility','current-shuttle-pickup','current-guest-lodging',
                                 'guest-logistics-keyboard-ru','guest-logistics-keyboard-en','offline-guest-actions'] and not sc013['page_errors']
        wp13=json.loads((pathlib.Path(os.environ['E2E_RESULT_DIR'])/'wp13-conflict-result.json').read_text())
        assert wp13['passed']==['purchase-draft','item-draft','rental-price-history',
                               'rental-return-keyboard-ru','rental-return-keyboard-en',
                               'purchase-access-recheck','item-access-recheck',
                               'purchases-read-states-ru','purchases-read-states-en',
                               'item-sets-read-states-ru','item-sets-read-states-en'] and not wp13['page_errors']
        sc015=json.loads((pathlib.Path(os.environ['E2E_RESULT_DIR'])/'sc015-browser-result.json').read_text())
        assert sc015['passed']==['addressed-thanks-and-revocation', 'thanks-keyboard-ru-en',
                                 'album-wrapup-and-support-rechecked-after-revocation'] and not sc015['page_errors']
        sc017=json.loads((pathlib.Path(os.environ['E2E_RESULT_DIR'])/'sc017-program-result.json').read_text())
        assert sc017['passed']==['contractor-version-and-revocation','timeline-editor-keyboard-ru','timeline-editor-keyboard-en']
        wp05=json.loads((pathlib.Path(os.environ['E2E_RESULT_DIR'])/'wp05-calendar-result.json').read_text())
        assert wp05['passed']==['external-calendar-keyboard-ru','external-calendar-keyboard-en'] and not wp05['page_errors']
        wp06=json.loads((pathlib.Path(os.environ['E2E_RESULT_DIR'])/'wp06-delivery-result.json').read_text())
        assert wp06['passed']==['vendor-delivery-keyboard-ru','vendor-delivery-keyboard-en'] and not wp06['page_errors']
        wp01=json.loads((pathlib.Path(os.environ['E2E_RESULT_DIR'])/'wp01-private-pdf-result.json').read_text())
        assert wp01['passed']==['private-pdf-keyboard-ru','private-pdf-keyboard-en'] and not wp01['page_errors']
        wp04=json.loads((pathlib.Path(os.environ['E2E_RESULT_DIR'])/'wp04-event-rsvp-result.json').read_text())
        assert wp04['passed']==['separate-event-rsvp-ru','separate-event-rsvp-en'] and not wp04['page_errors']
        wp09=json.loads((pathlib.Path(os.environ['E2E_RESULT_DIR'])/'wp09-delegations-result.json').read_text())
        assert wp09['passed']==['task-delegation-keyboard-ru','task-delegation-keyboard-en'] and not wp09['page_errors']
        wp12=json.loads((pathlib.Path(os.environ['E2E_RESULT_DIR'])/'wp12-price-result.json').read_text())
        assert wp12['passed']==['order-price-keyboard-ru','order-price-keyboard-en'] and not wp12['page_errors']
        for mode, configured in [('empty', False), ('configured', True)]:
            wp11=json.loads((pathlib.Path(os.environ['E2E_RESULT_DIR'])/f'wp11-{mode}.json').read_text())
            assert wp11=={'configured': configured, 'page_errors': [], 'languages': ['ru', 'en'], 'viewport_widths': [320,390,480]}
        PYCODE
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: task-planning-browser-evidence
        path: ${{ env.E2E_RESULT_DIR }}
        retention-days: 7
        if-no-files-found: warn
'on':
  push:
    branches:
    - feature/product-improvements-stage1-tasks
    - codex/t015-sc001-browser-*
    - codex/t016-sc013-browser-*
    - codex/t016-planb-active-guest-message-*
    - codex/t019-purchase-conflict-drafts-*
    - codex/t019-purchase-price-history-*
    - codex/t020-current-pickup-notices-*
    - codex/t020-lodging-history-*
    - codex/t021-guest-thanks-refresh-*
    - codex/t017-service-plan-catalog-*
    - codex/t024-guest-offline-actions-*
    - codex/t024-service-catalog-reconnect-*
    - codex/t024-notification-session-*
    - codex/t024-contract-live-access-*
    - codex/t024-archive-live-access-*
    - codex/t024-deal-read-access-*
    - codex/t024-move-consent-live-*
    - codex/t024-order-terms-live-*
    - codex/t024-order-draft-live-*
    - codex/t024-order-delivery-live-*
    - codex/t024-order-resources-live-*
    - codex/t024-calendar-bounds-live-*
    - codex/t024-price-preview-live-*
    - codex/t024-matrix-search-*
    - codex/t024-matrix-guest-*
    - codex/t024-matrix-staff-*
    - codex/t024-matrix-closeout-*
    - codex/t025-*
    - codex/t026-sc015-wrapup-*
    - codex/t026-wp11-catalog-ci-*
  pull_request:
    branches:
    - main
