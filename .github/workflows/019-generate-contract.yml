name: 019 contract regeneration

on:
  push:
    branches:
      - integration/019-audited-20260928
    paths:
      - '.github/workflows/019-generate-contract.yml'
      - 'Тили-тили/Тили-тили_API_openapi.yaml'

permissions:
  contents: write

concurrency:
  group: 019-contract-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Тили-тили/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - run: printf 'minimum-release-age=0\n' >> .npmrc
      - run: pnpm install --frozen-lockfile --node-linker=hoisted
      - name: Generate backend contract files
        run: pnpm run gen
      - name: Sync frontend API types
        run: cp src/contract/api.generated.ts ../app/src/lib/api/schema.ts
      - name: Commit generated outputs
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Тили-тили/backend/src/contract/paths.generated.ts" \
                     "Тили-тили/backend/src/contract/schemas.generated.ts" \
                     "Тили-тили/backend/src/contract/api.generated.ts" \
                     "Тили-тили/app/src/lib/api/schema.ts"
          if git diff --cached --quiet; then
            echo "generated files already synchronized"
            exit 0
          fi
          git commit -m "gen(019): regenerate contract from v0.48.0"
          git push origin HEAD:integration/019-audited-20260928
