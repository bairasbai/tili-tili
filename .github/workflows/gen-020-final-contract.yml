name: Generate 020 final contract
on:
  push:
    branches: ['test/020-finalize-20260928']
    paths:
      - 'Тили-тили/Тили-тили_API_openapi.yaml'
      - '.github/workflows/gen-020-final-contract.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: test/020-finalize-20260928 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generate
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          cd Тили-тили/backend
          printf 'minimum-release-age=0\n' > .npmrc
          pnpm install --frozen-lockfile --node-linker=hoisted
          rm .npmrc
          pnpm run gen
          node node_modules/openapi-typescript/bin/cli.js ../Тили-тили_API_openapi.yaml -o ../app/src/lib/api/schema.ts
          cd ../..
          git diff --check
      - name: Commit generated files
        run: |
          git config user.name Bibo
          git config user.email bayrasbay02@gmail.com
          git add Тили-тили/backend/src/contract/paths.generated.ts Тили-тили/backend/src/contract/schemas.generated.ts Тили-тили/backend/src/contract/api.generated.ts Тили-тили/app/src/lib/api/schema.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(020): regenerate final contract artifacts"
          # The 020 test branch is intentionally active while generation runs.
          # Rebase the generated commit onto the newest head instead of losing
          # a correct generation to a non-fast-forward push race.
          git pull --rebase origin test/020-finalize-20260928
          git push origin HEAD:test/020-finalize-20260928
