name: Task stage review workspace

on:
  push:
    branches: [feature/product-improvements-stage1-tasks]
    paths: [.github/workflows/task-stage-workspace.yml]

permissions:
  contents: read
  actions: read

jobs:
  workspace:
    if: github.ref == 'refs/heads/feature/product-improvements-stage1-tasks'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies for offline checks
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          for dir in 'Тили-тили/app' 'Тили-тили/backend'; do
            (cd "$dir" && printf '\nminimum-release-age=0\n' >> .npmrc && pnpm install --frozen-lockfile --node-linker=hoisted)
          done
      - name: Export tracked source and dependency trees only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task-workspace/export"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/task-workspace/export"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/task-workspace/export/WORKSPACE_COMMIT"
          for dir in 'Тили-тили/app' 'Тили-тили/backend'; do
            cp -a "$dir/node_modules" "$RUNNER_TEMP/task-workspace/export/$dir/node_modules"
          done
          tar -czf "$RUNNER_TEMP/task-workspace/workspace.tar.gz" -C "$RUNNER_TEMP/task-workspace/export" .
          sha256sum "$RUNNER_TEMP/task-workspace/workspace.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: task-stage-workspace
          path: ${{ runner.temp }}/task-workspace/workspace.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
