name: Verify 019 finalization

on:
  push:
    branches: ['test/019-finalization-20260928']

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tili
          POSTGRES_PASSWORD: tili
          POSTGRES_DB: tili_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tili -d tili_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tili:tili@127.0.0.1:5432/tili_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and migrate
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          for part in app backend; do
            cd "Тили-тили/$part"
            printf 'minimum-release-age=0\n' > .npmrc
            pnpm install --frozen-lockfile --node-linker=hoisted
            rm .npmrc
            cd ../..
          done
          cd Тили-тили/backend
          DATABASE_URL="$TEST_DATABASE_URL" node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m migrations up
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Target T039 T040
        run: cd Тили-тили/backend && pnpm vitest run test/accept019.test.ts
      - name: Full gate
        run: bash init.sh
      - name: Browser T041 on final code
        run: |
          set -euo pipefail
          export E2E_FIXTURE_FILE="$RUNNER_TEMP/offer019-final-fixture.json"
          export E2E_RESULT_DIR="$RUNNER_TEMP/offer019-final-browser"
          BACK="$GITHUB_WORKSPACE/Тили-тили/backend"
          FRONT="$GITHUB_WORKSPACE/Тили-тили/app"
          cd "$BACK"
          node --input-type=module -e 'import pg from "pg";const c=new pg.Client({connectionString:process.env.TEST_DATABASE_URL});await c.connect();await c.query("CREATE DATABASE offers_test OWNER tili");await c.end()'
          export TEST_DATABASE_URL=postgres://tili:tili@127.0.0.1:5432/offers_test
          DATABASE_URL="$TEST_DATABASE_URL" node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m migrations up
          node --import tsx scripts/offers-e2e-server.mts > "$RUNNER_TEMP/offer019-final-server.log" 2>&1 &
          BACK_PID=$!
          cd "$FRONT"
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 3000 --strictPort > "$RUNNER_TEMP/offer019-final-vite.log" 2>&1 &
          FRONT_PID=$!
          cleanup() { kill "$FRONT_PID" "$BACK_PID" 2>/dev/null || true; wait "$FRONT_PID" "$BACK_PID" 2>/dev/null || true; rm -f "$E2E_FIXTURE_FILE"; }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if test -f "$E2E_FIXTURE_FILE" && grep -q OFFERS_BROWSER_FIXTURE_READY "$RUNNER_TEMP/offer019-final-server.log" && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            kill -0 "$BACK_PID" "$FRONT_PID"
            sleep 1
          done
          test -f "$E2E_FIXTURE_FILE"
          python "$BACK/scripts/offers-e2e-browser.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offer019-finalization-evidence
          path: |
            ${{ runner.temp }}/offer019-final-browser/
            ${{ runner.temp }}/offer019-final-server.log
            ${{ runner.temp }}/offer019-final-vite.log
          retention-days: 7
