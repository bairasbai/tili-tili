name: Apply verified 021 snapshot fixes
on:
  push:
    branches: [feature/021-timeline-concurrency]
    paths: [.github/workflows/021-apply-snapshot.yml, .github/patches/021-snapshot-edits.json]
permissions:
  contents: write
concurrency:
  group: apply-021-snapshot
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'bairasbai/tili-tili' && github.ref == 'refs/heads/feature/021-timeline-concurrency'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tili
          POSTGRES_PASSWORD: tili
          POSTGRES_DB: tili
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U tili -d tili" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tili:tili@localhost:5432/tili
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Require the reviewed checkout and apply exact content hashes
        run: |
          set -euo pipefail
          actual_head=$(git rev-parse HEAD)
          actual_parent=$(git rev-parse HEAD^)
          git fetch --no-tags origin refs/heads/feature/021-timeline-concurrency
          remote_head=$(git rev-parse FETCH_HEAD)
          printf 'Checkout=%s\nParent=%s\nRemote=%s\nEvent=%s\n' "$actual_head" "$actual_parent" "$remote_head" "$GITHUB_SHA"
          test "$actual_parent" = '11dab9dc1732903e2f48ba1fe1fb28dbfa3bd102'
          test "$actual_head" = "$GITHUB_SHA"
          test "$remote_head" = "$GITHUB_SHA"
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path.cwd()
          changes=json.loads((root/'.github/patches/021-snapshot-edits.json').read_text())
          prepared=[]
          for change in changes:
              name=pathlib.PurePosixPath(change['path'])
              assert name.parts[0]=='Тили-тили' and '..' not in name.parts and not name.is_absolute()
              path=root/name
              old=path.read_bytes()
              assert hashlib.sha256(old).hexdigest()==change['before'], 'Source changed: '+str(name)
              lines=old.decode().splitlines(keepends=True)
              for start,end,text in reversed(change['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end]=text.splitlines(keepends=True)
              new=''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest()==change['after'], 'Result hash mismatch: '+str(name)
              prepared.append((path,new))
          for path,data in prepared:
              path.write_bytes(data)
          print('Applied',len(prepared),'hash-verified source changes; no main write')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          corepack enable && corepack prepare pnpm@10.34.5 --activate
          for dir in 'Тили-тили/backend' 'Тили-тили/app'; do
            (cd "$dir" && printf '\nminimum-release-age=0\n' >> .npmrc && pnpm install --frozen-lockfile --node-linker=hoisted)
          done
      - name: Generate contract and run full backend gate
        working-directory: Тили-тили/backend
        run: |
          set -euo pipefail
          pnpm run gen
          cp src/contract/api.generated.ts ../app/src/lib/api/schema.ts
          node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
          DATABASE_URL="$TEST_DATABASE_URL" node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m migrations up > "$RUNNER_TEMP/021-migrations.log" 2>&1 || { tail -100 "$RUNNER_TEMP/021-migrations.log"; exit 1; }
          node node_modules/vitest/vitest.mjs run > "$RUNNER_TEMP/021-backend-tests.log" 2>&1 || { tail -200 "$RUNNER_TEMP/021-backend-tests.log"; exit 1; }
          tail -12 "$RUNNER_TEMP/021-backend-tests.log"
          node node_modules/eslint/bin/eslint.js .
          node node_modules/typescript/bin/tsc -p tsconfig.json
      - name: Run full frontend gate
        working-directory: Тили-тили/app
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc -b
          node node_modules/vitest/vitest.mjs run > "$RUNNER_TEMP/021-frontend-tests.log" 2>&1 || { tail -200 "$RUNNER_TEMP/021-frontend-tests.log"; exit 1; }
          tail -12 "$RUNNER_TEMP/021-frontend-tests.log"
          node node_modules/eslint/bin/eslint.js .
          node node_modules/vite/bin/vite.js build
      - name: Commit only the tested application files to the feature branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/feature/021-timeline-concurrency
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          for config in 'Тили-тили/backend/.npmrc' 'Тили-тили/app/.npmrc'; do
            if git ls-files --error-unmatch -- "$config" > /dev/null 2>&1; then
              git restore -- "$config"
            else
              rm -f -- "$config"
            fi
          done
          git diff --check
          python - <<'PY'
          import json, pathlib, subprocess
          changes=json.loads(pathlib.Path('.github/patches/021-snapshot-edits.json').read_text())
          paths=[c['path'] for c in changes]+[
            'Тили-тили/backend/src/contract/api.generated.ts',
            'Тили-тили/backend/src/contract/paths.generated.ts',
            'Тили-тили/backend/src/contract/schemas.generated.ts',
            'Тили-тили/app/src/lib/api/schema.ts',
          ]
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(021): bind timeline snapshots to their versions'
          git push origin HEAD:refs/heads/feature/021-timeline-concurrency
          git rev-parse HEAD | tee "$RUNNER_TEMP/021-tested-source-sha.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/021-reviewed-source.tar.gz" HEAD
          echo "TESTED_SOURCE_COMMIT=$(git rev-parse HEAD)"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeline-021-snapshot-evidence-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/021-*-tests.log
            ${{ runner.temp }}/021-migrations.log
            ${{ runner.temp }}/021-tested-source-sha.txt
            ${{ runner.temp }}/021-reviewed-source.tar.gz
