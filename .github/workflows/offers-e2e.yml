# Stage 019 browser acceptance on the clean integration branch.
name: Offers 019 browser E2E

on:
  push:
    branches:
      - integration/019-audited-20260928
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offers-browser-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tili
          POSTGRES_PASSWORD: tili
          POSTGRES_DB: offers_browser_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tili -d offers_browser_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tili:tili@127.0.0.1:5432/offers_browser_test
      E2E_FIXTURE_FILE: /tmp/offers-browser-fixture.private.json
      E2E_RESULT_DIR: /tmp/offers-browser-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked application dependencies
        run: |
          set -euo pipefail
          corepack enable && corepack prepare pnpm@10.34.5 --activate
          for dir in 'Тили-тили/app' 'Тили-тили/backend'; do
            (cd "$dir" && pnpm install --frozen-lockfile --node-linker=hoisted)
          done
      - name: Install isolated browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Migrate disposable database
        working-directory: Тили-тили/backend
        run: DATABASE_URL="$TEST_DATABASE_URL" node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m migrations up
      - name: Exercise offers with real browser sessions
        run: |
          set -euo pipefail
          mkdir -p "$E2E_RESULT_DIR"
          rm -f "$E2E_FIXTURE_FILE"
          (cd 'Тили-тили/backend' && exec node node_modules/tsx/dist/cli.mjs scripts/offers-e2e-server.mts) > "$RUNNER_TEMP/offers-api.log" 2>&1 & api=$!
          (cd 'Тили-тили/app' && exec node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 3000 --strictPort) > "$RUNNER_TEMP/offers-vite.log" 2>&1 & ui=$!
          trap 'kill "$api" "$ui" 2>/dev/null || true; rm -f "$E2E_FIXTURE_FILE"' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if ! kill -0 "$api" 2>/dev/null || ! kill -0 "$ui" 2>/dev/null; then break; fi
            if test -s "$E2E_FIXTURE_FILE" && curl --fail --silent http://127.0.0.1:3001/health >/dev/null && curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if test "$ready" != 1; then
            tail -c 12000 "$RUNNER_TEMP/offers-api.log" || true
            tail -c 6000 "$RUNNER_TEMP/offers-vite.log" || true
            exit 1
          fi
          python 'Тили-тили/backend/scripts/offers-e2e-browser.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offers-browser-evidence
          path: |
            ${{ env.E2E_RESULT_DIR }}/result.json
            ${{ env.E2E_RESULT_DIR }}/*.png
          retention-days: 7
          if-no-files-found: warn
