name: FR005 exact native84 bindings transfer
'on':
  push:
    branches: [test/fr005-native84-transfer-20261006]
    paths: [.github/workflows/fr005-native84-transfer.yml, .automation/native84.patch]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cp .automation/native84.patch "$RUNNER_TEMP/native84.patch"
      - uses: actions/checkout@v4
        with:
          ref: 3133a27ee4d8afa537b3041e983485f44918cf05
          persist-credentials: false
      - name: Verify reviewed exact tree and upload only Git blobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, json, hashlib, os, urllib.request
          def git(*args): return subprocess.check_output(['git','-c','core.quotePath=false',*args]).decode().strip()
          base='3133a27ee4d8afa537b3041e983485f44918cf05'
          tree='62faedd3749527682a3184d2d6a287e95125d491'
          patch=pathlib.Path(os.environ['RUNNER_TEMP'])/'native84.patch'
          expected={
            'Тили-тили/backend/scripts/c04-c05-receipt-barrier-control.mjs':'27d65f10cc345cf496106372adbafa94544bb165',
            'Тили-тили/backend/test-isolated/c05WorkerFinalBatch.test.ts':'499c91515026acacd9a67a87e1a068c7ab1c772e',
            'Тили-тили/backend/test-support/c04-c05-test-inverse.json':'06516bc1fd2c44e11fad9688bc565fc4cb02f362',
            'Тили-тили/backend/test-support/c04-c05-schema84.test.mjs':'cb320d2c1a4e0c9de25e87c4e278b5d4521b7725',
            'tasks/wedding-platform-master-plan/FR005-NATIVE84-BINDINGS-20261006.md':'63f40dd0ff49126accd7df6ab9b152fabafeb882',
            'JOURNAL.md':'5abeb8723ad410d847b28f55ea8e9263c66a4469',
            'session-handoff.md':'daf58b6842a03b4ed11dfd7017ed61427104de07',
            'tasks/todo.md':'315b664a0c9055c72dd1de32cf7bbf096527be36',
          }
          assert git('rev-parse','HEAD')==base
          assert git('rev-parse','HEAD^{tree}')=='86543d899afa39681ceb06f1f165f77b804b6666'
          assert not git('status','--porcelain')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='547df1f892b3a9c04a7165d6bb7218c0349c805afa75dbf40adec3d637cfd485'
          subprocess.run(['git','apply','--index','--unidiff-zero',str(patch)],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(expected)
          assert git('write-tree')==tree
          for path,blob in expected.items():
            assert git('rev-parse',':'+path)==blob
            assert git('hash-object',path)==blob
          # Transfer only: do not execute application code or update branch references.
          for path,blob in expected.items():
            body=json.dumps({'content':pathlib.Path(path).read_text(),'encoding':'utf-8'}).encode()
            req=urllib.request.Request('https://api.github.com/repos/bairasbai/tili-tili/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=45) as response: assert json.load(response)['sha']==blob
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'native84-proof';out.mkdir()
          (out/'verified.json').write_text(json.dumps({'base':base,'tree':tree,'files':expected},ensure_ascii=False,indent=2))
          print('Transferred eight exact blobs; product references unchanged.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fr005-native84-verified
          path: ${{ runner.temp }}/native84-proof
          retention-days: 2
