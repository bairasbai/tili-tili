name: Repair 019 generated schema sync

on:
  push:
    branches:
      - integration/019-complete-clean-20260928

permissions:
  contents: write

jobs:
  regenerate:
    if: "github.event.head_commit.message == 'repair-019-schema-sync'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
      - name: Install backend dependencies
        working-directory: Тили-тили/backend
        run: |
          printf 'minimum-release-age=0\n' >> .npmrc
          pnpm install --frozen-lockfile --node-linker=hoisted
      - name: Regenerate JSON schema from canonical OpenAPI
        working-directory: Тили-тили/backend
        run: pnpm run gen:schemas
      - name: Commit generated schema
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Тили-тили/backend/src/contract/schemas.generated.ts; then
            echo "schemas.generated.ts is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Тили-тили/backend/src/contract/schemas.generated.ts
          git commit -m "gen(019): regenerate schemas from clean OpenAPI"
          git push origin HEAD:integration/019-complete-clean-20260928
