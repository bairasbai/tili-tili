name: Payment 018 sync current main

'on':
  push:
    branches:
      - integration/018-payments-clean-main-20260928

permissions:
  contents: write

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[payment-main-synced]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --no-tags
          if ! git merge --no-edit origin/main; then
            echo "=== MERGE CONFLICTS ==="
            git status --short
            git diff --name-only --diff-filter=U
            exit 1
          fi
      - name: Remove helper and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/payment-sync-main.yml
          git commit -m "merge(main): sync post-020 docs [payment-main-synced]"
          git push origin HEAD:integration/018-payments-clean-main-20260928
