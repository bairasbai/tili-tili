name: Sync payment integration with current main

'on':
  push:
    branches:
      - integration/018-payments-clean-main-20260928

permissions:
  contents: write

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[payment-main-synced]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --no-tags
          if ! git merge --no-edit origin/main; then
            allowed=(
              "session-handoff.md"
              "tasks/product-improvements-roadmap.md"
            )
            mapfile -d '' conflicts < <(git diff --name-only --diff-filter=U -z)
            for f in "${conflicts[@]}"; do
              ok=0
              for a in "${allowed[@]}"; do
                if [[ "$f" == "$a" ]]; then ok=1; break; fi
              done
              if [[ "$ok" != 1 ]]; then
                echo "Unexpected conflict: $f"
                exit 1
              fi
              git checkout --ours -- "$f"
              git add "$f"
            done
            git -c core.editor=true commit
          fi
      - name: Remove helper and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/payment-sync-main.yml
          git commit -m "chore(018-payments): sync current main [payment-main-synced]"
          git push origin HEAD:integration/018-payments-clean-main-20260928
