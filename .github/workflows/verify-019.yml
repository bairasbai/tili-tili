name: Verify 019 acceptance (temporary)
on:
  push:
    branches: ['test/019-acceptance-20260928']
    paths: ['.github/patches/019/**', '.github/workflows/verify-019.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tili
          POSTGRES_PASSWORD: tili
          POSTGRES_DB: tili
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tili" --health-interval 5s
          --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgres://tili:tili@localhost:5432/tili
      TEST_REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://tili:tili@localhost:5432/tili
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply reviewed source to pinned base and verify content hashes
        run: |
          mkdir -p /tmp/verify019
          git rev-parse HEAD > /tmp/verify019/runner-commit.txt
          cp -r .github/patches/019 /tmp/patch019
          git checkout --detach c4d37c2995d2aeb28bd988cb5144af164ff9fb60
          python /tmp/patch019/backend.py
          python /tmp/patch019/frontend.py
          python /tmp/patch019/docs.py
          cat /tmp/patch019/test.{0,1,2} > 'Тили-тили/backend/test/accept019.test.ts'
          echo '4bfd228b0a1c73e0d091274c090774109523dfa08f794bf708f8c7362a5a2801  Тили-тили/backend/test/accept019.test.ts' | sha256sum --check
          python /tmp/patch019/corrections.py
          git add -N .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
      - name: Install locked dependencies
        id: dependencies
        run: |
          (cd 'Тили-тили/backend' && pnpm install --frozen-lockfile --node-linker=hoisted) > /tmp/verify019/install-backend.log 2>&1
          (cd 'Тили-тили/app' && pnpm install --frozen-lockfile --node-linker=hoisted) > /tmp/verify019/install-app.log 2>&1
      - name: Generate contracts and migrate
        id: generated
        run: |
          cd 'Тили-тили/backend'
          pnpm run gen > /tmp/verify019/generate.log 2>&1
          cp src/contract/api.generated.ts ../app/src/lib/api/schema.ts
          pnpm exec node-pg-migrate up -m migrations > /tmp/verify019/migrate.log 2>&1
      - name: Run independent checks
        id: checks
        if: always() && steps.generated.outcome == 'success'
        run: |
          set +e
          runcheck() {
            local name="$1" dir="$2"; shift 2
            (cd "$dir" && "$@") > "/tmp/verify019/$name.log" 2>&1
            printf '%s\t%s\n' "$name" "$?" >> /tmp/verify019/checks.tsv
          }
          runcheck typecheck-backend 'Тили-тили/backend' pnpm run typecheck
          runcheck lint-backend 'Тили-тили/backend' pnpm run lint
          runcheck acceptance-backend 'Тили-тили/backend' pnpm exec vitest run test/accept019.test.ts --reporter=default --reporter=json --outputFile=/tmp/verify019/acceptance-backend.json
          runcheck typecheck-app 'Тили-тили/app' pnpm exec tsc -b
          runcheck lint-app 'Тили-тили/app' pnpm run lint
          runcheck acceptance-app 'Тили-тили/app' pnpm exec vitest run src/lib/offers019.test.tsx --reporter=default --reporter=json --outputFile=/tmp/verify019/acceptance-app.json
          runcheck backend-tests 'Тили-тили/backend' pnpm exec vitest run --reporter=default --reporter=json --outputFile=/tmp/verify019/backend-tests.json
          runcheck app-tests 'Тили-тили/app' pnpm exec vitest run --reporter=default --reporter=json --outputFile=/tmp/verify019/app-tests.json
          runcheck build-backend 'Тили-тили/backend' pnpm run build
          runcheck build-app 'Тили-тили/app' pnpm run build
          cat /tmp/verify019/checks.tsv
          if grep -v $'\t0$' /tmp/verify019/checks.tsv; then exit 1; fi
      - name: Export evidence and generated source
        if: always()
        run: |
          mkdir -p /tmp/verify019
          git rev-parse HEAD > /tmp/verify019/commit.txt
          git diff --check > /tmp/verify019/diff-check.txt
          git diff > /tmp/verify019/verified.diff
          tail -n 45 /tmp/verify019/*.log > /tmp/verify019/summary.txt || true
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/verify019/verified-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify019
          path: /tmp/verify019/
          retention-days: 3
