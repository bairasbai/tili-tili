name: Payment 018 contract merge helper

'on':
  push:
    branches:
      - integration/018-payments-clean-main-20260928

permissions:
  contents: write

jobs:
  merge-contract:
    if: "!contains(github.event.head_commit.message, '[payment-contract-result]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch audited source branch
        run: git fetch origin claude/review-018a-018b-roadmap-kqhovt --no-tags
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge payment contract delta onto current OpenAPI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruamel.yaml==0.18.15'
          python - <<'PY'
          from copy import deepcopy
          from pathlib import Path
          import io, subprocess, sys
          from collections.abc import Mapping, Sequence
          from ruamel.yaml import YAML

          path = 'Тили-тили/Тили-тили_API_openapi.yaml'
          base_ref = 'd47b5a8f033a6975dcefef84a83b5825a874c8ab'
          payment_ref = '6a106fd043f12f0ed5a5b76d845bc598d1fbbcac'

          def show(ref):
              return subprocess.check_output(['git','show',f'{ref}:{path}'], text=True)

          yaml = YAML()
          yaml.preserve_quotes = True
          yaml.width = 140

          def load(text):
              return yaml.load(io.StringIO(text))

          base = load(show(base_ref))
          theirs = load(show(payment_ref))
          ours_path = Path(path)
          ours = load(ours_path.read_text())

          MISSING = object()
          conflicts = []

          def plain(v):
              if v is MISSING:
                  return ('<missing>',)
              if isinstance(v, Mapping):
                  return {k: plain(x) for k,x in v.items()}
              if isinstance(v, list):
                  return [plain(x) for x in v]
              return v

          def eq(a,b):
              return plain(a) == plain(b)

          def scalar_list(v):
              return isinstance(v, list) and all(not isinstance(x,(Mapping,list)) for x in v)

          def merge(base_v, ours_v, theirs_v, p=()):
              if p == ('info','version'):
                  return '0.51.0'
              if p == ('info','description'):
                  return ours_v

              if eq(theirs_v, base_v):
                  return ours_v
              if eq(ours_v, base_v):
                  return deepcopy(theirs_v) if theirs_v is not MISSING else MISSING
              if eq(ours_v, theirs_v):
                  return ours_v

              if all((v is MISSING or isinstance(v, Mapping)) for v in (base_v,ours_v,theirs_v)):
                  out = deepcopy(ours_v) if ours_v is not MISSING else deepcopy(theirs_v)
                  if out is MISSING:
                      return MISSING
                  keys = []
                  for src in (base_v,ours_v,theirs_v):
                      if isinstance(src, Mapping):
                          for k in src:
                              if k not in keys:
                                  keys.append(k)
                  for k in keys:
                      b = base_v.get(k,MISSING) if isinstance(base_v,Mapping) else MISSING
                      o = ours_v.get(k,MISSING) if isinstance(ours_v,Mapping) else MISSING
                      t = theirs_v.get(k,MISSING) if isinstance(theirs_v,Mapping) else MISSING
                      m = merge(b,o,t,p+(str(k),))
                      if m is MISSING:
                          if k in out:
                              del out[k]
                      else:
                          out[k] = m
                  return out

              if scalar_list(base_v) and scalar_list(ours_v) and scalar_list(theirs_v):
                  out = list(ours_v)
                  payment_added = [x for x in theirs_v if x not in base_v]
                  payment_removed = [x for x in base_v if x not in theirs_v]
                  for x in payment_added:
                      if x not in out:
                          out.append(x)
                  for x in payment_removed:
                      if x in out and x in base_v and x in ours_v:
                          out.remove(x)
                  return out

              conflicts.append(('/'.join(p), plain(base_v), plain(ours_v), plain(theirs_v)))
              return ours_v

          merged = merge(base, ours, theirs)
          if conflicts:
              print('UNRESOLVED CONTRACT CONFLICTS:')
              for p,b,o,t in conflicts:
                  print(f'--- {p} ---')
                  print('BASE   :', repr(b)[:1000])
                  print('CURRENT:', repr(o)[:1000])
                  print('PAYMENT:', repr(t)[:1000])
              sys.exit(2)

          buf = io.StringIO()
          yaml.dump(merged, buf)
          ours_path.write_text(buf.getvalue())
          print('OpenAPI merged; version=', merged['info']['version'])
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate contract artifacts
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          cd 'Тили-тили/backend'
          pnpm install --frozen-lockfile --node-linker=hoisted
          pnpm run gen
          cp src/contract/api.generated.ts ../app/src/lib/api/schema.ts
      - name: Commit merged contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Тили-тили/Тили-тили_API_openapi.yaml' \
                  'Тили-тили/backend/src/contract/api.generated.ts' \
                  'Тили-тили/backend/src/contract/paths.generated.ts' \
                  'Тили-тили/backend/src/contract/schemas.generated.ts' \
                  'Тили-тили/app/src/lib/api/schema.ts'
          git rm .github/workflows/payment-contract-merge.yml
          git commit -m "contract(018-payments): merge onto API 0.51.0 [payment-contract-result]"
          git push origin HEAD:integration/018-payments-clean-main-20260928
