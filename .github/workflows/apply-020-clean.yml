name: Finalize 020 clean integration

on:
  push:
    branches:
      - integration/020-clean-main-20260928

permissions:
  contents: write

concurrency:
  group: finalize-020-clean-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  finalize:
    if: "github.event.head_commit.message == 'chore(020): finalize clean gate'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge final 020 docs and regenerate contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE_DOC=3663ec8af617d39e7b763db009adad57672b0fc5
          git config core.quotepath false
          git fetch --no-tags origin test/020-finalize-20260928
          SOURCE_DOC=$(git rev-parse origin/test/020-finalize-20260928)
          OURS=$(git rev-parse HEAD)

          echo "020 source docs: $SOURCE_DOC"
          unexpected=0
          while IFS= read -r path; do
            case "$path" in
              ERRORS.md|JOURNAL.md|tasks/product-improvements-roadmap.md|tasks/фичи/020-семейные-приглашения/*|Тили-тили/Тили-тили_Бизнес-логика_и_бэкенд.md|Тили-тили/Тили-тили_Карта_кнопок.md|Тили-тили/Тили-тили_Карта_экранов.md)
                ;;
              *)
                echo "::error file=$path::production/code change appeared after pinned 020 source; re-audit required"
                unexpected=$((unexpected + 1))
                ;;
            esac
          done < <(git diff --name-only "$BASE_DOC" "$SOURCE_DOC")
          test "$unexpected" -eq 0

          while IFS=$'\t' read -r status path extra; do
            case "$path" in
              ERRORS.md|JOURNAL.md|tasks/product-improvements-roadmap.md|tasks/фичи/020-семейные-приглашения/*|Тили-тили/Тили-тили_Бизнес-логика_и_бэкенд.md|Тили-тили/Тили-тили_Карта_кнопок.md|Тили-тили/Тили-тили_Карта_экранов.md)
                ;;
              *)
                continue
                ;;
            esac

            case "$status" in
              A)
                mkdir -p "$(dirname "$path")"
                git show "$SOURCE_DOC:$path" > "$path"
                ;;
              M)
                ours_file=$(mktemp)
                base_file=$(mktemp)
                theirs_file=$(mktemp)
                out_file=$(mktemp)
                git show "$OURS:$path" > "$ours_file"
                git show "$BASE_DOC:$path" > "$base_file"
                git show "$SOURCE_DOC:$path" > "$theirs_file"
                if ! git merge-file -p "$ours_file" "$base_file" "$theirs_file" > "$out_file"; then
                  case "$path" in
                    tasks/фичи/020-семейные-приглашения/tasks.md)
                      cp "$theirs_file" "$out_file"
                      ;;
                    tasks/product-improvements-roadmap.md)
                      cp "$ours_file" "$out_file"
                      source_line=$(grep '^| 020 |' "$theirs_file")
                      python3 -c 'import sys; p=sys.argv[1]; line=sys.argv[2]; s=open(p,encoding="utf-8").read().splitlines(); s=[line if x.startswith("| 020 |") else x for x in s]; open(p,"w",encoding="utf-8").write("\n".join(s)+"\n")' "$out_file" "$source_line"
                      ;;
                    ERRORS.md|JOURNAL.md|Тили-тили/Тили-тили_Бизнес-логика_и_бэкенд.md|Тили-тили/Тили-тили_Карта_кнопок.md|Тили-тили/Тили-тили_Карта_экранов.md)
                      git merge-file --union -p "$ours_file" "$base_file" "$theirs_file" > "$out_file"
                      ;;
                    *)
                      echo "::error file=$path::unexpected documentation conflict"
                      exit 1
                      ;;
                  esac
                fi
                if grep -q -E '^(<<<<<<<|=======|>>>>>>>)' "$out_file"; then
                  echo "::error file=$path::conflict markers remain"
                  exit 1
                fi
                cat "$out_file" > "$path"
                rm -f "$ours_file" "$base_file" "$theirs_file" "$out_file"
                ;;
              D)
                rm -f "$path"
                ;;
            esac
          done < <(git diff --name-status "$BASE_DOC" "$SOURCE_DOC")

          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          cd Тили-тили/backend
          printf 'minimum-release-age=0\n' > .npmrc
          pnpm install --frozen-lockfile --node-linker=hoisted
          rm .npmrc
          pnpm run gen
          node node_modules/openapi-typescript/bin/cli.js ../Тили-тили_API_openapi.yaml -o ../app/src/lib/api/schema.ts
          cd ../..

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ERRORS.md JOURNAL.md tasks/product-improvements-roadmap.md tasks/фичи/020-семейные-приглашения Тили-тили/Тили-тили_Бизнес-логика_и_бэкенд.md Тили-тили/Тили-тили_Карта_кнопок.md Тили-тили/Тили-тили_Карта_экранов.md Тили-тили/backend/src/contract/paths.generated.ts Тили-тили/backend/src/contract/schemas.generated.ts Тили-тили/backend/src/contract/api.generated.ts Тили-тили/app/src/lib/api/schema.ts
          if git diff --cached --quiet; then
            echo "nothing to finalize"
            exit 0
          fi
          git commit -m "chore(020): finalize docs and generated contract"
          git push origin HEAD:integration/020-clean-main-20260928

  browser:
    if: "github.event.head_commit.message == 'chore(020): finalize docs and generated contract'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tili
          POSTGRES_PASSWORD: tili
          POSTGRES_DB: family020_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tili -d family020_browser_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tili:tili@127.0.0.1:5432/family020_browser_test
      E2E_FIXTURE_FILE: /tmp/family020-browser-fixture.private.json
      E2E_RESULT_DIR: /tmp/family020-browser-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked application dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          for dir in 'Тили-тили/app' 'Тили-тили/backend'; do
            (cd "$dir" && printf 'minimum-release-age=0\n' > .npmrc && pnpm install --frozen-lockfile --node-linker=hoisted && rm .npmrc)
          done
      - name: Install isolated browser tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Migrate disposable database
        working-directory: Тили-тили/backend
        run: DATABASE_URL="$TEST_DATABASE_URL" node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m migrations up
      - name: Rehearse legacy family migration down seed up
        working-directory: Тили-тили/backend
        run: |
          set -euo pipefail
          DATABASE_URL="$TEST_DATABASE_URL" node node_modules/node-pg-migrate/bin/node-pg-migrate.js down 1 -m migrations
          DATABASE_URL="$TEST_DATABASE_URL" node scripts/family020-migration-rehearsal.mjs seed
          DATABASE_URL="$TEST_DATABASE_URL" node node_modules/node-pg-migrate/bin/node-pg-migrate.js up 1 -m migrations
          DATABASE_URL="$TEST_DATABASE_URL" node scripts/family020-migration-rehearsal.mjs verify
      - name: Run real family browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$E2E_RESULT_DIR"
          rm -f "$E2E_FIXTURE_FILE"
          (cd 'Тили-тили/backend' && exec node node_modules/tsx/dist/cli.mjs scripts/family020-e2e-server.mts) > "$RUNNER_TEMP/family020-api.log" 2>&1 &
          API_PID=$!
          (cd 'Тили-тили/app' && exec node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 3000 --strictPort) > "$RUNNER_TEMP/family020-vite.log" 2>&1 &
          UI_PID=$!
          trap 'kill "$API_PID" "$UI_PID" 2>/dev/null || true; rm -f "$E2E_FIXTURE_FILE"' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if ! kill -0 "$API_PID" 2>/dev/null || ! kill -0 "$UI_PID" 2>/dev/null; then break; fi
            if test -s "$E2E_FIXTURE_FILE" && curl --fail --silent http://127.0.0.1:3001/health >/dev/null && curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if test "$ready" != 1; then
            echo "fixture startup failed" > "$E2E_RESULT_DIR/startup-error.txt"
            tail -n 150 "$RUNNER_TEMP/family020-api.log" >> "$E2E_RESULT_DIR/startup-error.txt" || true
            tail -n 150 "$RUNNER_TEMP/family020-vite.log" >> "$E2E_RESULT_DIR/startup-error.txt" || true
            exit 1
          fi
          python 'Тили-тили/backend/scripts/family020-e2e-browser.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family020-clean-browser-evidence
          path: |
            ${{ env.E2E_RESULT_DIR }}/result.json
            ${{ env.E2E_RESULT_DIR }}/*.png
            ${{ env.E2E_RESULT_DIR }}/startup-error.txt
          retention-days: 7
          if-no-files-found: warn
