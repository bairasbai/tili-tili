name: Regenerate 020 clean contract

on:
  push:
    branches:
      - integration/020-clean-main-20260928

permissions:
  contents: write

jobs:
  generate:
    if: "github.event.head_commit.message == 'regen-020-clean-contract'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate contract artifacts
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          cd Тили-тили/backend
          printf 'minimum-release-age=0\n' > .npmrc
          pnpm install --frozen-lockfile --node-linker=hoisted
          rm .npmrc
          pnpm run gen
          node node_modules/openapi-typescript/bin/cli.js ../Тили-тили_API_openapi.yaml -o ../app/src/lib/api/schema.ts
          cd ../..
          git diff --check
      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Тили-тили/backend/src/contract/paths.generated.ts
          git add Тили-тили/backend/src/contract/schemas.generated.ts
          git add Тили-тили/backend/src/contract/api.generated.ts
          git add Тили-тили/app/src/lib/api/schema.ts
          if git diff --cached --quiet; then
            echo "Generated contract is already synchronized"
            exit 0
          fi
          git commit -m "chore(020): regenerate clean contract artifacts"
          git push origin HEAD:integration/020-clean-main-20260928
