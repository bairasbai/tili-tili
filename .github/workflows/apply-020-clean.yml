name: Apply 020 clean integration

on:
  push:
    branches:
      - integration/020-clean-main-20260928

permissions:
  contents: write

jobs:
  integrate-020:
    if: "github.event.head_commit.message == 'chore(020): merge clean delta snapshot'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply only the 020 delta with three-way merges
        shell: bash
        run: |
          set -euo pipefail
          BASE=da87f1fe9aab19342f68e4a58453a4b35decb943
          SOURCE=4a6fa187c87cda39fbd33ff6cc673e1bc5c836fc
          OURS=$(git rev-parse HEAD)
          git fetch --no-tags origin test/020-finalize-20260928

          conflicts=0
          while IFS=$'\t' read -r status path extra; do
            case "$path" in
              .github/workflows/gen-020-contract.yml|.github/workflows/gen-020-final-contract.yml|.github/workflows/verify-020-family-browser.yml)
                echo "skip disposable workflow: $path"
                continue
                ;;
              Тили-тили/backend/src/contract/api.generated.ts|Тили-тили/backend/src/contract/paths.generated.ts|Тили-тили/backend/src/contract/schemas.generated.ts|Тили-тили/app/src/lib/api/schema.ts)
                echo "skip generated artifact: $path"
                continue
                ;;
            esac

            case "$status" in
              A)
                mkdir -p "$(dirname "$path")"
                git show "$SOURCE:$path" > "$path"
                ;;
              M)
                mkdir -p "$(dirname "$path")"
                ours_file=$(mktemp)
                base_file=$(mktemp)
                theirs_file=$(mktemp)
                out_file=$(mktemp)
                git show "$OURS:$path" > "$ours_file"
                git show "$BASE:$path" > "$base_file"
                git show "$SOURCE:$path" > "$theirs_file"
                if ! git merge-file -p "$ours_file" "$base_file" "$theirs_file" > "$out_file"; then
                  echo "::error file=$path::three-way conflict"
                  grep -n -C 6 -E '^(<<<<<<<|=======|>>>>>>>)' "$out_file" || true
                  conflicts=$((conflicts + 1))
                fi
                cat "$out_file" > "$path"
                rm -f "$ours_file" "$base_file" "$theirs_file" "$out_file"
                ;;
              D)
                rm -f "$path"
                ;;
              *)
                echo "::error::unsupported diff status $status for $path"
                conflicts=$((conflicts + 1))
                ;;
            esac
          done < <(git diff --name-status "$BASE" "$SOURCE")

          if [ "$conflicts" -ne 0 ]; then
            echo "::error::$conflicts merge conflict(s)"
            exit 1
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false
          git add -A
          git commit -m "feat(020): integrate family invitations on current main"
          git push origin HEAD:integration/020-clean-main-20260928
