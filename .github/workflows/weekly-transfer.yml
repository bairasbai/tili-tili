name: Weekly candidate blob transfer
'on':
  push:
    branches: [test/wp09-weekly-validation-20261005]
    paths: [.github/workflows/weekly-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve checked patch
        run: |
          mkdir -p "$RUNNER_TEMP/weekly-transfer"
          cat .automation/weekly-part-{0,1,2,3}.b64 > "$RUNNER_TEMP/weekly-transfer/patch.b64"
      - uses: actions/checkout@v4
        with:
          ref: 7dc3ac93d922933ac25f48d618f03f8c3108a8dc
          persist-credentials: false
      - name: Verify exact candidate tree and upload only blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'weekly-transfer'
          patch=lzma.decompress(base64.b64decode((out/'patch.b64').read_bytes(),validate=True))
          digest=hashlib.sha256(patch).hexdigest()
          assert digest=='cae0a60fc64bed8a8f7086faccf2c06a9fa2bfcbff517c9ca63f0ff1f33ff94c',digest
          (out/'candidate.patch').write_bytes(patch)
          def git(*args): return subprocess.check_output(['git',*args])
          base=git('rev-parse','HEAD').decode().strip()
          assert base=='7dc3ac93d922933ac25f48d618f03f8c3108a8dc'
          subprocess.run(['git','apply','--index',str(out/'candidate.patch')],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=git('write-tree').decode().strip()
          assert tree=='6bbb9680ff6cd5a85ebf8b4ebc26c611f15129dc',tree
          entries=[]
          for path in git('diff','--cached','--name-only','-z').decode().split('\0'):
              if not path: continue
              data=pathlib.Path(path).read_bytes()
              sha=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              request=urllib.request.Request('https://api.github.com/repos/bairasbai/tili-tili/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
              assert result['sha']==sha
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          assert len(entries)==18,len(entries)
          (out/'tree-entries.json').write_text(json.dumps({'base':base,'tree':tree,'patch_sha256':digest,'complete':True,'entries':entries},ensure_ascii=False,indent=2))
          print(json.dumps({'tree':tree,'blob_count':len(entries),'complete':True}))
          (out/'patch.b64').unlink()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-candidate-transfer
          path: ${{ runner.temp }}/weekly-transfer
          retention-days: 2
