name: Timeline verification workspace

on:
  push:
    branches: [feature/021-timeline-concurrency]
    paths: [.github/workflows/021-workspace-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'bairasbai/tili-tili'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package Git objects and refs, never credentials or working-tree secrets
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/timeline-history.bundle" --all
          git bundle verify "$RUNNER_TEMP/timeline-history.bundle"
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
          git rev-parse refs/remotes/origin/main > "$RUNNER_TEMP/main-sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: timeline-history-${{ github.sha }}
          path: |
            ${{ runner.temp }}/timeline-history.bundle
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/main-sha.txt
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
