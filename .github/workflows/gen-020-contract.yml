name: Generate 020 contract

on:
  push:
    branches: ['test/020-family-invites-20260928']

permissions:
  contents: write

jobs:
  generate:
    if: "!contains(github.event.head_commit.message, 'gen(020): refresh contract outputs')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/020-family-invites-20260928
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generate
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          cd Тили-тили/backend
          printf 'minimum-release-age=0\n' > .npmrc
          pnpm install --frozen-lockfile --node-linker=hoisted
          rm .npmrc
          pnpm gen
          cd ../..
          git diff --check
          git status --short
      - name: Commit generated outputs
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "Bibo"
          git config user.email "bayrasbay02@gmail.com"
          git add Тили-тили
          git commit -m "gen(020): refresh contract outputs"
          git push origin HEAD:test/020-family-invites-20260928
