name: WP09 task dependencies validation
'on':
  push:
    branches: [test/wp09-task-dependencies-workbench-20261006]
    paths: [.github/workflows/wp09-task-dependencies-workbench.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tili
          POSTGRES_PASSWORD: tili
          POSTGRES_DB: tili_task_dependencies_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tili -d tili_task_dependencies_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://tili:tili@127.0.0.1:5432/tili_task_dependencies_test
      TEST_DATABASE_URL: postgres://tili:tili@127.0.0.1:5432/tili_task_dependencies_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve reviewed patch outside checkout
        run: |
          cat .automation/wp09deps/part{0,1,2,3,4,5} > "$RUNNER_TEMP/patch.xz.b64"
          base64 -d "$RUNNER_TEMP/patch.xz.b64" | xz -d > "$RUNNER_TEMP/feature.patch"
          test "$(sha256sum "$RUNNER_TEMP/feature.patch" | cut -d' ' -f1)" = c7cf421643ab09fed5638f1d05ad63ec6f640f41f7bbf1f196e46c24fa053d85
          cp .automation/wp09deps/authoritative.patch "$RUNNER_TEMP/authoritative.patch"
          cp .automation/wp09deps/browser.patch "$RUNNER_TEMP/browser.patch"
      - uses: actions/checkout@v4
        with:
          ref: 5b88c3261f8dda29d90a5d360e450588cf17745d
          persist-credentials: false
          clean: true
      - name: Apply reviewed patch
        run: |
          git apply --check "$RUNNER_TEMP/feature.patch"
          git apply "$RUNNER_TEMP/feature.patch"
          python - <<'PY'
          from pathlib import Path
          p=Path('Тили-тили/app/src/lib/taskDependenciesUi.test.tsx')
          s=p.read_text()
          s=s.replace("function open() { return render(<MemoryRouter><StoreProvider><Checklist /></StoreProvider></MemoryRouter>) }\nfunction row(title: string)", "function open() { return render(<MemoryRouter><StoreProvider><Checklist /></StoreProvider></MemoryRouter>) }\nasync function openAll() {\n  open()\n  fireEvent.click(screen.getByRole('button', { name: 'Все задачи' }))\n  await screen.findByRole('button', { name: /^Утвердить меню/ })\n}\nfunction row(title: string)")
          s=s.replace("tasks = [task('t1', 'Собрать ответы гостей', '6'), task('t2', 'Утвердить меню', '3')]", "tasks = [task('t1', 'Собрать ответы гостей', '9'), task('t2', 'Утвердить меню', '6')]")
          s=s.replace("open(); await screen.findByRole('button', { name: /^Утвердить меню/ }); fireEvent.click(row('Утвердить меню'))", "await openAll(); fireEvent.click(row('Утвердить меню'))")
          s=s.replace("open(); await screen.findByRole('button', { name: /^Утвердить меню/ })\n    const checks", "await openAll()\n    const checks")
          s=s.replace("open(); await screen.findByRole('button', { name: /^Утвердить меню/ })\n    fireEvent.click(screen.getAllByLabelText('Отметить выполненной')[1]!)", "await openAll()\n    fireEvent.click(screen.getAllByLabelText('Отметить выполненной')[1]!)")
          s=s.replace("open(); await screen.findByRole('button', { name: /^Утвердить меню/ })\n    const next", "await openAll()\n    const next")
          s=s.replace("await screen.findByText('Собрать ответы гостей')\n    expect(screen.getByText('Не завершено')).toBeTruthy()", "await screen.findByText('Не завершено')")
          p.write_text(s)
          PY
          git apply --check "$RUNNER_TEMP/authoritative.patch"
          git apply "$RUNNER_TEMP/authoritative.patch"
          git apply --check "$RUNNER_TEMP/browser.patch"
          git apply "$RUNNER_TEMP/browser.patch"
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies
        working-directory: Тили-тили/backend
        run: |
          corepack enable && corepack prepare pnpm@10.34.5 --activate
          printf '\nminimum-release-age=0\n' >> .npmrc
          pnpm install --frozen-lockfile --node-linker=hoisted
      - name: Generate contract and both TypeScript clients
        working-directory: Тили-тили/backend
        run: |
          pnpm run gen
          node node_modules/openapi-typescript/bin/cli.js ../Тили-тили_API_openapi.yaml -o ../app/src/lib/api/schema.ts
          cmp src/contract/api.generated.ts ../app/src/lib/api/schema.ts
      - name: Install locked frontend dependencies
        working-directory: Тили-тили/app
        run: |
          corepack enable && corepack prepare pnpm@10.34.5 --activate
          printf '\nminimum-release-age=0\n' >> .npmrc
          pnpm install --frozen-lockfile --node-linker=hoisted
      - name: Backend types and fresh migration
        working-directory: Тили-тили/backend
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
          node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m migrations up
      - name: Dependency API and contract regression
        working-directory: Тили-тили/backend
        run: node node_modules/vitest/vitest.mjs run test/taskDependencies.test.ts test/contract-sync.test.ts
      - name: Backend lint changed files
        working-directory: Тили-тили/backend
        run: node node_modules/eslint/bin/eslint.js src/routes/tasks.ts test/taskDependencies.test.ts
      - name: Frontend dependency tests and types
        working-directory: Тили-тили/app
        run: |
          node node_modules/typescript/bin/tsc -b
          node node_modules/vitest/vitest.mjs run src/lib/taskDependencies.test.ts src/lib/taskDependenciesUi.test.tsx
          node node_modules/eslint/bin/eslint.js src/components/TaskDependencies.tsx src/lib/taskDependencies.ts src/lib/taskDependencies.test.ts src/lib/taskDependenciesUi.test.tsx src/pages/Wedding.tsx src/lib/i18n.en.ts
      - name: Full frontend tests and build
        working-directory: Тили-тили/app
        run: |
          node node_modules/vitest/vitest.mjs run
          node node_modules/vite/bin/vite.js build
      - name: Install isolated browser tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Dependency browser acceptance against real API and PostgreSQL
        env:
          E2E_FIXTURE_FILE: ${{ runner.temp }}/task-dependencies-fixture.json
          E2E_RESULT_DIR: ${{ runner.temp }}/task-dependencies-browser
        run: |
          set -euo pipefail
          mkdir -p "$E2E_RESULT_DIR"
          rm -f "$E2E_FIXTURE_FILE"
          (cd 'Тили-тили/backend' && exec node node_modules/tsx/dist/cli.mjs scripts/task-e2e-server.mts) > "$RUNNER_TEMP/task-api.log" 2>&1 & api=$!
          (cd 'Тили-тили/app' && exec node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 3000 --strictPort) > "$RUNNER_TEMP/task-vite.log" 2>&1 & ui=$!
          trap 'kill "$api" "$ui" 2>/dev/null || true; rm -f "$E2E_FIXTURE_FILE"' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if ! kill -0 "$api" 2>/dev/null || ! kill -0 "$ui" 2>/dev/null; then break; fi
            if test -s "$E2E_FIXTURE_FILE" && curl --fail --silent http://127.0.0.1:3001/health >/dev/null && curl --fail --silent http://127.0.0.1:3000 >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          python 'Тили-тили/backend/scripts/task-e2e-browser.py'
          python - <<'PYCODE'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ['E2E_RESULT_DIR'])/'browser-result.json').read_text())
          assert len(r['passed'])==19 and not r['page_errors'] and 'error' not in r
          PYCODE
          cp -a "$E2E_RESULT_DIR" "$RUNNER_TEMP/evidence-browser"
      - name: Preserve generated exact tree
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git status --short > "$RUNNER_TEMP/evidence/status.txt"
          git diff --binary > "$RUNNER_TEMP/evidence/final.patch"
          git diff --check > "$RUNNER_TEMP/evidence/diff-check.txt"
          sha256sum "$RUNNER_TEMP/evidence/final.patch" > "$RUNNER_TEMP/evidence/SHA256SUMS"
          git diff --name-only > "$RUNNER_TEMP/evidence/files.txt"
          tar --exclude='./app/node_modules' --exclude='./backend/node_modules' --exclude='./app/dist' --exclude='./backend/dist' -czf "$RUNNER_TEMP/evidence/patched-source.tgz" -C Тили-тили .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp09-task-dependencies-validation
          path: ${{ runner.temp }}/evidence
          retention-days: 2
          compression-level: 0
