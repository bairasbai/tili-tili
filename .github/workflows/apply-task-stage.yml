name: Apply verified task stage
on:
  push:
    branches: [feature/product-improvements-stage1-tasks]
    paths: [.automation/task-stage.*.b64]
permissions:
  contents: write
concurrency:
  group: apply-task-stage
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feature/product-improvements-stage1-tasks'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tili
          POSTGRES_PASSWORD: tili
          POSTGRES_DB: tili_patch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tili -d tili_patch_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tili:tili@127.0.0.1:5432/tili_patch_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-improvements-stage1-tasks
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact reviewed edits, with old and new blob verification
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          raw=gzip.decompress(base64.b64decode(b''.join(p.read_bytes() for p in sorted(pathlib.Path('.automation').glob('task-stage.*.b64'))),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='41cdd3adfaf6c3a4e563cc690f8f648230bb312806d3686c6a9913a626bacc5f'
          data=json.loads(raw)
          allowed_roots={'CLAUDE.md','ERRORS.md','JOURNAL.md','session-handoff.md'}
          def blob(content):
              return subprocess.check_output(['git','hash-object','--stdin'],input=content).decode().strip()
          for f in data['files']:
              p=pathlib.Path(f['path'])
              assert not p.is_absolute() and '..' not in p.parts and not p.is_symlink()
              assert str(p) in allowed_roots or str(p).startswith(('tasks/','Тили-тили/'))
              old=p.read_bytes() if p.exists() else b''
              assert (blob(old) if p.exists() else None)==f['old'], f'Changed baseline: {p}'
              lines=old.decode('utf-8').splitlines(keepends=True)
              for start,end,text in reversed(f['edits']):
                  assert 0<=start<=end<=len(lines)
                  lines[start:end]=text.splitlines(keepends=True)
              new=''.join(lines).encode('utf-8')
              assert blob(new)==f['new'], f'Bad result: {p}'
              p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(new)
              subprocess.run(['git','add','--',str(p)],check=True)
          pathlib.Path('/tmp/task-generated-expected.json').write_text(json.dumps(data['generated']))
          PY
      - name: Install frozen dependencies and regenerate contracts
        run: |
          set -euo pipefail
          corepack enable && corepack prepare pnpm@10.34.5 --activate
          for dir in 'Тили-тили/app' 'Тили-тили/backend'; do
            (cd "$dir" && printf '\nminimum-release-age=0\n' >> .npmrc && pnpm install --frozen-lockfile --node-linker=hoisted)
          done
          (cd 'Тили-тили/backend' && node scripts/gen-contract.mjs && node scripts/gen-schemas.mjs && node node_modules/openapi-typescript/bin/cli.js ../Тили-тили_API_openapi.yaml -o src/contract/api.generated.ts)
          cp 'Тили-тили/backend/src/contract/api.generated.ts' 'Тили-тили/app/src/lib/api/schema.ts'
          python - <<'PY'
          import pathlib,json,subprocess
          for name,expected in json.loads(pathlib.Path('/tmp/task-generated-expected.json').read_text()).items():
              got=subprocess.check_output(['git','hash-object','--',name]).decode().strip()
              assert got==expected, f'Generated drift: {name}'
              subprocess.run(['git','add','--',name],check=True)
          PY
      - name: Check frontend
        working-directory: Тили-тили/app
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc -b
          node node_modules/vitest/vitest.mjs run --maxWorkers=2
          node node_modules/eslint/bin/eslint.js .
          node node_modules/vite/bin/vite.js build
      - name: Check backend against disposable services
        working-directory: Тили-тили/backend
        run: |
          set -euo pipefail
          DATABASE_URL="$TEST_DATABASE_URL" node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m migrations up
          node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
          node node_modules/vitest/vitest.mjs run --maxWorkers=4
          node node_modules/eslint/bin/eslint.js .
          node node_modules/typescript/bin/tsc -p tsconfig.json
      - name: Commit only reviewed files to the isolated feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/product-improvements-stage1-tasks'
          git diff --cached --check
          git fetch origin feature/product-improvements-stage1-tasks
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(tasks): complete stage 017-A with transactional planning and regression tests'
          git push origin HEAD:refs/heads/feature/product-improvements-stage1-tasks
          git rev-parse HEAD
