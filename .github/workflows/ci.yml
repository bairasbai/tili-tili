name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Тили-тили/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS, не 25: на нечётной ветке npm падает с
          # "Exit handler never called!" (ERR-0006).
          node-version: 22
      # Версия pnpm закреплена, как в deploy/Dockerfile.web: без неё corepack
      # тянет свежайшую (12.x), и та падает на --frozen-lockfile с
      # ERR_PNPM_IGNORED_BUILDS — CI был красным ещё до первого теста (FL-16).
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      # Установка из закоммиченного лок-файла: защита от только что
      # опубликованных версий здесь не нужна (так же в образе).
      - run: printf 'minimum-release-age=0\n' >> .npmrc
      - run: pnpm install --frozen-lockfile --node-linker=hoisted
      - run: node node_modules/typescript/bin/tsc -b
      - run: node node_modules/vitest/vitest.mjs run
      - run: node node_modules/eslint/bin/eslint.js .
      - run: node node_modules/vite/bin/vite.js build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Тили-тили/backend
    # Живые службы: без них интеграционные тесты пропускаются, и «зелёный CI»
    # не значит, что миграции и подключения проверены.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tili
          POSTGRES_PASSWORD: tili
          POSTGRES_DB: tili
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tili -d tili"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tili:tili@localhost:5432/tili
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Та же закреплённая версия pnpm, что в backend/Dockerfile (FL-16).
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - run: printf 'minimum-release-age=0\n' >> .npmrc
      - run: pnpm install --frozen-lockfile --node-linker=hoisted
      - name: Test diagnostic projections
        run: node --test scripts/ci-evidence*.test.mjs
      - run: node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
      - name: Миграции на живой базе
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m migrations up
        env:
          DATABASE_URL: postgres://tili:tili@localhost:5432/tili
      - name: Feature 021 migration rehearsal
        run: |
          PGPASSWORD=tili createdb -h localhost -U tili tili_privacy_test
          node scripts/payment-privacy-migration-rehearsal.mjs
        env:
          TEST_DATABASE_URL: postgres://tili:tili@localhost:5432/tili_privacy_test
          ALLOW_PAYMENT_PRIVACY_MIGRATION_DRILL: 'yes'
      # Контрактный тест: каждый путь openapi.yaml узнан сервером.
      # Падает, если контракт правили, а генерацию не перезапускали.
      # Интеграционные тесты здесь не пропускаются — службы подняты выше.
      - name: Guarded ecosystem PostgreSQL
        run: |
          docker run -d --network host --name ecosystem-pg \
            -e POSTGRES_USER=codex_test \
            -e POSTGRES_DB=tili_ecosystem_full_20260930_test \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            --health-cmd='pg_isready -U codex_test -p 15432 -d tili_ecosystem_full_20260930_test' \
            --health-interval=2s --health-timeout=3s --health-retries=30 \
            postgres:16-alpine -p 15432 -c listen_addresses=127.0.0.1
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' ecosystem-pg)" = healthy ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs ecosystem-pg
          exit 1
      - name: Ecosystem migrations and all backend tests
        run: |
          node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m migrations up
          node scripts/ci-evidence-runner.mjs vitest
        env:
          TILI_DISPOSABLE_PG_PORT: '15432'
          DATABASE_URL: postgres://codex_test@127.0.0.1:15432/tili_ecosystem_full_20260930_test
          TEST_DATABASE_URL: postgres://codex_test@127.0.0.1:15432/tili_ecosystem_full_20260930_test
      - name: Preserving ecosystem migration rehearsal
        run: |
          docker exec ecosystem-pg createdb -U codex_test -p 15432 tili_ecosystem_migration_drill12_20260930_test
          node scripts/ecosystem-migration-drill.mjs
        env:
          TILI_DISPOSABLE_PG_PORT: '15432'
          DATABASE_URL: postgres://codex_test@127.0.0.1:15432/tili_ecosystem_migration_drill12_20260930_test
          TEST_DATABASE_URL: postgres://codex_test@127.0.0.1:15432/tili_ecosystem_migration_drill12_20260930_test
      # Insert after existing backend full + migration-rehearsal steps; retain all old bytes.
      - name: Isolated C04 C05 native feature admission
        run: node scripts/ci-evidence-runner.mjs native
        env:
          C04_C05_NATIVE_PROFILE: github-ci
          C04_C05_CI_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
      - name: Preserve isolated C04 C05 native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c04-c05-native-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: Тили-тили/backend/.ci/c04-c05-native/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
      - run: node node_modules/eslint/bin/eslint.js .
      - run: node node_modules/typescript/bin/tsc -p tsconfig.json
      - name: Preserve backend failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tili-backend-evidence-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
