name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Тили-тили/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS, не 25: на нечётной ветке npm падает с
          # "Exit handler never called!" (ERR-0006).
          node-version: 22
      # Версия pnpm закреплена, как в deploy/Dockerfile.web: без неё corepack
      # тянет свежайшую (12.x), и та падает на --frozen-lockfile с
      # ERR_PNPM_IGNORED_BUILDS — CI был красным ещё до первого теста (FL-16).
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      # Установка из закоммиченного лок-файла: защита от только что
      # опубликованных версий здесь не нужна (так же в образе).
      - run: printf 'minimum-release-age=0\n' >> .npmrc
      - run: pnpm install --frozen-lockfile --node-linker=hoisted
      - run: node node_modules/typescript/bin/tsc -b
      - run: node node_modules/vitest/vitest.mjs run
      - run: node node_modules/eslint/bin/eslint.js .
      - run: node node_modules/vite/bin/vite.js build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Тили-тили/backend
    # Живые службы: без них интеграционные тесты пропускаются, и «зелёный CI»
    # не значит, что миграции и подключения проверены.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tili
          POSTGRES_PASSWORD: tili
          POSTGRES_DB: tili
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tili -d tili"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tili:tili@localhost:5432/tili
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Та же закреплённая версия pnpm, что в backend/Dockerfile (FL-16).
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - run: printf 'minimum-release-age=0\n' >> .npmrc
      - run: pnpm install --frozen-lockfile --node-linker=hoisted
      - name: Verify generated OpenAPI files
        run: |
          pnpm run gen
          git diff --exit-code -- src/contract/paths.generated.ts src/contract/schemas.generated.ts src/contract/api.generated.ts ../app/src/lib/api/schema.ts
      - run: node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
      - name: Local media launcher ownership and argument guards
        working-directory: .
        run: node --test deploy/local-media/test/guards.test.mjs
      # Reject stale historical source pins before starting the long native suites.
      # This source-only check never substitutes for the full preserving rehearsal below.
      - name: Historical migration source admission
        run: node scripts/ecosystem-migration-drill.mjs --source-admission-only
        env:
          TILI_DISPOSABLE_PG_PORT: '15432'
          DATABASE_URL: postgres://codex_test@127.0.0.1:15432/tili_ecosystem_migration_drill12_20260930_test
          TEST_DATABASE_URL: postgres://codex_test@127.0.0.1:15432/tili_ecosystem_migration_drill12_20260930_test
      - name: Миграции на живой базе
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m migrations up
        env:
          DATABASE_URL: postgres://tili:tili@localhost:5432/tili
      - name: Feature 021 migration rehearsal
        run: |
          PGPASSWORD=tili createdb -h localhost -U tili tili_privacy_test
          node scripts/payment-privacy-migration-rehearsal.mjs
        env:
          TEST_DATABASE_URL: postgres://tili:tili@localhost:5432/tili_privacy_test
          ALLOW_PAYMENT_PRIVACY_MIGRATION_DRILL: 'yes'
      # Интеграционные тесты здесь не пропускаются — службы подняты выше.
      - name: Guarded ecosystem PostgreSQL
        run: |
          docker run -d --network host --name ecosystem-pg \
            -e POSTGRES_USER=codex_test \
            -e POSTGRES_DB=tili_ecosystem_full_20260930_test \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            --health-cmd='pg_isready -U codex_test -p 15432 -d tili_ecosystem_full_20260930_test' \
            --health-interval=2s --health-timeout=3s --health-retries=30 \
            postgres:16-alpine -p 15432 -c listen_addresses=127.0.0.1
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' ecosystem-pg)" = healthy ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs ecosystem-pg
          exit 1
      # Qualify the finite isolated lane before the long full suite; retain every mandatory step.
      - name: Isolated C04 C05 native feature admission
        run: node scripts/c04-c05-isolated-lane.mjs --github-ci --run-approved-native
        env:
          C04_C05_NATIVE_PROFILE: github-ci
          C04_C05_CI_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
      - name: Preserve isolated C04 C05 native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c04-c05-native-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: Тили-тили/backend/.ci/c04-c05-native/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
      - name: Ecosystem migrations and all backend tests
        run: |
          node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m migrations up
          mkdir -p .ci/backend-full
          node node_modules/vitest/vitest.mjs run --reporter=default --reporter=json --outputFile=.ci/backend-full/results.json
        env:
          MEDIA_STATE_EVIDENCE: .ci/backend-full/media-state.json
          MEDIA_FIXTURE_EVIDENCE: .ci/backend-full/media-fixtures.jsonl
          MEDIA_FIXTURE_OWNER: CI/backend/media-tests
          TILI_DISPOSABLE_PG_PORT: '15432'
          DATABASE_URL: postgres://codex_test@127.0.0.1:15432/tili_ecosystem_full_20260930_test
          TEST_DATABASE_URL: postgres://codex_test@127.0.0.1:15432/tili_ecosystem_full_20260930_test
      - name: Preserve calendar371 raw witness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar371-native-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: Тили-тили/backend/.ci/calendar371-native/
          if-no-files-found: error
          compression-level: 9
          retention-days: 3
      - name: Preserving ecosystem migration rehearsal
        run: |
          # Routine autovacuum can keep the rehearsal's strict session gate busy.
          # Use a fresh cluster so the full backend suite keeps its normal settings.
          rehearsal_pg=$(docker run --detach --network host \
            -e POSTGRES_USER=codex_test \
            -e POSTGRES_DB=tili_ecosystem_migration_drill12_20260930_test \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:16-alpine -p "$TILI_DISPOSABLE_PG_PORT" -c listen_addresses=127.0.0.1 -c autovacuum=off)
          trap 'docker rm --force --volumes "$rehearsal_pg" >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if [ "$(docker exec "$rehearsal_pg" psql -XAt -h /var/run/postgresql -p "$TILI_DISPOSABLE_PG_PORT" -U codex_test -d postgres \
              -c "select current_setting('listen_addresses') = '127.0.0.1' and current_setting('autovacuum') = 'off'" 2>/dev/null)" = t ]; then
              node scripts/ecosystem-migration-drill.mjs
              exit 0
            fi
            sleep 1
          done
          docker logs "$rehearsal_pg"
          exit 1
        env:
          MANAGED_MEDIA_MIGRATION_EVIDENCE: .ci/managed-media99/
          MANAGED_ALBUM_MIGRATION_EVIDENCE: .ci/managed-album100/
          TILI_DISPOSABLE_PG_PORT: '55432'
          DATABASE_URL: postgres://codex_test@127.0.0.1:55432/tili_ecosystem_migration_drill12_20260930_test
          TEST_DATABASE_URL: postgres://codex_test@127.0.0.1:55432/tili_ecosystem_migration_drill12_20260930_test
      - name: Preserve delivery and booking test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar371-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            Тили-тили/backend/.ci/delivery-isolated/
            Тили-тили/backend/.ci/booking019-native-errors/
            Тили-тили/backend/.ci/backend-full/
            Тили-тили/backend/.ci/managed-media99/
            Тили-тили/backend/.ci/managed-album100/
          if-no-files-found: warn
      - run: node node_modules/eslint/bin/eslint.js .
      - run: node node_modules/typescript/bin/tsc -p tsconfig.json
