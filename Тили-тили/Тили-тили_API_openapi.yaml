  /catalog/vendors/{vendorId}/reviews:
    get:
      tags:
        - catalog
      summary: Отзывы о подрядчике
      description: |
        Публичная лента с пометкой источника (§15). Отзыв пары идёт
        с подтверждённой сделкой, отзыв гостя — с бейджем «Гость свадьбы»:
        у пары договор, у гостя впечатление, и смешивать их нельзя.

        Скрытые модератором отзывы не отдаются и в рейтинг не входят.
      security:
        - bearerAuth: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
            enum:
              - couple
              - guest
              - all
            default: all
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  nextCursor:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - catalog
      summary: Оставить отзыв (только после завершённой сделки)
      security:
        - bearerAuth: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
                - text
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                text:
                  type: string
      description: |
        Право на отзыв — завершённая (`done`) сделка этой пары с подрядчиком, ещё без
        отзыва и не старше 14 дней после завершения: берётся свежайшая такая
        (у фотографа с двумя слотами — вторая сделка получает свой отзыв, ревью 015).
        Нет ни одной — 403; все завершённые уже с отзывом — 409 `review_exists`;
        подрядчика с таким идентификатором нет — 404.
      responses:
        '201':
          description: Создан
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
