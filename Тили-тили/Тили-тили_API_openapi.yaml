        '404':
          description: категория не найдена в справочнике
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`concierge_pending` — уже есть открытая заявка по той же категории и городу'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
  /complaints:
