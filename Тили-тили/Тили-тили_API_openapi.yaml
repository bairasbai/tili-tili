      summary: Отзывы гостей о подрядчиках (для пары)
      description: |
        Пара видит их анонимно — без имени гостя.

        Схема своя, а не общий `Review`: там подрядчик подразумевается адресом
        (`/catalog/vendors/{id}/reviews`), а здесь в одном списке отзывы обо всей
        команде — без `vendorId` и имени отзыв не к чему отнести.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    vendorId:
                      type: string
                    vendorName:
                      type: string
                      nullable: true
                    authorName:
                      type: string
                      example: Гость свадьбы
                    rating:
                      type: integer
                      minimum: 1
                      maximum: 5
                    text:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
    post:
      tags:
        - reviews
      summary: Гость оставляет отзыв
      description: |
        Только по действующему токену приглашения и только после даты свадьбы.
        Один отзыв на подрядчика на гостя: повторная отправка — редактирование.

        Оценить можно лишь того, кто на этой свадьбе работал: у сделки должно
        быть состояние `booked` или дальше. Иначе отзыв — это оценка того,
        чего не было.
      security: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - $ref: '#/components/parameters/GuestTokenQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vendorId
                - stars
              properties:
                vendorId:
                  type: string
                stars:
                  type: integer
                  minimum: 1
                  maximum: 5
                text:
                  type: string
      responses:
        '201':
          description: Создано
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/consent:
    post:
      tags:
        - auth
      summary: Зафиксировать согласие на обработку персональных данных
      description: |
        152-ФЗ: согласие даётся явным действием. Сохраняются версия документа,
        дата и IP — это и есть подтверждение. Предустановленная галочка согласием не является.

        `adult` — отдельная галочка «мне есть 18 лет» (план бэкенда §7): версия
        документа покрывает текст, возраст текстом не покрывается. Пишется в
        `consents.adult` как есть; клиент не даёт зафиксировать согласие без неё.

        После смены редакции возвращает доступ (гасит `consent_outdated`).
        `policyVersion` не совпадает с действующей редакцией сервера — 409
        `policy_version_stale`: клиент показал не тот текст, подпись под ним
        не годится. Повтор той же действующей редакции — снова 201 и новая
        строка в `consents`: каждое нажатие «принимаю» — отдельный акт, а не
        обновление предыдущего. `Idempotency-Key` не читается и не
        объявляется.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - policyVersion
              properties:
                policyVersion:
                  type: string
                  example: '2026-09-02'
                adult:
                  type: boolean
                  description: подтверждение «мне есть 18 лет»; поля нет — false
      responses:
        '201':
          description: Зафиксировано
        '409':
          description: '`policy_version_stale` — `policyVersion` не совпадает с действующей редакцией'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - auth
      summary: Отозвать согласие
      description: Равносильно удалению аккаунта и всех данных свадьбы.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: OK
  /users/me:
    get:
      tags:
        - auth
      summary: Мой профиль
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    patch:
      tags:
        - auth
      summary: Изменить профиль и настройки уведомлений
      description: >-
        Имя, язык, таймзона, четыре канала push и тихие часы — экран «Настройки». Незнакомый `tz` (не из справочника
        IANA) — 422 `unknown_timezone`.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '422':
          $ref: '#/components/responses/Validation'
    delete:
      tags:
        - auth
      summary: Удалить аккаунт
      description: |
        Soft-delete на 30 дней, затем полное удаление кроном (План §19.1).
        Активные сделки требуют подтверждения второй стороны — 409
        `active_deals` со списком.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: OK
        '409':
          description: '`active_deals` — есть активные сделки, требуют подтверждения второй стороны'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/me/sessions:
    get:
      tags:
        - auth
      summary: Мои сессии и устройства
      description: 'Работает и без действующего согласия под текущей редакцией: выйти можно всегда (ARB-2).'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
    delete:
      tags:
        - auth
      summary: Выйти со всех устройств, кроме текущего
      description: 'Работает и без действующего согласия под текущей редакцией: выйти можно всегда (ARB-2).'
      security:
        - bearerAuth: []
      responses:
        '204':
          description: OK
  /users/me/sessions/{sessionId}:
    delete:
      tags:
        - auth
      summary: Завершить сессию
      description: |
        Выход со всех устройств сразу — DELETE /users/me/sessions. Работает и
        без действующего согласия под текущей редакцией: выйти можно всегда
        (ARB-2).
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'
  /users/me/export:
    get:
      tags:
        - auth
      summary: Экспорт моих данных
      description: 152-ФЗ, право на получение данных. JSON со всем, что принадлежит пользователю.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
  /users/me/push-subscriptions:
    post:
      tags:
        - notifications
      summary: Зарегистрировать подписку Web Push
      description: |
        VAPID. На iOS работает только с 16.4+ и после установки на экран «Домой» —
        при отказе клиент откатывается на email.

        Пока ключи VAPID не заданы, отвечает 501 `push_not_configured`: принять
        подписку и промолчать значило бы показать «уведомления включены» там,
        где их не будет. Уведомления при этом приходят в приложении —
        `GET /notifications` работает всегда.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint
                - keys
              additionalProperties: false
              properties:
                endpoint:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  pattern: ^https://[^ ]+$
                keys:
                  type: object
                  required:
                    - p256dh
                    - auth
                  additionalProperties: false
                  properties:
                    p256dh:
                      type: string
                      minLength: 1
                      maxLength: 200
                    auth:
                      type: string
                      minLength: 1
                      maxLength: 200
      responses:
        '201':
          description: Создано
        '422':
          $ref: '#/components/responses/Validation'
        '501':
          $ref: '#/components/responses/NotConfigured'
    delete:
      tags:
        - notifications
      summary: Отписаться от push
      description: |
        С параметром endpoint — только подписка этого устройства (её адрес
        знает только оно); без параметра — все подписки человека. Работает и
        при согласии под прежней редакцией: выход с экрана повторного
        согласия (ARB-2, allow-list).
      security:
        - bearerAuth: []
      parameters:
        - name: endpoint
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
      responses:
        '204':
          description: OK
    get:
      tags:
        - notifications
      summary: Мои push-подписки
      description: |
        Экран «Настройки» показывает, на скольких устройствах включён push,
        и может снять чужое. Адрес подписки — секрет устройства: наружу
        уходит только его хост, полный `endpoint` — нет.
      security:
        - bearerAuth: []
      parameters:
        - name: endpoint
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
          description: адрес подписки этого устройства — чтобы отметить её как mine
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    endpointHost:
                      type: string
                      description: хост push-службы (fcm.googleapis.com, web.push.apple.com…)
                    createdAt:
                      type: string
                      format: date-time
                    mine:
                      type: boolean
                      description: подписка этого устройства — сверяется с endpoint в query
  /users/me/referral:
    get:
      tags:
        - auth
      summary: Мой реферальный код и начисления
      description: Код вида ТИЛИ-ИМЯ; обеим парам по 3 000 ₽ бонусами после первой сделки приглашённой (§3.15).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: ТИЛИ-АЛИНА
                  invited:
                    type: integer
                  earned:
                    $ref: '#/components/schemas/Money'
  /referral/{code}/apply:
    post:
      tags:
        - auth
      summary: Применить чужой реферальный код
      description: |
        Один раз на аккаунт: уже применявший любой код — 409 `referral_used`.
        Свой же код — 409 `own_code`.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '409':
          description: '`referral_used` — код на этот аккаунт уже применялся; `own_code` — свой же код'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /deals/{dealId}/events:
    get:
      tags:
        - deals
      summary: Журнал сделки
      description: |
        Что и когда произошло со сделкой: переходы состояния и правки цены.
        Пишется в `deal_events` с самого начала, но прочитать его было негде —
        при споре «мы договаривались на другую сумму» доказательства лежали в
        базе и никому не показывались.

        Видят обе стороны сделки: пара и подрядчик. Автор события назван
        ролью, а не именем — «пара», «подрядчик», «система» (истёкшая мягкая
        бронь — событие без человека).
      security:
        - bearerAuth: []
      parameters:
        - name: dealId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    kind:
                      type: string
                      enum:
                        - state
                        - price
                      description: переход состояния или правка цены
                    fromState:
                      $ref: '#/components/schemas/DealState'
                    toState:
                      $ref: '#/components/schemas/DealState'
                    by:
                      type: string
                      enum:
                        - couple
                        - vendor
                        - system
                    note:
                      type: string
                      nullable: true
                      description: для правки цены — старая и новая сумма
                    at:
                      type: string
                      format: date-time
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /deals/{dealId}:
    patch:
      tags:
        - bookings
      summary: Перевести сделку в следующее состояние или исправить сумму
      description: |
        Сделка рождается сразу в `booked` (бронь слота или свой подрядчик) —
        ступени до `booked` (`candidate`, `contacted`, `negotiating`) через API
        не производятся, это витрина будущего сценария подбора, не действующий
        путь. Дальше разрешены только переходы вперёд по цепочке
        booked → paid_deposit → done; отмена — из любого состояния, КРОМЕ
        `done`. Недопустимый переход — 409 `bad_transition`; повторная отмена
        уже отменённой сделки — 409 `already_cancelled` (одна дверь
        `cancelDeal()` — ARB-1). Дата подрядчика уже занята другой его сделкой —
        409 `date_taken`.

        Сумму можно исправить до внесения аванса: подрядчик присылает новую
        смету, и без этой правки пара была вынуждена отменять сделку, а
        отмена освобождает дату в календаре подрядчика. В paid_deposit,
        done и cancelled сумма зафиксирована — 409 `price_locked`.
        Правка пишется в журнал сделки как событие вида `price`.

        Требуется хотя бы одно из полей: `state` или `price`. Обязательный
        `Idempotency-Key`: без него — 400 `idempotency_key_required`, длиннее
        200 символов — 400 `idempotency_key_too_long`, тот же ключ на другой
        запрос — 409 `idempotency_key_reused`, тот же ключ ещё выполняется —
        409 `idempotency_in_progress`.
      security:
        - bearerAuth: []
      parameters:
        - name: dealId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required:
                    - state
                - required:
                    - price
              properties:
                state:
                  $ref: '#/components/schemas/DealState'
                price:
                  $ref: '#/components/schemas/Money'
                note:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /deals/{dealId}/contract:
    post:
      tags:
        - documents
      summary: Сгенерировать договор из шаблона
      description: >
        Автоподстановка сторон, даты, суммы и города. Возвращает ссылки на PDF и DOCX. Дисклеймер про информационный
        характер — в теле документа (§3.10). Оформляет любая из двух сторон сделки: пара или подрядчик (план §9.2 шаг 3
        — «Ирина генерирует договор из шаблона платформы»). Команде свадьбы — 403: договор содержит суммы и данные
        сторон. Сделка ещё не забронирована — 409 `not_booked`; в `fields` не хватает полей шаблона — 422
        `fields_missing`. `Idempotency-Key` необязателен: без него переоформление создаёт новую версию, с ним повтор
        возвращает тот же документ; длиннее 200 символов — 400 `idempotency_key_too_long`, тот же ключ на другой запрос
        — 409 `idempotency_key_reused`, тот же ключ ещё выполняется — 409 `idempotency_in_progress`.
      security:
        - bearerAuth: []
      parameters:
        - name: dealId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - templateCode
              properties:
                templateCode:
                  type: string
                  enum:
                    - photographer
                    - videographer
                    - venue
                    - host
                    - universal
                fields:
                  type: object
                  additionalProperties: true
                  description: >-
                    паспортные данные и реквизиты, вводятся парой; обязательные поля зависят от шаблона — не хватает
                    хотя бы одного, названного шаблоном, — 422 `fields_missing`
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: >-
            `not_booked` — сделка ещё не забронирована; `idempotency_key_reused`/`idempotency_in_progress` — см.
            описание
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
  /weddings/{weddingId}/documents:
    get:
      tags:
        - documents
      summary: Договоры свадьбы
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
  /weddings/{weddingId}/events:
    get:
      tags:
        - timeline
      summary: Мероприятия своей свадьбы
      description: >-
        Команда видит дату, пояс и место каждого мероприятия. Историческая свадьба имеет одну основную программу;
        названия блоков не используются для её автоматического дробления. ETag относится к согласованному снимку
        программы и контекста.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Версия снимка программы и мероприятий
              schema:
                type: string
            X-Timeline-Updated-At:
              description: Фактическое время изменения
              schema:
                type: string
                format: date-time
            X-Timeline-Updated-By:
              description: Фактический автор изменения
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeddingEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - timeline
      summary: Добавить мероприятие
      description: >-
        Только пара. Исходный If-Match обязателен (428 без версии, 409 timeline_conflict при старой). Технический предел
        50 мероприятий. Неуказанные дата/пояс/место остаются неизвестными; создание не назначает приглашённых и не даёт
        гостям доступ к программе. Все исходные блоки/ID сохраняются.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - kind
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                kind:
                  $ref: '#/components/schemas/WeddingEventKind'
                date:
                  type: string
                  nullable: true
                  format: date
                timeZone:
                  type: string
                  nullable: true
                  minLength: 1
                  maxLength: 100
                location:
                  type: string
                  nullable: true
                  maxLength: 300
      responses:
        '201':
          description: Создано
          headers:
            ETag:
              description: Принятая версия программы
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '428':
          description: Нужен If-Match исходного снимка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /weddings/{weddingId}/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/WeddingId'
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
    patch:
      tags:
        - timeline
      summary: Изменить мероприятие
      description: |
        Только пара; старая версия отклоняется до мутации. Основные дата/пояс/место
        синхронизированы с контекстом свадьбы; назначенная основная дата не снимается.
        Перенос основной даты двигает только её non-fixed программу, не блоки
        независимо датированных мероприятий. Изменение даты/пояса отдельного
        мероприятия не переписывает часы его блоков автоматически: их нужно
        проверить/изменить явно. Неизвестный пояс или невозможная дата — 422.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                kind:
                  $ref: '#/components/schemas/WeddingEventKind'
                date:
                  type: string
                  nullable: true
                  format: date
                timeZone:
                  type: string
                  nullable: true
                  minLength: 1
                  maxLength: 100
                location:
                  type: string
                  nullable: true
                  maxLength: 300
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Принятая версия программы
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '428':
          description: Нужен If-Match исходного снимка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - timeline
      summary: Удалить пустое мероприятие
      description: >-
        Только пара, с исходным If-Match. Основное мероприятие или мероприятие с блоками/приглашёнными — 409
        event_in_use; блоки и приглашения никогда не удаляются каскадом этого действия. Сначала явно перенести блоки и
        снять дополнительные приглашения.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Удалено
          headers:
            ETag:
              description: Принятая версия программы
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          description: Нужен If-Match исходного снимка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /weddings/{weddingId}/events/{eventId}/invitations:
    parameters:
      - $ref: '#/components/parameters/WeddingId'
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - guests
      summary: Состав приглашённых на мероприятие
      description: >-
        Только пара. Единый снимок события, всех персон свадьбы и признаков приглашения; основной состав переходно равен
        всему списку гостей. Никаких гостевых токенов/контактов/чужих свадеб.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Снимок состава приглашённых
          headers:
            ETag:
              description: Версия снимка программы и приглашений
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventInvitationRoster'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - guests
      summary: Заменить состав приглашённых дополнительного мероприятия
      description: |
        Только пара. Полный набор уникальных персон своей свадьбы с исходным If-Match.
        Новое событие не приглашает автоматически; добавление персоны в семью не приглашает
        её на дополнительные события. Пустой набор снимает все приглашения данного события.
        Сохраняются прежние RSVP/идентичность семьи/ссылки. Основной состав не меняется этим путём.
        409 timeline_conflict — никакой частичной записи; 428 timeline_version_required;
        422 validation_failed — дубли или основное событие; 404 — чужая/отсутствующая персона/event.
        Общий срок RSVP утверждён, но дедлайны и отдельные ответы этой операцией не реализуются.
      security:
        - bearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: ^"[0-9]+"$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - guestIds
              additionalProperties: false
              properties:
                guestIds:
                  type: array
                  maxItems: 5000
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Принятый состав приглашённых
          headers:
            ETag:
              description: Принятая версия программы и приглашений
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventInvitationRoster'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '428':
          description: Требуется исходная версия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /weddings/{weddingId}/timeline:
    get:
      tags:
        - timeline
      summary: Тайминг дня
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Версия этого снимка программы
              schema:
                type: string
            X-Timeline-Updated-At:
              description: Время изменения; отсутствует для неизвестной истории
              schema:
                type: string
                format: date-time
            X-Timeline-Updated-By:
              description: ID фактического автора; отсутствует для неизвестного автора
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEvent'
    put:
      tags:
        - timeline
      summary: Заменить тайминг целиком
      description: >-
        Сохраняет ID существующих блоков. Требует версию исходного снимка; устаревшая запись ничего не меняет и получает
        409 timeline_conflict. Без версии — 428 timeline_version_required.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
            pattern: ^"[0-9]+"$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TimelineEvent'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Версия сохранённой программы
              schema:
                type: string
            X-Timeline-Updated-At:
              description: Время изменения; отсутствует для неизвестной истории
              schema:
                type: string
                format: date-time
            X-Timeline-Updated-By:
              description: ID фактического автора; отсутствует для неизвестного автора
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEvent'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '428':
          description: timeline_version_required — исходная версия не передана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /weddings/{weddingId}/timeline/autogen:
    post:
      tags:
        - timeline
      summary: Автоплан дня по забронированной команде
      description: >-
        Собирает черновик из стандартных длительностей и проверяет конфликты (План §8.9). Возвращает предпросмотр — не
        применяет.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Исходная версия предпросмотра
              schema:
                type: string
            X-Timeline-Updated-At:
              description: Время изменения исходного снимка; отсутствует для неизвестной истории
              schema:
                type: string
                format: date-time
            X-Timeline-Updated-By:
              description: ID фактического автора исходного снимка; отсутствует для неизвестного автора
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimelineEvent'
                  conflicts:
                    type: array
                    items:
                      type: string
  /weddings/{weddingId}/timeline/shift/preview:
    post:
      tags:
        - timeline
      summary: Предпросмотр сдвига выбранного дня или мероприятия
      description: |
        Только couple/coordinator. Ничего не записывает и не отправляет.
        Дата и пояс event берутся из своей wedding_events; day использует
        явно выбранную дату и реальный пояс свадьбы. Unknown context — 422,
        чужое/неизвестное event — одинаковый 404. Fixed, past, undated и другие
        дни/мероприятия исключаются. Все зависимости и общие ресурсы проверяются
        по полному снимку. Разные booked deals одного vendor — один ресурс.
        canConfirm=false при конфликте/пустом сдвиге, previewToken тогда null.
        Конфликт требует ручной правки программы, coordinator override отсутствует.
        Токен подписан сервером, привязан к пользователю/сессии/свадьбе/версии и
        последствиям, действует десять минут. Отсутствующий провайдер не считается
        доставкой гостям; их адресаты/трансферы не реконструируются по тексту блока.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scope
                - minutes
              additionalProperties: false
              properties:
                scope:
                  $ref: '#/components/schemas/TimelineShiftScope'
                minutes:
                  type: integer
                  minimum: -240
                  maximum: 240
                  description: Ненулевой сдвиг; 0 даёт 422 empty_shift.
      responses:
        '200':
          description: Снимок и последствия без мутации
          headers:
            ETag:
              schema:
                type: string
            X-Timeline-Updated-At:
              schema:
                type: string
                format: date-time
            X-Timeline-Updated-By:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineShiftPreview'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          description: '`db_unavailable`, `auth_unavailable` — база или подписание предпросмотра недоступны'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /weddings/{weddingId}/timeline/shift:
    post:
      tags:
        - timeline
      summary: Подтвердить точный предпросмотр сдвига
      description: |
        Только couple/coordinator. Обязательны подписанный previewToken,
        исходный If-Match и Idempotency-Key (до 128 символов). Старая команда
        {minutes} не является обходом: без версии 428, без preview 422.
        После ожидания замка проверяются текущие права/сессия/версия и фактическое
        серверное время. Изменившиеся последствия, истёкший preview или пустой/
        конфликтный план дают 409 без частичной записи, журнала и уведомления.
        Подтверждаются только точные blocks предпросмотра. Результат, новый ETag,
        журнал и адресные in-app notification rows сохраняются одной транзакцией.
        Replay сначала проверяет актуальные права и возвращает тот же ответ/ETag,
        не сдвигает и не уведомляет повторно. Другой token/If-Match на том же ключе
        даёт 409 idempotency_key_reused. Нулевой старый сдвиг — 422 empty_shift.
        guestsAffected означает затронутых подтвердившихся гостей, не доставку.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - previewToken
              additionalProperties: false
              properties:
                previewToken:
                  type: string
                  minLength: 1
                  maxLength: 8192
      responses:
        '200':
          description: Подтверждённый результат; ETag сохранён вместе с ответом для replay
          headers:
            ETag:
              schema:
                type: string
            Idempotent-Replay:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayXBroadcast'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            `timeline_conflict`, `shift_preview_changed`, `shift_preview_expired`, `shift_conflict`,
            `idempotency_key_reused`, `idempotency_in_progress` — отказ без мутации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
        '428':
          description: timeline_version_required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`db_unavailable`, `auth_unavailable` — база или подписание предпросмотра недоступны'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /weddings/{weddingId}/planb:
    get:
      tags:
        - timeline
      summary: 'План Б: сценарий и чек-лист накануне'
      description: >
        §13.1 называет чек-лист персистентным: отметки переживают смену устройства и видны обоим партнёрам. Пункты —
        обычные задачи вида `planb`, поэтому отмечаются через PATCH /weddings/{weddingId}/tasks/{taskId} и в общий
        чек-лист по месяцам не попадают.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenario:
                    type: string
                    nullable: true
                    description: Объявленный сценарий или null, если план Б не активировали.
                  activatedAt:
                    type: string
                    format: date-time
                    nullable: true
                  checklist:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        done:
                          type: boolean
  /weddings/{weddingId}/planb/activate:
    post:
      tags:
        - timeline
      summary: Активировать план Б
      description: |
        Фиксирует запасной сценарий и время его активации и уведомляет команду
        в приложении — проверить точку сбора и тайминг (§13.1). Тайминг не
        пересобирается, гостям ничего не рассылается: канала доставки гостям
        пока нет. Обязательный `Idempotency-Key`: без него — 400
        `idempotency_key_required`, длиннее 200 символов — 400
        `idempotency_key_too_long`, тот же ключ на другой запрос — 409
        `idempotency_key_reused`, тот же ключ ещё выполняется — 409
        `idempotency_in_progress`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scenario
              properties:
                scenario:
                  type: string
                  example: rain
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayXBroadcast'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: >-
            `idempotency_key_reused` — тот же ключ на другой запрос; `idempotency_in_progress` — тот же ключ ещё
            выполняется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /inspiration/likes:
    get:
      tags:
        - catalog
      summary: Избранные истории
      description: >
        Сами истории живут во фронте: сервер хранит только идентификаторы отмеченных. Отметка личная, а не на свадьбу —
        «нравится» это вкус одного человека.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  storyIds:
                    type: array
                    items:
                      type: string
  /inspiration/likes/{storyId}:
    put:
      tags:
        - catalog
      summary: Отметить историю
      description: |
        Предел отметок на пользователя — `likes_limit` (429, 500 штук):
        постоянный отказ, без заголовка `Retry-After`.
      security:
        - bearerAuth: []
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            maxLength: 40
      responses:
        '204':
          description: Отмечено; повтор ничего не меняет
        '429':
          $ref: '#/components/responses/QuotaExceeded'
    delete:
      tags:
        - catalog
      summary: Снять отметку
      security:
        - bearerAuth: []
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            maxLength: 40
      responses:
        '204':
          description: Отметки нет — в том числе если её и не было
  /media/upload-url:
    post:
      tags:
        - media
      summary: Ссылка для прямой загрузки файла
      description: |
        Presigned URL в S3. Сервер проверяет тип и размер до выдачи ссылки,
        длительность видео (≤180 с) — после загрузки; превышение отклоняет файл.
        EXIF снимается на сервере (План §12.4).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
                - contentType
                - sizeBytes
              properties:
                kind:
                  type: string
                  enum:
                    - vendor_photo
                    - vendor_video
                    - album_photo
                    - document_scan
                contentType:
                  type: string
                sizeBytes:
                  type: integer
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                  fileUrl:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '501':
          $ref: '#/components/responses/NotConfigured'
  /weddings/{weddingId}/album:
    get:
      tags:
        - album
      summary: Общий фотоальбом гостей
      description: |
        Паре видны все кадры, гостю — только одобренные. Пара опознаётся
        токеном доступа, гость — параметром `guestToken`.
      security: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: guestToken
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlbumPhoto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - album
      summary: Гость добавляет фото
      description: |
        Без регистрации, по персональному токену (`guestToken` в строке
        запроса). Кадр попадает в очередь модерации парой. Согласие на
        публикацию — явная галочка: без неё 422 `consent_required`. Предел
        кадров на гостя — `album_limit` (429, без `Retry-After`).
      security: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - $ref: '#/components/parameters/GuestTokenQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileUrl
                - consent
              properties:
                fileUrl:
                  type: string
                consent:
                  type: boolean
                  description: согласие на публикацию в альбоме пары
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumPhoto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
    patch:
      tags:
        - album
      summary: Одобрить или скрыть все кадры разом
      description: |
        «Одобрить все» одним запросом (план миграции §2.3): по кадру — это сотня
        запросов на альбом из сотни фото, и обрыв посередине оставлял альбом
        наполовину одобренным. Ответ — сколько кадров сменили состояние.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - approved
              properties:
                approved:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
  /weddings/{weddingId}/album/{photoId}:
