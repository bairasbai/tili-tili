      summary: Перевод в денежный фонд
      description: |
        Обязательный `Idempotency-Key`: без него — 400 `idempotency_key_required`,
        длиннее 200 символов — 400 `idempotency_key_too_long`, тот же ключ на
        другой запрос — 409 `idempotency_key_reused`. Предел взносов с одного
        токена — `contribution_limit` (429, без `Retry-After`).
      parameters:
        - $ref: '#/components/parameters/GuestToken'
        - name: fundId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  $ref: '#/components/schemas/Money'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fund'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`idempotency_key_reused` — тот же ключ на другой запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
  /weddings/{weddingId}/slots/{slotId}/external:
    post:
      tags:
        - bookings
      summary: Добавить своего подрядчика (не из каталога)
      description: |
        Пара нашла исполнителя сама. Профиля в каталоге нет, но слот, бюджет
        и тайминг он занимает наравне с каталожным. Слот уже занят — 409
        `slot_taken`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: slotId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vendorName
                - price
              properties:
                vendorName:
                  type: string
                price:
                  $ref: '#/components/schemas/Money'
                phone:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '409':
          description: '`slot_taken` — слот уже занят'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
    delete:
      tags:
        - bookings
      summary: Удалить своего подрядчика
      description: |
        Отменяет сделку той же единственной дверью `cancelDeal()`, что и
        отмена брони слота, `PATCH /deals` и отмена свадьбы (F1,
        F-RL-2-02/SA-06): освобождает дату, гасит ссылку-приглашение,
        снимает автобусные маршруты, возвращает лид в работу. Слот
        возвращается в empty, выданный гостевой токен аннулируется. В слоте
        нет сделки или сделка каталожная (не свой подрядчик) — 404;
        выполненная работа не снимается — 409 `bad_transition`; сделка,
        которую успел отменить параллельный запрос, — 409 `already_cancelled`
        (повтор после завершённой отмены получает 404: слот уже пуст).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: slotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            `bad_transition` — выполненная работа не снимается; `already_cancelled` — сделку уже отменил параллельный
            запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /weddings/{weddingId}/slots/{slotId}/external/invite:
    post:
      tags:
        - bookings
      summary: Ссылка-приглашение для своего подрядчика
      description: |
        Секретная многократная ссылка для guest-vendor, TTL 30 дней, привязана
        к слоту и текущей внешней сделке при выдаче. Выдача под wedding lock
        повторно проверяет live membership/session и действующую внешнюю сделку.
        Новая ссылка имеет свою program identity и не наследует receipt другой ссылки.
        В той же транзакции становится current program link сделки для сводки
        команды. Прежние ссылки не отзываются автоматически, но их receipt не
        подтверждает новую ссылку. Историческая очередность миграцией не угадывается.
        Только для своего подрядчика: в слоте с каталожной сделкой — 409
        `not_external` (у каталожного есть кабинет и чат по анкете; ссылка
        открывала бы слот и переписку постороннему — ревью 015). Пустой слот — 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: slotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  url:
                    type: string
                    example: https://tili-tili.ru/guest-vendor/<token>
                  expiresAt:
                    type: string
                    format: date-time
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /guest-vendor/{token}/timeline:
    get:
      tags:
        - bookings
      summary: Разрешённая программа внешнего исполнителя по ссылке
      description: >
        Без аккаунта, по действующей ссылке, выданной конкретной внешней сделке. Только назначенные этой сделке блоки и
        зависимости между ними, без who, чужих участников/служебных блоков/телефонов/денег. Общая projection с
        registered reader. ETag/sourceVersion/readToken относятся к одному снимку. Proof 600 секунд, отдельные
        purpose/key/audience, wedding/invite/deal/version/content. GET не подтверждает. Cache-Control no-store. После
        всех ожиданий проверяются actual clock/expiry/revocation/wedding/slot/current committed external deal.
        Исторические ссылки без issuance-time deal binding требуют новой ссылки от пары.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Назначенная разрешённая программа
          headers:
            ETag:
              description: Версия снимка
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProgramSnapshot'
        '409':
          description: program_link_unbound — пара должна выдать новую ссылку с явной привязкой к сделке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: gone — ссылка/свадьба/слот/внешняя сделка недоступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /guest-vendor/{token}/timeline/ack:
    post:
      tags:
        - bookings
      summary: Подтверждение точного снимка по ссылке внешнего исполнителя
      description: >
        Явная команда с readToken и исходным If-Match. Live access, actual TTL, exact version/content и конкретная
        ссылка/сделка повторно проверяются под lock. История содержит actual link identity, deal, minimal snapshot и
        server time; это действие владельца ссылки, не подтверждённая личность человека. Нет выдуманного
        user/session/actor name и нет raw link/proof в истории/audit. GET/accepted_at старого кабинета не заменяют этот
        receipt. Retry/concurrency сохраняют исходное время; отказ/ошибка audit откатывают оба следа.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - readToken
              properties:
                readToken:
                  type: string
                  minLength: 1
                  maxLength: 8192
      responses:
        '200':
          description: Реальная запись ознакомления этой ссылкой
          headers:
            ETag:
              description: Подтверждённая версия
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProgramAck'
        '409':
          description: >-
            program_link_unbound / timeline_conflict / program_read_expired / program_snapshot_changed /
            program_unassigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: gone — ссылка/свадьба/слот/внешняя сделка недоступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
        '428':
          description: timeline_version_required — нужен исходный If-Match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: acknowledgment_unavailable — запись не сохранена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /guest-vendor/{token}:
    get:
      tags:
        - bookings
      summary: Кабинет гостя-подрядчика
      description: >
        Без регистрации. Дата свадьбы, свой слот/сделка, назначенный тайминг и чат именно сохранённой при выдаче внешней
        сделки. Ссылка не следует за новой сделкой слота. Wedding/invite/slot/deal проверяются под блокировками в одной
        транзакции; actual TTL после всех ожиданий. Исторически unbound ссылке нужна новая ссылка. Cache-Control
        no-store. accepted_at записывается атомарно по actual clock, не является ознакомлением с программой; отказ
        откатывает chat/accepted_at.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  weddingDate:
                    type: string
                    format: date
                    nullable: true
                    description: пусто, пока пара не выбрала дату
                  slot:
                    $ref: '#/components/schemas/Slot'
                  chatId:
                    type: string
                  holdHours:
                    type: integer
                    description: срок мягкой брони в часах (§18.3) — справочно, как у сделки
                  timeline:
                    type: array
                    description: >
                      Только блоки с назначением на текущую внешнюю сделку слота. Legacy who всегда null; служебные
                      неназначенные блоки скрыты. Для полного версионного снимка/ознакомления используется отдельный GET
                      /guest-vendor/{token}/timeline; accepted_at кабинета не является подтверждением программы.
                    items:
                      $ref: '#/components/schemas/TimelineEvent'
        '409':
          description: '`program_link_unbound` — нужна новая ссылка от пары, историческая сделка не угадывается'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: '`gone` — ссылка/свадьба/сделка недействительны или слот больше не ведёт к выданной сделке'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /guest-vendor/{token}/messages:
    get:
      tags:
        - bookings
      summary: Переписка своего подрядчика с парой
      description: >
        Тот же чат, что пара видит у себя в списке. Аккаунта у подрядчика нет, поэтому право читать даёт токен из
        ссылки, а не заголовок авторизации. Actual выданная сделка и live wedding/invite/slot/deal проверяются в одной
        транзакции; actual TTL после всех ожиданий. Исторически unbound ссылка требует новой. Cache-Control no-store.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      security: []
      responses:
        '200':
