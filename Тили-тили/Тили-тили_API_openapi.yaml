  /catalog/vendors:
    get:
      tags:
        - catalog
      summary: Каталог подрядчиков с фильтрами
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
            example: Уфа
        - name: radiusKm
          in: query
          description: |
            Радиус выдачи в километрах от центра города `city` (координаты
            справочника городов, гаверсинус). 0 — только точное совпадение
            города; без параметра — 100 (фича 011: экран показывает и меняет
            его — «только город» · 50 · 100 · 300). У городов без координат
            радиус не считается — выдача по точному совпадению названия, и
            анкета из такого города попадает в чужую выдачу только по имени.
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 100
        - name: priceMin
          in: query
          description: Нижняя граница «цены от», в копейках.
          schema:
            type: integer
            minimum: 0
        - name: priceMax
          in: query
          schema:
            type: integer
            minimum: 0
        - name: date
          in: query
          description: |
            Дата свадьбы. Подрядчики, у которых она занята, из выдачи исчезают —
            иначе пара пишет тому, кто заведомо не сможет.
          schema:
            type: string
            format: date
            example: '2027-06-14'
        - name: ratingMin
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 5
        - name: hasVideo
          in: query
          description: Только анкеты с видео в портфолио.
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - rating
              - price_asc
              - price_desc
              - popular
            default: rating
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: '`bad_date` — календарная дата в `date` не существует'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
