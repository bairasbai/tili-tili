      summary: >-
        Слоты команды: 12 из шаблона (площадка, фотограф, видеограф, ведущий, флорист, кондитер, стилист, DJ, декоратор,
        транспорт, платье, кольца), слоты по формату и «кто планирует» из квиза (фича 018) и добавленные парой
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
    post:
      tags:
        - bookings
      summary: Добавить слот категории в мозаику
      description: |
        Каталог знает 35 категорий, шаблон мозаики — 12: подрядчика из категории
        вне шаблона (аниматор, фейерверк, фотобудка…) было некуда забронировать
        (фича 014, хвост этапа 6). Слот заводится пустым, подпись — название
        категории, ставится в конец мозаики; дальше — обычная бронь
        `POST …/slots/{slotId}/book`. Слот той же категории уже есть — 409
        `slot_exists` с его идентификатором в `details.slotId`: второй слот одной
        категории мозаике не нужен, пара бронирует в существующий. Неизвестная
        категория — 422. Заводит пара; помощник и координатор — 403 (состав
        команды решает пара, как и бронь).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - categoryId
              properties:
                categoryId:
                  type: string
                  maxLength: 40
      responses:
        '201':
          description: Слот добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`slot_exists` — слот этой категории уже есть; `details.slotId` — какой'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
  /weddings/{weddingId}/shortlist/{vendorId}:
    put:
      tags:
        - bookings
      summary: Добавить подрядчика в кандидаты места
      description: |
        Место ищется по текущей категории живой опубликованной анкеты.
        Если места нет, пара создаёт его этим же вызовом; помощник получает
        409 `slot_missing`. Повторный PUT того же подрядчика идемпотентен и возвращает
        ту же запись. Необязательный `replaceEntryId` атомарно заменяет запись,
        но только если тройка всё ещё полна и этот id всё ещё принадлежит этому
        месту. Входящий уже есть — ничего не удаляется; позиция освободилась — он
        просто добавляется. Устаревший или чужой `replaceEntryId` — 409 `shortlist_full` со
        свежей тройкой без удаления. Открытый запрос пара закрывает как `removed`,
        помощник получает 409 `request_open`. Больше трёх без действующей замены —
        409 `shortlist_full` с текущими тремя в `error.details.shortlist`; скрытая,
        заблокированная, удалённая или
        неизвестная анкета — 409 `vendor_unavailable`. Отменённая свадьба —
        409 `wedding_cancelled`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: vendorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                replaceEntryId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Кандидат добавлен или уже был в этом месте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortlistEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`shortlist_full`, `request_open`, `vendor_unavailable`, `slot_missing` или `wedding_cancelled`'
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                additionalProperties: false
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                          - shortlist_full
                          - request_open
                          - vendor_unavailable
                          - slot_missing
                          - wedding_cancelled
                      message:
                        type: string
                      details:
                        type: object
                        required:
                          - shortlist
                        additionalProperties: false
                        properties:
                          shortlist:
                            type: array
                            minItems: 3
                            maxItems: 3
                            items:
                              $ref: '#/components/schemas/ShortlistEntry'
        '422':
          $ref: '#/components/responses/Validation'
  /weddings/{weddingId}/slots/{slotId}/shortlist:
    get:
      tags:
        - bookings
      summary: Кандидаты места
      description: |
        Карточки и публичные пакеты видит вся команда свадьбы. Занятость:
        `free` — свободен или занят этой же свадьбой; `held` — идут переговоры с
        другой парой; `busy` — дата занята; `null` — у свадьбы нет даты или анкета
        стёрта. После стирания подрядчика остаётся обезличенная позиция с
        `vendor: null`, `available: null` — без прежних id и имени.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: slotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShortlistEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /weddings/{weddingId}/slots/{slotId}/shortlist/{entryId}:
    delete:
      tags:
        - bookings
      summary: Убрать кандидата из места
      description: |
        Удаление идёт по `ShortlistEntry.id`, поэтому пара может освободить и
        обезличенную позицию после стирания подрядчика. Бронь и сделка не
        меняются. Открытый запрос пара закрывает как `removed`; помощник в этом
        случае получает 409 `request_open`. Отменённая свадьба — 409 `wedding_cancelled`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: slotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Кандидат убран
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`request_open` — помощник не отзывает запрос пары; `wedding_cancelled` — свадьба отменена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /weddings/{weddingId}/slots/{slotId}/offer-requests:
    post:
      tags:
        - bookings
      summary: Запросить предложение у кандидатов места
      description: |
        Только пара. `entryIds` — от одного до трёх уникальных идентификаторов
        записей кандидатов этого места, не id подрядчиков. Ответ `results`
        сохраняет порядок `entryIds`; `requestId` есть только у `sent`.

        Запрос может уйти части кандидатов: занятая дата, скрытая анкета,
        смена категории или уже открытый запрос не отменяют `sent` остальным.
        Если не ушёл ни один, ответ — 409 `no_request_sent` с теми же итогами в
        `error.details.results`.

        Обязательный `Idempotency-Key`: без него — 400
        `idempotency_key_required`, длиннее 200 символов — 400
        `idempotency_key_too_long`, тот же ключ на другое тело — 409
        `idempotency_key_reused`, ещё выполняется — 409
        `idempotency_in_progress`.

        Новых запросов — не больше десяти за скользящие 24 часа на свадьбу.
        Если остатка квоты не хватает на всех пригодных адресатов вызова, он
        целиком отвечает 429 `offer_requests_limit`: новых строк и уведомлений нет.
        Эта квота не несёт `Retry-After`. Повтор той же успешной попытки по
        `Idempotency-Key` возвращает тот же 201 до проверки уже заполненной квоты.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: slotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entryIds
              additionalProperties: false
              properties:
                entryIds:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
                wishes:
                  type: string
                  maxLength: 2000
                budgetHint:
                  $ref: '#/components/schemas/PositiveMoney'
      responses:
        '201':
          description: Итог по каждому `entryId` в порядке запроса; хотя бы один запрос отправлен
          headers:
            Idempotent-Replay:
              description: '`true` — возвращён сохранённый ответ той же попытки'
              schema:
                type: string
                enum:
                  - 'true'
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                additionalProperties: false
                properties:
                  results:
                    type: array
                    minItems: 1
                    maxItems: 3
                    description: В том же порядке, что `entryIds` в запросе.
                    items:
                      oneOf:
                        - type: object
                          required:
                            - entryId
                            - status
                            - requestId
                          additionalProperties: false
                          properties:
                            entryId:
                              type: string
                              format: uuid
                            status:
                              type: string
                              enum:
                                - sent
                            requestId:
                              type: string
                              format: uuid
                        - type: object
                          required:
                            - entryId
                            - status
                          additionalProperties: false
                          properties:
                            entryId:
                              type: string
                              format: uuid
                            status:
                              type: string
                              enum:
                                - not_shortlisted
                                - busy
                                - already_open
                                - unavailable
                                - category_changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `no_request_sent` — ни один запрос не ушёл, итоги в `details.results`;
            `wedding_cancelled` — свадьба отменена; `idempotency_key_reused` и
            `idempotency_in_progress` — конфликт попытки.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - error
                    additionalProperties: false
                    properties:
                      error:
                        type: object
                        required:
                          - code
                          - message
                          - details
                        additionalProperties: false
                        properties:
                          code:
                            type: string
                            enum:
                              - no_request_sent
                          message:
                            type: string
                          details:
                            type: object
                            required:
                              - results
                            additionalProperties: false
                            properties:
                              results:
                                type: array
                                minItems: 1
                                maxItems: 3
                                description: В том же порядке, что `entryIds` в запросе.
                                items:
                                  oneOf:
                                    - type: object
                                      required:
                                        - entryId
                                        - status
                                        - requestId
                                      additionalProperties: false
                                      properties:
                                        entryId:
                                          type: string
                                          format: uuid
                                        status:
                                          type: string
                                          enum:
                                            - sent
                                        requestId:
                                          type: string
                                          format: uuid
                                    - type: object
                                      required:
                                        - entryId
                                        - status
                                      additionalProperties: false
                                      properties:
                                        entryId:
                                          type: string
                                          format: uuid
                                        status:
                                          type: string
                                          enum:
                                            - not_shortlisted
                                            - busy
                                            - already_open
                                            - unavailable
                                            - category_changed
                  - type: object
                    required:
                      - error
                    additionalProperties: false
                    properties:
                      error:
                        type: object
                        required:
                          - code
                          - message
                        additionalProperties: false
                        properties:
                          code:
                            type: string
                            enum:
                              - wedding_cancelled
                              - idempotency_key_reused
                              - idempotency_in_progress
                          message:
                            type: string
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          description: |
            `offer_requests_limit` — десять новых запросов за скользящие 24 часа на свадьбу.
            Вызов атомарен: если квоты не хватает всем пригодным адресатам, ни одна
            строка и ни одно уведомление не создаются. Заголовка `Retry-After` нет.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                additionalProperties: false
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                          - offer_requests_limit
                      message:
                        type: string
  /weddings/{weddingId}/offers/{offerId}/accept:
    post:
      tags:
        - bookings
      summary: Принять предложение и забронировать подрядчика
      description: |
        Только couple. Цена, название и состав берутся из неизменяемого предложения,
        а не из тела запроса или нынешнего пакета. Срок включительно по поясу свадьбы.
        Удаление пакета не отменяет предложение; снятая/заблокированная анкета недоступна.
        Одна транзакция создаёт сделку, занимает место/дату, закрывает запросы места
        и анонимно сообщает остальным подрядчикам о выборе другого исполнителя.
        Повтор успешной попытки с тем же Idempotency-Key возвращает сохранённый Slot.
        Обязательный ключ: 400 idempotency_key_required/idempotency_key_too_long;
        409 idempotency_key_reused/idempotency_in_progress — другая/незавершённая попытка.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: offerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Слот с забронированным предложением; повтор не создаёт второй сделки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            offer_expired — срок истёк; offer_stale_date — дата свадьбы изменилась;
            offer_superseded — подрядчик заменил условия; offer_declined — это отказ;
            request_closed — запрос закрыт; slot_taken — место уже занято;
            date_taken — дата у подрядчика занята; vendor_unavailable — анкета недоступна.
            idempotency_key_reused/idempotency_in_progress — см. описание.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /weddings/{weddingId}/slots/{slotId}/book:
    post:
      tags:
        - bookings
      summary: Забронировать подрядчика в слот («Добавить в свадьбу»)
      description: |
        Обязательный `Idempotency-Key`: без него — 400 `idempotency_key_required`,
        длиннее 200 символов — 400 `idempotency_key_too_long`, тот же ключ на
        другой запрос — 409 `idempotency_key_reused`, тот же ключ ещё выполняется —
        409 `idempotency_in_progress`. Пакет не из справочника подрядчика —
        422 `unknown_package`. Сохраняет прежнюю совместимость: одна компания
        может оказать услуги в нескольких категориях одной свадьбы.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: slotId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vendorId
                - price
              properties:
                vendorId:
                  type: string
                packageId:
                  type: string
                price:
                  $ref: '#/components/schemas/Money'
      responses:
        '200':
          description: Слот заполнен; бюджет пересчитывается на бэкенде
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: >-
            `slot_taken` — слот уже занят; `date_taken` — у подрядчика уже есть бронь на эту дату;
            `idempotency_key_reused`/`idempotency_in_progress` — см. описание
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
  /weddings/{weddingId}/slots/{slotId}/cancel:
    post:
      tags:
        - bookings
      summary: Отменить бронь (слот → free, бюджет минус)
      description: |
        Идемпотентно по `Idempotency-Key`, как бронь и оплата: отмена освобождает
        дату у подрядчика и рассылает уведомления, повтор на плохой связи не
        должен делать этого дважды. Сервер требовал заголовок с этапа 4, а
        контракт его не называл (класс ERR-0038) — выправлено в v0.24. Без
        заголовка — 400 `idempotency_key_required`, длиннее 200 символов —
        400 `idempotency_key_too_long`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: slotId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: >-
            `bad_transition` — выполненная работа (`done`) не снимается; `already_cancelled` — уже отменена;
            `slot_empty` — слот и так пуст; `idempotency_key_reused`/`idempotency_in_progress` — см. описание
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /weddings/{weddingId}/slots/{slotId}/pay:
    post:
      tags:
        - bookings
      summary: Оплата слота (доплата/полная)
      description: |
        Идемпотентно по `Idempotency-Key`. Статус → «Оплачено полностью».
        Эквайринга в MVP нет (План §3.2): запись в `payments` фиксирует факт,
        деньги ходят между парой и подрядчиком напрямую.

        Без `amount` записывается ОСТАТОК — цена минус уже оплаченное (возвраты
        с минусом, отменённые записи не считаются — та же формула, что `Deal.paid`);
        сделка, оплаченная целиком, — 409 `overpay`. Сумма сверх остатка — 409
        `overpay`; ноль — 422 `bad_amount`; сделка без цены — 409 `no_price`
        (ревью 015). Пустой слот — 409 `slot_empty`; слот без подтверждённой
        брони — 409 `not_booked`. Без заголовка — 400 `idempotency_key_required`,
        длиннее 200 символов — 400 `idempotency_key_too_long`, тот же ключ на
        другой запрос — 409 `idempotency_key_reused`, тот же ключ ещё
        выполняется — 409 `idempotency_in_progress`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: slotId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Ключ повтора. Без него повторное нажатие «Оплатить» на плохой связи
            заводит вторую запись об оплате.
          schema:
            type: string
            maxLength: 200
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  $ref: '#/components/schemas/Money'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
  /weddings/{weddingId}/slots/{slotId}/prebooked:
    delete:
      tags:
        - bookings
      summary: Снять отметку «уже забронировано» («Нет, ещё ищем»)
      description: |
        Пара ответила в квизе, что подрядчик этой категории уже найден вне
        приложения (`Slot.prebooked`, фича 018), а потом передумала: слот
        становится обычным пустым. Идемпотентно — слот без отметки тоже
        отвечает 204. Решает пара, как и бронь: помощник и координатор — 403.
        Слот не этой свадьбы или несуществующий — 404. Бронь из каталога и
        свой подрядчик снимают отметку сами, этот вызов им не нужен.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: slotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Отметки нет — снята сейчас или её не было
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
