  /vendor/profile:
    get:
      tags:
        - vendor
      summary: Моя анкета подрядчика
      description: |
        Анкеты ещё нет — 404: по нему кабинет показывает «Анкеты ещё нет» с кнопкой
        заполнить. Остальные пути `/vendor/*` без анкеты отвечают 403 (ревью 015).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - vendor
      summary: 'Создать/обновить анкету (мастер: категория → пакеты → город → публикация)'
      description: |
        Категория или город не из справочника — 404 (ARB-4). Несколько
        городов подходят под название — 422 `city_ambiguous`; портфолио с
        видео без длительности — 422 `video_duration_required`; видео длиннее
        предела — 422 `video_too_long`.

        Пакеты сохраняются по `id` (019, FR-006): `id` не своего пакета —
        чужого, уже удалённого или не uuid — 422 `unknown_package` с полем
        `packages/{i}/id`, и не записывается ничего; один `id` дважды — 422
        `validation_failed` с тем же полем. Ответ — анкета, прочитанная в той
        же транзакции: пакеты в нём идут в присланном порядке, и новый пакет
        получает `id` на том же месте списка.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorUpsert'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorDetail'
        '404':
          description: категория или город не найдены в справочнике
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
