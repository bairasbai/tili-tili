            to:
              type: string
              format: date
              pattern: ^\d{4}-\d{2}-\d{2}$
            today:
              type: string
              format: date
              pattern: ^\d{4}-\d{2}-\d{2}$
            timeZone:
              type: string
            includeOverdue:
              type: boolean
            includeCancelled:
              type: boolean
        readOnly:
          type: boolean
        summary:
          $ref: '#/components/schemas/PaymentSummary'
        dueInWindow:
          allOf:
            - $ref: '#/components/schemas/Money'
        overdueRemaining:
          allOf:
            - $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentInstallment'
        deals:
