                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /weddings/{weddingId}/payments/{paymentId}/receipts/{receiptId}:
    delete:
      tags:
        - payments
      summary: Удалить приватное подтверждение оплаты
      description: |
        Файл удаляется из базы сразу. В журнале действий остаются оплата, тип,
        размер и SHA-256 содержимого — без имени файла: журнал переживает стирание
