openapi: 3.0.3
info:
  title: Тили-тили API
  version: 0.43.0
  description: |
    Контракт бэкенда для PWA «Тили-тили» (tili-tili.ru) — свадебный планировщик.
    Фронтенд (React) уже работает на моках; этот файл — единственный источник правды для бэкенда (Claude Code).

    ## Решения владельца 2026-09-02 (контракт v0.2)
    - Деньги — объект `{ amount: копейки, currency: ISO 4217 }` у КАЖДОЙ суммы.
      Не одна валюта на свадьбу: план §19.7 описывает свадьбу за границей, где
      сделка в евро, а бюджет в рублях. В MVP принимается только RUB.
    - У слота нет собственного статуса. Слот либо пуст, либо несёт сделку;
      состояние живёт в `Deal.state` — шесть значений. `Slot.tileState` —
      производная подпись для мозаики, только для чтения.
    - Гость опознаётся ОДНИМ персональным токеном во всех гостевых путях
      (`/rsvp/{guestToken}`, `/gifts/{guestToken}`, `/join/{guestToken}/…`).
      Общий код свадьбы не годится: по нему нельзя подставить имя в приглашение
      и нельзя дать гостю снять СВОЙ резерв подарка. Анонимность сохраняется —
      система знает гостя, а API пары этот токен не отдаёт никогда (§9).
    - Переноса данных с localStorage-моков не будет: реальных пользователей не
      было, эндпоинт импорта не заводится.

    ## Роли
    - `couple` — молодожёны (владельцы свадьбы): полный доступ.
    - `helper` — помощник (друг/родственник): орг-разделы, без бюджета и сделок.
    - `coordinator` — координатор: командует днём X (тайминг, чаты подрядчиков), без бюджета и оплат.
    - `vendor` — подрядчик: свои сделки, лиды, чаты, анкета.
    - `guest` — гость: только RSVP по ссылке приглашения.

    ## Принципы
    - Все даты — ISO 8601 (`2027-06-14`), дата-время — UTC RFC 3339.
    - Деньги — integer в **копейках** (минорных единицах) + код валюты ISO 4217.
      Решение владельца 2026-09-02. Пример: 85 000 ₽ = `{ "amount": 8500000, "currency": "RUB" }`.
      Дробных сумм в JSON не бывает; показ рублей — задача клиента.
    - Пагинация: `?limit=20&cursor=...` → `{ items, nextCursor }`.
    - Живые обновления — WebSocket `wss://…/ws?token=<access>`. События: `message.created`,
      `deal.state_changed`, `timeline.shifted`, `seating.updated`, `menu.poll.updated`,
      `notification.created`. Клиент без WebSocket опрашивает REST раз в 30 с (§13.4).
      OpenAPI 3.0 не описывает WS-каналы — контракт событий ведётся здесь.
    - Ошибки: `{ "error": { "code": "string", "message": "string" } }`.
    - Идемпотентность мутаций оплаты/брони — через `Idempotency-Key` header.

    ## Общие коды ошибок (не привязаны к одной операции)
    Могут прийти у любой операции, если не сказано иное:
    - `unauthorized` (401) — любая операция за входом; у гостевых см. описание `GuestToken`.
    - `token_expired` (401) — просроченный access-токен; у живого канала — закрытие 4401.
    - `forbidden` (403) — живого согласия нет вовсе (не давали или отозвали), роли или стороны недостаточно; согласие под прежней редакцией — не `forbidden`, а `consent_outdated`.
    - `consent_outdated` (403) — согласие есть, но под прежней редакцией политики: нужно подтвердить новую (см. `POST /users/me/consent`); у живого канала чата — закрытие 4403 с тем же кодом.
    - `not_found` (404) — чужой или несуществующий идентификатор, либо неизвестный адрес.
    - `validation_failed` (422) — нарушение схемы запроса; поле-виновник — в `error.fields`.
    - `invalid_json` (422) — тело запроса не является JSON.
    - `invalid_character` (422) — NUL-байт в адресе, строке запроса или теле.
    - `payload_too_large` (413) — тело запроса больше 1 МиБ.
    - `unsupported_media_type` (415) — тело не `application/json`.
    - `bad_content_length` (400) — заголовок `Content-Length` не совпал с телом.
    - `rate_limited` (429) — превышен общий лимит запросов (кроме `/health*`); ответ несёт `Retry-After`.
    - `internal` (500) — необработанная ошибка сервера; тело несёт идентификатор запроса для поддержки.
    - `money_overflow` (500) — денежная сумма в базе вышла за пределы точного представления.
    - `db_unavailable` (503) — база данных недоступна.
    - `not_configured` (503) — секрет для отправки SMS-кодов не настроен на сервере.
    - `code_collision` (503) — генератор человекочитаемого кода исчерпал попытки подобрать свободный.
servers:
  - url: https://api.tili-tili.ru/v1
  - url: http://localhost:8080/v1
tags:
  - name: auth
  - name: weddings
  - name: invites
  - name: geo
  - name: catalog
  - name: bookings
  - name: budget
  - name: guests
  - name: tasks
  - name: chats
  - name: vendor
  - name: notifications

paths:
  # ───────────────────────── AUTH ─────────────────────────
  /auth/otp:
    post:
      tags: [auth]
      security: []
      summary: Запросить код из SMS
      description: |
        Регистрация и вход — один и тот же шаг: аккаунт заводится при первой
        успешной проверке кода. Пароля в продукте нет (экран /auth во фронте).
        Ответ одинаков и для нового, и для известного номера — иначе по нему
        можно перебором узнать, зарегистрирован ли человек.

        Лимиты выдачи кода (фича 005): по паре «номер + адрес» — 3 в час, по
        номеру — 10 в час и 30 в сутки, по адресу — как прежде. Каждый 429
        `too_many_requests` несёт `Retry-After` в секундах. Чужой номер пятью
        запросами больше не закрыть: посторонний с одного адреса упирается в
        свой лимит, а владелец номера с другого адреса код получает. Номер не
        похож на телефон — 422 `bad_phone`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '+79171234567', description: 'E.164; на фронте вводятся 10 цифр после +7' }
      responses:
        '200':
          description: Код отправлен
          content:
            application/json:
              schema:
                type: object
                required: [expiresIn, resendAfter]
                properties:
                  expiresIn: { type: integer, example: 300, description: сколько секунд код действителен }
                  resendAfter: { type: integer, example: 60, description: через сколько секунд можно запросить повторно }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { description: 'SMS-провайдер не ответил или отказал — код не отправлен (sms_failed)' }
  /auth/otp/verify:
    post:
      tags: [auth]
      security: []
      summary: Обменять код на токены
      description: |
        Аккаунт, удалённый через `DELETE /users/me` не больше 30 дней назад,
        при входе тем же номером восстанавливается: `deleted_at` снимается,
        в журнал аудита пишется `user.restored`, данные на месте. Отозванное
        при удалении согласие даётся заново — ответ несёт `consentRequired`
        как у нового аккаунта. Старше 30 дней строка стирается при входе (или
        уборкой раньше), и вход заводит новый аккаунт (фичи 005/014). Код
        сверяется со всеми живыми кодами номера: чужой запрос кода на ваш
        номер ваш код не отменяет; попытки считаются, после пяти неверных —
        429 `too_many_requests` (ревью 015). Номер не похож на телефон — 422
        `bad_phone`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, example: '+79171234567' }
                code: { type: string, example: '4821' }
                device: { type: string, example: 'iPhone · Safari', description: подпись для экрана «Сессии и устройства» }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: Обновление access-token
      description: |
        Refresh одноразовый: при обмене старый гасится, выдаётся новый.
        Повторное предъявление уже погашенного — 401 `refresh_superseded`,
        признак кражи, и тогда гасятся ВСЕ сессии пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/oauth/{provider}:
    get:
      tags: [auth]
      summary: OAuth-вход (VK, Yandex, Google, Telegram)
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [vk, yandex, google, telegram] }
      security: []
      responses:
        '302': { description: Редирект на провайдера }
        '501': { $ref: '#/components/responses/NotConfigured' }

  # ───────────────────────── WEDDINGS ─────────────────────────
  /weddings:
    get:
      tags: [weddings]
      summary: Мои свадьбы
      description: |
        Единственный способ найти свою свадьбу после переустановки приложения:
        идентификатор хранится только на устройстве, и с чистым localStorage
        восстановить его больше неоткуда. Отдаёт и те свадьбы, куда человека
        позвали помощником или координатором, — с его ролью в каждой.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Wedding'
                    - type: object
                      properties:
                        role: { type: string, enum: [couple, helper, coordinator, vendor] }
    post:
      tags: [weddings]
      summary: Создать свадьбу (после квиза)
      description: |
        Город не найден в справочнике — 404 (ARB-4). Дата свадьбы вне
        диапазона «год назад … пять лет вперёд» — 422 `date_out_of_range`;
        несуществующий день вроде 30 февраля — 422 `bad_date`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partnerName, city]
              properties:
                partnerName: { type: string, example: Тимур }
                date: { type: string, format: date, example: '2027-06-14' }
                city: { $ref: '#/components/schemas/CityRef' }
                budgetTotal: { $ref: '#/components/schemas/Money' }  # example: 1500000
                guestsPlanned: { type: integer, example: 80 }
                style: { type: string, example: нежная классика }
                quizAnswers:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Свадьба создана; создатель — `couple`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wedding' }
        '404':
          description: 'город не найден в справочнике'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `wedding_exists` — у пары уже есть живая свадьба (не отменена и
            не в архиве); вторая заводится только после её отмены или
            завершения. Тело ошибки несёт `weddingId` существующей в `details`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
  /weddings/{weddingId}:
    get:
      tags: [weddings]
      summary: Карточка свадьбы (данные для Home)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wedding' }
    patch:
      tags: [weddings]
      summary: Обновить (дата, город, бюджет, стиль)
      description: |
        Правка `date` — это ПЕРЕНОС: она проходит тот же путь, что
        `POST /weddings/{weddingId}/reschedule`, и тянет за собой занятость
        в календарях подрядчиков, сроки задач чек-листа, время блоков тайминга
        и час открытия чата дня X. Если кто-то из забронированной команды занят
        на новую дату — 409 `team_busy`, и не меняется ничего; дата уже
        занята у своего же подрядчика — 409 `date_taken`.

        Дата свадьбы принимается в диапазоне «год назад … пять лет вперёд»
        (решение владельца 2026-09-03); за его пределами — 422
        `date_out_of_range`. Несуществующий день вроде 30 февраля — 422 `bad_date`.
        Незнакомый `tz` (не из справочника IANA) — 422 `unknown_timezone`.
        Город не найден в справочнике — 404 (ARB-4).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date: { type: string, format: date }
                city: { $ref: '#/components/schemas/CityRef' }
                budgetTotal: { $ref: '#/components/schemas/Money' }
                guestsPlanned: { type: integer }
                style: { type: string }
                venue: { type: string, maxLength: 200 }
                tz: { type: string, maxLength: 64, description: 'явный пояс важнее пояса города' }
                inviteText: { type: string, maxLength: 2000, description: 'обращение пары в приглашении — его видит гость' }
                inviteThemeId:
                  type: integer
                  minimum: 0
                  maximum: 9
                  description: |
                    Сценарий оформления приглашения. Хранится у свадьбы, а не в
                    браузере пары: гость открывает приглашение со своего
                    устройства, и тема должна приехать к нему вместе с текстом.
                dressCode:
                  type: string
                  nullable: true
                  maxLength: 32
                  description: 'идентификатор палитры дресс-кода (План ч. 295) — по той же причине, что и тема; null — снять дресс-код'
                dressNote: { type: string, nullable: true, maxLength: 300, description: 'пожелание словами: «дамы — без белого»; null — убрать пожелание' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wedding' }
        '404':
          description: 'город не найден в справочнике'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /weddings/{weddingId}/members:
    get:
      tags: [weddings]
      summary: Команда свадьбы
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
  /weddings/{weddingId}/members/{userId}:
    patch:
      tags: [weddings]
      summary: Сменить роль участника (только couple)
      description: 'Последнюю пару из свадьбы убрать нельзя (`last_couple`, 409) — у свадьбы должен остаться хотя бы один couple.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [couple, helper, coordinator] }
      responses:
        '200': { description: OK }
        '409':
          description: '`last_couple` — последнюю пару из свадьбы убрать нельзя'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [weddings]
      summary: Удалить участника
      description: 'Последнюю пару из свадьбы убрать нельзя (`last_couple`, 409).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Удалён }
        '409':
          description: '`last_couple` — последнюю пару из свадьбы убрать нельзя'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── INVITES (команда) ─────────────────────────
  /weddings/{weddingId}/invites:
    post:
      tags: [invites]
      summary: Создать одноразовую ссылку-приглашение (7 дней)
      description: Фронт рисует QR по `url`. Код — человекочитаемый (ПАРА-XXXX, ДРУГ-XXXX, ПОДР-XXXX).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [couple, helper, coordinator, vendor] }
                label: { type: string, example: 'Для Тимура' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteLink' }
    get:
      tags: [invites]
      summary: Активные приглашения
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InviteLink' }
  /invites/{code}:
    get:
      tags: [invites]
      summary: Просмотр приглашения (экран /join/:code)
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, example: ДРУГ-7F3K }
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  role: { type: string, enum: [couple, helper, coordinator, vendor] }
                  weddingTitle: { type: string, example: 'Алина ♥ Тимур' }
                  inviterName: { type: string }
                  expiresAt: { type: string, format: date-time }
        '410':
          description: '`gone` — истёк или отозван'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [invites]
      summary: Отозвать приглашение
      security: [{ bearerAuth: [] }]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Отозвано }
  /invites/{code}/accept:
    post:
      tags: [invites]
      summary: Принять приглашение (после регистрации/входа)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Присоединён к свадьбе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '409':
          description: '`already_member` — уже в этой свадьбе'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: '`gone` — истёк, отозван или уже использован'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── GEO ─────────────────────────
  /health:
    get:
      tags: [health]
      security: []
      summary: Жив ли процесс
      description: |
        Отвечает 200, пока процесс работает, и не ходит ни в базу, ни в Redis.
        По нему перезапускают контейнер. Ронять его из-за упавшей базы нельзя:
        приложение уйдёт в цикл перезапусков и не поднимется, когда база
        вернётся (RUNBOOK §1).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  uptime: { type: integer, description: 'секунд с запуска процесса' }

  /health/ready:
    get:
      tags: [health]
      security: []
      summary: Готов ли принимать трафик
      description: |
        503, если недоступна база или Redis — по нему балансировщик выводит
        машину из ротации. В теле видно, что именно упало.
      responses:
        '200':
          description: Готов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Не готов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /legal/policy:
    get:
      tags: [legal]
      security: []
      summary: Действующая редакция оферты и политики
      description: |
        Отдаёт редакцию, под которой сервер сейчас принимает согласие.

        Без этого пути клиент обязан прислать `policyVersion` в
        `POST /users/me/consent`, а взять её ему негде: в контракте она
        встречалась ровно один раз — в теле запроса. Сервер сверяет
        присланное со своим значением и отказывает при расхождении, то есть
        единственным способом узнать редакцию было прислать неверную
        и разобрать текст ошибки.

        Цена отсутствия — не неудобство: смена текста политики поднимает
        `POLICY_VERSION`, развёрнутый фронт продолжает слать старую
        константу, согласие перестаёт приниматься, а без согласия закрыто
        всё (`requireConsent`). Ни один новый пользователь не завершает
        регистрацию, пока не выкатят фронт. Юридическое действие ломало
        вход (ERR-0114).

        Без входа намеренно: галочка согласия стоит на экране ДО того,
        как человек получил токены.

        Сам текст оферты и политики живёт в приложении — сервер отдаёт
        только редакцию, потому что только её он и проверяет.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [policyVersion]
                properties:
                  policyVersion:
                    type: string
                    example: '2026-09-02'
                    description: 'Значение, которое ждёт POST /users/me/consent'

  /geo/cities:
    get:
      tags: [geo]
      summary: Поиск городов (автокомплит CityPicker)
      description: |
        Источник — Яндекс Геокодер (`geocode-maps.yandex.ru/1.x/?kind=locality`) + собственная таблица райцентров.
        Поиск prefix-first, ё→е, минимум 2 символа. Ответ отсортирован: точный префикс → население.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, example: сиб }
        - name: limit
          in: query
          schema: { type: integer, default: 12, maximum: 50 }
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/City' }
  /geo/nearest:
    get:
      tags: [geo]
      summary: Ближайший город по координатам (кнопка геолокации)
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, example: 54.7351 }
        - name: lon
          in: query
          required: true
          schema: { type: number, example: 55.9587 }
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/City' }

  # ───────────────────────── CATALOG ─────────────────────────
  /catalog/categories:
    get:
      tags: [catalog]
      summary: Категории подрядчиков (площадки, фото, декор…)
      description: |
        С `city` каждая категория несёт `vendorsCount` — сколько опубликованных
        анкет в этом городе (план миграции §2.7: экран `/search` держится на
        доводе «здесь есть из кого выбирать»); без `city` — по всей базе.
      parameters:
        - name: city
          in: query
          required: false
          schema: { type: string, maxLength: 80 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /catalog/vendors:
    get:
      tags: [catalog]
      summary: Каталог подрядчиков с фильтрами
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string }
        - name: city
          in: query
          schema: { type: string, example: Уфа }
        - name: radiusKm
          in: query
          description: |
            Радиус выдачи в километрах от центра города `city` (координаты
            справочника городов, гаверсинус). 0 — только точное совпадение
            города; без параметра — 100 (фича 011: экран показывает и меняет
            его — «только город» · 50 · 100 · 300). У городов без координат
            радиус не считается — выдача по точному совпадению названия, и
            анкета из такого города попадает в чужую выдачу только по имени.
          schema: { type: integer, minimum: 0, maximum: 1000, default: 100 }
        - name: priceMin
          in: query
          description: Нижняя граница «цены от», в копейках.
          schema: { type: integer, minimum: 0 }
        - name: priceMax
          in: query
          schema: { type: integer, minimum: 0 }
        - name: date
          in: query
          description: |
            Дата свадьбы. Подрядчики, у которых она занята, из выдачи исчезают —
            иначе пара пишет тому, кто заведомо не сможет.
          schema: { type: string, format: date, example: '2027-06-14' }
        - name: ratingMin
          in: query
          schema: { type: number, minimum: 0, maximum: 5 }
        - name: hasVideo
          in: query
          description: Только анкеты с видео в портфолио.
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [rating, price_asc, price_desc, popular], default: rating }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: '`bad_date` — календарная дата в `date` не существует'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /catalog/vendors/{vendorId}:
    get:
      tags: [catalog]
      summary: Анкета подрядчика
      description: |
        Опубликованная анкета — любому вошедшему. Свою анкету владелец видит и
        НЕопубликованной (и заблокированной) — так он смотрит её «глазами пары»
        до публикации (фича 007); в ответе владельцу есть `published`/`blocked`.
        Чужая неопубликованная — 404, как и раньше: по адресу нельзя узнать,
        существует ли черновик.
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /catalog/vendors/{vendorId}/availability:
    get:
      tags: [catalog]
      summary: Занятость дат (для выбора даты брони)
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string }
        - name: month
          in: query
          schema: { type: string, example: '2027-06' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  busyDates:
                    type: array
                    items: { type: string, format: date }
                  holdDates:
                    type: array
                    items: { type: string, format: date }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── FAVORITES ─────────────────────────
  /me/favorites:
    get:
      tags: [catalog]
      summary: Избранное пользователя
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vendor' }
  /me/favorites/{vendorId}:
    put:
      tags: [catalog]
      summary: Добавить в избранное
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: OK }
    delete:
      tags: [catalog]
      summary: Убрать из избранного
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: OK }

  # ───────────────────────── BOOKINGS / SLOTS ─────────────────────────
  /weddings/{weddingId}/notes:
    get:
      tags: [wedding]
      summary: Заметки и идеи свадьбы
      description: |
        Заметки жили в `localStorage` одного телефона (фича 014, блокер №7 — решение
        владельца): теперь — на сервере, у свадьбы, свежие первыми. Видит и пишет вся
        команда свадьбы (пара, помощник, координатор): идеи — общее поле, как чат команды.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Note' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [wedding]
      summary: Добавить заметку
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: Добавлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /weddings/{weddingId}/notes/{noteId}:
    delete:
      tags: [wedding]
      summary: Удалить заметку
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Удалена }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /weddings/{weddingId}/slots:
    get:
      tags: [bookings]
      summary: "Слоты команды: 12 из шаблона (площадка, фотограф, видеограф, ведущий, флорист, кондитер, стилист, DJ, декоратор, транспорт, платье, кольца) плюс добавленные парой"
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Slot' }
    post:
      tags: [bookings]
      summary: Добавить слот категории в мозаику
      description: |
        Каталог знает 35 категорий, шаблон мозаики — 12: подрядчика из категории
        вне шаблона (аниматор, фейерверк, фотобудка…) было некуда забронировать
        (фича 014, хвост этапа 6). Слот заводится пустым, подпись — название
        категории, ставится в конец мозаики; дальше — обычная бронь
        `POST …/slots/{slotId}/book`. Слот той же категории уже есть — 409
        `slot_exists` с его идентификатором в `details.slotId`: второй слот одной
        категории мозаике не нужен, пара бронирует в существующий. Неизвестная
        категория — 422. Заводит пара; помощник и координатор — 403 (состав
        команды решает пара, как и бронь).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId]
              properties:
                categoryId: { type: string, maxLength: 40 }
      responses:
        '201':
          description: Слот добавлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`slot_exists` — слот этой категории уже есть; `details.slotId` — какой'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
  /weddings/{weddingId}/slots/{slotId}/book:
    post:
      tags: [bookings]
      summary: Забронировать подрядчика в слот («Добавить в свадьбу»)
      description: |
        Обязательный `Idempotency-Key`: без него — 400 `idempotency_key_required`,
        длиннее 200 символов — 400 `idempotency_key_too_long`, тот же ключ на
        другой запрос — 409 `idempotency_key_reused`, тот же ключ ещё выполняется —
        409 `idempotency_in_progress`. Пакет не из справочника подрядчика —
        422 `unknown_package`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - name: slotId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendorId, price]
              properties:
                vendorId: { type: string }
                packageId: { type: string }
                price: { $ref: '#/components/schemas/Money' }  # example: 150000
      responses:
        '200':
          description: Слот заполнен; бюджет пересчитывается на бэкенде
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: '`slot_taken` — слот уже занят; `date_taken` — у подрядчика уже есть бронь на эту дату; `idempotency_key_reused`/`idempotency_in_progress` — см. описание'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
  /weddings/{weddingId}/slots/{slotId}/cancel:
    post:
      tags: [bookings]
      summary: Отменить бронь (слот → free, бюджет минус)
      description: |
        Идемпотентно по `Idempotency-Key`, как бронь и оплата: отмена освобождает
        дату у подрядчика и рассылает уведомления, повтор на плохой связи не
        должен делать этого дважды. Сервер требовал заголовок с этапа 4, а
        контракт его не называл (класс ERR-0038) — выправлено в v0.24. Без
        заголовка — 400 `idempotency_key_required`, длиннее 200 символов —
        400 `idempotency_key_too_long`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - name: slotId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: '`bad_transition` — выполненная работа (`done`) не снимается; `already_cancelled` — уже отменена; `slot_empty` — слот и так пуст; `idempotency_key_reused`/`idempotency_in_progress` — см. описание'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /weddings/{weddingId}/slots/{slotId}/pay:
    post:
      tags: [bookings]
      summary: Оплата слота (доплата/полная)
      description: |
        Идемпотентно по `Idempotency-Key`. Статус → «Оплачено полностью».
        Эквайринга в MVP нет (План §3.2): запись в `payments` фиксирует факт,
        деньги ходят между парой и подрядчиком напрямую.

        Без `amount` записывается ОСТАТОК — цена минус уже оплаченное (возвраты
        с минусом, отменённые записи не считаются — та же формула, что `Deal.paid`);
        сделка, оплаченная целиком, — 409 `overpay`. Сумма сверх остатка — 409
        `overpay`; ноль — 422 `bad_amount`; сделка без цены — 409 `no_price`
        (ревью 015). Пустой слот — 409 `slot_empty`; слот без подтверждённой
        брони — 409 `not_booked`. Без заголовка — 400 `idempotency_key_required`,
        длиннее 200 символов — 400 `idempotency_key_too_long`, тот же ключ на
        другой запрос — 409 `idempotency_key_reused`, тот же ключ ещё
        выполняется — 409 `idempotency_in_progress`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - name: slotId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Ключ повтора. Без него повторное нажатие «Оплатить» на плохой связи
            заводит вторую запись об оплате.
          schema: { type: string, maxLength: 200 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { $ref: '#/components/schemas/Money' }  # description: 'пусто = остаток до цены'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  # ───────────────────────── BUDGET ─────────────────────────
  /weddings/{weddingId}/budget:
    get:
      tags: [budget]
      summary: Бюджет (статьи + автосуммы из слотов)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
  /weddings/{weddingId}/tips:
    get:
      tags: [wedding]
      summary: Подсказки Тиля по правилам (Бизнес-логика §3.14)
      description: |
        Три правила, считаются на сервере из данных свадьбы: дефицит категории
        (слот без брони, до свадьбы < 8 месяцев, свободных на дату анкет в городе
        ≤ 6), блокирующий слот (блок тайминга из шаблона зависит от пустого слота),
        лимит бюджета (категория обещана больше чем на 85 % плана). Пустой список —
        поводов нет. Внутри суммы — только паре (матрица §6). До 2026-09-18 правила
        жили на клиенте: порог 80 % по загруженной странице, остальных не было.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Tip' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /weddings/{weddingId}/budget/items:
    post:
      tags: [budget]
      summary: Своя статья расхода
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, amount, categoryId]
              properties:
                title: { type: string }
                amount: { $ref: '#/components/schemas/Money' }
                categoryId: { type: string }
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetItem' }
  /weddings/{weddingId}/budget/items/{itemId}:
    delete:
      tags: [budget]
      summary: Удалить свою статью (×-кнопка)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Удалена }

  # ───────────────────────── GUESTS ─────────────────────────
  /weddings/{weddingId}/guests:
    get:
      tags: [guests]
      summary: Список гостей
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Guest' }
    post:
      tags: [guests]
      summary: Добавить гостя
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                plusOne: { type: boolean, default: false }
                group: { type: string, example: 'Родня невесты' }
                phone: { type: string, maxLength: 32, description: 'для напоминаний по SMS (POST …/guests/remind)' }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guest' }
  /weddings/{weddingId}/guests/{guestId}:
    patch:
      tags: [guests]
      summary: Обновить гостя (статус RSVP циклом yes→no→pending)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - name: guestId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                plusOne: { type: boolean }
                status: { type: string, enum: [yes, no, pending] }
                tableId: { type: string, nullable: true }
                group: { type: string, nullable: true }
                phone: { type: string, nullable: true, maxLength: 32, description: 'null — стереть номер' }
                diet: { type: string, nullable: true, enum: [null, vegetarian, vegan, halal, kosher, gluten_free, other] }
                dietNote: { type: string, nullable: true, maxLength: 300 }
                transfer: { type: string, nullable: true, enum: [null, need, own] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guest' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [guests]
      summary: Удалить гостя
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - name: guestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Удалён }
  /weddings/{weddingId}/tables:
    get:
      tags: [guests]
      summary: Рассадка (столы + гости)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Table' }
    post:
      tags: [guests]
      summary: Добавить стол
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: 'Стол 7' }
                capacity: { type: integer, minimum: 1, maximum: 100, default: 8 }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Table' }
        '422': { $ref: '#/components/responses/Validation' }

  /weddings/{weddingId}/tables/{tableId}:
    patch:
      tags: [guests]
      summary: Переименовать стол или изменить вместимость
      description: |
        До фичи 005 стол нельзя было ни переименовать, ни убрать — промах по
        «Добавить стол» оставался навсегда. Вместимость меньше числа уже
        посаженных — 409 `table_full`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: tableId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
                capacity: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Table' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [guests]
      summary: Удалить стол
      description: 'Гости стола остаются в списке без стола (tableId становится null).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: tableId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Удалён }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── GUEST RSVP (публично) ─────────────────────────
  /rsvp/{guestToken}:
    get:
      tags: [guests]
      summary: Публичная страница гостя (из ссылки в приглашении)
      parameters:
        - name: guestToken
          in: path
          required: true
          schema: { type: string }
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  guestName: { type: string }
                  wedding: { $ref: '#/components/schemas/WeddingPublic' }
                  status: { type: string, enum: [yes, no, pending] }
                  # Свой ответ целиком: гость видит, что уже сказал (v0.25 —
                  # аудит, блок 5). Без этого форма после «приду» не могла
                  # показать ни +1, ни еду, ни трансфер, которые он выбрал.
                  plusOne: { type: boolean }
                  diet: { type: string, nullable: true, enum: [null, vegetarian, vegan, halal, kosher, gluten_free, other] }
                  dietNote: { type: string, nullable: true }
                  transfer: { type: string, nullable: true, enum: [null, need, own] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [guests]
      summary: Ответ гостя (RSVP)
      description: |
        `plusOne: true` при уже забронированном автобусе может не поместиться
        в его границу мест — тогда 409 `bus_full`, ответ RSVP не сохраняется.
      parameters:
        - name: guestToken
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [yes, no] }
                plusOne: { type: boolean }
                comment: { type: string }
                diet: { type: string, nullable: true, enum: [null, vegetarian, vegan, halal, kosher, gluten_free, other] }
                dietNote: { type: string, maxLength: 300 }
                transfer: { type: string, enum: [need, own] }
      security: []
      responses:
        '200': { description: Принято }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`bus_full` — мест в автобусе не осталось'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /weddings/{weddingId}/guests/import:
    post:
      tags: [guests]
      summary: Завести гостей списком
      description: |
        Пара вставляет список из заметок или таблицы; экран разбирает строки
        (имя, телефон, «+1») и показывает предпросмотр, сервер принимает уже
        разобранные строки и заводит их одной транзакцией (фича 008, План
        §20.1 экран 29). Дубликаты пропускаются, а не обновляются: совпадение
        имени (без учёта регистра и лишних пробелов) или телефона с уже
        существующим гостем свадьбы или с другой строкой того же запроса —
        `skipped` с причиной `duplicate`. Телефон нормализуется к `+7XXXXXXXXXX`
        (принимаются `8…`, `7…`, `+7…`); не распознанный — `invalid`, строка не
        заводится, остальные — заводятся. Повтор того же списка добавляет ноль.
        Права — как у `POST …/guests` (вся команда свадьбы).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guests]
              properties:
                guests:
                  type: array
                  minItems: 1
                  maxItems: 300
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, minLength: 2, maxLength: 120 }
                      phone: { type: string, maxLength: 32 }
                      plusOne: { type: boolean, default: false }
                      group: { type: string, maxLength: 60 }
      responses:
        '201':
          description: Список заведён; что пропущено — в `skipped`
          content:
            application/json:
              schema:
                type: object
                required: [created, skipped]
                properties:
                  created:
                    type: array
                    items: { $ref: '#/components/schemas/Guest' }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [index, name, reason]
                      properties:
                        index: { type: integer, description: 'позиция строки в присланном списке, с нуля' }
                        name: { type: string }
                        reason: { type: string, enum: [duplicate, invalid] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /weddings/{weddingId}/guests/remind:
    post:
      tags: [guests]
      summary: Напомнить гостям, которые не ответили
      description: |
        Одно СМС каждому, кто не ответил на приглашение и у кого есть телефон.
        Раньше пара обходила список руками — на полусотне гостей это вечер.

        **Только паре** (фича 005): рассылка тратит SMS-лимит свадьбы,
        помощнику и координатору — 403. Телефоны гостей видит тоже только
        пара — остальным в `Guest` приходит `hasPhone`.

        **Кому не уходит и почему.** Гостю, чья личная ссылка уже открыта,
        напоминание отсюда не идёт: новая ссылка гасит его токен, а вместе с
        ним теряется всё, что он выбрал — резерв подарка в том числе (§9).
        Такому гостю пара выдаёт ссылку поштучно, осознанно.

        **Не чаще раза в сутки.** Рассылка стоит денег и приходит чужим людям.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: Отправлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: integer, description: 'сколько сообщений ушло' }
                  skippedNoPhone: { type: integer, description: 'не ответили, но телефона нет' }
                  skippedLinkUsed:
                    type: integer
                    description: 'не ответили, но живой личной ссылки нет — открыта или не выдавалась; им ссылку выдают поштучно'
                  failed:
                    type: integer
                    description: 'телефон и ссылка есть, а SMS не ушла: отказ провайдера или предел рассылки (300 за нажатие; остальные — в следующие сутки)'
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: '`too_often` — не чаще раза в сутки; заголовка `Retry-After` нет'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /weddings/{weddingId}/guests/{guestId}/invite-link:
    post:
      tags: [guests]
      summary: Выдать (или перевыпустить) одноразовую ссылку-приглашение гостю
      description: >
        Только роль couple. Список гостей ведёт вся команда, но ссылка — это
        удостоверение: кто её выдаёт, тот может обменять её сам и дальше
        действовать от имени гостя. Помощнику такие права не нужны
        (решение владельца 2026-09-03).
        Возвращает ссылку вида https://tili-tili.ru/i/{shareCode}. Код одноразовый:
        при первом открытии он гаснет и гость получает персональный guestToken в свой
        браузер. Пара сырой токен не видит. Повторный вызов гасит прежний код и выдаёт
        новый — на случай «гость потерял ссылку». Вместе с кодом гаснет и САМ ТОКЕН:
        иначе пара, которая ссылку и выдаёт, обменяла бы её сама и увидела на гостевой
        странице, какой подарок этот гость зарезервировал (§9). Резервы прежнего токена
        освобождаются — подарок не должен остаться занят мёртвой ссылкой.
      parameters:
        - { name: weddingId, in: path, required: true, schema: { type: string } }
        - { name: guestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, example: 'https://tili-tili.ru/i/7F3K-QX9M' }
                  expiresAt: { type: string, format: date-time, description: '30 дней или дата свадьбы + 30 дней — что позже' }

  /invite/{shareCode}:
    get:
      tags: [guests]
      security: []
      summary: Обменять одноразовый код на персональный токен гостя
      description: >
        Вызывается браузером гостя при переходе по ссылке. Код гасится в этот момент.
        Токен возвращается один раз и дальше живёт в localStorage гостя. Повторный вызов
        с тем же кодом в течение 10 минут после первого отдаёт тот же токен (ответ мог не
        дойти по мобильной сети — D3-07), позже — 410; 410 также у истёкшего и
        перевыпущенного парой кода и у кода отменённой или убранной свадьбы.
      parameters:
        - { name: shareCode, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [guestToken, guestName, wedding]
                properties:
                  guestToken: { type: string }
                  guestName: { type: string }
                  wedding: { $ref: '#/components/schemas/WeddingPublic' }
        '410':
          description: '`gone` — код уже использован или истёк: попросите пару выслать ссылку заново'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── TASKS / CHECKLIST ─────────────────────────
  /weddings/{weddingId}/tasks:
    get:
      tags: [tasks]
      summary: Чек-лист (шаблонные + свои задачи)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - name: mine
          in: query
          schema: { type: boolean, default: false }
          description: Только задачи текущего пользователя в этой свадьбе; права раздела не меняются.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
    post:
      tags: [tasks]
      summary: Своя задача
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '422':
          description: Неверная дата, период или ответственный; относительная точная дата без даты свадьбы.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /weddings/{weddingId}/tasks/{taskId}:
    patch:
      tags: [tasks]
      summary: Отметить/изменить задачу
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404':
          description: Задача не найдена в доступной свадьбе.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Неверная дата или ответственный; планирование задач плана Б не поддерживается.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [tasks]
      summary: Удалить свою задачу
      description: 'Системную задачу (заведённую сервером, не парой) удалить нельзя — 409 `system_task`.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Удалена }
        '409':
          description: '`system_task` — системную задачу удалить нельзя'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── CHATS ─────────────────────────
  /chats:
    get:
      tags: [chats]
      summary: Список чатов пользователя
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Chat' }
  /chats/{chatId}/messages:
    get:
      tags: [chats]
      summary: История сообщений
      security: [{ bearerAuth: [] }]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  nextCursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '423':
          description: '`wedding_date_unknown` — у свадьбы ещё нет даты, окно чата не считается; `chat_not_open_yet` — окно чата ещё не открылось'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [chats]
      summary: Отправить сообщение
      security: [{ bearerAuth: [] }]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                attachmentUrl: { type: string }
      responses:
        '201':
          description: Отправлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`chat_closed` — чат своего подрядчика закрыт: сделка отменена, писать некому (переписка остаётся паре для чтения)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '423':
          description: '`wedding_date_unknown` — у свадьбы ещё нет даты, окно чата не считается; `chat_not_open_yet` — окно чата ещё не открылось'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            Предел исчерпан: `cold_outreach_limit` — непроверенный подрядчик начал
            за день больше переписок, чем разрешено (§18.2); `tilly_daily_limit` —
            пара задала Тилю за сутки (по поясу свадьбы) больше реплик, чем
            `Chat.tilly.limitPerDay` (План §18: 50 в день). Заголовка Retry-After
            нет — счётчик сбрасывается в полночь по поясу места, и экран говорит
            это словами сервера. Реплика не сохраняется.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /chats/{chatId}/ws:
    get:
      tags: [chats]
      summary: Живой канал чата (WebSocket)
      description: |
        Апгрейд соединения до WebSocket. Сообщения и «печатает…» приходят
        событиями `{ type, chatId, actorId, … }`; отправка по-прежнему
        обычным POST — канал только доставляет.

        Токен доступа идёт СТРОКОЙ ЗАПРОСА, а не заголовком: браузерный
        WebSocket заголовки ставить не умеет. Поэтому он маскируется в логах
        наравне с гостевыми токенами.

        Отказ приходит внутри соединения (`{ type: 'error', status, code }`)
        и закрывает его кодом 4000+status: молча оборвать рукопожатие значило
        бы «сеть барахлит» вместо «ссылка устарела», и клиент переподключался
        бы бесконечно.

        Если канал недоступен, клиент опрашивает историю раз в 30 секунд —
        штатный запасной путь §13.4.

        Коды закрытия — тем же пространством, что и обычные ответы, только
        4000+status: `token_expired` → 4401, `forbidden`/`vendor_blocked` →
        4403, `not_found` → 4404, `wedding_date_unknown`/`chat_not_open_yet` →
        4423. Без апгрейда до WebSocket — 426 `upgrade_required`.
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
        - name: token
          in: query
          required: true
          description: Токен доступа. В заголовке его передать нельзя — так устроен браузерный WebSocket.
          schema: { type: string }
      security: []
      responses:
        '101': { description: Соединение установлено }
        '426': { description: '`upgrade_required` — нужен апгрейд до WebSocket' }
  /chats/{chatId}/typing:
    post:
      tags: [chats]
      summary: Индикатор «печатает…» (WebSocket-fallback)
      description: |
        Запасной путь для клиента без живого канала: он сообщает о наборе
        обычным запросом, а событие уходит подписчикам тем же каналом, что
        и сообщения. Ничего не сохраняется — «печатает» живёт секунды.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '423':
          description: '`wedding_date_unknown` — у свадьбы ещё нет даты, окно чата не считается; `chat_not_open_yet` — окно чата ещё не открылось'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /chats/vendor/{vendorId}:
    post:
      tags: [chats]
      summary: Открыть/создать чат с подрядчиком («Написать»)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }

  # ───────────────────────── VENDOR-СТОРОНА ─────────────────────────
  /vendor/profile:
    get:
      tags: [vendor]
      summary: Моя анкета подрядчика
      description: |
        Анкеты ещё нет — 404: по нему кабинет показывает «Анкеты ещё нет» с кнопкой
        заполнить. Остальные пути `/vendor/*` без анкеты отвечают 403 (ревью 015).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [vendor]
      summary: "Создать/обновить анкету (мастер: категория → пакеты → город → публикация)"
      description: |
        Категория или город не из справочника — 404 (ARB-4). Несколько
        городов подходят под название — 422 `city_ambiguous`; портфолио с
        видео без длительности — 422 `video_duration_required`; видео длиннее
        предела — 422 `video_too_long`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorUpsert' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorDetail' }
        '404':
          description: 'категория или город не найдены в справочнике'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
  /vendor/profile/publish:
    post:
      tags: [vendor]
      summary: Опубликовать анкету (модерация → live)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [moderation, live] }
        '409': { $ref: '#/components/responses/Conflict' }
  /vendor/calendar:
    get:
      tags: [vendor]
      summary: Занятость (календарь подрядчика)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: month
          in: query
          schema: { type: string, example: '2027-06' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string, format: date }
                    status: { type: string, enum: [free, busy, hold] }
                    source:
                      type: string
                      enum: [manual, deal]
                      nullable: true
                      description: |
                        Кто закрыл дату: сам подрядчик (`manual`) или сделка (`deal`).
                        Без этого поля кабинет не может отличить одно от другого: он
                        предлагает снять занятость с забронированного дня, сервер
                        отвечает 204 и ничего не меняет — тап выглядит потерянным.

                        Пусто у `hold`: мягкая бронь выводится из состояния сделки и
                        строки в календаре не имеет.
  /vendor/calendar/busy:
    post:
      tags: [vendor]
      summary: Отметить даты занятыми/свободными
      description: 'Календарная дата не существует — 422 `bad_date`.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dates, status]
              properties:
                dates:
                  type: array
                  items: { type: string, format: date }
                status: { type: string, enum: [free, busy] }
      responses:
        '204': { description: OK }
        '422': { $ref: '#/components/responses/Validation' }
  /vendor/leads:
    get:
      tags: [vendor]
      summary: Входящие лиды
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Lead' }
  /vendor/leads/{leadId}:
    post:
      tags: [vendor]
      summary: "Действие с лидом: ответить / холд 72ч / отклонить / вернуть"
      description: |
        `text` обязателен при `action=reply` — без него 422 `text_required`;
        текст при action, для которого он не по делу, — 422 `text_not_allowed`.
        Уходит той же дверью, что `POST /chats/{chatId}/messages`:
        заблокированному подрядчику — 403 `vendor_blocked`, непроверенному
        сверх предела холодных обращений — 429 `cold_outreach_limit`. Лид уже
        выигран (`lead_won`) — 409: решение принято, действие не применяется.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [reply, hold, decline, reopen] }
                text:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  description: |
                    Сообщение паре в чат заявки. Обязателен при `action=reply`;
                    при `hold`/`decline`/`reopen` — по желанию: причина отказа
                    или холда (§3.13, R-48).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lead' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`lead_won` — лид уже выигран, действие не применяется'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
        '429':
          description: '`cold_outreach_limit` — непроверенный подрядчик исчерпал предел холодных обращений за день'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /vendor/reviews:
    get:
      tags: [vendor]
      summary: Отзывы на меня
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }
  /vendor/reviews/{reviewId}/reply:
    post:
      tags: [vendor]
      summary: Ответить на отзыв
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties: { text: { type: string } }
      responses:
        '200': { description: OK }
  /vendor/deals:
    get:
      tags: [vendor]
      summary: Сделки подрядчика
      description: |
        Экран «Сделки» кабинета: пара, дата, сумма, состояние. Заявка
        и сделка — разные вещи: у заявки нет ни суммы, ни мягкой брони,
        и показывать одно вместо другого нечестно.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  expected:
                    allOf: [{ $ref: '#/components/schemas/Money' }]
                    description: 'остаток по ОТКРЫТЫМ броням (booked, paid_deposit): цена минус платежи'
                  shortfall:
                    allOf: [{ $ref: '#/components/schemas/Money' }]
                    description: |
                      Недоплата по ЗАВЕРШЁННЫМ (done) сделкам: работа сдана, а
                      цена не закрыта платежами. В «ожидается» не входит — это
                      предмет спора, а не ожидания (решение владельца, В7).
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        coupleName: { type: string }
                        weddingDate: { type: string, format: date, nullable: true }
                        price:
                          allOf: [{ $ref: '#/components/schemas/Money' }]
                          nullable: true
                        packageName:
                          type: string
                          nullable: true
                          description: 'пакет, по которому бронировали; null — без пакета или пакет снят с витрины'
                        state: { type: string, enum: [candidate, contacted, negotiating, booked, paid_deposit, done, cancelled] }
                        paid:
                          allOf: [{ $ref: '#/components/schemas/Money' }]
                          description: 'внесено платежами (те же `payments`, что видит пара; возвраты с минусом) — карточка сделки, План §8.2'
                        chatId:
                          type: string
                          nullable: true
                          description: 'чат с парой этой свадьбы (`kind: vendor`); null — пара ещё не писала'
                        contract:
                          type: object
                          nullable: true
                          description: 'последняя редакция договора по сделке — только заголовок, без полей сторон'
                          properties:
                            id: { type: string }
                            templateCode: { type: string }
                            version: { type: integer }
                            status: { type: string, enum: [draft, sent, signed] }
                            createdAt: { type: string, format: date-time }
                        holdUntil: { type: string, format: date-time, nullable: true }
                        busRoutes:
                          type: array
                          description: |
                            Маршруты для гостей, привязанные к этой сделке (перевозчик,
                            фича 006): сколько машин и мест готовить. Только счётчики —
                            имён и телефонов гостей перевозчик не получает (152-ФЗ).
                            У сделок не из слота «Транспорт» — пустой список.
                          items:
                            type: object
                            properties:
                              id: { type: string }
                              name: { type: string }
                              from: { type: string, nullable: true }
                              time: { type: string, nullable: true }
                              seats: { type: integer }
                              taken: { type: integer, description: 'занято персон' }
  /vendor/updates:
    get:
      tags: [vendor]
      summary: Обновления от пар
      description: >
        §13.2: изменения рассадки, опроса меню, тайминга и гостевых счётчиков
        по свадьбам, где сделка подрядчика забронирована. Не уведомление,
        а короткий список того, что надо учесть; закрывается подтверждением.
        Правки одного вида по одной свадьбе сливаются в одну строку, пока
        её не подтвердили: рассадку двигают мышью, и каждое движение — не новость.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    wedding: { type: string }
                    weddingDate: { type: string, format: date, nullable: true }
                    kind: { type: string, enum: [seating, menu, timeline, guests, transport], description: '`transport` — маршрут для гостей заведён или изменён по сделке перевозчика (фичи 006/014)' }
                    text: { type: string }
                    createdAt: { type: string, format: date-time }
                    ackAt: { type: string, format: date-time, nullable: true }

  /vendor/updates/{updateId}/ack:
    post:
      tags: [vendor]
      summary: Подтвердить получение обновления
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: updateId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Учтено; повтор не меняет времени }
        '404': { $ref: '#/components/responses/NotFound' }

  /vendor/analytics:
    get:
      tags: [vendor]
      summary: Аналитика анкеты (просмотры → лиды → сделки)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [month, season, year], default: season }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: string, enum: [month, season, year] }
                  revenue: { $ref: '#/components/schemas/Money' }
                  revenueDeltaPct:
                    type: number
                    nullable: true
                    example: 38
                    description: |
                      Прирост к прошлому такому же периоду. `null`, если
                      прошлого периода не было: делить на ноль нечем, а «+100 %»
                      от нуля — это выдумка.
                  funnel:
                    type: object
                    properties:
                      views: { type: integer, example: 1240 }
                      contacts: { type: integer, example: 96 }
                      leads: { type: integer, example: 34 }
                      deals: { type: integer, example: 8 }

  # ───────────────────────── REVIEWS (пара → подрядчик) ─────────────────────────
  /catalog/vendors/{vendorId}/reviews:
    get:
      tags: [catalog]
      summary: Отзывы о подрядчике
      description: |
        Публичная лента с пометкой источника (§15). Отзыв пары идёт
        с подтверждённой сделкой, отзыв гостя — с бейджем «Гость свадьбы»:
        у пары договор, у гостя впечатление, и смешивать их нельзя.

        Скрытые модератором отзывы не отдаются и в рейтинг не входят.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string, enum: [couple, guest, all], default: all }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Review' } }
                  nextCursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [catalog]
      summary: Оставить отзыв (только после завершённой сделки)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, text]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                text: { type: string }
      description: |
        Право на отзыв — завершённая (`done`) сделка этой пары с подрядчиком, ещё без
        отзыва и не старше 14 дней после завершения: берётся свежайшая такая
        (у фотографа с двумя слотами — вторая сделка получает свой отзыв, ревью 015).
        Нет ни одной — 403; все завершённые уже с отзывом — 409 `review_exists`;
        подрядчика с таким идентификатором нет — 404.
      responses:
        '201': { description: Создан }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── NOTIFICATIONS ─────────────────────────
  /notifications:
    get:
      tags: [notifications]
      summary: Уведомления пользователя
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
  /notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Отметить прочитанным
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: OK }
  /notifications/read-all:
    post:
      tags: [notifications]
      summary: Отметить прочитанными все
      description: |
        «Прочитать все» одним запросом (план миграции §2.3): до этого экран
        обходил список поштучно — сотня уведомлений, сотня запросов на один тап,
        и обрыв посередине оставлял половину непрочитанной. Повтор пустой:
        время прочтения не двигается.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  marked: { type: integer, description: 'сколько уведомлений стало прочитанными этим запросом' }
        '401': { $ref: '#/components/responses/Unauthorized' }


  # ───────────────────────── WISHLIST (пара) ─────────────────────────
  /weddings/{weddingId}/wishlist:
    get:
      tags: [wishlist]
      summary: Список желаний пары
      description: Пара видит статус подарка, но НИКОГДА не видит, кто его зарезервировал (§9).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  gifts: { type: array, items: { $ref: '#/components/schemas/Gift' } }
                  funds: { type: array, items: { $ref: '#/components/schemas/Fund' } }
                  antiGifts: { type: array, items: { type: string } }
    post:
      tags: [wishlist]
      summary: Добавить желание
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: { type: string }
                price: { $ref: '#/components/schemas/Money' }
                group: { type: boolean, description: можно скидываться }
                icon: { type: string, maxLength: 16 }
                desc: { type: string }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gift' }
  /weddings/{weddingId}/wishlist/{giftId}:
    patch:
      tags: [wishlist]
      summary: Изменить желание
      description: 'Новая цена ниже уже собранной суммы — 409 `gift_price_below_funded`.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: giftId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                price: { $ref: '#/components/schemas/Money' }
                icon: { type: string, maxLength: 16 }
                desc: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gift' }
        '409':
          description: '`gift_price_below_funded` — новая цена ниже уже собранной суммы'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [wishlist]
      summary: Удалить желание
      description: 'Запрещено, если в подарок уже сложились — 409 `gift_has_contributions`, как и у фонда.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: giftId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: OK }
        '409':
          description: '`gift_has_contributions` — в подарок уже сложились'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── WISHLIST (гость по ссылке) ─────────────────────────
  /gifts/{guestToken}:
    get:
      tags: [wishlist-guest]
      summary: Список подарков глазами гостя
      description: Без авторизации, по коду приглашения. Занятые подарки помечены, но кем — не видно.
      parameters: [{ $ref: '#/components/parameters/GuestToken' }]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  gifts: { type: array, items: { $ref: '#/components/schemas/Gift' } }
                  funds: { type: array, items: { $ref: '#/components/schemas/Fund' } }
                  antiGifts: { type: array, items: { type: string } }
                  fairPrice:
                    allOf: [{ $ref: '#/components/schemas/Money' }]
                    nullable: true
                    description: |
                      Деликатный ориентир «банкет на гостя»: расходы по строке
                      «Площадка и кейтеринг», делённые на число гостей. Пока
                      бюджет пуст или список гостей пуст — null, а не ноль
                      и не выдуманное число.
        '401': { $ref: '#/components/responses/Unauthorized' }
  /gifts/{guestToken}/{giftId}/reserve:
    post:
      tags: [wishlist-guest]
      summary: Зарезервировать подарок
      description: |
        Атомарно: резерв проходит только если подарок свободен (conditional update
        либо unique constraint). Второй гость получает 409 `gift_reserved` —
        подарить дважды нельзя. Токен гостя сохраняется, но паре не отдаётся
        никогда.

        Повтор тем же токеном — тот же 200: гость нажал дважды, подарок его.
        Подарок, в который уже сложились (`gift_has_contributions`), зарезервировать
        нельзя: иначе деньги участников складчины повисают на чужом резерве.
        Обязательный `Idempotency-Key`: без него — 400 `idempotency_key_required`,
        длиннее 200 символов — 400 `idempotency_key_too_long`. Предел резервов
        с одного токена — `reservation_limit` (429, без `Retry-After`).
      parameters:
        - { $ref: '#/components/parameters/GuestToken' }
        - { name: giftId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      security: []
      responses:
        '200': { description: Зарезервировано }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`gift_reserved` — уже зарезервирован другим гостем; `gift_has_contributions` — в подарок уже сложились'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
    delete:
      tags: [wishlist-guest]
      summary: Снять свой резерв
      description: Только по тому же гостевому токену, которым резерв был поставлен.
      parameters:
        - { $ref: '#/components/parameters/GuestToken' }
        - { name: giftId, in: path, required: true, schema: { type: string } }
      security: []
      responses:
        '204': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /gifts/{guestToken}/{giftId}/fund:
    post:
      tags: [wishlist-guest]
      summary: Внести часть суммы (складчина)
      description: |
        Только для подарков с `group: true` (иначе 409 `gift_not_group`). Сумма
        прибавляется к `funded` до `price`; взнос, переваливающий за цену
        (`gift_overfunded`), или закрытый подарок (`gift_closed`, `funded == price`),
        или уже зарезервированный кем-то (`gift_reserved`) — 409: принять
        больше нужного значит взять с гостя лишнее. Обязательный
        `Idempotency-Key`: без него — 400 `idempotency_key_required`, длиннее
        200 символов — 400 `idempotency_key_too_long`, тот же ключ на другой
        запрос — 409 `idempotency_key_reused`. Предел взносов с одного токена —
        `contribution_limit` (429, без `Retry-After`).
      parameters:
        - { $ref: '#/components/parameters/GuestToken' }
        - { name: giftId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gift' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`gift_not_group` — не складчина; `gift_overfunded` — сумма выше цены; `gift_closed` — уже собрано; `gift_reserved` — занят; `idempotency_key_reused` — тот же ключ на другой запрос'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
  /gifts/{guestToken}/funds/{fundId}:
    post:
      tags: [wishlist-guest]
      summary: Перевод в денежный фонд
      description: |
        Обязательный `Idempotency-Key`: без него — 400 `idempotency_key_required`,
        длиннее 200 символов — 400 `idempotency_key_too_long`, тот же ключ на
        другой запрос — 409 `idempotency_key_reused`. Предел взносов с одного
        токена — `contribution_limit` (429, без `Retry-After`).
      parameters:
        - { $ref: '#/components/parameters/GuestToken' }
        - { name: fundId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fund' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`idempotency_key_reused` — тот же ключ на другой запрос'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }

  # ───────────────────────── СВОИ ПОДРЯДЧИКИ (§11) ─────────────────────────
  /weddings/{weddingId}/slots/{slotId}/external:
    post:
      tags: [bookings]
      summary: Добавить своего подрядчика (не из каталога)
      description: |
        Пара нашла исполнителя сама. Профиля в каталоге нет, но слот, бюджет
        и тайминг он занимает наравне с каталожным. Слот уже занят — 409
        `slot_taken`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: slotId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendorName, price]
              properties:
                vendorName: { type: string }
                price: { $ref: '#/components/schemas/Money' }
                phone: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slot' }
        '409':
          description: '`slot_taken` — слот уже занят'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [bookings]
      summary: Удалить своего подрядчика
      description: |
        Отменяет сделку той же единственной дверью `cancelDeal()`, что и
        отмена брони слота, `PATCH /deals` и отмена свадьбы (F1,
        F-RL-2-02/SA-06): освобождает дату, гасит ссылку-приглашение,
        снимает автобусные маршруты, возвращает лид в работу. Слот
        возвращается в empty, выданный гостевой токен аннулируется. В слоте
        нет сделки или сделка каталожная (не свой подрядчик) — 404;
        выполненная работа не снимается — 409 `bad_transition`; сделка,
        которую успел отменить параллельный запрос, — 409 `already_cancelled`
        (повтор после завершённой отмены получает 404: слот уже пуст).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: slotId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`bad_transition` — выполненная работа не снимается; `already_cancelled` — сделку уже отменил параллельный запрос'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /weddings/{weddingId}/slots/{slotId}/external/invite:
    post:
      tags: [bookings]
      summary: Ссылка-приглашение для своего подрядчика
      description: |
        Одноразовый токен, scope guest_vendor, TTL 30 дней, привязан к слоту.
        Только для своего подрядчика: в слоте с каталожной сделкой — 409
        `not_external` (у каталожного есть кабинет и чат по анкете; ссылка
        открывала бы слот и переписку постороннему — ревью 015). Пустой слот — 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: slotId, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  url: { type: string, example: 'https://tili-tili.ru/guest-vendor/<token>' }
                  expiresAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /guest-vendor/{token}:
    get:
      tags: [bookings]
      summary: Кабинет гостя-подрядчика
      description: Без регистрации. Отдаёт только дату, тайминг дня и чат с парой — ничего больше.
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  weddingDate: { type: string, format: date, nullable: true, description: 'пусто, пока пара не выбрала дату' }
                  slot: { $ref: '#/components/schemas/Slot' }
                  chatId: { type: string }
                  holdHours: { type: integer, description: 'срок мягкой брони в часах (§18.3) — справочно, как у сделки' }
                  timeline:
                    type: array
                    description: >
                      Тайминг дня целиком (§11): подрядчику нужно знать, когда начинается
                      церемония и когда его выход. Ни гостей, ни бюджета, ни остальной
                      команды здесь нет.
                    items: { $ref: '#/components/schemas/TimelineEvent' }
        '410':
          description: '`gone` — ссылка истекла или отозвана'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /guest-vendor/{token}/messages:
    get:
      tags: [bookings]
      summary: Переписка своего подрядчика с парой
      description: >
        Тот же чат, что пара видит у себя в списке. Аккаунта у подрядчика нет,
        поэтому право читать даёт токен из ссылки, а не заголовок авторизации.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Message' } }
                  nextCursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410':
          description: '`gone` — ссылка истекла или отозвана'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [bookings]
      summary: Написать паре
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
      security: []
      responses:
        '201':
          description: Отправлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '410':
          description: '`gone` — ссылка истекла или отозвана'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── ЛОГИСТИКА ГОСТЕЙ (§12.1) ─────────────────────────
  /weddings/{weddingId}/logistics/buses:
    get:
      tags: [logistics]
      summary: Маршруты трансфера
      description: |
        Пути чтения не было: маршрут можно было создать и удалить, но не
        показать. Экран логистики после перезагрузки оставался пустым, хотя
        автобусы стояли в базе, а `taken` — единственный источник правды о том,
        сколько мест занято.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BusRoute' }
    post:
      tags: [logistics]
      summary: Добавить маршрут трансфера
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusRoute' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusRoute' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /weddings/{weddingId}/logistics/buses/{busId}:
    patch:
      tags: [logistics]
      summary: Изменить маршрут
      description: |
        До фичи 006 маршрут можно было только завести и удалить — опечатка во
        времени стоила записей гостей. Все поля необязательны; `seats` меньше
        занятых персон — 409 `bus_full`; `dealId: null` снимает перевозчика.
        Перевозчику из каталога уходит заметка «пара изменила маршрут».
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: busId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                from: { type: string, maxLength: 300, nullable: true, description: 'null — точка сбора ещё не назначена' }
                time: { type: string, nullable: true, description: 'HH:MM; null — время ещё не назначено' }
                seats: { type: integer, minimum: 1, maximum: 500 }
                dealId: { type: string, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusRoute' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [logistics]
      summary: Удалить маршрут
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: busId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: OK }
  /weddings/{weddingId}/logistics/hotels:
    get:
      tags: [logistics]
      summary: Отельные блоки
      description: |
        Симметрично автобусам: блок можно было завести и удалить, но не
        прочитать. Гостю список отдаётся по его токену
        (`/join/{guestToken}/hotels`), а паре — здесь.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HotelBlock' }
    post:
      tags: [logistics]
      summary: Добавить отельный блок
      description: 'Дата заезда/выезда — не существующий календарный день — 422 `bad_date`.'
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HotelBlock' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotelBlock' }
        '422': { $ref: '#/components/responses/Validation' }
  /weddings/{weddingId}/logistics/hotels/{hotelId}:
    delete:
      tags: [logistics]
      summary: Удалить отельный блок
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: hotelId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: OK }
  /weddings/{weddingId}/logistics/notify-pickup:
    post:
      tags: [logistics]
      summary: Разослать точки сбора записавшимся гостям
      description: |
        Гостям доставки нет (ни SMS, ни почты — «Хвосты»): рассылка пишется в
        журнал и уведомляет команду в приложении. Тело ответа говорит, что
        именно сделано, — `recipients` это кого касается, `notified` —
        скольким членам команды ушло. Повторный вызов с тем же
        Idempotency-Key рассылку не дублирует. Без заголовка — 400
        `idempotency_key_required`, длиннее 200 символов — 400
        `idempotency_key_too_long`, тот же ключ на другой запрос — 409
        `idempotency_key_reused`, тот же ключ ещё выполняется — 409
        `idempotency_in_progress`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '202':
          description: Принято
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: '`idempotency_key_reused` — тот же ключ на другой запрос; `idempotency_in_progress` — тот же ключ ещё выполняется'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /join/{guestToken}/shuttle:
    get:
      tags: [logistics-guest]
      summary: Маршруты трансфера, доступные гостю
      description: |
        Записаться гость мог, а увидеть, куда именно, — нет: путь был только на
        запись, и `busId` брать было неоткуда. `myBusId` говорит, куда он уже
        записан: без этого гость, вернувшийся по ссылке, видит пустой выбор и
        занимает второе место.
      parameters: [{ $ref: '#/components/parameters/GuestToken' }]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  myBusId: { type: string, nullable: true }
                  routes:
                    type: array
                    items: { $ref: '#/components/schemas/BusRoute' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [logistics-guest]
      summary: Гость записывается в автобус
      description: |
        Место занимается атомарно; при переполнении — 409. Повтор безопасен по
        построению (`on conflict do nothing` + признак «уже записан») —
        `Idempotency-Key` не читается и не объявляется.
      parameters:
        - { $ref: '#/components/parameters/GuestToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [busId]
              properties:
                busId: { type: string }
      security: []
      responses:
        '200': { description: Записан }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /join/{guestToken}/day:
    get:
      tags: [logistics-guest]
      summary: День свадьбы глазами гостя
      description: |
        Одним запросом всё, что нужно гостю в день X (План §8.8, фича 009):
        программа — только блоки с `forGuests`, в поясе места; адрес и дресс-код;
        свой стол; свой автобус с перевозчиком; координатор (имя и телефон — он
        для того и назначен, «не жениха»); окно чата дня. Телефона пары здесь
        нет. Раздел на экране гостя появляется с кануна (по `tz`).
      parameters: [{ $ref: '#/components/parameters/GuestToken' }]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [date, tz, timeline, table, bus, coordinator, chat]
                properties:
                  date: { type: string, format: date, nullable: true }
                  tz: { type: string, example: Europe/Moscow }
                  venue: { type: string, nullable: true }
                  dressCode: { type: string, nullable: true }
                  dressNote: { type: string, nullable: true }
                  timeline:
                    type: array
                    items: { $ref: '#/components/schemas/TimelineEvent' }
                  table:
                    type: object
                    nullable: true
                    properties:
                      name: { type: string }
                  bus:
                    allOf: [{ $ref: '#/components/schemas/BusRoute' }]
                    nullable: true
                  coordinator:
                    type: object
                    nullable: true
                    properties:
                      name: { type: string, nullable: true }
                      phone: { type: string, nullable: true }
                  chat:
                    type: object
                    required: [open]
                    properties:
                      open: { type: boolean, description: 'чат дня открыт гостям: с 09:00 кануна по конец дня после свадьбы (по tz)' }
                      opensAt: { type: string, format: date-time, nullable: true }
                      closesAt: { type: string, format: date-time, nullable: true }
        '410':
          description: '`gone` — ссылка отозвана, свадьба отменена или в архиве: попросите пару прислать новую'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /join/{guestToken}/day-chat/messages:
    get:
      tags: [logistics-guest]
      summary: Чат дня X глазами гостя
      description: |
        Та же лента, что у пары и команды (`kind=day`), только по токену гостя и
        только в окне дня; вне окна — 423 `chat_closed_for_guests` с `opensAt`
        в `details`. Реплики гостей несут `guestName`.
      parameters:
        - { $ref: '#/components/parameters/GuestToken' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  nextCursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410':
          description: '`gone` — ссылка отозвана, свадьба отменена или в архиве: попросите пару прислать новую'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '423': { $ref: '#/components/responses/Locked' }
    post:
      tags: [logistics-guest]
      summary: Гость пишет в чат дня X
      description: |
        Реплика от имени гостя из списка (`guestName`), в общий чат дня — её
        видят пара, команда и забронированные подрядчики (решение владельца,
        В3 фичи 009). Команде уходит уведомление, как от участника.
      parameters: [{ $ref: '#/components/parameters/GuestToken' }]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: Отправлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '410':
          description: '`gone` — ссылка отозвана, свадьба отменена или в архиве: попросите пару прислать новую'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
        '423': { $ref: '#/components/responses/Locked' }
  /join/{guestToken}/team:
    get:
      tags: [logistics-guest]
      summary: Кто работал на свадьбе — глазами гостя
      description: |
        Нужен, чтобы гость мог оставить отзыв: `POST /weddings/{weddingId}/guest-reviews`
        принимает `vendorId`, а взять его гостю было неоткуда — списка команды
        по гостевому токену не существовало, и форма отзыва предлагала имена из
        мока.

        Отдаётся только то, что гость и так видел на свадьбе: имя, категория и
        идентификатор. Сумма сделки, телефон и состояние сделки — нет.
        Подрядчики только забронированные: оценивать того, кто не работал,
        нечего.
      parameters: [{ $ref: '#/components/parameters/GuestToken' }]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  weddingId:
                    type: string
                    description: |
                      Нужен гостю, чтобы отправить отзыв: путь отзыва —
                      `/weddings/{weddingId}/guest-reviews`, а взять этот
                      идентификатор ему больше неоткуда. Секрета в нём нет:
                      токен гостя и так привязан к этой свадьбе.
                  weddingDate:
                    type: string
                    format: date
                    nullable: true
                    description: |
                      Отзыв принимается только после дня свадьбы. Без даты гость
                      заполнил бы форму и получил отказ там, где сказать нужно
                      было заранее.
                  tz:
                    type: string
                    example: Europe/Moscow
                    description: 'пояс места свадьбы — «день прошёл» считается по нему, не по телефону гостя'
                  vendors:
                    type: array
                    items:
                      type: object
                      properties:
                        vendorId: { type: string }
                        name: { type: string }
                        categoryId: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /join/{guestToken}/hotels:
    get:
      tags: [logistics-guest]
      summary: Отельные блоки для гостя
      parameters: [{ $ref: '#/components/parameters/GuestToken' }]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HotelBlock' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [logistics-guest]
      summary: Гость занимает номер в блоке
      description: |
        Место занимается атомарно, при переполнении — 409 `hotel_full`. Пути
        записи не было вовсе: блоки показывались, а занять номер было нечем,
        хотя план требует «атомарные места в автобусе И НОМЕРЕ». После
        `deadline_passed` (дедлайн заселения прошёл) — тоже 409. Повтор
        безопасен по построению (`on conflict do nothing` + признак «уже
        занято») — `Idempotency-Key` не читается и не объявляется.
      parameters:
        - { $ref: '#/components/parameters/GuestToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hotelId]
              properties:
                hotelId: { type: string }
      security: []
      responses:
        '200': { description: Номер занят }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`hotel_full` — мест не осталось; `deadline_passed` — дедлайн заселения прошёл'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── ОПРОС ПО МЕНЮ (§12.2) ─────────────────────────
  /weddings/{weddingId}/menu-poll:
    get:
      tags: [catering]
      summary: Опрос гостей по горячему
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuPoll' }
    put:
      tags: [catering]
      summary: Изменить опрос
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuPoll' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuPoll' }
  /weddings/{weddingId}/menu-poll/remind:
    post:
      tags: [catering]
      summary: Напомнить не выбравшим блюдо
      description: |
        Гостям доставки нет: напоминание уходит команде в приложении, чтобы
        она добрала голоса сама. Тело — что сделано (см. `BroadcastResult`).
        Без заголовка — 400 `idempotency_key_required`, длиннее 200 символов —
        400 `idempotency_key_too_long`, тот же ключ на другой запрос — 409
        `idempotency_key_reused`, тот же ключ ещё выполняется — 409
        `idempotency_in_progress`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '202':
          description: Принято
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: '`idempotency_key_reused` — тот же ключ на другой запрос; `idempotency_in_progress` — тот же ключ ещё выполняется'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /join/{guestToken}/menu-vote:
    get:
      tags: [logistics-guest]
      summary: Опрос по горячему глазами гостя
      description: |
        Варианты блюд задаёт пара, а голосовать гость мог вслепую: путь был
        только на отправку выбора. `chosenOptionId` — что он уже выбрал.
      parameters: [{ $ref: '#/components/parameters/GuestToken' }]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { type: string }
                  chosenOptionId: { type: string, nullable: true }
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [catering]
      summary: Гость выбирает блюдо
      description: Один голос на гостя; повторный вызов меняет выбор, а не добавляет второй.
      parameters: [{ $ref: '#/components/parameters/GuestToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionId]
              properties:
                optionId: { type: string }
      security: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── ОТЗЫВЫ ГОСТЕЙ (§15) ─────────────────────────
  /weddings/{weddingId}/guest-reviews:
    get:
      tags: [reviews]
      summary: Отзывы гостей о подрядчиках (для пары)
      description: |
        Пара видит их анонимно — без имени гостя.

        Схема своя, а не общий `Review`: там подрядчик подразумевается адресом
        (`/catalog/vendors/{id}/reviews`), а здесь в одном списке отзывы обо всей
        команде — без `vendorId` и имени отзыв не к чему отнести.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    vendorId: { type: string }
                    vendorName: { type: string, nullable: true }
                    authorName: { type: string, example: Гость свадьбы }
                    rating: { type: integer, minimum: 1, maximum: 5 }
                    text: { type: string }
                    createdAt: { type: string, format: date-time }
    post:
      tags: [reviews]
      summary: Гость оставляет отзыв
      description: |
        Только по действующему токену приглашения и только после даты свадьбы.
        Один отзыв на подрядчика на гостя: повторная отправка — редактирование.

        Оценить можно лишь того, кто на этой свадьбе работал: у сделки должно
        быть состояние `booked` или дальше. Иначе отзыв — это оценка того,
        чего не было.
      security: []
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { $ref: '#/components/parameters/GuestTokenQuery' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendorId, stars]
              properties:
                vendorId: { type: string }
                stars: { type: integer, minimum: 1, maximum: 5 }
                text: { type: string }
      responses:
        '201': { description: Создано }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── СОГЛАСИЕ НА ОБРАБОТКУ ПДн (§18.1) ─────────────────────────
  /users/me/consent:
    post:
      tags: [auth]
      summary: Зафиксировать согласие на обработку персональных данных
      description: |
        152-ФЗ: согласие даётся явным действием. Сохраняются версия документа,
        дата и IP — это и есть подтверждение. Предустановленная галочка согласием не является.

        `adult` — отдельная галочка «мне есть 18 лет» (план бэкенда §7): версия
        документа покрывает текст, возраст текстом не покрывается. Пишется в
        `consents.adult` как есть; клиент не даёт зафиксировать согласие без неё.

        После смены редакции возвращает доступ (гасит `consent_outdated`).
        `policyVersion` не совпадает с действующей редакцией сервера — 409
        `policy_version_stale`: клиент показал не тот текст, подпись под ним
        не годится. Повтор той же действующей редакции — снова 201 и новая
        строка в `consents`: каждое нажатие «принимаю» — отдельный акт, а не
        обновление предыдущего. `Idempotency-Key` не читается и не
        объявляется.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policyVersion]
              properties:
                policyVersion: { type: string, example: '2026-09-02' }
                adult: { type: boolean, description: 'подтверждение «мне есть 18 лет»; поля нет — false' }
      responses:
        '201': { description: Зафиксировано }
        '409':
          description: '`policy_version_stale` — `policyVersion` не совпадает с действующей редакцией'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [auth]
      summary: Отозвать согласие
      description: Равносильно удалению аккаунта и всех данных свадьбы.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: OK }


  # ───────────────────────── ПРОФИЛЬ ПОЛЬЗОВАТЕЛЯ ─────────────────────────
  /users/me:
    get:
      tags: [auth]
      summary: Мой профиль
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
    patch:
      tags: [auth]
      summary: Изменить профиль и настройки уведомлений
      description: 'Имя, язык, таймзона, четыре канала push и тихие часы — экран «Настройки». Незнакомый `tz` (не из справочника IANA) — 422 `unknown_timezone`.'
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfile' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [auth]
      summary: Удалить аккаунт
      description: |
        Soft-delete на 30 дней, затем полное удаление кроном (План §19.1).
        Активные сделки требуют подтверждения второй стороны — 409
        `active_deals` со списком.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: OK }
        '409':
          description: '`active_deals` — есть активные сделки, требуют подтверждения второй стороны'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/me/sessions:
    get:
      tags: [auth]
      summary: Мои сессии и устройства
      description: 'Работает и без действующего согласия под текущей редакцией: выйти можно всегда (ARB-2).'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
    delete:
      tags: [auth]
      summary: Выйти со всех устройств, кроме текущего
      description: 'Работает и без действующего согласия под текущей редакцией: выйти можно всегда (ARB-2).'
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: OK }
  /users/me/sessions/{sessionId}:
    delete:
      tags: [auth]
      summary: Завершить сессию
      description: |
        Выход со всех устройств сразу — DELETE /users/me/sessions. Работает и
        без действующего согласия под текущей редакцией: выйти можно всегда
        (ARB-2).
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/me/export:
    get:
      tags: [auth]
      summary: Экспорт моих данных
      description: 152-ФЗ, право на получение данных. JSON со всем, что принадлежит пользователю.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
  /users/me/push-subscriptions:
    post:
      tags: [notifications]
      summary: Зарегистрировать подписку Web Push
      description: |
        VAPID. На iOS работает только с 16.4+ и после установки на экран «Домой» —
        при отказе клиент откатывается на email.

        Пока ключи VAPID не заданы, отвечает 501 `push_not_configured`: принять
        подписку и промолчать значило бы показать «уведомления включены» там,
        где их не будет. Уведомления при этом приходят в приложении —
        `GET /notifications` работает всегда.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              additionalProperties: false
              properties:
                endpoint: { type: string, minLength: 1, maxLength: 2000, pattern: '^https://[^ ]+$' }
                keys:
                  type: object
                  required: [p256dh, auth]
                  additionalProperties: false
                  properties:
                    p256dh: { type: string, minLength: 1, maxLength: 200 }
                    auth: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201': { description: Создано }
        '422': { $ref: '#/components/responses/Validation' }
        '501': { $ref: '#/components/responses/NotConfigured' }
    delete:
      tags: [notifications]
      summary: Отписаться от push
      description: |
        С параметром endpoint — только подписка этого устройства (её адрес
        знает только оно); без параметра — все подписки человека. Работает и
        при согласии под прежней редакцией: выход с экрана повторного
        согласия (ARB-2, allow-list).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: endpoint, in: query, required: false, schema: { type: string, maxLength: 2048 } }
      responses:
        '204': { description: OK }
    get:
      tags: [notifications]
      summary: Мои push-подписки
      description: |
        Экран «Настройки» показывает, на скольких устройствах включён push,
        и может снять чужое. Адрес подписки — секрет устройства: наружу
        уходит только его хост, полный `endpoint` — нет.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: endpoint, in: query, required: false, schema: { type: string, maxLength: 2048 }, description: 'адрес подписки этого устройства — чтобы отметить её как mine' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    endpointHost: { type: string, description: 'хост push-службы (fcm.googleapis.com, web.push.apple.com…)' }
                    createdAt: { type: string, format: date-time }
                    mine:
                      type: boolean
                      description: 'подписка этого устройства — сверяется с endpoint в query'
  /users/me/referral:
    get:
      tags: [auth]
      summary: Мой реферальный код и начисления
      description: 'Код вида ТИЛИ-ИМЯ; обеим парам по 3 000 ₽ бонусами после первой сделки приглашённой (§3.15).'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: ТИЛИ-АЛИНА }
                  invited: { type: integer }
                  earned: { $ref: '#/components/schemas/Money' }
  /referral/{code}/apply:
    post:
      tags: [auth]
      summary: Применить чужой реферальный код
      description: |
        Один раз на аккаунт: уже применявший любой код — 409 `referral_used`.
        Свой же код — 409 `own_code`.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '409':
          description: '`referral_used` — код на этот аккаунт уже применялся; `own_code` — свой же код'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── СДЕЛКИ: ПЕРЕХОДЫ И ДОГОВОРЫ ─────────────────────────
  /deals/{dealId}/events:
    get:
      tags: [deals]
      summary: Журнал сделки
      description: |
        Что и когда произошло со сделкой: переходы состояния и правки цены.
        Пишется в `deal_events` с самого начала, но прочитать его было негде —
        при споре «мы договаривались на другую сумму» доказательства лежали в
        базе и никому не показывались.

        Видят обе стороны сделки: пара и подрядчик. Автор события назван
        ролью, а не именем — «пара», «подрядчик», «система» (истёкшая мягкая
        бронь — событие без человека).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dealId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    kind: { type: string, enum: [state, price], description: 'переход состояния или правка цены' }
                    fromState: { $ref: '#/components/schemas/DealState' }
                    toState: { $ref: '#/components/schemas/DealState' }
                    by: { type: string, enum: [couple, vendor, system] }
                    note: { type: string, nullable: true, description: 'для правки цены — старая и новая сумма' }
                    at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /deals/{dealId}:
    patch:
      tags: [bookings]
      summary: Перевести сделку в следующее состояние или исправить сумму
      description: |
        Сделка рождается сразу в `booked` (бронь слота или свой подрядчик) —
        ступени до `booked` (`candidate`, `contacted`, `negotiating`) через API
        не производятся, это витрина будущего сценария подбора, не действующий
        путь. Дальше разрешены только переходы вперёд по цепочке
        booked → paid_deposit → done; отмена — из любого состояния, КРОМЕ
        `done`. Недопустимый переход — 409 `bad_transition`; повторная отмена
        уже отменённой сделки — 409 `already_cancelled` (одна дверь
        `cancelDeal()` — ARB-1). Дата подрядчика уже занята другой его сделкой —
        409 `date_taken`.

        Сумму можно исправить до внесения аванса: подрядчик присылает новую
        смету, и без этой правки пара была вынуждена отменять сделку, а
        отмена освобождает дату в календаре подрядчика. В paid_deposit,
        done и cancelled сумма зафиксирована — 409 `price_locked`.
        Правка пишется в журнал сделки как событие вида `price`.

        Требуется хотя бы одно из полей: `state` или `price`. Обязательный
        `Idempotency-Key`: без него — 400 `idempotency_key_required`, длиннее
        200 символов — 400 `idempotency_key_too_long`, тот же ключ на другой
        запрос — 409 `idempotency_key_reused`, тот же ключ ещё выполняется —
        409 `idempotency_in_progress`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dealId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf: [{ required: [state] }, { required: [price] }]
              properties:
                state: { $ref: '#/components/schemas/DealState' }
                price: { $ref: '#/components/schemas/Money' }
                note: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /deals/{dealId}/contract:
    post:
      tags: [documents]
      summary: Сгенерировать договор из шаблона
      description: >
        Автоподстановка сторон, даты, суммы и города. Возвращает ссылки на PDF
        и DOCX. Дисклеймер про информационный характер — в теле документа (§3.10).
        Оформляет любая из двух сторон сделки: пара или подрядчик (план §9.2
        шаг 3 — «Ирина генерирует договор из шаблона платформы»). Команде
        свадьбы — 403: договор содержит суммы и данные сторон. Сделка ещё не
        забронирована — 409 `not_booked`; в `fields` не хватает полей шаблона —
        422 `fields_missing`. `Idempotency-Key` необязателен: без него
        переоформление создаёт новую версию, с ним повтор возвращает тот же
        документ; длиннее 200 символов — 400 `idempotency_key_too_long`, тот
        же ключ на другой запрос — 409 `idempotency_key_reused`, тот же ключ
        ещё выполняется — 409 `idempotency_in_progress`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dealId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateCode]
              properties:
                templateCode: { type: string, enum: [photographer, videographer, venue, host, universal] }
                fields:
                  type: object
                  additionalProperties: true
                  description: 'паспортные данные и реквизиты, вводятся парой; обязательные поля зависят от шаблона — не хватает хотя бы одного, названного шаблоном, — 422 `fields_missing`'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: '`not_booked` — сделка ещё не забронирована; `idempotency_key_reused`/`idempotency_in_progress` — см. описание'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
  /weddings/{weddingId}/documents:
    get:
      tags: [documents]
      summary: Договоры свадьбы
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }

  # ───────────────────────── ТАЙМИНГ И ПЛАН Б ─────────────────────────
  /weddings/{weddingId}/timeline:
    get:
      tags: [timeline]
      summary: Тайминг дня
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TimelineEvent' }
    put:
      tags: [timeline]
      summary: Заменить тайминг целиком
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/TimelineEvent' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TimelineEvent' }
        '422': { $ref: '#/components/responses/Validation' }
  /weddings/{weddingId}/timeline/autogen:
    post:
      tags: [timeline]
      summary: Автоплан дня по забронированной команде
      description: 'Собирает черновик из стандартных длительностей и проверяет конфликты (План §8.9). Возвращает предпросмотр — не применяет.'
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/TimelineEvent' } }
                  conflicts: { type: array, items: { type: string } }
  /weddings/{weddingId}/timeline/shift:
    post:
      tags: [timeline]
      summary: Сдвинуть день X на N минут
      description: |
        Кнопка «+15 мин» в режиме дня X. Сдвигает все последующие блоки и
        рассылает push команде и гостям — killer-фича §19.6. Нулевой сдвиг —
        422 `empty_shift`. Обязательный `Idempotency-Key`: без него — 400
        `idempotency_key_required`, длиннее 200 символов — 400
        `idempotency_key_too_long`, тот же ключ на другой запрос — 409
        `idempotency_key_reused`, тот же ключ ещё выполняется — 409
        `idempotency_in_progress`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: { type: integer, example: 15 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayXBroadcast' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: '`idempotency_key_reused` — тот же ключ на другой запрос; `idempotency_in_progress` — тот же ключ ещё выполняется'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
  /weddings/{weddingId}/planb:
    get:
      tags: [timeline]
      summary: "План Б: сценарий и чек-лист накануне"
      description: >
        §13.1 называет чек-лист персистентным: отметки переживают смену
        устройства и видны обоим партнёрам. Пункты — обычные задачи вида
        `planb`, поэтому отмечаются через PATCH /weddings/{weddingId}/tasks/{taskId}
        и в общий чек-лист по месяцам не попадают.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenario:
                    type: string
                    nullable: true
                    description: 'Объявленный сценарий или null, если план Б не активировали.'
                  activatedAt: { type: string, format: date-time, nullable: true }
                  checklist:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        done: { type: boolean }

  /weddings/{weddingId}/planb/activate:
    post:
      tags: [timeline]
      summary: Активировать план Б
      description: |
        Фиксирует запасной сценарий и время его активации и уведомляет команду
        в приложении — проверить точку сбора и тайминг (§13.1). Тайминг не
        пересобирается, гостям ничего не рассылается: канала доставки гостям
        пока нет. Обязательный `Idempotency-Key`: без него — 400
        `idempotency_key_required`, длиннее 200 символов — 400
        `idempotency_key_too_long`, тот же ключ на другой запрос — 409
        `idempotency_key_reused`, тот же ключ ещё выполняется — 409
        `idempotency_in_progress`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario: { type: string, example: rain }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayXBroadcast' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: '`idempotency_key_reused` — тот же ключ на другой запрос; `idempotency_in_progress` — тот же ключ ещё выполняется'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── ВДОХНОВЕНИЕ (§8.4) ─────────────────────────
  /inspiration/likes:
    get:
      tags: [catalog]
      summary: Избранные истории
      description: >
        Сами истории живут во фронте: сервер хранит только идентификаторы
        отмеченных. Отметка личная, а не на свадьбу — «нравится» это вкус
        одного человека.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  storyIds: { type: array, items: { type: string } }

  /inspiration/likes/{storyId}:
    put:
      tags: [catalog]
      summary: Отметить историю
      description: |
        Предел отметок на пользователя — `likes_limit` (429, 500 штук):
        постоянный отказ, без заголовка `Retry-After`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: storyId, in: path, required: true, schema: { type: string, maxLength: 40 } }
      responses:
        '204': { description: Отмечено; повтор ничего не меняет }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
    delete:
      tags: [catalog]
      summary: Снять отметку
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: storyId, in: path, required: true, schema: { type: string, maxLength: 40 } }
      responses:
        '204': { description: 'Отметки нет — в том числе если её и не было' }

  # ───────────────────────── МЕДИА И АЛЬБОМ ─────────────────────────
  /media/upload-url:
    post:
      tags: [media]
      summary: Ссылка для прямой загрузки файла
      description: |
        Presigned URL в S3. Сервер проверяет тип и размер до выдачи ссылки,
        длительность видео (≤180 с) — после загрузки; превышение отклоняет файл.
        EXIF снимается на сервере (План §12.4).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, contentType, sizeBytes]
              properties:
                kind: { type: string, enum: [vendor_photo, vendor_video, album_photo, document_scan] }
                contentType: { type: string }
                sizeBytes: { type: integer }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl: { type: string }
                  fileUrl: { type: string }
                  expiresAt: { type: string, format: date-time }
        '501': { $ref: '#/components/responses/NotConfigured' }
  /weddings/{weddingId}/album:
    get:
      tags: [album]
      summary: Общий фотоальбом гостей
      description: |
        Паре видны все кадры, гостю — только одобренные. Пара опознаётся
        токеном доступа, гость — параметром `guestToken`.
      security: []
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - name: guestToken
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlbumPhoto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [album]
      summary: Гость добавляет фото
      description: |
        Без регистрации, по персональному токену (`guestToken` в строке
        запроса). Кадр попадает в очередь модерации парой. Согласие на
        публикацию — явная галочка: без неё 422 `consent_required`. Предел
        кадров на гостя — `album_limit` (429, без `Retry-After`).
      security: []
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { $ref: '#/components/parameters/GuestTokenQuery' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileUrl, consent]
              properties:
                fileUrl: { type: string }
                consent: { type: boolean, description: согласие на публикацию в альбоме пары }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlbumPhoto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
    patch:
      tags: [album]
      summary: Одобрить или скрыть все кадры разом
      description: |
        «Одобрить все» одним запросом (план миграции §2.3): по кадру — это сотня
        запросов на альбом из сотни фото, и обрыв посередине оставлял альбом
        наполовину одобренным. Ответ — сколько кадров сменили состояние.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
  /weddings/{weddingId}/album/{photoId}:
    patch:
      tags: [album]
      summary: Одобрить или скрыть кадр
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: photoId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlbumPhoto' }

  # ───────────────────────── ПОДАРКИ: ЧЕГО НЕ ХВАТАЛО ПАРЕ ─────────────────────────
  /weddings/{weddingId}/anti-gifts:
    put:
      tags: [wishlist]
      summary: Список «просим не дарить»
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /weddings/{weddingId}/funds:
    post:
      tags: [wishlist]
      summary: Завести денежный фонд
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, target]
              properties:
                name: { type: string }
                target: { $ref: '#/components/schemas/Money' }
                icon: { type: string, maxLength: 16 }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fund' }
  /weddings/{weddingId}/funds/{fundId}:
    delete:
      tags: [wishlist]
      summary: Удалить фонд
      description: 'Запрещено, если в фонд уже внесены деньги — 409 `fund_has_contributions`.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: fundId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: OK }
        '409':
          description: '`fund_has_contributions` — в фонд уже внесены деньги'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── ЖИЗНЬ ПРОЕКТА ─────────────────────────
  /weddings/{weddingId}/reschedule:
    post:
      tags: [weddings]
      summary: Перенести дату свадьбы
      description: |
        Проверяет занятость всей забронированной команды на новую дату и
        возвращает отчёт «кто свободен, кто нет» (План §9.4). Освобождает старые
        даты в календарях подрядчиков и захватывает новые в одной транзакции,
        а заодно двигает сроки задач и блоки тайминга на ту же разницу.

        Тот же перенос делает `PATCH /weddings/{weddingId}` с полем `date` —
        это один код, а не два похожих. Разница только в ответе: здесь
        возвращается отчёт по команде, там — карточка свадьбы. Если кто-то из
        забронированной команды занят на новую дату — 409 `team_busy` (имена
        занятых — в тексте ошибки), и не меняется ничего: частичного переноса
        нет. Дата вне допустимого диапазона — 422 `date_out_of_range`;
        календарная дата не существует — 422 `bad_date`; занятая дата у своего
        же подрядчика — 409 `date_taken`. Обязательный `Idempotency-Key`: без
        него — 400 `idempotency_key_required`, длиннее 200 символов — 400
        `idempotency_key_too_long`, тот же ключ на другой запрос — 409
        `idempotency_key_reused`, тот же ключ ещё выполняется — 409
        `idempotency_in_progress`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  free: { type: array, items: { type: string } }
                  busy: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: '`team_busy` — кто-то из забронированной команды занят на новую дату, не меняется ничего; `date_taken` — дата уже занята у подрядчика; `idempotency_key_reused`/`idempotency_in_progress` — см. описание'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
  /weddings/{weddingId}/cancel:
    post:
      tags: [weddings]
      summary: Отменить свадьбу
      description: |
        Требует подтверждения ОБОИХ партнёров: первый вызов создаёт запрос,
        второй — исполняет (План §19.1).

        Брони отменяются той же дверью, что и отмена сделки —
        `cancelDeal()` (F1, F-RL-2-02/SA-06): даты, маршруты, ссылки своего
        подрядчика, лиды. Отменяются сделки в состояниях `booked` и
        `paid_deposit`, подрядчики уведомляются. Сделки `done` остаются как
        были — работа уже сделана, и отменять в ней нечего. Даты подрядчиков
        и слоты свадьбы освобождаются только по отменённым сделкам: занятость
        по `done` — это состоявшийся день, а не бронь.

        Проект уходит в архив на `WEDDING_ARCHIVE_DAYS` дней (по умолчанию
        365, меньше 30 не бывает), после чего уборка удаляет его со всем
        содержимым. Отзывы, оставленные подрядчикам, остаются: они про
        подрядчика, а не про свадьбу.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: 'Запрос создан либо отмена исполнена — см. поле state'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /catalog/concierge:
    post:
      tags: [catalog]
      summary: Заявка консьержу при пустой выдаче
      description: |
        Пока в городе меньше 50 анкет, поиск честно предлагает подбор вручную
        за 24 часа (План §18.12). Категория не из справочника — 404 (ARB-4).
        Уже есть открытая (`new`/`in_progress`) заявка по той же категории —
        409 `concierge_pending`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId]
              properties:
                categoryId: { type: string }
                budget: { $ref: '#/components/schemas/Money' }
                comment: { type: string }
                city: { type: string, description: 'город поиска, если отличается от города свадьбы; только из справочника — иначе 422' }
      responses:
        '201': { description: Создано }
        '404':
          description: 'категория не найдена в справочнике'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`concierge_pending` — уже есть открытая заявка по той же категории и городу'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Validation' }
  /complaints:
    post:
      tags: [moderation]
      summary: Пожаловаться
      description: 'Из чата, на отзыв, на анкету. SLA ответа модерации — 24 часа (План §18.2).'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetKind, targetId, category]
              properties:
                targetKind: { type: string, enum: [vendor, review, message, deal] }
                targetId: { type: string }
                category: { type: string, enum: [fraud, content, no_show, spam] }
                text: { type: string }
      responses:
        '201': { description: Создано }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /vendor/verification:
    get:
      tags: [vendor]
      summary: Состояние моей заявки на верификацию
      description: |
        Последняя заявка подрядчика: подана ли, разобрана ли и когда. Без
        этого пути подрядчик видит только наличие или отсутствие галочки и
        гадает, дошли ли документы (План §18.2).

        Ни ссылки на документ, ни ИНН в ответе нет — они свои, но экрану не
        нужны, а на устройстве им не место. Причина отказа приходит
        уведомлением: у заявки своего поля причины нет.

        Заявок не было — `status: none`. Анкеты нет вовсе — 403, как и на
        остальных путях кабинета: кабинет открыт подрядчику с анкетой.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [vendor]
      summary: Подать документы на верификацию
      description: |
        Паспорт или реквизиты ИП для сверки с ФНС. Документы не публикуются
        никогда — публична только галочка «Проверен» (План §18.2, §8.2).

        Заявка при неразобранной первой — 409 `verification_pending`: это не
        второй документ, а второе нажатие.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationSubmit' }
      responses:
        '201': { description: Отправлено на проверку }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  # ───────────────────────── АДМИНКА (План §19.10) ─────────────────────────
  /admin/moderation/vendors:
    get:
      tags: [admin]
      summary: Очередь пост-модерации анкет
      description: |
        Анкеты публикуются сразу; модератор проверяет новые за ≤24 ч, жалобы — вне очереди.
        В очереди только опубликованные и ещё не проверенные анкеты. Заблокированных
        по жалобе здесь нет: решение по ним уже принято, и второй раз его не принимают.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationVendorPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/moderation/vendors/{vendorId}:
    post:
      tags: [admin]
      summary: Решение по анкете
      description: |
        `approve` — анкета проверена модератором и остаётся в каталоге;
        `reject` — снята с публикации, и тогда `reason` обязательна: без непустой
        причины сервер отвечает 422 с полем `reason`;
        `verify` — документы сверены вне приложения, в каталоге появляется галочка «Проверен».
        О решении подрядчик узнаёт уведомлением, причина уходит ему вместе с ним.

        Заявку на верификацию закрывает только `verify`: он переводит незакрытые
        заявки подрядчика в `approved`. `reject` анкету снимает с публикации, а
        заявку НЕ трогает — документы и публикация разные решения, и снятая
        анкета не повод потерять заявку из очереди верификации. Решение по
        документам принимается в `POST /admin/verifications/{requestId}`.

        Решение принимается только по живой анкете — опубликованной и не заблокированной
        по жалобе. Иначе 409 `vendor_not_live`: у снятой анкеты одобрять нечего, а
        заблокированную модерация не возвращает — это решение принимают в разделе жалоб.
        Второй модератор с тем же решением тоже получает 409, а подрядчик — не вторую
        новость об одном и том же. Одобрение уже проверенной живой анкеты остаётся 200.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: vendorId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject, verify] }
                reason:
                  type: string
                  maxLength: 1000
                  description: 'Причина решения. Обязательна при `reject`: снятие с публикации без объяснения подрядчику нечем исправить.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorDecision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /admin/verifications:
    get:
      tags: [admin]
      summary: Очередь заявок на верификацию
      description: |
        Заявки на проверку документов, старейшие сверху: срок разбора считается
        от подачи. Только неразобранные (`pending`) и только от живых
        пользователей — заявка ушедшего разбору не подлежит.

        Ни ссылки на документ, ни ИНН в списке нет: документы уходят одному
        сотруднику в карточке заявки, а не раздаются страницами. В списке
        только `hasFile` — есть ли что открывать.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/verifications/{requestId}:
    get:
      tags: [admin]
      summary: Карточка заявки на верификацию
      description: |
        Вид документа, ИНН и ссылка на сам документ — единственное место, где
        они выходят наружу, и только сотруднику. Ссылка ведёт в хранилище и
        открывается отдельно от приложения.

        Каждое чтение пишется в журнал действий (`verification.view`): кто,
        когда и какую заявку открыл. Запись делается ДО ответа — просмотр,
        оборвавшийся на отдаче, иначе остался бы незамеченным.

        `vendorPublished` говорит, есть ли анкета в каталоге сейчас. На решение
        по документам это не влияет: галочка появится вместе с анкетой.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [admin]
      summary: Решение по заявке на верификацию
      description: |
        `approve` — «документы сверены»: заявка закрывается, и в каталоге
        появляется галочка «Проверен». Это НЕ то же, что `approve` анкеты в
        модерации: там решение «анкета проверена и остаётся в каталоге», здесь —
        про документы. Галочка ставится сразу, в том числе по неопубликованной
        анкете: документы от публикации не зависят, а в каталоге галочка
        покажется вместе с анкетой.

        `reject` — «документы не подтверждены»: заявка закрывается без галочки,
        а анкета остаётся ровно такой, какой была. Снятие с публикации — другое
        решение и другой путь. Причина обязательна: без непустой `reason`
        сервер отвечает 422 с полем `reason` — отказ без объяснения подрядчику
        нечем исправить. Причина уходит ему уведомлением и остаётся в журнале.

        Заявка уже разобрана — 409 `verification_not_pending`: второй сотрудник
        должен увидеть, что опоздал, а подрядчик не должен получить вторую
        новость об одном и том же.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject] }
                reason:
                  type: string
                  maxLength: 1000
                  description: 'Причина решения. Обязательна при `reject`: подрядчик читает её в уведомлении.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationDecision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /admin/complaints:
    get:
      tags: [admin]
      summary: Очередь жалоб
      description: 'Только нерассмотренные (`new`), старейшие сверху: срок разбора считается от подачи.'
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Complaint' } }
                  nextCursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/complaints/{complaintId}:
    post:
      tags: [admin]
      summary: Решение по жалобе
      description: |
        Санкции по возрастанию: предупреждение → понижение в выдаче → блокировка (План §18.2).
        Набор зависит от цели жалобы: `vendor` — все четыре; `review` — `dismiss`, `warn`
        и `block` (скрыть отзыв: он уходит и из показа, и из рейтинга); `message` и `deal` —
        только `dismiss` и `warn`, иных санкций к ним сервер не применяет. Неприменимая
        санкция — 422 с полем `action`, и жалоба остаётся нерассмотренной.
        При `warn`, `downrank` и `block` по цели `vendor` подрядчик получает уведомление;
        заметка модератора остаётся в журнале и наружу не уходит.
        Повторное решение по уже разобранной жалобе — 404: второй модератор должен
        увидеть, что опоздал.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: complaintId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [dismiss, warn, downrank, block] }
                note:
                  type: string
                  maxLength: 2000
                  description: 'Заметка модератора для журнала. Нарушителю не уходит.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplaintDecision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /admin/concierge:
    get:
      tags: [admin]
      summary: Очередь заявок консьержу
      description: |
        Заявки «подобрать вручную» (`POST /catalog/concierge`, План §18.12): открытые
        (`new`, `in_progress`), старейшие сверху — обещание «свяжемся в течение суток»
        считается от подачи. До ревью 015 заявки копились в базе, и разобрать их было
        неоткуда. Телефон пары — в заявке: она сама попросила связаться с ней, и
        сотрудник звонит по нему; чтение очереди пишется в журнал действий
        (`concierge.queue.view`), как открытие документов верификации.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConciergePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/concierge/{requestId}:
    post:
      tags: [admin]
      summary: Состояние заявки консьержу
      description: |
        `in_progress` — взята в работу; `done` — подрядчик подобран, пара получает
        уведомление «Консьерж подобрал варианты»; `cancelled` — снята (пара передумала
        или не отвечает). Закрытую (`done`/`cancelled`) не открывают заново — 409
        `concierge_closed`: новая просьба — новая заявка. Чужой или несуществующий
        идентификатор — 404. Решение — в журнал действий (`concierge.<status>`).
      security: [{ bearerAuth: [] }]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [in_progress, done, cancelled] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConciergeDecision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /admin/categories:
    get:
      tags: [admin]
      summary: Категории и словарь синонимов
      description: |
        Читает то, что заменяет PUT. Словарь заменяется целиком, поэтому вслепую
        его править нельзя: экран сперва показывает текущий, иначе сохранение
        стирает строки, которых никто не видел.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCategories' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      summary: Изменить категории и словарь синонимов
      description: |
        «тамада» = «ведущий», «сладкий стол» = «кондитер» (План §19.2).
        Категории добавляются и правятся, но не удаляются: на них ссылаются анкеты
        и слоты, и исчезнувшая категория — это осиротевшая мозаика. `icon` пропущенный
        оставляет прежний значок, `null` — стирает (R-17, фича 014). Словарь `synonyms` заменяется ЦЕЛИКОМ —
        чего не прислали, того больше нет. Слово, ведущее на неизвестную категорию, —
        422 с полем `synonyms.<слово>`, и не меняется ничего.

        `version` — та версия справочника, с которой сотрудник начал правку.
        Не совпала с текущей — 409 `categories_stale`, и не меняется НИЧЕГО:
        словарь заменяется целиком, и сохранение поверх чужой правки стёрло бы
        строки, которых сотрудник не видел. Поля нет — проверки нет.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCategoriesUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoriesUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /admin/metrics:
    get:
      tags: [admin]
      summary: Дашборд платформы
      description: |
        Регистрации, свадьбы, опубликованные анкеты, размер очередей, просроченные
        жалобы, сделки, оборот, готовность города к запуску (≥50 анкет) и расход
        Тиля на модель за 30 дней (`llm`, фича 010 — из учёта вызовов
        `tilly_usage`) и заполненность опубликованных анкет (`profiles`,
        фича 012).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/weddings/{weddingId}:
    get:
      tags: [admin]
      summary: Просмотр проекта поддержкой
      description: |
        Только чтение и только по обращению пары. Каждый просмотр пишется в
        AuditLog: кто и зачем смотрел (План §19.10 п. 5).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - name: reason
          in: query
          required: true
          description: |
            Зачем смотрим: номер обращения или его суть. Уходит в журнал вместе
            с именем сотрудника, поэтому пустая строка не принимается.
          schema: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeddingSupportCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /admin/weddings/{weddingId}/deals:
    get:
      tags: [admin]
      summary: Сделки свадьбы для поддержки (только чтение, с причиной и записью в журнал)
      description: |
        Разбор спора о деньгах по обращению пары (План §19.10 п. 5; решение
        владельца 2026-09-13: сделки — да, переписка — нет). Список сделок
        свадьбы: подрядчик или свой подрядчик по имени (без телефонов), слот,
        состояние, цена, оплачено, история событий. Причина обязательна (5…500
        знаков), каждый запрос пишется в журнал действий как `wedding.deals.view`
        с причиной — как и карточка свадьбы. Переписки пары ни с кем здесь нет
        и не будет без отдельного решения.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: weddingId
          in: path
          required: true
          schema: { type: string }
        - name: reason
          in: query
          required: true
          description: Зачем смотрим — номер обращения или его суть. Уходит в журнал.
          schema: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SupportDeal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GuestTokenQuery:
      name: guestToken
      in: query
      required: true
      description: |
        Персональный токен гостя. Нужен там, где гость обращается к пути
        со свадьбой в адресе: подставить его в путь некуда, а без него
        сервер не отличит гостя от постороннего.

        Мёртвая ссылка гостя — токен неизвестен, свадьба отменена или в
        архиве. Пути дня X — `GET /join/{guestToken}/day`,
        `GET /join/{guestToken}/day-chat/messages` и
        `POST /join/{guestToken}/day-chat/messages` — отвечают 410 `gone`:
        ссылка отозвана, попросите пару прислать новую. Остальные гостевые
        операции отвечают 401 `unauthorized`: `GET` и `POST /rsvp/{guestToken}`,
        `GET /gifts/{guestToken}`, `POST` и `DELETE /gifts/{guestToken}/{giftId}/reserve`,
        `POST /gifts/{guestToken}/{giftId}/fund`, `POST /gifts/{guestToken}/funds/{fundId}`,
        `GET` и `POST /join/{guestToken}/shuttle`, `GET` и `POST /join/{guestToken}/hotels`,
        `GET` и `POST /join/{guestToken}/menu-vote`, `GET /join/{guestToken}/team`,
        `GET` и `POST /weddings/{weddingId}/album?guestToken=…`,
        `POST /weddings/{weddingId}/guest-reviews?guestToken=…`. По коду ответа
        не видно, существовал ли токен. Токен чужой свадьбы в `?guestToken=` — 404.
      schema: { type: string }
    GuestToken:
      name: guestToken
      in: path
      required: true
      description: |
        Персональный токен гостя из его ссылки-приглашения. Решение владельца
        2026-09-02: гость опознаётся ОДНИМ токеном во всех гостевых путях.
        Общий код свадьбы не годится — по нему нельзя ни подставить имя в
        приглашение (план §8.6), ни дать гостю снять СВОЙ резерв подарка.
        Анонимность подарков при этом сохраняется: система знает гостя, а API
        пары этот токен не отдаёт никогда (§9).

        Мёртвая ссылка гостя — токен неизвестен, свадьба отменена или в
        архиве. Пути дня X — `GET /join/{guestToken}/day`,
        `GET /join/{guestToken}/day-chat/messages` и
        `POST /join/{guestToken}/day-chat/messages` — отвечают 410 `gone`:
        ссылка отозвана, попросите пару прислать новую. Остальные гостевые
        операции отвечают 401 `unauthorized`: `GET` и `POST /rsvp/{guestToken}`,
        `GET /gifts/{guestToken}`, `POST` и `DELETE /gifts/{guestToken}/{giftId}/reserve`,
        `POST /gifts/{guestToken}/{giftId}/fund`, `POST /gifts/{guestToken}/funds/{fundId}`,
        `GET` и `POST /join/{guestToken}/shuttle`, `GET` и `POST /join/{guestToken}/hotels`,
        `GET` и `POST /join/{guestToken}/menu-vote`, `GET /join/{guestToken}/team`,
        `GET` и `POST /weddings/{weddingId}/album?guestToken=…`,
        `POST /weddings/{weddingId}/guest-reviews?guestToken=…`. По коду ответа
        не видно, существовал ли токен. Токен чужой свадьбы в `?guestToken=` — 404.
      schema: { type: string }
    WeddingId:
      name: weddingId
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        Доступ закрыт роли или стороне. Это нормальный ответ, а не поломка:
        помощник не видит денег, посторонний — чужой сделки (план §6).
        Тот же статус — у отказа по согласию на обработку данных: `forbidden`,
        если живого согласия нет вовсе, и `consent_outdated`, если согласие
        дано под прежней редакцией политики — нужно подтвердить действующую
        (`POST /users/me/consent`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Конфликт (уже существует)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validation:
      description: |
        Запрос не прошёл проверку (`validation_failed`). Так отвечает сервер
        на любое нарушение схемы и на правила, которых схемой не выразить:
        снятие анкеты с публикации без причины, санкция, неприменимая к цели
        жалобы, синоним на несуществующую категорию. В описании операции
        сказано, какое поле сервер называет виноватым.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: |
        Запрос не годится ещё до проверки схемы или бизнес-правил. Возможные
        коды (в описании операции — какой из них применим): `bad_limit`
        (параметр `limit` — не целое число от 1 до 100), `bad_cursor` (курсор
        листания испорчен, не того типа сортировки или обрезан), `idempotency_key_required`
        (обязательный заголовок `Idempotency-Key` не передан) и
        `idempotency_key_too_long` (заголовок длиннее 200 символов).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Слишком часто — см. Retry-After
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Locked:
      description: |
        Доступ не запрещён — он ещё не наступил. Так отвечает чат дня X
        до `openFrom`: 403 сказало бы «вам нельзя», а человеку нужно
        «откроется накануне в 09:00».
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    QuotaExceeded:
      description: |
        Предел исчерпан насовсем: столько от одного гостя мы не принимаем.
        В отличие от TooManyRequests заголовка Retry-After НЕТ — повтор
        не поможет ни через минуту, ни через сутки. Клиенту нужно показать
        отказ, а не таймер.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotConfigured:
      description: |
        Путь согласован, обработчик есть, но внешняя служба не подключена
        (OAuth-приложения, VAPID-ключи, объектное хранилище). Код ошибки
        называет, чего именно нет: `oauth_not_configured`,
        `push_not_configured`, `storage_not_configured`. Это хвост владельца,
        а не недоделка сервера — 501 с общим `not_implemented` здесь не бывает.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Readiness:
      type: object
      properties:
        status: { type: string, enum: [ok, not_ready] }
        db: { type: string, enum: [up, down] }
        redis: { type: string, enum: [up, down] }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
              description: |
                Только у 422: какие именно поля не прошли проверку.
                Ключ — имя поля (`reason`, `action`, `synonyms.тамада`),
                значение — что с ним не так. Человеку показывается `message`,
                поля подсвечивает форма.
            details:
              type: object
              additionalProperties: true
              description: |
                Машинные подробности отказа там, где экрану нужно больше кода:
                у 409 `wedding_exists` — `weddingId` живой свадьбы пары (фича 005).
    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 900, description: 'срок жизни accessToken, секунды. 15 минут по плану §1' }
        user: { $ref: '#/components/schemas/User' }
        consentRequired:
          type: boolean
          description: |
            Только у `POST /auth/otp/verify`: нет живого согласия под
            действующей редакцией политики — новый аккаунт, восстановленный
            после отзыва, или согласие дано под прежней редакцией (фича 005).
            До `POST /users/me/consent` остальные пути отвечают: без согласия
            вовсе — 403 `forbidden`; под прежней редакцией — 403
            `consent_outdated`.
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string, nullable: true, description: 'null, пока человек не назвал себя' }
        phone: { type: string, readOnly: true, description: 'E.164 — тот, что подтверждён кодом' }
        email: { type: string, format: email }
        avatarUrl: { type: string, nullable: true }
    City:
      type: object
      properties:
        id: { type: integer, example: 42 }
        name: { type: string, example: Сибай }
        region: { type: string, example: Башкортостан }
        district: { type: string, nullable: true, example: Баймакский район }
        lat: { type: number }
        lon: { type: number }
        population: { type: integer, nullable: true }
        big: { type: boolean, description: 'крупный город — блок «Популярные» в CityPicker' }
    CityRef:
      type: object
      required: [name, region]
      properties:
        name: { type: string }
        region: { type: string }
    Wedding:
      type: object
      properties:
        id: { type: string }
        title: { type: string, example: 'Алина ♥ Тимур' }
        date: { type: string, format: date }
        city: { $ref: '#/components/schemas/CityRef' }
        budgetTotal: { $ref: '#/components/schemas/Money' }
        guestsPlanned: { type: integer }
        style: { type: string }
        tz: { type: string, example: Asia/Yekaterinburg, description: 'таймзона места свадьбы. По ней открывается чат дня X и считаются напоминания — не по таймзоне пользователя' }
        inviteText: { type: string }
        inviteThemeId: { type: integer }
        dressCode: { type: string, nullable: true, description: 'палитра дресс-кода — её же видит гость' }
        dressNote: { type: string, nullable: true }
        cancelRequestedBy:
          type: string
          nullable: true
          description: >
            Кто из пары запросил отмену свадьбы и ждёт подтверждения второго.
            Видно только паре. Нужно, чтобы второй партнёр понимал: его нажатие
            «Отменить» не запросит отмену, а ИСПОЛНИТ её — брони отменятся,
            даты уйдут подрядчикам. Без этого поля показать предупреждение
            нечем. Пусто — запроса нет или он протух (срок 72 часа).
        cancelRequestedAt:
          type: string
          format: date-time
          nullable: true
          description: 'Когда запрошена отмена. Запрос живёт 72 часа, дальше требуется новый.'
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }
    WeddingPublic:
      type: object
      description: Публичная часть свадьбы для гостей (без бюджета)
      properties:
        title: { type: string }
        date: { type: string, format: date }
        city: { $ref: '#/components/schemas/CityRef' }
        inviteText: { type: string }
        inviteThemeId: { type: integer }
        venue: { type: string, nullable: true }
        dressCode: { type: string, nullable: true, description: 'идентификатор палитры — гость видит её в приглашении' }
        dressNote: { type: string, nullable: true }
        tz:
          type: string
          example: Europe/Moscow
          description: |
            Часовой пояс места свадьбы. Гость считает «свадьба уже прошла»
            (окно отзыва) по нему, а не по поясу своего телефона (D3-18).
    CancelResult:
      type: object
      description: |
        Чем кончился вызов отмены. Отмена свадьбы — решение обоих партнёров,
        поэтому первый вызов только просит подтверждения, и ответ обязан
        различать эти два случая: экран показывает разное.
      properties:
        state:
          type: string
          enum: [confirmation_required, cancelled]
          description: '`confirmation_required` — ждём второго партнёра; `cancelled` — свадьба отменена'
        requestedBy:
          type: string
          description: 'кто попросил отмену — есть при `confirmation_required`'
        cancelledDeals:
          type: integer
          description: 'сколько сделок отменено — есть при `cancelled`; `done` в это число не входят'
    Member:
      type: object
      description: >
        Член свадьбы — тот, у кого есть аккаунт и доступ в приложение.
        Гость (guest) и свой подрядчик (guest-vendor) членами НЕ являются:
        они опознаются токеном по ссылке, аккаунта не имеют и в members не попадают.
        Матрица доступа (§4 плана) описывает все шесть ролей, эта схема — только четыре с аккаунтом.
      properties:
        user: { $ref: '#/components/schemas/User' }
        role: { type: string, enum: [couple, helper, coordinator, vendor] }
        joinedAt: { type: string, format: date-time }
    InviteLink:
      type: object
      properties:
        code: { type: string, example: ДРУГ-7F3K }
        url: { type: string, example: 'https://tili-tili.ru/join/ДРУГ-7F3K' }
        role: { type: string, enum: [couple, helper, coordinator, vendor] }
        label: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
        used: { type: boolean }
    Category:
      type: object
      description: >
        Справочник категорий подрядчиков. Список фиксированный — 35 записей,
        сид-данные лежат в миграции seed_categories; фронт берёт его только
        отсюда (моков `lib/data.ts` нет с 2026-09-06). Enum здесь не ставится
        намеренно: добавление категории не должно требовать выката новой версии
        контракта. Изменять список может только админ через PUT /admin/categories.
      properties:
        id: { type: string, example: photo }
        title: { type: string, example: Фотограф }
        icon: { type: string }
        vendorsCount:
          type: integer
          description: 'опубликованных анкет: в городе `city`, если он передан, иначе по всей базе'
        description:
          type: string
          nullable: true
          description: 'одна строка: что делает подрядчик и что у него спросить (миграция 39, план бэкенда §8.5)'
    Vendor:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        categoryId: { type: string }
        city: { type: string }
        priceFrom:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
        rating: { type: number, nullable: true, example: 4.9 }
        reviewsCount: { type: integer }
        photoUrl: { type: string, nullable: true }
        verified:
          type: boolean
          description: |
            Документы сверены. Сами документы не публикуются НИКОГДА —
            наружу выходит только этот признак (план §6).
        hasVideo: { type: boolean }
        distanceKm:
          type: integer
          nullable: true
          description: |
            Расстояние от города поиска (`city`) до города анкеты в
            километрах, округлённое (фича 011): 0 — тот же город; null — запрос
            без `city`, у одного из городов нет координат или это анкета вне
            выдачи (`GET /catalog/vendors/{vendorId}`). Считается между
            центрами городов справочника, не до площадки — адресов у анкет нет.
    VendorPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Vendor' }
        nextCursor: { type: string, nullable: true }
    VendorDetail:
      allOf:
        - $ref: '#/components/schemas/Vendor'
        - type: object
          properties:
            about: { type: string }
            phone:
              type: string
              nullable: true
              description: |
                Рабочий телефон подрядчика. Отдельное поле анкеты, а не номер
                входа: публикация личного номера — раскрытие персональных
                данных, и заполняя это поле, подрядчик соглашается его показать.

                Приходит ЗАПОЛНЕННЫМ только той паре (и её команде), которая
                этого подрядчика уже забронировала — `booked`, `paid_deposit`
                или `done` (решение владельца 2026-09-03). До брони — `null`,
                и это значит «ещё рано», а не «номер не указан»: клиент
                показывает вместо него кнопку «Написать». Владелец анкеты
                видит свой номер всегда.
            cityRegion:
              type: string
              nullable: true
              description: |
                Регион города анкеты. Нужен владельцу, чтобы вернуть анкету
                обратно без потери города: `city` приходит одной строкой, а
                справочник различает одноимённые города по региону.
            published:
              type: boolean
              description: |
                Опубликована ли анкета. Приходит только владельцу (`GET /vendor/profile`):
                для чужого читателя вопрос не стоит — неопубликованную он не видит вовсе.

                Подрядчику это главный факт кабинета: пока анкета не опубликована,
                её нет в каталоге, и заявок не будет, сколько ни заполняй поля.
            moderated:
              type: boolean
              description: 'Прошла ли пост-модерацию. Публикация мгновенная, проверка идёт следом.'
            blocked:
              type: boolean
              description: |
                Анкета заблокирована модератором по жалобе (`block`). Только
                владельцу: в каталоге её нет, публикация отвечает 409, и
                кабинет обязан сказать почему, а не показывать «не опубликована»
                с кнопкой, которая не сработает (D5-23).
            mediaRights:
              type: boolean
              description: |
                Подрядчик подтвердил права на фото и видео портфолио и согласие
                снятых на публикацию (152-ФЗ, план бэкенда §7). Только владельцу.
                Ставится один раз через `mediaRights: true` в `PUT /vendor/profile`
                и не снимается; мастер анкеты не публикует без него.
            completeness:
              type: object
              description: |
                Заполненность анкеты (План §8.2) — только владельцу. Одно правило
                на кабинет и панель (`vendor/completeness.ts`): четыре поля —
                о себе, телефон, цена «от», пакеты; фотографии не считаются до
                хранилища (№3). `missing` — чего не хватает, для подсказки.
              required: [pct, missing]
              properties:
                pct: { type: integer, minimum: 0, maximum: 100 }
                missing:
                  type: array
                  items: { type: string, enum: [about, phone, priceFrom, packages] }
            gallery:
              type: array
              description: Ссылки на фотографии — совместимость с прежней формой ответа.
              items: { type: string }
            media:
              type: array
              items:
                type: object
                properties:
                  kind: { type: string, enum: [photo, video] }
                  url: { type: string }
                  durationS: { type: integer, nullable: true }
            packages:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  price: { $ref: '#/components/schemas/Money' }
                  includes: { type: array, items: { type: string } }
            reviews:
              type: array
              items: { $ref: '#/components/schemas/Review' }
    VendorUpsert:
      type: object
      description: |
        Анкета целиком. Правило для списков (`packages`, `portfolioUrls`, `media`):
        **поля нет — список не трогаем, пустой массив — очищаем**.

        Иначе экран, который списком не занимается — мастер анкеты портфолио не
        редактирует, загрузка ждёт хранилища, — стирал бы чужие работы при
        сохранении имени или телефона.
      required: [name, categoryId, city]
      properties:
        name: { type: string }
        categoryId: { type: string }
        city:
          allOf: [{ $ref: '#/components/schemas/CityRef' }]
          description: |
            Регион можно не присылать, если название города в справочнике
            единственное. Иначе он обязателен: «Октябрьский» есть и в
            Башкортостане, и в Волгоградской области.

            Без этого послабления анкету нельзя было отредактировать: в ответе
            город приходит одной строкой, региона в нём нет, и любое сохранение
            падало с «городом не найден».
        about: { type: string }
        phone:
          type: string
          nullable: true
          minLength: 5
          maxLength: 32
          description: >
            Рабочий телефон для пар, которые уже забронировали. Формат свободный:
            люди пишут +7, 8, со скобками и без — навязывать один вид значит
            ловить отказы на живых номерах.
        priceFrom: { $ref: '#/components/schemas/Money' }
        mediaRights:
          type: boolean
          description: |
            `true` — подрядчик подтверждает права на фото и видео портфолио и
            согласие снятых людей на публикацию. Записывается моментом
            (`vendors.media_rights_at`) и не снимается; `false` и отсутствие
            поля прежнее подтверждение не трогают.
        packages:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              price: { $ref: '#/components/schemas/Money' }
              includes: { type: array, items: { type: string } }
        portfolioUrls:
          type: array
          description: 'Фотографии портфолио. Для видео нужен `media` — там есть длительность.'
          items: { type: string }
        media:
          type: array
          description: |
            Портфолио с типом файла. У видео длительность обязательна: ограничение
            180 с проверяется на сервере, а из голой ссылки его не узнать.
          items:
            type: object
            required: [kind, url]
            properties:
              kind: { type: string, enum: [photo, video] }
              url: { type: string }
              durationS: { type: integer, minimum: 1, maximum: 180, nullable: true }
    Note:
      type: object
      description: Заметка команды свадьбы (фича 014). Автор — по имени из профиля; удалённый аккаунт — null.
      required: [id, text, createdAt]
      properties:
        id: { type: string }
        text: { type: string }
        authorName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Slot:
      type: object
      description: |
        Место в команде свадьбы. Слот либо пуст, либо несёт сделку — собственного
        статуса у него нет. tileState — производная подпись для мозаики команды,
        только для чтения: клиент не должен вычислять её сам, чтобы экраны не
        разошлись между собой.
      properties:
        id: { type: string, example: s4 }
        categoryId: { type: string }
        label: { type: string, readOnly: true, description: 'подпись плитки в мозаике («Фотограф», «Площадка») — из шаблона слотов сервера' }
        deal:
          allOf: [{ $ref: '#/components/schemas/Deal' }]
          nullable: true
          description: null = слот пуст
        tileState:
          type: string
          readOnly: true
          description: производное от deal.state для плитки в мозаике
          enum: [empty, candidate, hold, booked, paid]
    Budget:
      type: object
      properties:
        total: { $ref: '#/components/schemas/Money' }  # example: 1500000
        spent: { $ref: '#/components/schemas/Money' }  # example: 560000
        reserve:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            Резерв на непредвиденное — 10% от общего бюджета (План ч. 283).
            Отдельная строка, а не категория: категории делят сто процентов
            между собой, и резерв внутри них означал бы, что часть сметы
            просто уменьшили.

            Считает сервер, чтобы доля не разошлась между экранами.
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              planned: { $ref: '#/components/schemas/Money' }
              fromSlots: { type: integer, description: 'автосумма из броней' }
              color:
                type: string
                example: '#D9A8A0'
                description: |
                  Цвет полосы категории в разбивке бюджета. Задаётся сервером,
                  а не клиентом: категории приходят из справочника, и палитра
                  должна совпадать во всех клиентах и в выгрузках.
              live:
                type: string
                nullable: true
                example: 'Елена Смирнова · Ильдар Хабиров'
                description: |
                  Кто из забронированной команды попал в эту категорию, через
                  разделитель. Пусто — в категории пока только плановая сумма.
                  Нужно, чтобы пара видела, откуда взялась автосумма: без этого
                  «120 000 из команды» выглядит как число ниоткуда.
              items:
                type: array
                items: { $ref: '#/components/schemas/BudgetItem' }
    Tip:
      type: object
      description: 'Подсказка по правилу §3.14; `link` — куда ведёт (экран поиска категории или бюджет).'
      required: [kind, title, body, link]
      properties:
        kind: { type: string, enum: [deficit, blocking_slot, budget] }
        title: { type: string }
        body: { type: string }
        link: { type: string, example: /search/florist }
        categoryId: { type: string, nullable: true }
    BudgetItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        categoryId: { type: string }
        custom: { type: boolean, description: 'true = своя статья (удаляемая)' }
    Guest:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        plusOne: { type: boolean }
        group: { type: string, nullable: true }
        phone:
          type: string
          nullable: true
          description: |
            Для напоминаний по SMS; вводит пара. Видит только пара (152-ФЗ,
            минимизация): помощнику и координатору поле не приходит —
            у них есть `hasPhone`.
        hasPhone: { type: boolean, description: 'телефон записан — для ролей, которым сам номер не показывается' }
        comment:
          type: string
          nullable: true
          description: |
            Что гость написал в RSVP (`POST /join/{guestToken}`). Только паре —
            до фичи 005 писалось и нигде не читалось (D3-25).
        status: { type: string, enum: [yes, no, pending] }
        tableId: { type: string, nullable: true }
        diet: { type: string, nullable: true, enum: [null, vegetarian, vegan, halal, kosher, gluten_free, other], description: 'RSVP+ — ограничения по еде' }
        dietNote: { type: string, nullable: true, description: 'аллергии словами, когда enum не хватает' }
        menuOptionId: { type: string, nullable: true, description: 'выбор в опросе меню' }
        transfer: { type: string, nullable: true, enum: [null, need, own], description: 'нужен ли трансфер' }
        busId: { type: string, nullable: true, description: 'посажен в этот автобус' }
        hotelId: { type: string, nullable: true }
        inviteUrl: { type: string, nullable: true, description: 'ОДНОРАЗОВАЯ ссылка-приглашение для этого гостя. Пара её пересылает; при первом открытии код обменивается на персональный guestToken и гаснет. Сырой guestToken паре не отдаётся НИКОГДА — иначе пара может открыть гостевую страницу и увидеть его резерв подарка, что ломает анонимность (§9 бизнес-логики)' }
        inviteUrlUsed: { type: boolean, readOnly: true, description: 'true — гость уже открыл ссылку. Чтобы выдать новую, нужен POST …/invite-link' }
    Table:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        capacity: { type: integer, default: 8 }
        guestIds: { type: array, items: { type: string } }
    TaskCreate:
      type: object
      additionalProperties: false
      required: [title, period]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        period:
          type: string
          maxLength: 40
          description: Число месяцев 0–120 до свадьбы или произвольная подпись периода без вычисленного срока.
        due: { type: string, format: date, nullable: true }
        dueMode:
          type: string
          enum: [relative, fixed]
          description: Без явной даты — relative; с явной датой или null — fixed по умолчанию. Relative с точной датой требует даты свадьбы.
        assigneeId: { type: string, format: uuid, nullable: true }
        reminderDaysBefore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 30
          description: Напомнить ответственному за N календарных дней до срока; 0 — в день срока, null — выключено. Для включения нужны срок и ответственный. Снятие срока или назначения выключает напоминание.
        reminderTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Время по поясу ответственного (профиль → свадьба → Москва), по умолчанию 09:00. Тихие часы и настройки уведомлений имеют приоритет.
    TaskPatch:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        done: { type: boolean }
        due:
          type: string
          format: date
          nullable: true
          description: Пропуск сохраняет срок; null снимает срок. Явное значение без dueMode переключает в fixed.
        dueMode:
          type: string
          enum: [relative, fixed]
          description: Relative без due пересчитывает срок по периоду и дате свадьбы; fixed без due сохраняет дату.
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: Живой участник этой свадьбы с ролью couple/helper/coordinator. Null снимает назначение; пропуск сохраняет.
        reminderDaysBefore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 30
          description: Напомнить ответственному за N календарных дней до срока; 0 — в день срока, null — выключено. Для включения нужны срок и ответственный. Снятие срока или назначения выключает напоминание.
        reminderTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Время по поясу ответственного (профиль → свадьба → Москва), по умолчанию 09:00. Тихие часы и настройки уведомлений имеют приоритет.
    Task:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        period: { type: string, nullable: true }
        done: { type: boolean }
        custom: { type: boolean }
        due:
          type: string
          format: date
          nullable: true
          description: Срок задачи. Relative двигается вместе с датой свадьбы; fixed сохраняет выбранную дату, в том числе отсутствие срока.
        dueMode: { type: string, enum: [relative, fixed] }
        assignee:
          type: object
          nullable: true
          properties:
            userId: { type: string, format: uuid }
            name: { type: string, nullable: true }
        reminderDaysBefore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 30
          description: Напомнить ответственному за N календарных дней до срока; 0 — в день срока, null — выключено. Для включения нужны срок и ответственный. Снятие срока или назначения выключает напоминание.
        reminderTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Время по поясу ответственного (профиль → свадьба → Москва), по умолчанию 09:00. Тихие часы и настройки уведомлений имеют приоритет.
    Chat:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        avatarUrl: { type: string, nullable: true }
        lastMessage: { type: string }
        unread: { type: integer }
        kind:
          type: string
          enum: [vendor, team, day, tilly, external, crew]
          description: |
            `vendor` — пара с подрядчиком из каталога. `external` — со своим
            подрядчиком, найденным парой (§11), привязан к сделке
            (`chats.deal_id`): у следующего подрядчика того же слота — свой чат.
            `team` — команда свадьбы: пара, помощники и ЗАБРОНИРОВАННЫЕ
            подрядчики (Бизнес-логика §3.11); в нём координатор командует
            всеми разом. `crew` — чат исполнителей: координатор и
            забронированные подрядчики, БЕЗ пары (решение владельца
            2026-09-03). Пара видит строку `crew` в списке — с подписью
            вместо последней реплики и нулём непрочитанных, — а на чтение
            переписки получает 403. `tilly` — помощник, только паре.
            `day` — чат дня X, открывается накануне.
        closed:
          type: boolean
          description: |
            Только у kind=external: сделка со своим подрядчиком отменена —
            переписка остаётся паре для чтения, писать больше некому. Чат
            привязан к сделке, не к слоту: у нового подрядчика в том же слоте
            свой чат, и историю прежнего он не видит (фича 005, ERR-0219).
        openFrom:
          type: string
          format: date-time
          nullable: true
          description: |
            Только у kind=day: 09:00 НАКАНУНЕ свадьбы по Wedding.tz. Чат
            существует с момента создания свадьбы и до этого срока виден,
            но закрыт (423) — иначе в списке чатов до дня X была бы пустота
            вместо строки «откроется 13 июня». Дату перенесли — срок едет
            вместе с ней.
        tilly:
          type: object
          nullable: true
          description: |
            Только у kind=tilly (фича 010), у остальных чатов — null. `live` — за Тилем стоит языковая
            модель (провайдер настроен); false — он отвечает честной заглушкой
            «Тиль пока без ИИ», и экран говорит это словами. `usedToday` —
            сколько реплик пара уже отправила Тилю за сутки по поясу свадьбы,
            `limitPerDay` — предел (План §18: 50); на пределе POST отвечает
            429 `tilly_daily_limit`. Числа считает сервер — экран их не
            досчитывает и без ответа не показывает.
          required: [live, usedToday, limitPerDay]
          properties:
            live: { type: boolean }
            usedToday: { type: integer, minimum: 0 }
            limitPerDay: { type: integer, minimum: 1 }
    Message:
      type: object
      properties:
        id: { type: string }
        chatId: { type: string }
        senderId:
          type: string
          nullable: true
          description: >
            null — сообщение не от пользователя приложения: ответ Тиль, системная
            запись или, в чате со своим подрядчиком (§11), сам подрядчик — аккаунта
            у него нет. Системных записей в таком чате не бывает, поэтому там
            пустой отправитель однозначно означает подрядчика.
        text: { type: string }
        attachmentUrl: { type: string, nullable: true }
        sentAt: { type: string, format: date-time }
        system:
          type: boolean
          description: |
            Системная запись (сдвиг тайминга, перенос даты, «участник вышел»)
            — не реплика человека. Экран рисует её по признаку, а не угадывает
            по тексту (D4-15). У ответа Тиль, реплик своего подрядчика и гостей — false.
        guestName:
          type: string
          nullable: true
          description: |
            Имя гостя, если реплику написал гость по своей ссылке в чат дня X
            (фича 009): у гостя нет аккаунта, `senderId` пуст, имя — из списка
            гостей. У остальных реплик — null.
        mine:
          type: boolean
          nullable: true
          description: |
            Своя ли это реплика для того, кто читает (фича 014). Участнику —
            по `senderId`, гостю в чате дня — по его строке в списке гостей:
            у гостя нет идентификатора аккаунта, и сравнивать имена (две
            Марины) экран не должен. Считает сервер. `null` — читатель
            неизвестен (реплика пришла живым каналом всем сразу): экран
            участника тогда решает по `senderId`.
        warning:
          type: string
          nullable: true
          readOnly: true
          description: |
            Мягкое предупреждение о выводе сделки мимо платформы (§18.2):
            сообщение ДОСТАВЛЕНО, но обе стороны видят плашку и системную
            запись в чате. Блокировать нельзя — разговор просто уйдёт
            в мессенджер, где нет ни договора, ни эскроу, ни следа
            для разбирательства.
    Lead:
      type: object
      properties:
        id: { type: string }
        coupleName: { type: string }
        weddingDate: { type: string, format: date, nullable: true }
        city: { type: string, nullable: true }
        message: { type: string }
        status: { type: string, enum: [new, replied, hold, declined, won] }
        holdUntil: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        chatId:
          type: string
          nullable: true
          description: |
            Чат пары с этим подрядчиком — тот же, что открыло «Написать» пары
            и в который уходит ответ на заявку. Кабинет ведёт из заявки прямо в
            переписку (фича 007). null — у заявки без чата (выигранная без
            переписки).
    Review:
      type: object
      properties:
        id: { type: string }
        source:
          type: string
          enum: [couple, guest]
          description: 'Пара со сделкой или гость свадьбы: в рейтинге веса разные (§15).'
        authorName: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        reply:
          type: object
          nullable: true
          properties:
            text: { type: string }
            createdAt: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        kind: { type: string, enum: [deal, chat, task, guest, system] }
        link:
          type: string
          nullable: true
          example: /deal/01a06eac-4983-7b5e-8d67-36d1a8e05cc9
          description: |
            Место, а не маршрут приложения: `/deal/{dealId}`, `/chats/{chatId}`,
            `/guests`, `/checklist`, `/dayx`, `/vendor-app`. У пары и у
            подрядчика одно и то же место лежит по разным адресам, поэтому
            перевод в маршрут делает клиент. Незнакомое место никуда не ведёт.
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    Money:
      type: object
      description: |
        Денежная сумма. Решение владельца 2026-09-02: минорные единицы плюс код
        валюты у КАЖДОЙ суммы, а не одна валюта на свадьбу — план §19.7 описывает
        свадьбу за границей, где сделка в евро, а бюджет в рублях.
        В MVP принимается только RUB; enum расширяется вместе с поддержкой курсов.
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: |
            Сумма в копейках. 85 000 ₽ = 8500000. Дробных значений не бывает.
            Потолок — предел точного целого в JSON: за ним число молча
            округляется, и «потрачено» перестаёт сходиться с суммой сделок.
          example: 8500000
        currency:
          type: string
          description: Код валюты по ISO 4217.
          enum: [RUB]
          example: RUB
    Deal:
      type: object
      description: |
        Договорённость пары с конкретным исполнителем на конкретный слот.
        Носитель состояния: у слота собственного статуса нет (решение владельца
        2026-09-02) — раньше слот, сделка и фронтенд описывали одно понятие тремя
        разными наборами значений.
      properties:
        id: { type: string }
        state: { $ref: '#/components/schemas/DealState' }
        vendor:
          allOf: [{ $ref: '#/components/schemas/Vendor' }]
          nullable: true
          description: null у своего подрядчика не из каталога (§11)
        externalName: { type: string, nullable: true, description: имя своего подрядчика }
        externalPhone: { type: string, nullable: true }
        packageName:
          type: string
          nullable: true
          description: |
            Название пакета, по которому бронировали (`packageId` в
            `POST …/book`). null — бронь без пакета или пакет снят с витрины.
        price: { $ref: '#/components/schemas/Money' }
        paid:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            Сколько уже внесено по этой сделке: платежи `deposit` и `balance`
            минус возвраты, без отменённых. Считается на лету, в базе не
            хранится (§3.1: производное значение расходится с источником).

            Без него «оплачено 30 000 из 50 000» показать нечем, и человек
            держит остаток долга в голове. Уходит вместе с ценой — тому, кто
            видит деньги: помощник и координатор не видят ни того, ни другого.
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: дата последнего платежа. Пусто — платежей не было
        negotiatingUntil:
          type: string
          format: date-time
          nullable: true
          description: 'срок мягкой брони: 72 ч на этапе negotiating (§18.3)'
        bookedAt: { type: string, format: date-time, nullable: true }
        doneAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
    DealState:
      type: string
      description: |
        Шесть состояний сделки (План §8.1, решение владельца 2026-09-02).
        Мягкая бронь на 72 часа — не отдельное состояние, а срок жизни `negotiating` (§18.3).
      enum: [candidate, contacted, negotiating, booked, paid_deposit, done, cancelled]
    Gift:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        icon:
          type: string
          maxLength: 16
          nullable: true
          description: |
            Значок подарка (§9). Плитка (`tile` в моках) сюда не входит: это
            цвет из палитры, он считается на клиенте по месту в списке —
            дизайн-токен, а не данные.
        desc: { type: string, nullable: true }
        price: { $ref: '#/components/schemas/Money' }
        group: { type: boolean, description: можно скидываться }
        funded: { $ref: '#/components/schemas/Money' }
        reserved: { type: boolean, description: 'кем именно — паре не отдаётся никогда' }
        mine:
          type: boolean
          readOnly: true
          description: |
            Резерв поставлен ЭТИМ гостем. Только в гостевом ответе; паре поле
            не отдаётся вовсе — иначе «занято мной» на её экране и означало бы
            того самого гостя, которого §9 обещает не показывать.
    Fund:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: string, maxLength: 16, nullable: true }
        target: { $ref: '#/components/schemas/Money' }
        collected: { $ref: '#/components/schemas/Money' }
    BusRoute:
      type: object
      description: |
        Маршрут для гостей — работа перевозчика глазами гостей: точка сбора,
        время, места. Перевозчик — подрядчик (сделка в слоте «Транспорт»);
        маршрут может ссылаться на его сделку (фича 006), а может жить сам по
        себе (свой микроавтобус без сделки). Лимузин пары — сделка без маршрута.
      properties:
        id: { type: string }
        name: { type: string, example: Автобус №1 }
        from: { type: string, example: 'Уфа, ост. «Гостиный двор»' }
        time: { type: string, example: '14:30' }
        seats: { type: integer }
        taken: { type: integer, readOnly: true, description: 'занято ПЕРСОН (гость «с +1» — двое); считает база, переполнение запрещено' }
        dealId:
          type: string
          nullable: true
          description: |
            Сделка с перевозчиком этой свадьбы — только в слоте категории
            `transport` (иначе 422 `not_transport`) и живая: отменённая — 409
            `deal_cancelled`, кандидат или переговоры — 409 `deal_not_booked`
            (фича 014: «везёт перевозчик X» — обещание гостям, его не дают за
            подрядчика, который ничего не подтвердил). null — маршрут без
            перевозчика. Отмена сделки обнуляет поле, маршрут и записи гостей
            остаются.
        carrier:
          type: string
          nullable: true
          readOnly: true
          description: |
            Имя перевозчика по сделке: название анкеты из каталога или имя
            своего подрядчика. Видят пара, команда и гость (`GET /join/{t}/shuttle`)
            — только имя, без телефона и цены.
    HotelBlock:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        rooms: { type: integer }
        booked: { type: integer }
        price: { $ref: '#/components/schemas/Money' }
        deadline: { type: string, format: date }
        promo: { type: string }
        mine:
          type: boolean
          readOnly: true
          description: |
            Только в `GET /join/{guestToken}/hotels`: гость уже занял номер
            в этом блоке. Без признака гость не видел своей брони и тап по
            другому блоку переносил её молча (D3-15).
    BroadcastResult:
      type: object
      description: |
        Что сделала «рассылка гостям»: гостям доставки нет (ни SMS, ни почты
        — «Хвосты»), запись уходит в журнал рассылок и команде в приложении.
      properties:
        broadcastId: { type: string }
        recipients: { type: integer, description: 'скольких гостей касается (по записям/ответам)' }
        notified: { type: integer, description: 'скольким членам команды ушло уведомление' }
        debounced:
          type: boolean
          description: 'true — та же рассылка уже была недавно, повторно не отправлялась'
    DayXBroadcast:
      type: object
      description: Ответ на «+15 мин» и активацию плана Б.
      properties:
        minutes: { type: integer, description: 'только у сдвига' }
        shiftedBlocks: { type: integer, description: 'только у сдвига — сколько блоков сдвинуто' }
        scenario: { type: string, nullable: true, description: 'только у плана Б' }
        guestsAffected:
          type: integer
          description: |
            Скольких гостей (ответивших «да») касается — им сообщает команда.
            Поле `notifiedGuests` (всегда 0, канала до гостей нет) снято в v0.30.0.
    MenuPoll:
      type: object
      required: [options]
      properties:
        question: { type: string }
        sentAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: когда сводка ушла кейтерингу (POST …/menu-poll/remind); null — ещё не уходила
        expectedPortions:
          type: integer
          readOnly: true
          description: |
            На сколько ПЕРСОН готовить. Считается по подтвердившим гостям:
            запись с «+1» — двое. Кейтерингу нужны порции, а не строки
            списка, и считать их на клиенте значит получить два разных
            ответа на разных экранах.
        options:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              icon: { type: string }
              votes: { type: integer }

    UserProfile:
      type: object
      properties:
        id: { type: string, readOnly: true }
        name: { type: string }
        phone: { type: string, readOnly: true }
        email:
          type: string
          nullable: true
          readOnly: true
          description: |
            Пока только читается: отправителя писем нет (хвост владельца), и
            принимать адрес, на который ничего не уйдёт, — обещать доставку.
            Правка появится вместе с отправителем и подтверждением адреса.
        isStaff:
          type: boolean
          readOnly: true
          description: |
            Сотрудник платформы: по этому признаку в меню «Мы» появляется
            «Админка». Только чтение и только про себя: списка сотрудников
            наружу нет, а признак ставится руками в базе при найме.
            PATCH /users/me берёт тело по этой же схеме — без readOnly контракт
            объявил бы права настраиваемыми, то есть «сделай меня админом»
            в один запрос.
        lang: { type: string, enum: [ru, en] }
        tz: { type: string, example: Asia/Yekaterinburg, description: 'нужна для открытия чата дня X в 09:00 по местному' }
        push:
          type: object
          description: четыре независимых канала — тумблеры в настройках
          properties:
            tasks: { type: boolean }
            chats: { type: boolean }
            deals: { type: boolean }
            tips: { type: boolean }
        quietHours:
          type: object
          description: 'по умолчанию 22:00–09:00; в день X отключаются автоматически'
          properties:
            from: { type: string, example: '22:00' }
            to: { type: string, example: '09:00' }
    Session:
      type: object
      properties:
        id: { type: string }
        device: { type: string, example: 'iPhone · Safari' }
        current: { type: boolean }
        createdAt: { type: string, format: date-time }
    Document:
      type: object
      properties:
        id: { type: string }
        dealId: { type: string }
        templateCode: { type: string }
        version: { type: integer }
        status: { type: string, enum: [draft, sent, signed] }
        pdfUrl:
          type: string
          nullable: true
          description: |
            Появляется после подключения объектного хранилища. До тех пор
            договор существует как запись с полями и версией, но файла нет:
            выдать ссылку в никуда хуже, чем честно вернуть null.
        docxUrl: { type: string, nullable: true }
        fields:
          type: object
          additionalProperties: true
          description: 'Подставленные значения: стороны, дата, сумма, город.'
        createdAt: { type: string, format: date-time }
    TimelineEvent:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Выездная церемония }
        location: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        who: { type: string, description: кто отвечает }
        icon:
          type: string
          example: 🌅
          description: |
            Значок блока. Приходит с сервера, потому что шаблон тайминга
            собирается там при создании свадьбы: клиент не знает, что «Сборы
            невесты» — это рассвет, а «Первый танец» — музыка, и подбирать
            значок по названию значит гадать по строке.
        outdoor: { type: boolean, description: 'блок под открытым небом — к нему привязывается план Б' }
        forGuests:
          type: boolean
          default: true
          description: |
            Видят ли блок гости в день X (`GET /join/{guestToken}/day`). По
            умолчанию да — программа праздника; «Сборы невесты» и «Монтаж
            арки» пара снимает галочкой (План §8.8, фича 009).
    AlbumPhoto:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        approved: { type: boolean }
        createdAt: { type: string, format: date-time }
    Complaint:
      type: object
      properties:
        id: { type: string }
        targetKind: { type: string, enum: [vendor, review, message, deal] }
        targetId: { type: string }
        category: { type: string, enum: [fraud, content, no_show, spam] }
        text: { type: string }
        status: { type: string, enum: [new, resolved] }
        createdAt: { type: string, format: date-time }

    # ─── Админка (План §19.10) ───
    AdminCategory:
      type: object
      description: |
        Категория глазами сотрудника: то же, что в каталоге, плюс порядок в мозаике.
        Отдельная схема, а не Category, потому что `sort` наружу не выходит —
        паре он не нужен, а панель без него не может переставлять плитки.
      required: [id, title]
      properties:
        id:
          type: string
          maxLength: 40
          # Идентификатор попадает в адреса и в ссылки анкет, а категории не
          # удаляются: `PHOTO` рядом с `photo` — это вторая мозаика навсегда,
          # а пустой идентификатор — строка, которую нечем выбрать.
          pattern: '^[a-z0-9_-]{1,40}$'
          example: photo
        title: { type: string, minLength: 1, maxLength: 100, example: Фотограф }
        icon:
          type: string
          maxLength: 16
          nullable: true
          description: |
            Значок категории. В базе может быть пустым, и это `null`, а не «нет поля».
            В теле PUT пропуск — прежний значок, `null` — стереть (R-17: пропуск и
            очистка — разные намерения; фича 014).
        sort: { type: integer, description: 'порядок в мозаике: меньше — выше' }
    AdminCategories:
      type: object
      description: 'Текущее состояние справочника: то, что заменит следующий PUT.'
      properties:
        categories: { type: array, items: { $ref: '#/components/schemas/AdminCategory' } }
        synonyms:
          type: object
          description: 'слово → идентификатор категории'
          additionalProperties: { type: string }
        version:
          type: string
          pattern: '^[0-9a-f]{16}$'
          example: 9f2c1ab340de77b5
          description: |
            Отпечаток содержимого справочника — шестнадцать шестнадцатеричных знаков.
            Меняется от ЛЮБОЙ правки категорий или словаря, в том числе сделанной
            мимо панели: он считается по самим строкам, а не по времени сохранения.
            Возвращается в теле PUT, чтобы сохранение не затёрло чужую правку.
    VerificationSubmit:
      type: object
      description: "Тело подачи документов на верификацию (фича 014: одна схема — и контракту, и обработчику)."
      required: [kind, fileUrl]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [passport, ip, company] }
        fileUrl:
          type: string
          maxLength: 2000
          pattern: '^https://[^ ]+$'
          description: |
            Ссылка на скан. Только `https` — сотрудник открывает её в новой
            вкладке из карточки заявки, и `http`, `javascript:` или `file:`
            здесь были бы не документом, а тем, что сотруднику подсунули.
        inn:
          type: string
          pattern: '^[0-9]{10}$|^[0-9]{12}$'
          description: 'ИНН: 10 знаков у организации, 12 у ИП и физлица.'
    AdminCategoriesUpdate:
      type: object
      description: "Тело правки справочника категорий (фича 014: одна схема — и контракту, и обработчику)."
      additionalProperties: false
      properties:
        categories:
          type: array
          maxItems: 200
          description: 'до 200 категорий — справочник шлётся целиком (сейчас 35)'
          items: { $ref: '#/components/schemas/AdminCategory' }
        synonyms:
          type: object
          maxProperties: 2000
          propertyNames: { maxLength: 40 }
          description: |
            слово → идентификатор категории; слово хранится в нижнем регистре.
            Не больше 2000 слов, длина слова — до 40 знаков: словарь
            заменяется целиком и вставляется построчно под блокировкой
            справочника, а «фотограф» — это слово, а не абзац.
          additionalProperties: { type: string }
        version:
          type: string
          maxLength: 16
          pattern: '^[0-9a-f]{16}$'
          description: |
            Версия справочника, с которой начата правка (из `GET /admin/categories`).
            Не совпала с текущей — 409 `categories_stale`. Без поля сохранение
            идёт без проверки. Шестнадцать шестнадцатеричных знаков — всё
            остальное 422, а не 409: такой версии сервер не выдавал никогда.
    CategoriesUpdated:
      type: object
      description: 'Сколько строк сохранено. Словарь заменён целиком — число равно его новому размеру.'
      properties:
        categories: { type: integer }
        synonyms: { type: integer }
        version:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: 'Версия справочника после сохранения — с ней продолжают правку, не перечитывая.'
    ModerationVendor:
      allOf:
        - $ref: '#/components/schemas/Vendor'
        - type: object
          properties:
            createdAt: { type: string, format: date-time, description: 'когда анкета заведена' }
            publishedAt:
              type: string
              format: date-time
              nullable: true
              description: |
                Когда анкета опубликована. Именно от этой даты считается срок
                проверки, и именно её показывает очередь: дата заведения
                у анкеты, пролежавшей месяц в черновике, ответила бы не на тот вопрос.
    ModerationVendorPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ModerationVendor' } }
        nextCursor: { type: string, nullable: true }
    VendorDecision:
      type: object
      description: 'Что записано по анкете. Ответ подтверждает решение, а не состояние анкеты целиком.'
      properties:
        vendorId: { type: string }
        action: { type: string, enum: [approve, reject, verify] }
    ComplaintDecision:
      type: object
      description: 'Что записано по жалобе.'
      properties:
        complaintId: { type: string }
        action: { type: string, enum: [dismiss, warn, downrank, block] }
    ConciergeRequest:
      type: object
      description: 'Заявка консьержу в очереди панели: что искать, где, на какой бюджет и кому перезвонить.'
      properties:
        id: { type: string }
        status: { type: string, enum: [new, in_progress, done, cancelled] }
        categoryId: { type: string }
        categoryName: { type: string, description: 'название категории из справочника' }
        city: { type: string, nullable: true, description: 'город поиска; пусто — заявка без города' }
        budget:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
        comment: { type: string, nullable: true }
        phone:
          type: string
          description: 'номер входа пары — она попросила связаться; сотрудник звонит по нему'
        name: { type: string, nullable: true, description: 'имя пары из профиля' }
        createdAt: { type: string, format: date-time, description: 'когда подана — от неё считаются сутки' }
    ConciergePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ConciergeRequest' } }
        nextCursor: { type: string, nullable: true }
    ConciergeDecision:
      type: object
      description: 'Что записано по заявке консьержу.'
      properties:
        requestId: { type: string }
        status: { type: string, enum: [in_progress, done, cancelled] }
    VerificationItem:
      type: object
      description: |
        Заявка в очереди. Ни ссылки на документ, ни ИНН здесь нет — только
        признак `hasFile`: документы отдаются в карточке одному сотруднику
        и с записью в журнал, а не страницами всем подряд.
      properties:
        id: { type: string }
        vendorId: { type: string }
        vendorName: { type: string }
        kind:
          type: string
          enum: [passport, ip, company]
          description: 'что прислали: паспорт, документы ИП или документы компании'
        hasFile: { type: boolean, description: 'приложена ли ссылка на документ' }
        createdAt: { type: string, format: date-time, description: 'когда подана' }
    VerificationPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VerificationItem' } }
        nextCursor: { type: string, nullable: true }
    VerificationRequest:
      type: object
      description: |
        Карточка заявки: то, по чему принимается решение. Единственный ответ,
        где ссылка на документ и ИНН выходят наружу, — и только сотруднику.
      properties:
        id: { type: string }
        vendorId: { type: string }
        vendorName: { type: string }
        vendorPublished:
          type: boolean
          description: |
            Есть ли анкета в каталоге сейчас (опубликована и не заблокирована).
            Решение по документам этим не задерживается — признак нужен, чтобы
            карточка не вела на анкету, которой в каталоге нет.
        kind: { type: string, enum: [passport, ip, company] }
        fileUrl:
          type: string
          nullable: true
          description: 'Ссылка на документ во внешнем хранилище. Пусто — документ не приложен.'
        inn: { type: string, nullable: true }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
        checkedAt: { type: string, format: date-time, nullable: true, description: 'когда разобрана' }
    VerificationDecision:
      type: object
      description: 'Что записано по заявке. Ответ подтверждает решение, а не состояние подрядчика целиком.'
      properties:
        requestId: { type: string }
        action: { type: string, enum: [approve, reject] }
    VerificationStatus:
      type: object
      description: |
        Состояние последней заявки подрядчика. `none` — заявок не было.
        Причины отказа здесь нет: она приходит уведомлением.
      properties:
        status: { type: string, enum: [none, pending, approved, rejected] }
        kind: { type: string, enum: [passport, ip, company], nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true, description: 'когда подана' }
        checkedAt: { type: string, format: date-time, nullable: true, description: 'когда разобрана' }
    AdminMetrics:
      type: object
      description: |
        Показатели платформы на сейчас. Каждое число считается сервером —
        клиент их не складывает и не досчитывает, иначе на двух экранах
        получились бы два разных ответа.
      properties:
        users: { type: integer, description: 'живые аккаунты' }
        weddings: { type: integer, description: 'неархивные свадьбы' }
        vendorsPublished: { type: integer, description: 'опубликованные и не заблокированные анкеты' }
        moderationQueue: { type: integer, description: 'анкеты, ждущие проверки' }
        verificationQueue:
          type: integer
          description: |
            Заявки на верификацию, ждущие решения. Считается тем же условием,
            что и очередь `GET /admin/verifications`: число на дашборде и длина
            очереди — одно и то же, иначе панель обещает работу, которой нет.
        complaintsOpen: { type: integer, description: 'нерассмотренные жалобы' }
        complaintsOverdue:
          type: integer
          description: |
            Из них старше суток. Срок разбора — 24 часа (§18.2); без отдельного
            счётчика он существует только на бумаге.
        deals: { type: integer, description: 'сделки в состояниях booked, paid_deposit, done' }
        gmv:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: 'оборот по тем же сделкам'
        cities:
          type: array
          description: 'до двадцати городов по числу анкет'
          items:
            type: object
            properties:
              city: { type: string }
              vendors: { type: integer }
              launchReady: { type: boolean, description: 'город готов к запуску — анкет 50 и больше' }
        llm:
          type: object
          description: |
            Расход Тиля на языковую модель за последние 30 дней — по строкам
            учёта `tilly_usage` (одна на каждый вызов, фича 010). `calls` —
            все обращения, включая отказы провайдера и ответы заглушкой;
            `answered` — сколько из них ответила модель; токены — только по
            ответам модели. Стоимость в рублях сервер не считает: цены у
            провайдеров и моделей разные и меняются — владелец умножает сам.
          required: [since, calls, answered, inputTokens, outputTokens]
          properties:
            since: { type: string, format: date-time, description: 'начало окна — 30 дней назад' }
            calls: { type: integer, minimum: 0 }
            answered: { type: integer, minimum: 0 }
            inputTokens: { type: integer, minimum: 0 }
            outputTokens: { type: integer, minimum: 0 }
        profiles:
          type: object
          description: |
            Заполненность живых опубликованных анкет (фича 012, План §19.10
            п. 4). Заполненность одной анкеты — доля заполненных из четырёх
            полей, которые подрядчик может заполнить сам: описание, рабочий
            телефон, цена «от», хотя бы один пакет. Фото и видео не считаются —
            загрузок нет до хранилища, и метрика штрафовала бы всех за
            инфраструктуру. `published` — тот же набор, что `vendorsPublished`;
            `complete` — 4 из 4; `averagePercent` — среднее по анкетам, 0…100.
            Пустой каталог — нули по факту ответа, не «неизвестно».
          required: [published, complete, averagePercent]
          properties:
            published: { type: integer, minimum: 0 }
            complete: { type: integer, minimum: 0 }
            averagePercent: { type: integer, minimum: 0, maximum: 100 }
    SupportDeal:
      type: object
      description: |
        Сделка глазами поддержки (фича 013): только то, что нужно для разбора
        спора о деньгах. Имена — есть, телефонов и переписки — нет.
      required: [id, slotLabel, categoryId, state, paid, events]
      properties:
        id: { type: string }
        slotLabel: { type: string, description: 'подпись слота на мозаике пары («Фотограф»)' }
        categoryId: { type: string }
        vendorName: { type: string, nullable: true, description: 'анкета каталога; null у своего подрядчика' }
        externalName: { type: string, nullable: true, description: 'свой подрядчик пары (§11); null у сделки из каталога' }
        state: { $ref: '#/components/schemas/DealState' }
        price:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
        paid:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: 'оплачено по платежам (возвраты вычтены, отменённые не считаются) — та же формула, что у пары и подрядчика'
        bookedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        events:
          type: array
          description: 'история состояний по времени: кто (couple | vendor | system), откуда, куда, заметка'
          items:
            type: object
            required: [at, by, toState]
            properties:
              at: { type: string, format: date-time }
              by: { type: string, enum: [couple, vendor, system] }
              fromState: { type: string, nullable: true }
              toState: { type: string }
              note: { type: string, nullable: true }
    WeddingSupportCard:
      type: object
      description: |
        Карточка, а не свадьба целиком: ни гостей, ни переписки, ни сумм.
        Для разбора обращения этого достаточно, а лишнее здесь — чужая свадьба
        на экране поддержки.
      properties:
        id: { type: string }
        title: { type: string }
        date: { type: string, format: date, nullable: true }
        city: { type: string, nullable: true }
        style: { type: string, nullable: true }
        guestsPlanned: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }

security:
  - bearerAuth: []
