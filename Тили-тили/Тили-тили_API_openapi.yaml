                required:
                  - guestToken
                  - guestName
                  - wedding
                properties:
                  guestToken:
                    type: string
                  guestName:
                    type: string
                  wedding:
                    $ref: '#/components/schemas/WeddingPublic'
        '410':
          description: '`gone` — код уже использован или истёк: попросите пару выслать ссылку заново'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
