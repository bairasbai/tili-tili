      summary: Индикатор «печатает…» (WebSocket-fallback)
      description: |
        Запасной путь для клиента без живого канала: он сообщает о наборе
        обычным запросом, а событие уходит подписчикам тем же каналом, что
        и сообщения. Ничего не сохраняется — «печатает» живёт секунды.
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OK
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          description: >-
            `wedding_date_unknown` — у свадьбы ещё нет даты, окно чата не считается; `chat_not_open_yet` — окно чата ещё
            не открылось
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /chats/vendor/{vendorId}:
