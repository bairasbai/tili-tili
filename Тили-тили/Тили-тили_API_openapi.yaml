        '401':
          description: Нужна текущая сессия
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Устарела версия
          изменился источник или повтор ключа относится к другому запросу: null
        '422':
          $ref: '#/components/responses/Validation'
  /deals/{dealId}/order/terms:
    get:
      tags:
        - bookings
      summary: Прочитать редакции условий заказа
      description: >-
        Условия фиксируют реальные бриф, назначения, части, события, цену и исполнителя. Текущая пара и владелец именно
        этого подрядчика проверяются после блокировки, включая повтор ключа. Новая редакция не наследует согласие.
        Read-token привязан к версии, сессии и стороне, выдаётся только GET свежего предложения, не сохраняется offline.
        Принятие не меняет цену, оплату, бронь или программу и не является юридической подписью. Внешний контакт не
        создаёт согласие исполнителя; отдельный путь внешнего подтверждения ещё не подключён. История сохраняется при
        устаревшем/повреждённом черновике, который нельзя принять. Формат schemaVersion 1 остаётся для заказа без плана.
        Формат 2 добавляет безопасную проекцию и точную неизменяемую редакцию плана ресурсов; внутренние ID ресурсов и
        людей в неё не входят. Новая редакция не наследует прежних ответов сторон. Изменение used или общей мощности
        окна не меняет обещанный состав.
      security:
        - bearerAuth: []
      parameters:
        - name: dealId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: termsId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Редакции и реальные отметки сторон; запись не выдаёт новый read-token
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'no-store: приватные данные и read-token нельзя кэшировать'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderTermsView'
        '401':
          description: Нужна текущая сессия
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Изменилась редакция/источник, истекло подтверждение или ключ повторён с другим запросом
        '422':
          $ref: '#/components/responses/Validation'
        '503':
          description: Подтверждение редакции недоступно
