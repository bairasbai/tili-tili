                        - reason
                      properties:
                        index:
                          type: integer
                          description: позиция строки в присланном списке, с нуля
                        name:
                          type: string
                        reason:
                          type: string
                          enum:
                            - duplicate
                            - invalid
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
  /weddings/{weddingId}/guests/remind:
    post:
      tags:
        - guests
      summary: Напомнить гостям, которые не ответили
      description: |
        Одно СМС каждому, кто не ответил на приглашение и у кого есть телефон.
        Раньше пара обходила список руками — на полусотне гостей это вечер.

        **Только паре** (фича 005): рассылка тратит SMS-лимит свадьбы,
        помощнику и координатору — 403. Телефоны гостей видит тоже только
        пара — остальным в `Guest` приходит `hasPhone`.

        **Кому не уходит и почему.** Гостю, чья личная ссылка уже открыта,
        напоминание отсюда не идёт: новая ссылка гасит его токен, а вместе с
        ним теряется всё, что он выбрал — резерв подарка в том числе (§9).
        Такому гостю пара выдаёт ссылку поштучно, осознанно.

        **Не чаще раза в сутки.** Рассылка стоит денег и приходит чужим людям.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
      responses:
        '200':
          description: Отправлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: integer
                    description: сколько сообщений ушло
                  skippedNoPhone:
                    type: integer
                    description: не ответили, но телефона нет
                  skippedLinkUsed:
                    type: integer
                    description: не ответили, но живой личной ссылки нет — открыта или не выдавалась; им ссылку выдают поштучно
                  failed:
                    type: integer
                    description: >-
                      телефон и ссылка есть, а SMS не ушла: отказ провайдера или предел рассылки (300 за нажатие;
                      остальные — в следующие сутки)
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: '`too_often` — не чаще раза в сутки; заголовка `Retry-After` нет'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /weddings/{weddingId}/guests/{guestId}/invite-link:
    post:
      tags:
        - guests
      summary: Выдать (или перевыпустить) одноразовую ссылку-приглашение гостю
      description: >
        Только роль couple. Список гостей ведёт вся команда, но ссылка — это удостоверение: кто её выдаёт, тот может
        обменять её сам и дальше действовать от имени гостя. Помощнику такие права не нужны (решение владельца
        2026-09-03). Возвращает ссылку вида https://tili-tili.ru/i/{shareCode}. Код одноразовый: при первом открытии он
        гаснет и гость получает персональный guestToken в свой браузер. Пара сырой токен не видит. Повторный вызов гасит
        прежний код и выдаёт новый — на случай «гость потерял ссылку». Вместе с кодом гаснет и САМ ТОКЕН: иначе пара,
        которая ссылку и выдаёт, обменяла бы её сама и увидела на гостевой странице, какой подарок этот гость
        зарезервировал (§9). Резервы прежнего токена освобождаются — подарок не должен остаться занят мёртвой ссылкой.
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: string
        - name: guestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                  - expiresAt
                properties:
                  url:
                    type: string
                    example: https://tili-tili.ru/i/7F3K-QX9M
                  expiresAt:
                    type: string
                    format: date-time
                    description: 30 дней или дата свадьбы + 30 дней — что позже
  /invite/{shareCode}:
    get:
      tags:
        - guests
      security: []
      summary: Обменять одноразовый код на персональный токен гостя
      description: >
        Вызывается браузером гостя при переходе по ссылке. Код гасится в этот момент. Токен возвращается один раз и
        дальше живёт в localStorage гостя. Повторный вызов с тем же кодом в течение 10 минут после первого отдаёт тот же
        токен (ответ мог не дойти по мобильной сети — D3-07), позже — 410; 410 также у истёкшего и перевыпущенного парой
        кода и у кода отменённой или убранной свадьбы.
      parameters:
        - name: shareCode
          in: path
          required: true
          schema:
            type: string
      responses:
