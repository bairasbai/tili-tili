  /vendor/weddings/{weddingId}/timeline/ack:
    post:
      tags:
        - vendor
      summary: Подтвердить ознакомление с точным снимком программы
      description: >
        Явная команда, отдельная от legacy vendor updates/ack. Требуются readToken из GET и его исходный If-Match. После
        wedding lock повторно проверяются live wedding/account/session/ownership/committed deals, exact version, срок
        token и digest фактической разрешённой projection. Старый снимок не подтверждает новую редакцию. Повтор
        сохраняет исходное время и не создаёт второй audit event; отказ не пишет историю. В истории сохраняется
        минимальный подтверждённый снимок без token/телефонов/денег. Это не доказательство доставки SMS/push или
        человеческого прочтения каждой строки.
      security:
        - bearerAuth: []
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - readToken
              properties:
                readToken:
                  type: string
                  minLength: 1
                  maxLength: 8192
      responses:
        '200':
          description: Сохранённое ознакомление с этой версией
          headers:
            ETag:
              description: Подтверждённая версия
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProgramAck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: timeline_conflict / program_read_expired / program_snapshot_changed / program_unassigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
        '428':
          description: timeline_version_required — нужен исходный If-Match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: acknowledgment_unavailable — подтверждение не сохранено, повторите позже
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /weddings/{weddingId}/timeline/acknowledgments:
    get:
      tags:
        - timeline
      summary: Сводка ознакомления исполнителей для пары и команды
      description: >
        Только couple/helper/coordinator своей активной свадьбы, live access после wedding lock. GET не подтверждает и
        не выдаёт readToken/digest/session/деньги. Current acknowledged требует ту же версию, содержание разрешённой
        projection и текущего живого владельца анкеты. PreviousAcknowledgment — отдельная история, не подтверждение этой
        редакции; имя читается из текущего профиля реального автора, не восстановленный снимок имени. External deal
        использует явный current-link указатель, атомарно сохранённый при выдаче последней ссылки, ту же deal/link
        identity/version/content. Старая ссылка не подтверждает новую; старые подтверждения доступны отдельно.
        Неизвестный исторический указатель, отозванная/истёкшая ссылка или устаревшая сделка слота дают unavailable, без
        возврата к старой зелёной отметке. После всех запросов проверяется фактическое время ссылки. External
        acknowledgedBy всегда null: это подтверждение владельцем ссылки, не проверенная личность. Отсутствующее
        назначение unassigned; удалённый зарегистрированный владелец unavailable. not_supported сохранён для
        совместимости прежних ответов. ETag/sourceVersion из одного lock; Cache-Control no-store. Сводка не доказывает
        доставку уведомлений или прочтение каждой строки.
      security:
        - bearerAuth: []
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Текущее состояние и отдельное предыдущее подтверждение
          headers:
            ETag:
              description: Версия программы
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineAcknowledgments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: program_actors_changed — состав исполнителей поменялся во время чтения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /vendor/analytics:
