        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }

  # ───────────────────────── VENDOR-СТОРОНА ─────────────────────────
  /vendor/profile:
    get:
      tags: [vendor]
      summary: Моя анкета подрядчика
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorDetail' }
    put:
      tags: [vendor]
      summary: "Создать/обновить анкету (мастер: категория → пакеты → город → публикация)"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorUpsert' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorDetail' }
  /vendor/profile/publish:
    post:
      tags: [vendor]
      summary: Опубликовать анкету (модерация → live)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [moderation, live] }
  /vendor/calendar:
    get:
      tags: [vendor]
      summary: Занятость (календарь подрядчика)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: month
          in: query
          schema: { type: string, example: '2027-06' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string, format: date }
                    status: { type: string, enum: [free, busy, hold] }
  /vendor/calendar/busy:
    post:
      tags: [vendor]
      summary: Отметить даты занятыми/свободными
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dates, status]
              properties:
                dates:
                  type: array
                  items: { type: string, format: date }
                status: { type: string, enum: [free, busy] }
      responses:
        '204': { description: OK }
  /vendor/leads:
    get:
      tags: [vendor]
      summary: Входящие лиды
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Lead' }
  /vendor/leads/{leadId}:
    post:
      tags: [vendor]
      summary: "Действие с лидом: ответить / холд 72ч / отклонить / вернуть"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: leadId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [reply, hold, decline, reopen] }
                text: { type: string, description: 'для action=reply' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lead' }
  /vendor/reviews:
    get:
      tags: [vendor]
      summary: Отзывы на меня
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }
  /vendor/reviews/{reviewId}/reply:
    post:
      tags: [vendor]
      summary: Ответить на отзыв
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties: { text: { type: string } }
      responses:
        '200': { description: OK }
  /vendor/analytics:
    get:
      tags: [vendor]
      summary: Аналитика анкеты (просмотры → лиды → сделки)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [month, season, year], default: season }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revenue: { type: integer, example: 385000 }
                  revenueDeltaPct: { type: number, example: 38 }
                  funnel:
                    type: object
                    properties:
                      views: { type: integer, example: 1240 }
                      contacts: { type: integer, example: 96 }
                      leads: { type: integer, example: 34 }
                      deals: { type: integer, example: 8 }

  # ───────────────────────── REVIEWS (пара → подрядчик) ─────────────────────────
  /catalog/vendors/{vendorId}/reviews:
    post:
      tags: [catalog]
      summary: Оставить отзыв (только после завершённой сделки)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, text]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                text: { type: string }
      responses:
        '201': { description: Создан }

  # ───────────────────────── NOTIFICATIONS ─────────────────────────
  /notifications:
    get:
      tags: [notifications]
      summary: Уведомления пользователя
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
  /notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Отметить прочитанным
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: OK }


  # ───────────────────────── WISHLIST (пара) ─────────────────────────
  /weddings/{weddingId}/wishlist:
    get:
      tags: [wishlist]
      summary: Список желаний пары
      description: Пара видит статус подарка, но НИКОГДА не видит, кто его зарезервировал (§9).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  gifts: { type: array, items: { $ref: '#/components/schemas/Gift' } }
                  funds: { type: array, items: { $ref: '#/components/schemas/Fund' } }
                  antiGifts: { type: array, items: { type: string } }
    post:
      tags: [wishlist]
      summary: Добавить желание
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: { type: string }
                price: { $ref: '#/components/schemas/Money' }
                group: { type: boolean, description: можно скидываться }
                icon: { type: string, maxLength: 16 }
                desc: { type: string }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gift' }
  /weddings/{weddingId}/wishlist/{giftId}:
    patch:
      tags: [wishlist]
      summary: Изменить желание
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: giftId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                price: { $ref: '#/components/schemas/Money' }
                icon: { type: string, maxLength: 16 }
                desc: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gift' }
    delete:
      tags: [wishlist]
      summary: Удалить желание
      description: 'Запрещено, если в подарок уже сложились — 409, как и у фонда.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: giftId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: OK }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── WISHLIST (гость по ссылке) ─────────────────────────
  /gifts/{guestToken}:
    get:
      tags: [wishlist-guest]
      summary: Список подарков глазами гостя
      description: Без авторизации, по коду приглашения. Занятые подарки помечены, но кем — не видно.
      parameters: [{ $ref: '#/components/parameters/GuestToken' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  gifts: { type: array, items: { $ref: '#/components/schemas/Gift' } }
                  funds: { type: array, items: { $ref: '#/components/schemas/Fund' } }
                  antiGifts: { type: array, items: { type: string } }
                  fairPrice:
                    allOf: [{ $ref: '#/components/schemas/Money' }]
                    nullable: true
                    description: |
                      Деликатный ориентир «банкет на гостя»: расходы по строке
                      «Площадка и кейтеринг», делённые на число гостей. Пока
                      бюджет пуст или список гостей пуст — null, а не ноль
                      и не выдуманное число.
  /gifts/{guestToken}/{giftId}/reserve:
    post:
      tags: [wishlist-guest]
      summary: Зарезервировать подарок
      description: |
        Атомарно: резерв проходит только если подарок свободен (conditional update
        либо unique constraint). Второй гость получает 409 — подарить дважды нельзя.
        Токен гостя сохраняется, но паре не отдаётся никогда.

        Повтор тем же токеном — тот же 200: гость нажал дважды, подарок его.
        Подарок, в который уже сложились, зарезервировать нельзя (409): иначе
        деньги участников складчины повисают на чужом резерве.
      parameters:
        - { $ref: '#/components/parameters/GuestToken' }
        - { name: giftId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Зарезервировано }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [wishlist-guest]
      summary: Снять свой резерв
      description: Только по тому же гостевому токену, которым резерв был поставлен.
      parameters:
        - { $ref: '#/components/parameters/GuestToken' }
        - { name: giftId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: OK }
  /gifts/{guestToken}/{giftId}/fund:
    post:
      tags: [wishlist-guest]
      summary: Внести часть суммы (складчина)
      description: |
        Только для подарков с `group: true`. Сумма прибавляется к `funded`
        до `price`; взнос, переваливающий за цену, отклоняется 409 — принять
        больше нужного значит взять с гостя лишнее. При `funded == price`
        подарок закрывается и больше не принимает ни взносов, ни резерва.
      parameters:
        - { $ref: '#/components/parameters/GuestToken' }
        - { name: giftId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gift' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
  /gifts/{guestToken}/funds/{fundId}:
    post:
      tags: [wishlist-guest]
      summary: Перевод в денежный фонд
      parameters:
        - { $ref: '#/components/parameters/GuestToken' }
        - { name: fundId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fund' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }

  # ───────────────────────── СВОИ ПОДРЯДЧИКИ (§11) ─────────────────────────
  /weddings/{weddingId}/slots/{slotId}/external:
    post:
      tags: [bookings]
      summary: Добавить своего подрядчика (не из каталога)
      description: Пара нашла исполнителя сама. Профиля в каталоге нет, но слот, бюджет и тайминг он занимает наравне с каталожным.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: slotId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendorName, price]
              properties:
                vendorName: { type: string }
                price: { $ref: '#/components/schemas/Money' }
                phone: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slot' }
    delete:
      tags: [bookings]
      summary: Удалить своего подрядчика
      description: Слот возвращается в empty, выданный гостевой токен аннулируется.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: slotId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: OK }
  /weddings/{weddingId}/slots/{slotId}/external/invite:
    post:
      tags: [bookings]
      summary: Ссылка-приглашение для своего подрядчика
      description: Одноразовый токен, scope guest_vendor, TTL 30 дней, привязан к слоту.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: slotId, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  url: { type: string, example: 'https://tili-tili.ru/join/ТИЛИ-СВОЙ-S8' }
                  expiresAt: { type: string, format: date-time }
  /guest-vendor/{token}:
    get:
      tags: [bookings]
      summary: Кабинет гостя-подрядчика
      description: Без регистрации. Отдаёт только дату, свой блок тайминга и чат с парой — ничего больше.
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  weddingDate: { type: string, format: date }
                  slot: { $ref: '#/components/schemas/Slot' }
                  chatId: { type: string }

  # ───────────────────────── ЛОГИСТИКА ГОСТЕЙ (§12.1) ─────────────────────────
  /weddings/{weddingId}/logistics/buses:
    post:
      tags: [logistics]
      summary: Добавить маршрут трансфера
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusRoute' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusRoute' }
  /weddings/{weddingId}/logistics/buses/{busId}:
    delete:
      tags: [logistics]
      summary: Удалить маршрут
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: busId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: OK }
  /weddings/{weddingId}/logistics/hotels:
    post:
      tags: [logistics]
      summary: Добавить отельный блок
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HotelBlock' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotelBlock' }
  /weddings/{weddingId}/logistics/hotels/{hotelId}:
    delete:
      tags: [logistics]
      summary: Удалить отельный блок
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: hotelId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: OK }
  /weddings/{weddingId}/logistics/notify-pickup:
    post:
      tags: [logistics]
      summary: Разослать точки сбора записавшимся гостям
      description: Массовая рассылка идёт через очередь; повторный вызов с тем же Idempotency-Key не дублирует push.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '202': { description: Принято в очередь }
  /join/{guestToken}/shuttle:
    post:
      tags: [logistics-guest]
      summary: Гость записывается в автобус
      description: Место занимается атомарно; при переполнении — 409.
      parameters:
        - { $ref: '#/components/parameters/GuestToken' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [busId]
              properties:
                busId: { type: string }
      responses:
        '200': { description: Записан }
        '409': { $ref: '#/components/responses/Conflict' }
  /join/{guestToken}/hotels:
    get:
      tags: [logistics-guest]
      summary: Отельные блоки для гостя
      parameters: [{ $ref: '#/components/parameters/GuestToken' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HotelBlock' }
    post:
      tags: [logistics-guest]
      summary: Гость занимает номер в блоке
      description: |
        Место занимается атомарно, при переполнении — 409. Пути записи
        не было вовсе: блоки показывались, а занять номер было нечем,
        хотя план требует «атомарные места в автобусе И НОМЕРЕ».
      parameters:
        - { $ref: '#/components/parameters/GuestToken' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hotelId]
              properties:
                hotelId: { type: string }
      responses:
        '200': { description: Номер занят }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── ОПРОС ПО МЕНЮ (§12.2) ─────────────────────────
  /weddings/{weddingId}/menu-poll:
    get:
      tags: [catering]
      summary: Опрос гостей по горячему
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuPoll' }
    put:
      tags: [catering]
      summary: Изменить опрос
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuPoll' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuPoll' }
  /weddings/{weddingId}/menu-poll/remind:
    post:
      tags: [catering]
      summary: Напомнить не выбравшим блюдо
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '202': { description: Принято в очередь }
  /join/{guestToken}/menu-vote:
    post:
      tags: [catering]
      summary: Гость выбирает блюдо
      description: Один голос на гостя; повторный вызов меняет выбор, а не добавляет второй.
      parameters: [{ $ref: '#/components/parameters/GuestToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionId]
              properties:
                optionId: { type: string }
      responses:
        '200': { description: OK }

  # ───────────────────────── ОТЗЫВЫ ГОСТЕЙ (§15) ─────────────────────────
  /weddings/{weddingId}/guest-reviews:
    get:
      tags: [reviews]
      summary: Отзывы гостей о подрядчиках (для пары)
      description: Пара видит их анонимно — без имени гостя.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }
    post:
      tags: [reviews]
      summary: Гость оставляет отзыв
      description: |
        Только по действующему токену приглашения и только после даты свадьбы.
        Один отзыв на подрядчика на гостя: повторная отправка — редактирование, 409 при конфликте.
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendorId, stars]
              properties:
                vendorId: { type: string }
                stars: { type: integer, minimum: 1, maximum: 5 }
                text: { type: string }
      responses:
        '201': { description: Создано }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── СОГЛАСИЕ НА ОБРАБОТКУ ПДн (§18.1) ─────────────────────────
  /users/me/consent:
    post:
      tags: [auth]
      summary: Зафиксировать согласие на обработку персональных данных
      description: |
        152-ФЗ: согласие даётся явным действием. Сохраняются версия документа,
        дата и IP — это и есть подтверждение. Предустановленная галочка согласием не является.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policyVersion]
              properties:
                policyVersion: { type: string, example: '2026-09-02' }
      responses:
        '201': { description: Зафиксировано }
    delete:
      tags: [auth]
      summary: Отозвать согласие
      description: Равносильно удалению аккаунта и всех данных свадьбы.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: OK }


  # ───────────────────────── ПРОФИЛЬ ПОЛЬЗОВАТЕЛЯ ─────────────────────────
  /users/me:
    get:
      tags: [auth]
      summary: Мой профиль
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
    patch:
      tags: [auth]
      summary: Изменить профиль и настройки уведомлений
      description: Имя, язык, таймзона, четыре канала push и тихие часы — экран «Настройки».
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfile' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
    delete:
      tags: [auth]
      summary: Удалить аккаунт
      description: |
        Soft-delete на 30 дней, затем полное удаление кроном (План §19.1).
        Активные сделки требуют подтверждения второй стороны — 409 со списком.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: OK }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/me/sessions:
    get:
      tags: [auth]
      summary: Мои сессии и устройства
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
    delete:
      tags: [auth]
      summary: Выйти со всех устройств, кроме текущего
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: OK }
  /users/me/sessions/{sessionId}:
    delete:
      tags: [auth]
      summary: Завершить сессию
      description: 'Выход со всех устройств сразу — DELETE /users/me/sessions.'
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: OK }
  /users/me/export:
    get:
      tags: [auth]
      summary: Экспорт моих данных
      description: 152-ФЗ, право на получение данных. JSON со всем, что принадлежит пользователю.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
  /users/me/push-subscriptions:
    post:
      tags: [notifications]
      summary: Зарегистрировать подписку Web Push
      description: 'VAPID. На iOS работает только с 16.4+ и после установки на экран «Домой» — при отказе клиент откатывается на email.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string }
                keys: { type: object }
      responses:
        '201': { description: Создано }
    delete:
      tags: [notifications]
      summary: Отписаться от push
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: OK }
  /users/me/referral:
    get:
      tags: [auth]
      summary: Мой реферальный код и начисления
      description: 'Код вида ТИЛИ-ИМЯ; обеим парам по 3 000 ₽ бонусами после первой сделки приглашённой (§3.15).'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: ТИЛИ-АЛИНА }
                  invited: { type: integer }
                  earned: { $ref: '#/components/schemas/Money' }
  /referral/{code}/apply:
    post:
      tags: [auth]
      summary: Применить чужой реферальный код
      description: Один раз на аккаунт и только до первой сделки. Повтор — 409.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── СДЕЛКИ: ПЕРЕХОДЫ И ДОГОВОРЫ ─────────────────────────
  /deals/{dealId}:
    patch:
      tags: [bookings]
      summary: Перевести сделку в следующее состояние
      description: |
        Контракт знал только book/cancel/pay — четыре из шести состояний были
        недостижимы через API. Разрешены только переходы вперёд по цепочке
        candidate → contacted → negotiating → booked → paid_deposit → done
        и cancelled из любого. Недопустимый переход — 409.
        Переход в negotiating ставит negotiatingUntil = now + 72 ч.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dealId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { $ref: '#/components/schemas/DealState' }
                note: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deal' }
        '409': { $ref: '#/components/responses/Conflict' }
  /deals/{dealId}/contract:
    post:
      tags: [documents]
      summary: Сгенерировать договор из шаблона
      description: 'Автоподстановка сторон, даты, суммы и города. Возвращает ссылки на PDF и DOCX. Дисклеймер про информационный характер — в теле документа (§3.10).'
      security: [{ bearerAuth: [] }]
      parameters: [{ name: dealId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateCode]
              properties:
                templateCode: { type: string, example: photographer }
                fields: { type: object, description: 'паспортные данные и реквизиты, вводятся парой' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
  /weddings/{weddingId}/documents:
    get:
      tags: [documents]
      summary: Договоры свадьбы
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }

  # ───────────────────────── ТАЙМИНГ И ПЛАН Б ─────────────────────────
  /weddings/{weddingId}/timeline:
    get:
      tags: [timeline]
      summary: Тайминг дня
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TimelineEvent' }
    put:
      tags: [timeline]
      summary: Заменить тайминг целиком
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/TimelineEvent' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TimelineEvent' }
  /weddings/{weddingId}/timeline/autogen:
    post:
      tags: [timeline]
      summary: Автоплан дня по забронированной команде
      description: 'Собирает черновик из стандартных длительностей и проверяет конфликты (План §8.9). Возвращает предпросмотр — не применяет.'
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/TimelineEvent' } }
                  conflicts: { type: array, items: { type: string } }
  /weddings/{weddingId}/timeline/shift:
    post:
      tags: [timeline]
      summary: Сдвинуть день X на N минут
      description: 'Кнопка «+15 мин» в режиме дня X. Сдвигает все последующие блоки и рассылает push команде и гостям — killer-фича §19.6.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: { type: integer, example: 15 }
      responses:
        '200': { description: OK }
  /weddings/{weddingId}/planb/activate:
    post:
      tags: [timeline]
      summary: Активировать план Б
      description: 'Пересобирает тайминг под запасной сценарий и рассылает команде и гостям новую точку сбора (§13.1).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario: { type: string, example: rain }
      responses:
        '200': { description: OK }

  # ───────────────────────── МЕДИА И АЛЬБОМ ─────────────────────────
  /media/upload-url:
    post:
      tags: [media]
      summary: Ссылка для прямой загрузки файла
      description: |
        Presigned URL в S3. Сервер проверяет тип и размер до выдачи ссылки,
        длительность видео (≤180 с) — после загрузки; превышение отклоняет файл.
        EXIF снимается на сервере (План §12.4).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, contentType, sizeBytes]
              properties:
                kind: { type: string, enum: [vendor_photo, vendor_video, album_photo, document_scan] }
                contentType: { type: string }
                sizeBytes: { type: integer }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl: { type: string }
                  fileUrl: { type: string }
                  expiresAt: { type: string, format: date-time }
  /weddings/{weddingId}/album:
    get:
      tags: [album]
      summary: Общий фотоальбом гостей
      description: |
        Паре видны все кадры, гостю — только одобренные. Пара опознаётся
        токеном доступа, гость — параметром `guestToken`.
      security: []
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - name: guestToken
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlbumPhoto' }
    post:
      tags: [album]
      summary: Гость добавляет фото
      description: 'Без регистрации, по персональному токену. Кадр попадает в очередь модерации парой.'
      security: []
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { $ref: '#/components/parameters/GuestTokenQuery' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileUrl, consent]
              properties:
                fileUrl: { type: string }
                consent: { type: boolean, description: согласие на публикацию в альбоме пары }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlbumPhoto' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
  /weddings/{weddingId}/album/{photoId}:
    patch:
      tags: [album]
      summary: Одобрить или скрыть кадр
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: photoId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approved: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlbumPhoto' }

  # ───────────────────────── ПОДАРКИ: ЧЕГО НЕ ХВАТАЛО ПАРЕ ─────────────────────────
  /weddings/{weddingId}/anti-gifts:
    put:
      tags: [wishlist]
      summary: Список «просим не дарить»
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /weddings/{weddingId}/funds:
    post:
      tags: [wishlist]
      summary: Завести денежный фонд
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, target]
              properties:
                name: { type: string }
                target: { $ref: '#/components/schemas/Money' }
                icon: { type: string, maxLength: 16 }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fund' }
  /weddings/{weddingId}/funds/{fundId}:
    delete:
      tags: [wishlist]
      summary: Удалить фонд
      description: 'Запрещено, если в фонд уже внесены деньги — 409.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: fundId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: OK }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── ЖИЗНЬ ПРОЕКТА ─────────────────────────
  /weddings/{weddingId}/reschedule:
    post:
      tags: [weddings]
      summary: Перенести дату свадьбы
      description: |
        Проверяет занятость всей забронированной команды на новую дату и
        возвращает отчёт «кто свободен, кто нет» (План §9.4). Освобождает старые
        даты в календарях подрядчиков и захватывает новые в одной транзакции.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  free: { type: array, items: { type: string } }
                  busy: { type: array, items: { type: string } }
        '409': { $ref: '#/components/responses/Conflict' }
  /weddings/{weddingId}/cancel:
    post:
      tags: [weddings]
      summary: Отменить свадьбу
      description: |
        Требует подтверждения ОБОИХ партнёров: первый вызов создаёт запрос,
        второй — исполняет. Всем сделкам в booked и paid_deposit ставится
        cancelled_by_couple, подрядчики уведомляются, проект уходит в архив на
        12 месяцев (План §19.1).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses:
        '200': { description: 'Запрос создан либо отмена исполнена — см. поле state' }
  /catalog/concierge:
    post:
      tags: [catalog]
      summary: Заявка консьержу при пустой выдаче
      description: 'Пока в городе меньше 50 анкет, поиск честно предлагает подбор вручную за 24 часа (План §18.12).'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId]
              properties:
                categoryId: { type: string }
                budget: { $ref: '#/components/schemas/Money' }
                comment: { type: string }
      responses:
        '201': { description: Создано }
  /complaints:
    post:
      tags: [moderation]
      summary: Пожаловаться
      description: 'Из чата, на отзыв, на анкету. SLA ответа модерации — 24 часа (План §18.2).'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetKind, targetId, category]
              properties:
                targetKind: { type: string, enum: [vendor, review, message, deal] }
                targetId: { type: string }
                category: { type: string, enum: [fraud, content, no_show, spam] }
                text: { type: string }
      responses:
        '201': { description: Создано }
  /vendor/verification:
    post:
      tags: [vendor]
      summary: Подать документы на верификацию
      description: |
        Паспорт или реквизиты ИП для сверки с ФНС. Документы не публикуются
        никогда — публична только галочка «Проверен» (План §18.2, §8.2).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, fileUrl]
              properties:
                kind: { type: string, enum: [passport, ip, company] }
                fileUrl: { type: string }
                inn: { type: string }
      responses:
        '201': { description: Отправлено на проверку }

  # ───────────────────────── АДМИНКА (План §19.10) ─────────────────────────
  /admin/moderation/vendors:
    get:
      tags: [admin]
      summary: Очередь пост-модерации анкет
      description: 'Анкеты публикуются сразу; модератор проверяет новые за ≤24 ч, жалобы — вне очереди.'
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorPage' }
  /admin/moderation/vendors/{vendorId}:
    post:
      tags: [admin]
      summary: Решение по анкете
      security: [{ bearerAuth: [] }]
      parameters: [{ name: vendorId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject, verify] }
                reason: { type: string }
      responses:
        '200': { description: OK }
  /admin/complaints:
    get:
      tags: [admin]
      summary: Очередь жалоб
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Complaint' } }
                  nextCursor: { type: string, nullable: true }
  /admin/complaints/{complaintId}:
    post:
      tags: [admin]
      summary: Решение по жалобе
      description: 'Санкции по возрастанию: предупреждение → понижение в выдаче → блокировка (План §18.2).'
      security: [{ bearerAuth: [] }]
      parameters: [{ name: complaintId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [dismiss, warn, downrank, block] }
                note: { type: string }
      responses:
        '200': { description: OK }
  /admin/categories:
    put:
      tags: [admin]
      summary: Категории и словарь синонимов
      description: '«тамада» = «ведущий», «сладкий стол» = «кондитер» (План §19.2).'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
                synonyms: { type: object }
      responses:
        '200': { description: OK }
  /admin/metrics:
    get:
      tags: [admin]
      summary: Дашборд платформы
      description: 'Регистрации, заполненность анкет, сделки, стоимость LLM, готовность города к запуску (≥50 анкет).'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
  /admin/weddings/{weddingId}:
    get:
      tags: [admin]
      summary: Просмотр проекта поддержкой
      description: |
        Только чтение и только по обращению пары. Каждый просмотр пишется в
        AuditLog: кто и зачем смотрел (План §19.10 п. 5).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: reason, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wedding' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GuestTokenQuery:
      name: guestToken
      in: query
      required: true
      description: |
        Персональный токен гостя. Нужен там, где гость обращается к пути
        со свадьбой в адресе: подставить его в путь некуда, а без него
        сервер не отличит гостя от постороннего.
      schema: { type: string }
    GuestToken:
      name: guestToken
      in: path
      required: true
      description: |
        Персональный токен гостя из его ссылки-приглашения. Решение владельца
        2026-09-02: гость опознаётся ОДНИМ токеном во всех гостевых путях.
        Общий код свадьбы не годится — по нему нельзя ни подставить имя в
        приглашение (план §8.6), ни дать гостю снять СВОЙ резерв подарка.
        Анонимность подарков при этом сохраняется: система знает гостя, а API
        пары этот токен не отдаёт никогда (§9).
      schema: { type: string }
    WeddingId:
      name: weddingId
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Конфликт (уже существует)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Слишком часто — см. Retry-After
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    QuotaExceeded:
      description: |
        Предел исчерпан насовсем: столько от одного гостя мы не принимаем.
        В отличие от TooManyRequests заголовка Retry-After НЕТ — повтор
        не поможет ни через минуту, ни через сутки. Клиенту нужно показать
        отказ, а не таймер.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 900, description: 'срок жизни accessToken, секунды. 15 минут по плану §1' }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: string, nullable: true }
    City:
      type: object
      properties:
        id: { type: integer, example: 42 }
        name: { type: string, example: Сибай }
        region: { type: string, example: Башкортостан }
        district: { type: string, nullable: true, example: Баймакский район }
        lat: { type: number }
        lon: { type: number }
        population: { type: integer, nullable: true }
        big: { type: boolean, description: 'крупный город — блок «Популярные» в CityPicker' }
    CityRef:
      type: object
      required: [name, region]
      properties:
        name: { type: string }
        region: { type: string }
    Wedding:
      type: object
      properties:
        id: { type: string }
        title: { type: string, example: 'Алина ♥ Тимур' }
        date: { type: string, format: date }
        city: { $ref: '#/components/schemas/CityRef' }
        budgetTotal: { $ref: '#/components/schemas/Money' }
        guestsPlanned: { type: integer }
        style: { type: string }
        tz: { type: string, example: Asia/Yekaterinburg, description: 'таймзона места свадьбы. По ней открывается чат дня X и считаются напоминания — не по таймзоне пользователя' }
        inviteText: { type: string }
        inviteThemeId: { type: integer }
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }
    WeddingPublic:
      type: object
      description: Публичная часть свадьбы для гостей (без бюджета)
      properties:
        title: { type: string }
        date: { type: string, format: date }
        city: { $ref: '#/components/schemas/CityRef' }
        inviteText: { type: string }
        inviteThemeId: { type: integer }
        venue: { type: string, nullable: true }
    Member:
      type: object
      description: >
        Член свадьбы — тот, у кого есть аккаунт и доступ в приложение.
        Гость (guest) и свой подрядчик (guest-vendor) членами НЕ являются:
        они опознаются токеном по ссылке, аккаунта не имеют и в members не попадают.
        Матрица доступа (§4 плана) описывает все шесть ролей, эта схема — только четыре с аккаунтом.
      properties:
        user: { $ref: '#/components/schemas/User' }
        role: { type: string, enum: [couple, helper, coordinator, vendor] }
        joinedAt: { type: string, format: date-time }
    InviteLink:
      type: object
      properties:
        code: { type: string, example: ДРУГ-7F3K }
        url: { type: string, example: 'https://tili-tili.ru/join/ДРУГ-7F3K' }
        role: { type: string, enum: [couple, helper, coordinator, vendor] }
        label: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
        used: { type: boolean }
    Category:
      type: object
      description: >
        Справочник категорий подрядчиков. Список фиксированный — 35 записей,
        сид-данные лежат в миграции seed_categories и совпадают с CATEGORIES
        во фронте (Тили-тили/app/src/lib/data.ts). Enum здесь не ставится
        намеренно: добавление категории не должно требовать выката новой версии
        контракта. Изменять список может только админ через POST /admin/categories.
      properties:
        id: { type: string, example: photo }
        title: { type: string, example: Фотограф }
        icon: { type: string }
    Vendor:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        categoryId: { type: string }
        city: { type: string }
        priceFrom:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
        rating: { type: number, nullable: true, example: 4.9 }
        reviewsCount: { type: integer }
        photoUrl: { type: string, nullable: true }
        verified:
          type: boolean
          description: |
            Документы сверены. Сами документы не публикуются НИКОГДА —
            наружу выходит только этот признак (план §6).
        hasVideo: { type: boolean }
    VendorPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Vendor' }
        nextCursor: { type: string, nullable: true }
    VendorDetail:
      allOf:
        - $ref: '#/components/schemas/Vendor'
        - type: object
          properties:
            about: { type: string }
            gallery:
              type: array
              description: Ссылки на фотографии — совместимость с прежней формой ответа.
              items: { type: string }
            media:
              type: array
              items:
                type: object
                properties:
                  kind: { type: string, enum: [photo, video] }
                  url: { type: string }
                  durationS: { type: integer, nullable: true }
            packages:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  price: { $ref: '#/components/schemas/Money' }
                  includes: { type: array, items: { type: string } }
            reviews:
              type: array
              items: { $ref: '#/components/schemas/Review' }
    VendorUpsert:
      type: object
      required: [name, categoryId, city]
      properties:
        name: { type: string }
        categoryId: { type: string }
        city: { $ref: '#/components/schemas/CityRef' }
        about: { type: string }
        priceFrom: { $ref: '#/components/schemas/Money' }
        packages:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              price: { $ref: '#/components/schemas/Money' }
              includes: { type: array, items: { type: string } }
        portfolioUrls:
          type: array
          description: 'Фотографии портфолио. Для видео нужен `media` — там есть длительность.'
          items: { type: string }
        media:
          type: array
          description: |
            Портфолио с типом файла. У видео длительность обязательна: ограничение
            180 с проверяется на сервере, а из голой ссылки его не узнать.
          items:
            type: object
            required: [kind, url]
            properties:
              kind: { type: string, enum: [photo, video] }
              url: { type: string }
              durationS: { type: integer, minimum: 1, maximum: 180, nullable: true }
    Slot:
      type: object
      description: |
        Место в команде свадьбы. Слот либо пуст, либо несёт сделку — собственного
        статуса у него нет. tileState — производная подпись для мозаики команды,
        только для чтения: клиент не должен вычислять её сам, чтобы экраны не
        разошлись между собой.
      properties:
        id: { type: string, example: s4 }
        categoryId: { type: string }
        deal:
          allOf: [{ $ref: '#/components/schemas/Deal' }]
          nullable: true
          description: null = слот пуст
        tileState:
          type: string
          readOnly: true
          description: производное от deal.state для плитки в мозаике
          enum: [empty, candidate, hold, booked, paid]
    Budget:
      type: object
      properties:
        total: { $ref: '#/components/schemas/Money' }  # example: 1500000
        spent: { $ref: '#/components/schemas/Money' }  # example: 560000
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              planned: { $ref: '#/components/schemas/Money' }
              fromSlots: { type: integer, description: 'автосумма из броней' }
              items:
                type: array
                items: { $ref: '#/components/schemas/BudgetItem' }
    BudgetItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        categoryId: { type: string }
        custom: { type: boolean, description: 'true = своя статья (удаляемая)' }
    Guest:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        plusOne: { type: boolean }
        group: { type: string, nullable: true }
        status: { type: string, enum: [yes, no, pending] }
        tableId: { type: string, nullable: true }
        diet: { type: string, nullable: true, enum: [null, vegetarian, vegan, halal, kosher, gluten_free, other], description: 'RSVP+ — ограничения по еде' }
        dietNote: { type: string, nullable: true, description: 'аллергии словами, когда enum не хватает' }
        menuOptionId: { type: string, nullable: true, description: 'выбор в опросе меню' }
        transfer: { type: string, nullable: true, enum: [null, need, own], description: 'нужен ли трансфер' }
        busId: { type: string, nullable: true, description: 'посажен в этот автобус' }
        hotelId: { type: string, nullable: true }
        inviteUrl: { type: string, nullable: true, description: 'ОДНОРАЗОВАЯ ссылка-приглашение для этого гостя. Пара её пересылает; при первом открытии код обменивается на персональный guestToken и гаснет. Сырой guestToken паре не отдаётся НИКОГДА — иначе пара может открыть гостевую страницу и увидеть его резерв подарка, что ломает анонимность (§9 бизнес-логики)' }
        inviteUrlUsed: { type: boolean, readOnly: true, description: 'true — гость уже открыл ссылку. Чтобы выдать новую, нужен POST …/invite-link' }
    Table:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        capacity: { type: integer, default: 8 }
        guestIds: { type: array, items: { type: string } }
    Task:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        period: { type: string }
        done: { type: boolean }
        custom: { type: boolean }
    Chat:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        avatarUrl: { type: string, nullable: true }
        lastMessage: { type: string }
        unread: { type: integer }
        kind: { type: string, enum: [vendor, team, day, tilly] }
        openFrom: { type: string, format: date-time, nullable: true, description: 'у kind=day — 09:00 по Wedding.tz в день свадьбы; до этого чат не создан' }
    Message:
      type: object
      properties:
        id: { type: string }
        chatId: { type: string }
        senderId: { type: string }
        text: { type: string }
        attachmentUrl: { type: string, nullable: true }
        sentAt: { type: string, format: date-time }
    Lead:
      type: object
      properties:
        id: { type: string }
        coupleName: { type: string }
        weddingDate: { type: string, format: date }
        city: { type: string }
        message: { type: string }
        status: { type: string, enum: [new, replied, hold, declined, won] }
        holdUntil: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    Review:
      type: object
      properties:
        id: { type: string }
        authorName: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        reply:
          type: object
          nullable: true
          properties:
            text: { type: string }
            createdAt: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        kind: { type: string, enum: [deal, chat, task, guest, system] }
        link: { type: string, nullable: true, example: /deal }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    Money:
      type: object
      description: |
        Денежная сумма. Решение владельца 2026-09-02: минорные единицы плюс код
        валюты у КАЖДОЙ суммы, а не одна валюта на свадьбу — план §19.7 описывает
        свадьбу за границей, где сделка в евро, а бюджет в рублях.
        В MVP принимается только RUB; enum расширяется вместе с поддержкой курсов.
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: |
            Сумма в копейках. 85 000 ₽ = 8500000. Дробных значений не бывает.
            Потолок — предел точного целого в JSON: за ним число молча
            округляется, и «потрачено» перестаёт сходиться с суммой сделок.
          example: 8500000
        currency:
          type: string
          description: Код валюты по ISO 4217.
          enum: [RUB]
          example: RUB
    Deal:
      type: object
      description: |
        Договорённость пары с конкретным исполнителем на конкретный слот.
        Носитель состояния: у слота собственного статуса нет (решение владельца
        2026-09-02) — раньше слот, сделка и фронтенд описывали одно понятие тремя
        разными наборами значений.
      properties:
        id: { type: string }
        state: { $ref: '#/components/schemas/DealState' }
        vendor:
          allOf: [{ $ref: '#/components/schemas/Vendor' }]
          nullable: true
          description: null у своего подрядчика не из каталога (§11)
        externalName: { type: string, nullable: true, description: имя своего подрядчика }
        externalPhone: { type: string, nullable: true }
        price: { $ref: '#/components/schemas/Money' }
        negotiatingUntil:
          type: string
          format: date-time
          nullable: true
          description: 'срок мягкой брони: 72 ч на этапе negotiating (§18.3)'
        bookedAt: { type: string, format: date-time, nullable: true }
        doneAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
    DealState:
      type: string
      description: |
        Шесть состояний сделки (План §8.1, решение владельца 2026-09-02).
        Мягкая бронь на 72 часа — не отдельное состояние, а срок жизни `negotiating` (§18.3).
      enum: [candidate, contacted, negotiating, booked, paid_deposit, done, cancelled]
    Gift:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        icon:
          type: string
          maxLength: 16
          nullable: true
          description: |
            Значок подарка (§9). Плитка (`tile` в моках) сюда не входит: это
            цвет из палитры, он считается на клиенте по месту в списке —
            дизайн-токен, а не данные.
        desc: { type: string, nullable: true }
        price: { $ref: '#/components/schemas/Money' }
        group: { type: boolean, description: можно скидываться }
        funded: { $ref: '#/components/schemas/Money' }
        reserved: { type: boolean, description: 'кем именно — паре не отдаётся никогда' }
        mine:
          type: boolean
          readOnly: true
          description: |
            Резерв поставлен ЭТИМ гостем. Только в гостевом ответе; паре поле
            не отдаётся вовсе — иначе «занято мной» на её экране и означало бы
            того самого гостя, которого §9 обещает не показывать.
    Fund:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: string, maxLength: 16, nullable: true }
        target: { $ref: '#/components/schemas/Money' }
        collected: { $ref: '#/components/schemas/Money' }
    BusRoute:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Автобус №1 }
        from: { type: string, example: 'Уфа, ост. «Гостиный двор»' }
        time: { type: string, example: '14:30' }
        seats: { type: integer }
        taken: { type: integer, description: 'инкрементируется атомарно, переполнение запрещено' }
    HotelBlock:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        rooms: { type: integer }
        booked: { type: integer }
        price: { $ref: '#/components/schemas/Money' }
        deadline: { type: string, format: date }
        promo: { type: string }
    MenuPoll:
      type: object
      properties:
        question: { type: string }
        sent: { type: boolean }
        expectedPortions:
          type: integer
          readOnly: true
          description: |
            На сколько ПЕРСОН готовить. Считается по подтвердившим гостям:
            запись с «+1» — двое. Кейтерингу нужны порции, а не строки
            списка, и считать их на клиенте значит получить два разных
            ответа на разных экранах.
        options:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              icon: { type: string }
              votes: { type: integer }

    UserProfile:
      type: object
      properties:
        id: { type: string, readOnly: true }
        name: { type: string }
        phone: { type: string, readOnly: true }
        email: { type: string, nullable: true }
        lang: { type: string, enum: [ru, en] }
        tz: { type: string, example: Asia/Yekaterinburg, description: 'нужна для открытия чата дня X в 09:00 по местному' }
        push:
          type: object
          description: четыре независимых канала — тумблеры в настройках
          properties:
            tasks: { type: boolean }
            chats: { type: boolean }
            deals: { type: boolean }
            tips: { type: boolean }
        quietHours:
          type: object
          description: 'по умолчанию 22:00–09:00; в день X отключаются автоматически'
          properties:
            from: { type: string, example: '22:00' }
            to: { type: string, example: '09:00' }
    Session:
      type: object
      properties:
        id: { type: string }
        device: { type: string, example: 'iPhone · Safari' }
        current: { type: boolean }
        createdAt: { type: string, format: date-time }
    Document:
      type: object
      properties:
        id: { type: string }
        dealId: { type: string }
        templateCode: { type: string }
        version: { type: integer }
        status: { type: string, enum: [draft, sent, signed] }
        pdfUrl:
          type: string
          nullable: true
          description: |
            Появляется после подключения объектного хранилища. До тех пор
            договор существует как запись с полями и версией, но файла нет:
            выдать ссылку в никуда хуже, чем честно вернуть null.
        docxUrl: { type: string, nullable: true }
        fields:
          type: object
          additionalProperties: true
          description: 'Подставленные значения: стороны, дата, сумма, город.'
        createdAt: { type: string, format: date-time }
    TimelineEvent:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Выездная церемония }
        location: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        who: { type: string, description: кто отвечает }
        outdoor: { type: boolean, description: 'блок под открытым небом — к нему привязывается план Б' }
    AlbumPhoto:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        approved: { type: boolean }
        createdAt: { type: string, format: date-time }
    Complaint:
      type: object
      properties:
        id: { type: string }
        targetKind: { type: string, enum: [vendor, review, message, deal] }
        targetId: { type: string }
        category: { type: string, enum: [fraud, content, no_show, spam] }
        text: { type: string }
        status: { type: string, enum: [new, resolved] }
        createdAt: { type: string, format: date-time }

security:
  - bearerAuth: []
