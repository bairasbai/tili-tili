                type: string
                format: uuid
              title:
                type: string
              status:
                $ref: '#/components/schemas/PaymentInstallmentStatus'
              remaining:
                $ref: '#/components/schemas/Money'
              unknownAmountPayments:
                type: integer
                minimum: 0
    PaymentHistoryExport:
