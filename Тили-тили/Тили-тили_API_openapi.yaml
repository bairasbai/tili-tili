                    format: date
                    nullable: true
                  tz:
                    type: string
                    example: Europe/Moscow
                  venue:
                    type: string
                    nullable: true
                  dressCode:
                    type: string
                    nullable: true
                  dressNote:
                    type: string
                    nullable: true
                  timeline:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimelineEvent'
                  table:
                    type: object
                    nullable: true
                    properties:
                      name:
                        type: string
                  bus:
                    allOf:
