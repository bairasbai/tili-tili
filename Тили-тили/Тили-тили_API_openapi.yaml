components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GuestTokenQuery:
      name: guestToken
      in: query
      required: true
      description: |
        Персональный токен гостя. Нужен там, где гость обращается к пути
        со свадьбой в адресе: подставить его в путь некуда, а без него
        сервер не отличит гостя от постороннего.

        Мёртвая ссылка гостя — токен неизвестен, свадьба отменена или в
        архиве. Пути дня X — `GET /join/{guestToken}/day`,
        `GET /join/{guestToken}/day-chat/messages` и
        `POST /join/{guestToken}/day-chat/messages` — отвечают 410 `gone`:
        ссылка отозвана, попросите пару прислать новую. Остальные гостевые
        операции отвечают 401 `unauthorized`: `GET` и `POST /rsvp/{guestToken}`,
        `GET /gifts/{guestToken}`, `POST` и `DELETE /gifts/{guestToken}/{giftId}/reserve`,
        `POST /gifts/{guestToken}/{giftId}/fund`, `POST /gifts/{guestToken}/funds/{fundId}`,
        `GET` и `POST /join/{guestToken}/shuttle`, `GET` и `POST /join/{guestToken}/hotels`,
        `GET` и `POST /join/{guestToken}/menu-vote`, `GET /join/{guestToken}/team`,
        `GET` и `POST /weddings/{weddingId}/album?guestToken=…`,
        `POST /weddings/{weddingId}/guest-reviews?guestToken=…`. По коду ответа
        не видно, существовал ли токен. Токен чужой свадьбы в `?guestToken=` — 404.
      schema:
        type: string
    GuestToken:
      name: guestToken
      in: path
      required: true
      description: |
        Персональный токен гостя из его ссылки-приглашения. Решение владельца
        2026-09-02: гость опознаётся ОДНИМ токеном во всех гостевых путях.
        Общий код свадьбы не годится — по нему нельзя ни подставить имя в
        приглашение (план §8.6), ни дать гостю снять СВОЙ резерв подарка.
        Анонимность подарков при этом сохраняется: система знает гостя, а API
        пары этот токен не отдаёт никогда (§9).

        Мёртвая ссылка гостя — токен неизвестен, свадьба отменена или в
        архиве. Пути дня X — `GET /join/{guestToken}/day`,
        `GET /join/{guestToken}/day-chat/messages` и
        `POST /join/{guestToken}/day-chat/messages` — отвечают 410 `gone`:
        ссылка отозвана, попросите пару прислать новую. Остальные гостевые
        операции отвечают 401 `unauthorized`: `GET` и `POST /rsvp/{guestToken}`,
        `GET /gifts/{guestToken}`, `POST` и `DELETE /gifts/{guestToken}/{giftId}/reserve`,
        `POST /gifts/{guestToken}/{giftId}/fund`, `POST /gifts/{guestToken}/funds/{fundId}`,
        `GET` и `POST /join/{guestToken}/shuttle`, `GET` и `POST /join/{guestToken}/hotels`,
        `GET` и `POST /join/{guestToken}/menu-vote`, `GET /join/{guestToken}/team`,
        `GET` и `POST /weddings/{weddingId}/album?guestToken=…`,
        `POST /weddings/{weddingId}/guest-reviews?guestToken=…`. По коду ответа
        не видно, существовал ли токен. Токен чужой свадьбы в `?guestToken=` — 404.
      schema:
        type: string
    WeddingId:
      name: weddingId
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  responses:
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        Доступ закрыт роли или стороне. Это нормальный ответ, а не поломка:
        помощник не видит денег, посторонний — чужой сделки (план §6).
        Тот же статус — у отказа по согласию на обработку данных: `forbidden`,
        если живого согласия нет вовсе, и `consent_outdated`, если согласие
        дано под прежней редакцией политики — нужно подтвердить действующую
        (`POST /users/me/consent`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Конфликт (уже существует)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Validation:
      description: |
        Запрос не прошёл проверку (`validation_failed`). Так отвечает сервер
        на любое нарушение схемы и на правила, которых схемой не выразить:
        снятие анкеты с публикации без причины, санкция, неприменимая к цели
        жалобы, синоним на несуществующую категорию. В описании операции
        сказано, какое поле сервер называет виноватым.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: |
        Запрос не годится ещё до проверки схемы или бизнес-правил. Возможные
        коды (в описании операции — какой из них применим): `bad_limit`
        (параметр `limit` — не целое число от 1 до 100), `bad_cursor` (курсор
        листания испорчен, не того типа сортировки или обрезан), `idempotency_key_required`
        (обязательный заголовок `Idempotency-Key` не передан) и
        `idempotency_key_too_long` (заголовок длиннее 200 символов).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Слишком часто — см. Retry-After
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Locked:
      description: |
        Доступ не запрещён — он ещё не наступил. Так отвечает чат дня X
        до `openFrom`: 403 сказало бы «вам нельзя», а человеку нужно
        «откроется накануне в 09:00».
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QuotaExceeded:
      description: |
        Предел исчерпан насовсем: столько от одного гостя мы не принимаем.
        В отличие от TooManyRequests заголовка Retry-After НЕТ — повтор
        не поможет ни через минуту, ни через сутки. Клиенту нужно показать
        отказ, а не таймер.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotConfigured:
      description: |
        Путь согласован, обработчик есть, но внешняя служба не подключена
        (OAuth-приложения, VAPID-ключи, объектное хранилище). Код ошибки
        называет, чего именно нет: `oauth_not_configured`,
        `push_not_configured`, `storage_not_configured`. Это хвост владельца,
        а не недоделка сервера — 501 с общим `not_implemented` здесь не бывает.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    TimelineAcknowledgments:
      type: object
      additionalProperties: false
      required:
        - sourceVersion
        - updatedAt
        - items
      properties:
        sourceVersion:
          type: string
        updatedAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimelineAcknowledgmentStatus'
    TimelineAcknowledgmentStatus:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - name
        - blockCount
        - status
        - acknowledgedAt
        - acknowledgedBy
        - previousAcknowledgment
      properties:
        kind:
          type: string
          enum:
            - registered
            - external
        id:
          type: string
          format: uuid
          description: ID анкеты для registered, ID реальной сделки для external
        name:
          type: string
          nullable: true
        blockCount:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
            - pending
            - acknowledged
            - unassigned
            - unavailable
            - not_supported
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
        acknowledgedBy:
          type: string
          nullable: true
          description: >-
            Текущее имя реального автора для registered; для external всегда null, личность владельца ссылки не
            проверена
        previousAcknowledgment:
          type: object
          nullable: true
          additionalProperties: false
          required:
            - sourceVersion
            - acknowledgedAt
            - acknowledgedBy
          properties:
            sourceVersion:
              type: string
            acknowledgedAt:
              type: string
              format: date-time
            acknowledgedBy:
              type: string
              nullable: true
    VendorProgramSummary:
      type: object
      additionalProperties: false
      required:
        - weddingId
        - wedding
        - sourceVersion
        - updatedAt
        - blockCount
        - acknowledgedAt
        - requiresAcknowledgment
      properties:
        weddingId:
          type: string
          format: uuid
        wedding:
          type: string
        sourceVersion:
          type: string
          pattern: ^[0-9]+$
        updatedAt:
          type: string
          format: date-time
          nullable: true
        blockCount:
          type: integer
          minimum: 0
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
        requiresAcknowledgment:
          type: boolean
    VendorProgramBlock:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - location
        - startsAt
        - endsAt
        - durationMinutes
        - fixed
        - travelMinutes
        - bufferMinutes
        - outdoor
        - roles
        - dependsOn
        - event
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
          description: Сохранённое окончание или точная явная длительность; неизвестное null
        durationMinutes:
          type: number
          nullable: true
        fixed:
          type: boolean
        travelMinutes:
          type: number
          minimum: 0
        bufferMinutes:
          type: number
          minimum: 0
        outdoor:
          type: boolean
        roles:
          type: array
          items:
            type: string
            enum:
              - responsible
              - participant
        dependsOn:
          type: array
          items:
            type: string
            format: uuid
          description: Только ID других разрешённых блоков этого снимка
        event:
          type: object
          additionalProperties: false
          required:
            - id
            - name
            - date
            - timeZone
            - location
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            date:
              type: string
              format: date
              nullable: true
            timeZone:
              type: string
              nullable: true
            location:
              type: string
              nullable: true
    VendorProgramSnapshot:
      type: object
      additionalProperties: false
      required:
        - weddingId
        - wedding
        - sourceVersion
        - updatedAt
        - blocks
        - acknowledgedAt
        - requiresAcknowledgment
        - readToken
        - expiresAt
      properties:
        weddingId:
          type: string
          format: uuid
        wedding:
          type: string
        sourceVersion:
          type: string
          pattern: ^[0-9]+$
        updatedAt:
          type: string
          format: date-time
          nullable: true
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/VendorProgramBlock'
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
        requiresAcknowledgment:
          type: boolean
        readToken:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
    VendorProgramAck:
      type: object
      additionalProperties: false
      required:
        - sourceVersion
        - acknowledgedAt
      properties:
        sourceVersion:
          type: string
          pattern: ^[0-9]+$
        acknowledgedAt:
          type: string
          format: date-time
    Readiness:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - not_ready
        db:
          type: string
          enum:
            - up
            - down
        redis:
          type: string
          enum:
            - up
            - down
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
              description: |
                Только у 422: какие именно поля не прошли проверку.
                Ключ — имя поля (`reason`, `action`, `synonyms.тамада`),
                значение — что с ним не так. Человеку показывается `message`,
                поля подсвечивает форма.
            details:
              type: object
              additionalProperties: true
              description: |
                Машинные подробности отказа там, где экрану нужно больше кода:
                у 409 `wedding_exists` — `weddingId` живой свадьбы пары (фича 005).
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 900
          description: срок жизни accessToken, секунды. 15 минут по плану §1
        user:
          $ref: '#/components/schemas/User'
        consentRequired:
          type: boolean
          description: |
            Только у `POST /auth/otp/verify`: нет живого согласия под
            действующей редакцией политики — новый аккаунт, восстановленный
            после отзыва, или согласие дано под прежней редакцией (фича 005).
            До `POST /users/me/consent` остальные пути отвечают: без согласия
            вовсе — 403 `forbidden`; под прежней редакцией — 403
            `consent_outdated`.
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
          description: null, пока человек не назвал себя
        phone:
          type: string
          readOnly: true
          description: E.164 — тот, что подтверждён кодом
        email:
          type: string
          format: email
        avatarUrl:
          type: string
          nullable: true
    City:
      type: object
      properties:
        id:
          type: integer
          example: 42
        name:
          type: string
          example: Сибай
        region:
          type: string
          example: Башкортостан
        district:
          type: string
          nullable: true
          example: Баймакский район
        lat:
          type: number
        lon:
          type: number
        population:
          type: integer
          nullable: true
        big:
          type: boolean
          description: крупный город — блок «Популярные» в CityPicker
    CityRef:
      type: object
      required:
        - name
        - region
      properties:
        name:
          type: string
        region:
          type: string
    WeddingFormat:
      type: string
      enum:
        - classic
        - outdoor
        - intimate
        - two_day
      description: |
        Формат свадьбы из квиза (фича 018). Код, а не подпись варианта: подпись
        переводится на экране, и «Классика» на другом языке стала бы другим
        ответом.
        - `classic` — «Классика: ЗАГС + банкет»: 12 слотов шаблона; в тайминге
          «Регистрация в ЗАГСе» 14:00–15:00 вместо «Выездной церемонии» 16:00–17:00.
        - `outdoor` — «Выездная церемония»: плюс слоты «Площадка выездной
          церемонии» (`ceremony`) и «Церемониймейстер» (`registrar`); тайминг
          шаблона.
        - `intimate` — «Камерная свадьба»: 12 слотов; «Ужин» 18:00–22:00 вместо
          «Банкета», без «Салюта и финала».
        - `two_day` — «Банкет+ на 2 дня»: плюс слот «Отель для гостей» (`hotel`);
          тайминг выездной и два блока на следующее число — «День 2: бранч»
          12:00–14:00 и «День 2: продолжение праздника» 14:00–20:00. Перенос даты
          двигает их вместе с первым днём.
    WeddingPlanner:
      type: string
      enum:
        - self
        - agency
        - coordinator
      description: >-
        Кто планирует (фича 018): `agency` — плюс слот «Организатор» (`agency`), `coordinator` — плюс «Координатор дня»
        (`coordinator`), `self` — ничего.
    PrebookedCategory:
      type: string
      enum:
        - venue
        - photo
        - video
        - host
      description: >-
        Категория слота шаблона, подрядчик которой уже найден вне приложения (фича 018): площадка, фотограф, видеограф,
        ведущий.
    Wedding:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          example: Алина ♥ Тимур
        date:
          type: string
          format: date
        city:
          $ref: '#/components/schemas/CityRef'
        budgetTotal:
          $ref: '#/components/schemas/Money'
        guestsPlanned:
          type: integer
        style:
          type: string
        format:
          allOf:
            - $ref: '#/components/schemas/WeddingFormat'
          nullable: true
          description: 'формат из квиза (фича 018); null — не указан: вопрос пропущен или свадьба заведена раньше'
        planner:
          allOf:
            - $ref: '#/components/schemas/WeddingPlanner'
          nullable: true
          description: кто планирует (фича 018); null — не указано
        tz:
          type: string
          example: Asia/Yekaterinburg
          description: таймзона места свадьбы. По ней открывается чат дня X и считаются напоминания — не по таймзоне пользователя
        inviteText:
          type: string
        inviteThemeId:
          type: integer
        dressCode:
          type: string
          nullable: true
          description: палитра дресс-кода — её же видит гость
        dressNote:
          type: string
          nullable: true
        cancelRequestedBy:
          type: string
          nullable: true
          description: >
            Кто из пары запросил отмену свадьбы и ждёт подтверждения второго. Видно только паре. Нужно, чтобы второй
            партнёр понимал: его нажатие «Отменить» не запросит отмену, а ИСПОЛНИТ её — брони отменятся, даты уйдут
            подрядчикам. Без этого поля показать предупреждение нечем. Пусто — запроса нет или он протух (срок 72 часа).
        cancelRequestedAt:
          type: string
          format: date-time
          nullable: true
          description: Когда запрошена отмена. Запрос живёт 72 часа, дальше требуется новый.
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    WeddingPublic:
      type: object
      description: Публичная часть свадьбы для гостей (без бюджета)
      properties:
        title:
          type: string
        date:
          type: string
          format: date
        city:
          $ref: '#/components/schemas/CityRef'
        inviteText:
          type: string
        inviteThemeId:
          type: integer
        venue:
          type: string
          nullable: true
        dressCode:
          type: string
          nullable: true
          description: идентификатор палитры — гость видит её в приглашении
        dressNote:
          type: string
          nullable: true
        tz:
          type: string
          example: Europe/Moscow
          description: |
            Часовой пояс места свадьбы. Гость считает «свадьба уже прошла»
            (окно отзыва) по нему, а не по поясу своего телефона (D3-18).
    CancelResult:
      type: object
      description: |
        Чем кончился вызов отмены. Отмена свадьбы — решение обоих партнёров,
        поэтому первый вызов только просит подтверждения, и ответ обязан
        различать эти два случая: экран показывает разное.
      properties:
        state:
          type: string
          enum:
            - confirmation_required
            - cancelled
          description: '`confirmation_required` — ждём второго партнёра; `cancelled` — свадьба отменена'
        requestedBy:
          type: string
          description: кто попросил отмену — есть при `confirmation_required`
        cancelledDeals:
          type: integer
          description: сколько сделок отменено — есть при `cancelled`; `done` в это число не входят
    Member:
      type: object
      description: >
        Член свадьбы — тот, у кого есть аккаунт и доступ в приложение. Гость (guest) и свой подрядчик (guest-vendor)
        членами НЕ являются: они опознаются токеном по ссылке, аккаунта не имеют и в members не попадают. Матрица
        доступа (§4 плана) описывает все шесть ролей, эта схема — только четыре с аккаунтом.
      properties:
        user:
          $ref: '#/components/schemas/User'
        role:
          type: string
          enum:
            - couple
            - helper
            - coordinator
            - vendor
        joinedAt:
          type: string
          format: date-time
    InviteLink:
      type: object
      properties:
        code:
          type: string
          example: ДРУГ-7F3K
        url:
          type: string
          example: https://tili-tili.ru/join/ДРУГ-7F3K
        role:
          type: string
          enum:
            - couple
            - helper
            - coordinator
            - vendor
        label:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
        used:
          type: boolean
    Category:
      type: object
      description: >
        Справочник категорий подрядчиков. Список фиксированный — 35 записей, сид-данные лежат в миграции
        seed_categories; фронт берёт его только отсюда (моков `lib/data.ts` нет с 2026-09-06). Enum здесь не ставится
        намеренно: добавление категории не должно требовать выката новой версии контракта. Изменять список может только
        админ через PUT /admin/categories.
      properties:
        id:
          type: string
          example: photo
        title:
          type: string
          example: Фотограф
        icon:
          type: string
        vendorsCount:
          type: integer
          description: 'опубликованных анкет: в городе `city`, если он передан, иначе по всей базе'
        description:
          type: string
          nullable: true
          description: 'одна строка: что делает подрядчик и что у него спросить (миграция 39, план бэкенда §8.5)'
    Vendor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        categoryId:
          type: string
        city:
          type: string
        priceFrom:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        rating:
          type: number
          nullable: true
          example: 4.9
        reviewsCount:
          type: integer
        photoUrl:
          type: string
          nullable: true
        verified:
          type: boolean
          description: |
            Документы сверены. Сами документы не публикуются НИКОГДА —
            наружу выходит только этот признак (план §6).
        hasVideo:
          type: boolean
        bookingMode:
          type: string
          enum:
            - legacy_day
            - resources
          description: Способ бронирования компании. Доступность конкретных ресурсов и времени этим полем не подтверждается.
        distanceKm:
          type: integer
          nullable: true
          description: |
            Расстояние от города поиска (`city`) до города анкеты в
            километрах, округлённое (фича 011): 0 — тот же город; null — запрос
            без `city`, у одного из городов нет координат или это анкета вне
            выдачи (`GET /catalog/vendors/{vendorId}`). Считается между
            центрами городов справочника, не до площадки — адресов у анкет нет.
    VendorPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Vendor'
        nextCursor:
          type: string
          nullable: true
    VendorDetail:
      allOf:
        - $ref: '#/components/schemas/Vendor'
        - type: object
          properties:
            about:
              type: string
            phone:
              type: string
              nullable: true
              description: |
                Рабочий телефон подрядчика. Отдельное поле анкеты, а не номер
                входа: публикация личного номера — раскрытие персональных
                данных, и заполняя это поле, подрядчик соглашается его показать.

                Приходит ЗАПОЛНЕННЫМ только той паре (и её команде), которая
                этого подрядчика уже забронировала — `booked`, `paid_deposit`
                или `done` (решение владельца 2026-09-03). До брони — `null`,
                и это значит «ещё рано», а не «номер не указан»: клиент
                показывает вместо него кнопку «Написать». Владелец анкеты
                видит свой номер всегда.
            cityRegion:
              type: string
              nullable: true
              description: |
                Регион города анкеты. Нужен владельцу, чтобы вернуть анкету
                обратно без потери города: `city` приходит одной строкой, а
                справочник различает одноимённые города по региону.
            published:
              type: boolean
              description: |
                Опубликована ли анкета. Приходит только владельцу (`GET /vendor/profile`):
                для чужого читателя вопрос не стоит — неопубликованную он не видит вовсе.

                Подрядчику это главный факт кабинета: пока анкета не опубликована,
                её нет в каталоге, и заявок не будет, сколько ни заполняй поля.
            moderated:
              type: boolean
              description: Прошла ли пост-модерацию. Публикация мгновенная, проверка идёт следом.
            blocked:
              type: boolean
              description: |
                Анкета заблокирована модератором по жалобе (`block`). Только
                владельцу: в каталоге её нет, публикация отвечает 409, и
                кабинет обязан сказать почему, а не показывать «не опубликована»
                с кнопкой, которая не сработает (D5-23).
            mediaRights:
              type: boolean
              description: |
                Подрядчик подтвердил права на фото и видео портфолио и согласие
                снятых на публикацию (152-ФЗ, план бэкенда §7). Только владельцу.
                Ставится один раз через `mediaRights: true` в `PUT /vendor/profile`
                и не снимается; мастер анкеты не публикует без него.
            completeness:
              type: object
              description: |
                Заполненность анкеты (План §8.2) — только владельцу. Одно правило
                на кабинет и панель (`vendor/completeness.ts`): четыре поля —
                о себе, телефон, цена «от», пакеты; фотографии не считаются до
                хранилища (№3). `missing` — чего не хватает, для подсказки.
              required:
                - pct
                - missing
              properties:
                pct:
                  type: integer
                  minimum: 0
                  maximum: 100
                missing:
                  type: array
                  items:
                    type: string
                    enum:
                      - about
                      - phone
                      - priceFrom
                      - packages
            gallery:
              type: array
              description: Ссылки на фотографии — совместимость с прежней формой ответа.
              items:
                type: string
            media:
              type: array
              items:
                type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - photo
                      - video
                  url:
                    type: string
                  durationS:
                    type: integer
                    nullable: true
            packages:
              type: array
              description: В порядке, заданном подрядчиком.
              items:
                $ref: '#/components/schemas/VendorPackage'
            reviews:
              type: array
              items:
                $ref: '#/components/schemas/Review'
    VendorPackage:
      type: object
      description: |
        Пакет услуг подрядчика в ответе. `id` постоянен: правка анкеты, не
        удаляющая пакет, его не меняет, и брони называют пакет, как до правки
        (019, FR-006).
      required:
        - id
        - name
        - price
        - includes
      properties:
        id:
          type: string
        name:
          type: string
        price:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: '`null` — цена не названа («по запросу»), а не 0 ₽ (R-281).'
        includes:
          type: array
          description: Что входит в пакет — пунктами.
          items:
            type: string
    ShortlistEntry:
      type: object
      required:
        - id
        - slotId
        - position
        - createdAt
        - available
        - occupancy
        - vendor
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Стабильный id записи шорт-листа; по нему запись удаляется.
        slotId:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
          maximum: 3
        createdAt:
          type: string
          format: date-time
        available:
          type: boolean
          nullable: true
          description: |
            `true` — живая анкета той же категории; `false` — анкета скрыта,
            заблокирована или сменила категорию; `null` — обезличенный tombstone.
        occupancy:
          type: string
          nullable: true
          enum:
            - free
            - held
            - busy
            - null
          description: |
            Занятость на дату свадьбы. `null` — дата не выбрана, анкета стёрта или компания использует план ресурсов;
            своя бронь этой свадьбы считается `free`.
        request:
          description: |
            Паре — полный запрос с действующим ответом, если он уже есть;
            помощнику и координатору — только обезличенный статус. Поля нет,
            пока пара не отправила запрос этому кандидату.
          oneOf:
            - $ref: '#/components/schemas/OfferRequest'
            - $ref: '#/components/schemas/OfferPublic'
        vendor:
          type: object
          nullable: true
          required:
            - id
            - name
            - categoryId
            - city
            - priceFrom
            - rating
            - reviewsCount
            - photoUrl
            - verified
            - hasVideo
            - packages
          additionalProperties: false
          description: |
            Публичная карточка кандидата. `null` — подрядчик стёрт: прежние id,
            имя и другие данные не возвращаются. У скрытой/заблокированной анкеты
            медиа, цены и пакеты не возвращаются.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            categoryId:
              type: string
            city:
              type: string
              nullable: true
            priceFrom:
              allOf:
                - $ref: '#/components/schemas/Money'
              nullable: true
            rating:
              type: number
              nullable: true
            reviewsCount:
              type: integer
              minimum: 0
            photoUrl:
              type: string
              nullable: true
            verified:
              type: boolean
            hasVideo:
              type: boolean
            bookingMode:
              type: string
              enum:
                - legacy_day
                - resources
              description: Способ бронирования действующей публичной компании; доступность ресурсов не подтверждает.
            packages:
              type: array
              items:
                $ref: '#/components/schemas/VendorPackage'
    PositiveMoney:
      type: object
      description: Положительная сумма в копейках; в 019 принимается только RUB.
      required:
        - amount
        - currency
      additionalProperties: false
      properties:
        amount:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        currency:
          type: string
          enum:
            - RUB
    Offer:
      description: |
        Точная публичная форма одной версии ответа: оба варианта имеют ровно
        девять полей. У `decline` поля предложения равны только `null`, а
        `includes` строго пуст; у `offer` название, положительная цена и срок
        не могут быть `null`.
      oneOf:
        - type: object
          title: Предложение
          required:
            - id
            - requestId
            - kind
            - packageId
            - title
            - price
            - includes
            - message
            - validUntil
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            requestId:
              type: string
              format: uuid
            kind:
              type: string
              enum:
                - offer
            packageId:
              type: string
              format: uuid
              nullable: true
            title:
              type: string
              minLength: 1
              maxLength: 200
            price:
              $ref: '#/components/schemas/PositiveMoney'
            includes:
              type: array
              maxItems: 40
              items:
                type: string
                maxLength: 200
            message:
              type: string
              maxLength: 2000
              nullable: true
            validUntil:
              type: string
              format: date
              pattern: ^\d{4}-\d{2}-\d{2}$
        - type: object
          title: Отказ
          required:
            - id
            - requestId
            - kind
            - packageId
            - title
            - price
            - includes
            - message
            - validUntil
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            requestId:
              type: string
              format: uuid
            kind:
              type: string
              enum:
                - decline
            packageId:
              type: string
              format: uuid
              nullable: true
              enum:
                - null
            title:
              type: string
              nullable: true
              enum:
                - null
            price:
              type: object
              nullable: true
              enum:
                - null
            includes:
              type: array
              minItems: 0
              maxItems: 0
              items:
                type: string
            message:
              type: string
              minLength: 1
              maxLength: 2000
            validUntil:
              type: string
              format: date
              nullable: true
              enum:
                - null
    OfferRequest:
      type: object
      description: Условия свадьбы, зафиксированные в момент отправки запроса этому подрядчику.
      required:
        - id
        - status
        - weddingDate
        - guests
        - city
        - wishes
        - createdAt
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - open
            - closed
        closeReason:
          type: string
          enum:
            - removed
            - booked_other
            - booked
            - wedding_cancelled
            - date_changed
            - vendor_erased
        weddingDate:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          nullable: true
        guests:
          type: integer
          minimum: 0
          maximum: 5000
          nullable: true
        city:
          type: string
          minLength: 1
          maxLength: 200
          nullable: true
        wishes:
          type: string
          maxLength: 2000
          nullable: true
        createdAt:
          type: string
          format: date-time
        budgetHint:
          $ref: '#/components/schemas/PositiveMoney'
        offer:
          $ref: '#/components/schemas/Offer'
    OfferPublic:
      type: object
      description: Безопасный статус для помощника и координатора без условий и ответа подрядчика.
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - pending
            - responded
    OfferInput:
      description: Пакет, своё предложение или отказ — ровно одна из трёх строгих форм.
      oneOf:
        - type: object
          title: Ответ пакетом анкеты
          required:
            - kind
            - packageId
            - price
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - offer
            packageId:
              type: string
              format: uuid
            price:
              $ref: '#/components/schemas/PositiveMoney'
            message:
              type: string
              maxLength: 2000
            validUntil:
              type: string
              format: date
              pattern: ^\d{4}-\d{2}-\d{2}$
        - type: object
          title: Собственное предложение
          required:
            - kind
            - title
            - price
            - includes
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - offer
            title:
              type: string
              minLength: 1
              maxLength: 200
            price:
              $ref: '#/components/schemas/PositiveMoney'
            includes:
              type: array
              maxItems: 40
              items:
                type: string
                maxLength: 200
            message:
              type: string
              maxLength: 2000
            validUntil:
              type: string
              format: date
              pattern: ^\d{4}-\d{2}-\d{2}$
        - type: object
          title: Отказ
          required:
            - kind
            - message
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - decline
            message:
              type: string
              minLength: 1
              maxLength: 2000
    VendorPackageInput:
      type: object
      description: |
        Пакет услуг в `PUT /vendor/profile`. С `id` — свой пакет, который
        остаётся тем же (имя, цена, состав и место в списке обновляются);
        без `id` — новый. Цены нет — поле не присылается: `null` не
        принимается, пакет хранится без цены (R-281).
      required:
        - name
      properties:
        id:
          type: string
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 120
        price:
          $ref: '#/components/schemas/Money'
        includes:
          type: array
          maxItems: 40
          items:
            type: string
            maxLength: 200
    VendorUpsert:
      type: object
      description: |
        Анкета целиком. Правило для списков (`packages`, `portfolioUrls`, `media`):
        **поля нет — список не трогаем, пустой массив — очищаем**. Пакеты
        сохраняются по `id`: присланный с `id` — тот же пакет, без `id` —
        новый, неприсланный удаляется (019, FR-006).

        Иначе экран, который списком не занимается — мастер анкеты портфолио не
        редактирует, загрузка ждёт хранилища, — стирал бы чужие работы при
        сохранении имени или телефона.
      required:
        - name
        - categoryId
        - city
      properties:
        name:
          type: string
        categoryId:
          type: string
        city:
          allOf:
            - $ref: '#/components/schemas/CityRef'
          description: |
            Регион можно не присылать, если название города в справочнике
            единственное. Иначе он обязателен: «Октябрьский» есть и в
            Башкортостане, и в Волгоградской области.

            Без этого послабления анкету нельзя было отредактировать: в ответе
            город приходит одной строкой, региона в нём нет, и любое сохранение
            падало с «городом не найден».
        about:
          type: string
        phone:
          type: string
          nullable: true
          minLength: 5
          maxLength: 32
          description: >
            Рабочий телефон для пар, которые уже забронировали. Формат свободный: люди пишут +7, 8, со скобками и без —
            навязывать один вид значит ловить отказы на живых номерах.
        priceFrom:
          $ref: '#/components/schemas/Money'
        mediaRights:
          type: boolean
          description: |
            `true` — подрядчик подтверждает права на фото и видео портфолио и
            согласие снятых людей на публикацию. Записывается моментом
            (`vendors.media_rights_at`) и не снимается; `false` и отсутствие
            поля прежнее подтверждение не трогают.
        packages:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/VendorPackageInput'
        portfolioUrls:
          type: array
          description: Фотографии портфолио. Для видео нужен `media` — там есть длительность.
          items:
            type: string
        media:
          type: array
          description: |
            Портфолио с типом файла. У видео длительность обязательна: ограничение
            180 с проверяется на сервере, а из голой ссылки его не узнать.
          items:
            type: object
            required:
              - kind
              - url
            properties:
              kind:
                type: string
                enum:
                  - photo
                  - video
              url:
                type: string
              durationS:
                type: integer
                minimum: 1
                maximum: 180
                nullable: true
    Note:
      type: object
      description: Заметка команды свадьбы (фича 014). Автор — по имени из профиля; удалённый аккаунт — null.
      required:
        - id
        - text
        - createdAt
      properties:
        id:
          type: string
        text:
          type: string
        authorName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    Slot:
      type: object
      description: |
        Место в команде свадьбы. Слот либо пуст, либо несёт сделку — собственного
        статуса у него нет. tileState — производная подпись для мозаики команды,
        только для чтения: клиент не должен вычислять её сам, чтобы экраны не
        разошлись между собой. Пустой слот может нести отметку `prebooked`
        («уже забронировано вне приложения», фича 018) — она приходит всегда.
      required:
        - prebooked
      properties:
        id:
          type: string
          example: s4
        categoryId:
          type: string
        label:
          type: string
          readOnly: true
          description: подпись плитки в мозаике («Фотограф», «Площадка») — из шаблона слотов сервера
        deal:
          allOf:
            - $ref: '#/components/schemas/Deal'
          nullable: true
          description: null = слот пуст
        tileState:
          type: string
          readOnly: true
          description: производное от deal.state для плитки в мозаике
          enum:
            - empty
            - candidate
            - hold
            - booked
            - paid
        prebooked:
          type: boolean
          readOnly: true
          description: |
            Пара ответила в квизе, что подрядчик этой категории уже найден вне
            приложения (`POST /weddings`, поле `prebooked`). Бывает только у
            слота без сделки — это держит ограничение базы: бронь из каталога и
            свой подрядчик снимают отметку той же операцией. Снять вручную —
            `DELETE …/slots/{slotId}/prebooked`. Счётчики готовности и подсказки
            Тиля (`GET …/tips`) считают такой слот забронированным, а `tileState`
            остаётся производной от сделки — `empty`.
    Budget:
      type: object
      required:
        - reserveBps
        - settingsVersion
      properties:
        paymentSummary:
          $ref: '#/components/schemas/PaymentSummary'
        total:
          $ref: '#/components/schemas/Money'
        spent:
          $ref: '#/components/schemas/Money'
        reserveBps:
          type: integer
          minimum: 0
          maximum: 5000
          description: 'Доля резерва в базисных пунктах: 1000 = 10 %. От 0 до 5000 (50 %), по умолчанию 1000.'
        settingsVersion:
          type: integer
          minimum: 0
          description: Версия настроек резерва для `PATCH …/budget/settings`; 0 — резерв ни разу не меняли.
        reserve:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |
            Резерв на непредвиденное — `reserveBps` от общего бюджета: по
            умолчанию 10 % (План ч. 283), пара меняет долю от 0 до 50 % (018-B).
            Отдельная строка, а не категория: категории делят сто процентов
            между собой, и резерв внутри них означал бы, что часть сметы
            просто уменьшили.

            Считает сервер, чтобы доля не разошлась между экранами.
        categories:
          type: array
          items:
            type: object
            required:
              - limitCustom
              - limitVersion
            properties:
              id:
                type: string
              title:
                type: string
              planned:
                allOf:
                  - $ref: '#/components/schemas/Money'
                description: 'Лимит категории: доля общего бюджета или, при `limitCustom`, сумма, заданная парой.'
              limitCustom:
                type: boolean
                description: true — лимит задан парой (`PUT …/limit`), false — автоматическая доля.
              limitVersion:
                type: integer
                minimum: 0
                description: Версия лимита для `PUT`/`PATCH …/limit`; 0 — лимит ни разу не задавали.
              fromSlots:
                type: integer
                description: автосумма из броней
              color:
                type: string
                example: '#D9A8A0'
                description: |
                  Цвет полосы категории в разбивке бюджета. Задаётся сервером,
                  а не клиентом: категории приходят из справочника, и палитра
                  должна совпадать во всех клиентах и в выгрузках.
              live:
                type: string
                nullable: true
                example: Елена Смирнова · Ильдар Хабиров
                description: |
                  Кто из забронированной команды попал в эту категорию, через
                  разделитель. Пусто — в категории пока только плановая сумма.
                  Нужно, чтобы пара видела, откуда взялась автосумма: без этого
                  «120 000 из команды» выглядит как число ниоткуда.
              items:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetItem'
    Tip:
      type: object
      description: Подсказка по правилу §3.14; `link` — куда ведёт (экран поиска категории или бюджет).
      required:
        - kind
        - title
        - body
        - link
      properties:
        kind:
          type: string
          enum:
            - deficit
            - blocking_slot
            - budget
        title:
          type: string
        body:
          type: string
        link:
          type: string
          example: /search/florist
        categoryId:
          type: string
          nullable: true
    BudgetItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        categoryId:
          type: string
        custom:
          type: boolean
          description: true = своя статья (удаляемая)
    Guest:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        partyId:
          type: string
          format: uuid
          readOnly: true
          description: одно семейное приглашение для 1–10 персон
        partyPosition:
          type: integer
          minimum: 1
          maximum: 10
          readOnly: true
        partySize:
          type: integer
          minimum: 1
          maximum: 10
          readOnly: true
          description: текущее число персон в семейном приглашении
        isPrimary:
          type: boolean
          readOnly: true
          description: только у primary показывается inviteUrl
        isPlaceholder:
          type: boolean
          readOnly: true
          description: системное имя, созданное из старого +1; пара может переименовать
        plusOne:
          type: boolean
          deprecated: true
          description: >-
            переходное поле: true у primary, если в party больше одной персоны; новые клиенты используют
            partyId/отдельные строки
        group:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: |
            Для напоминаний по SMS; вводит пара. Видит только пара (152-ФЗ,
            минимизация): помощнику и координатору поле не приходит —
            у них есть `hasPhone`.
        hasPhone:
          type: boolean
          description: телефон записан — для ролей, которым сам номер не показывается
        comment:
          type: string
          nullable: true
          description: |
            Что гость написал в RSVP (`POST /join/{guestToken}`). Только паре —
            до фичи 005 писалось и нигде не читалось (D3-25).
        status:
          type: string
          enum:
            - 'yes'
            - 'no'
            - pending
        tableId:
          type: string
          nullable: true
        diet:
          type: string
          nullable: true
          enum:
            - null
            - vegetarian
            - vegan
            - halal
            - kosher
            - gluten_free
            - other
          description: RSVP+ — ограничения по еде
        dietNote:
          type: string
          nullable: true
          description: аллергии словами, когда enum не хватает
        menuOptionId:
          type: string
          nullable: true
          description: выбор в опросе меню
        transfer:
          type: string
          nullable: true
          enum:
            - null
            - need
            - own
          description: нужен ли трансфер
        busId:
          type: string
          nullable: true
          description: посажен в этот автобус
        hotelId:
          type: string
          nullable: true
        inviteUrl:
          type: string
          nullable: true
          description: >-
            ОДНОРАЗОВАЯ ссылка-приглашение для этого гостя. Пара её пересылает; при первом открытии код обменивается на
            персональный guestToken и гаснет. Сырой guestToken паре не отдаётся НИКОГДА — иначе пара может открыть
            гостевую страницу и увидеть его резерв подарка, что ломает анонимность (§9 бизнес-логики)
        inviteUrlUsed:
          type: boolean
          readOnly: true
          description: true — гость уже открыл ссылку. Чтобы выдать новую, нужен POST …/invite-link
    GuestPersonRsvp:
      type: object
      required:
        - guestId
        - name
        - status
      properties:
        guestId:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
            - 'yes'
            - 'no'
            - pending
        diet:
          type: string
          nullable: true
          enum:
            - null
            - vegetarian
            - vegan
            - halal
            - kosher
            - gluten_free
            - other
        dietNote:
          type: string
          nullable: true
        transfer:
          type: string
          nullable: true
          enum:
            - null
            - need
            - own
        isPlaceholder:
          type: boolean
          readOnly: true
    Table:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        capacity:
          type: integer
          default: 8
        guestIds:
          type: array
          items:
            type: string
    TaskCreate:
      type: object
      additionalProperties: false
      required:
        - title
        - period
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        period:
          type: string
          maxLength: 40
          description: Число месяцев 0–120 до свадьбы или произвольная подпись периода без вычисленного срока.
        due:
          type: string
          format: date
          nullable: true
        dueMode:
          type: string
          enum:
            - relative
            - fixed
          description: >-
            Без явной даты — relative; с явной датой или null — fixed по умолчанию. Relative с точной датой требует даты
            свадьбы.
        assigneeId:
          type: string
          format: uuid
          nullable: true
        reminderDaysBefore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 30
          description: >-
            Напомнить ответственному за N календарных дней до срока; 0 — в день срока, null — выключено. Для включения
            нужны срок и ответственный. Снятие срока или назначения выключает напоминание.
        reminderTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: >-
            Время по поясу ответственного (профиль → свадьба → Москва), по умолчанию 09:00. Тихие часы и настройки
            уведомлений имеют приоритет.
    TaskPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        done:
          type: boolean
        due:
          type: string
          format: date
          nullable: true
          description: Пропуск сохраняет срок; null снимает срок. Явное значение без dueMode переключает в fixed.
        dueMode:
          type: string
          enum:
            - relative
            - fixed
          description: Relative без due пересчитывает срок по периоду и дате свадьбы; fixed без due сохраняет дату.
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: Живой участник этой свадьбы с ролью couple/helper/coordinator. Null снимает назначение; пропуск сохраняет.
        reminderDaysBefore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 30
          description: >-
            Напомнить ответственному за N календарных дней до срока; 0 — в день срока, null — выключено. Для включения
            нужны срок и ответственный. Снятие срока или назначения выключает напоминание.
        reminderTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: >-
            Время по поясу ответственного (профиль → свадьба → Москва), по умолчанию 09:00. Тихие часы и настройки
            уведомлений имеют приоритет.
    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        period:
          type: string
          nullable: true
        done:
          type: boolean
        custom:
          type: boolean
        due:
          type: string
          format: date
          nullable: true
          description: >-
            Срок задачи. Relative двигается вместе с датой свадьбы; fixed сохраняет выбранную дату, в том числе
            отсутствие срока.
        dueMode:
          type: string
          enum:
            - relative
            - fixed
        assignee:
          type: object
          nullable: true
          properties:
            userId:
              type: string
              format: uuid
            name:
              type: string
              nullable: true
        reminderDaysBefore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 30
          description: >-
            Напомнить ответственному за N календарных дней до срока; 0 — в день срока, null — выключено. Для включения
            нужны срок и ответственный. Снятие срока или назначения выключает напоминание.
        reminderTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: >-
            Время по поясу ответственного (профиль → свадьба → Москва), по умолчанию 09:00. Тихие часы и настройки
            уведомлений имеют приоритет.
    Chat:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        avatarUrl:
          type: string
          nullable: true
        lastMessage:
          type: string
        unread:
          type: integer
        kind:
          type: string
          enum:
            - vendor
            - team
            - day
            - tilly
            - external
            - crew
          description: |
            `vendor` — пара с подрядчиком из каталога. `external` — со своим
            подрядчиком, найденным парой (§11), привязан к сделке
            (`chats.deal_id`): у следующего подрядчика того же слота — свой чат.
            `team` — команда свадьбы: пара, помощники и ЗАБРОНИРОВАННЫЕ
            подрядчики (Бизнес-логика §3.11); в нём координатор командует
            всеми разом. `crew` — чат исполнителей: координатор и
            забронированные подрядчики, БЕЗ пары (решение владельца
            2026-09-03). Пара видит строку `crew` в списке — с подписью
            вместо последней реплики и нулём непрочитанных, — а на чтение
            переписки получает 403. `tilly` — помощник, только паре.
            `day` — чат дня X, открывается накануне.
        closed:
          type: boolean
          description: |
            Только у kind=external: сделка со своим подрядчиком отменена —
            переписка остаётся паре для чтения, писать больше некому. Чат
            привязан к сделке, не к слоту: у нового подрядчика в том же слоте
            свой чат, и историю прежнего он не видит (фича 005, ERR-0219).
        openFrom:
          type: string
          format: date-time
          nullable: true
          description: |
            Только у kind=day: 09:00 НАКАНУНЕ свадьбы по Wedding.tz. Чат
            существует с момента создания свадьбы и до этого срока виден,
            но закрыт (423) — иначе в списке чатов до дня X была бы пустота
            вместо строки «откроется 13 июня». Дату перенесли — срок едет
            вместе с ней.
        tilly:
          type: object
          nullable: true
          description: |
            Только у kind=tilly (фича 010), у остальных чатов — null. `live` — за Тилем стоит языковая
            модель (провайдер настроен); false — он отвечает честной заглушкой
            «Тиль пока без ИИ», и экран говорит это словами. `usedToday` —
            сколько реплик пара уже отправила Тилю за сутки по поясу свадьбы,
            `limitPerDay` — предел (План §18: 50); на пределе POST отвечает
            429 `tilly_daily_limit`. Числа считает сервер — экран их не
            досчитывает и без ответа не показывает.
          required:
            - live
            - usedToday
            - limitPerDay
          properties:
            live:
              type: boolean
            usedToday:
              type: integer
              minimum: 0
            limitPerDay:
              type: integer
              minimum: 1
    Message:
      type: object
      properties:
        id:
          type: string
        chatId:
          type: string
        senderId:
          type: string
          nullable: true
          description: >
            null — сообщение не от пользователя приложения: ответ Тиль, системная запись или, в чате со своим
            подрядчиком (§11), сам подрядчик — аккаунта у него нет. Системных записей в таком чате не бывает, поэтому
            там пустой отправитель однозначно означает подрядчика.
        text:
          type: string
        attachmentUrl:
          type: string
          nullable: true
        sentAt:
          type: string
          format: date-time
        system:
          type: boolean
          description: |
            Системная запись (сдвиг тайминга, перенос даты, «участник вышел»)
            — не реплика человека. Экран рисует её по признаку, а не угадывает
            по тексту (D4-15). У ответа Тиль, реплик своего подрядчика и гостей — false.
        guestName:
          type: string
          nullable: true
          description: |
            Имя гостя, если реплику написал гость по своей ссылке в чат дня X
            (фича 009): у гостя нет аккаунта, `senderId` пуст, имя — из списка
            гостей. У остальных реплик — null.
        mine:
          type: boolean
          nullable: true
          description: |
            Своя ли это реплика для того, кто читает (фича 014). Участнику —
            по `senderId`, гостю в чате дня — по его строке в списке гостей:
            у гостя нет идентификатора аккаунта, и сравнивать имена (две
            Марины) экран не должен. Считает сервер. `null` — читатель
            неизвестен (реплика пришла живым каналом всем сразу): экран
            участника тогда решает по `senderId`.
        warning:
          type: string
          nullable: true
          readOnly: true
          description: |
            Мягкое предупреждение о выводе сделки мимо платформы (§18.2):
            сообщение ДОСТАВЛЕНО, но обе стороны видят плашку и системную
            запись в чате. Блокировать нельзя — разговор просто уйдёт
            в мессенджер, где нет ни договора, ни эскроу, ни следа
            для разбирательства.
    Lead:
      type: object
      properties:
        id:
          type: string
        coupleName:
          type: string
        weddingDate:
          type: string
          format: date
          nullable: true
        city:
          type: string
          nullable: true
        message:
          type: string
        status:
          type: string
          enum:
            - new
            - replied
            - hold
            - declined
            - won
        holdUntil:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        chatId:
          type: string
          nullable: true
          description: |
            Чат пары с этим подрядчиком — тот же, что открыло «Написать» пары
            и в который уходит ответ на заявку. Кабинет ведёт из заявки прямо в
            переписку (фича 007). null — у заявки без чата (выигранная без
            переписки).
    Review:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
          enum:
            - couple
            - guest
          description: 'Пара со сделкой или гость свадьбы: в рейтинге веса разные (§15).'
        authorName:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
        createdAt:
          type: string
          format: date-time
        reply:
          type: object
          nullable: true
          properties:
            text:
              type: string
            createdAt:
              type: string
              format: date-time
    Notification:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        kind:
          type: string
          enum:
            - deal
            - chat
            - task
            - guest
            - system
        link:
          type: string
          nullable: true
          example: /deal/01a06eac-4983-7b5e-8d67-36d1a8e05cc9
          description: |
            Место, а не маршрут приложения: `/deal/{dealId}`, `/chats/{chatId}`,
            `/guests`, `/checklist`, `/dayx`, `/vendor-app`. У пары и у
            подрядчика одно и то же место лежит по разным адресам, поэтому
            перевод в маршрут делает клиент. Незнакомое место никуда не ведёт.
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Money:
      type: object
      description: |
        Денежная сумма. Решение владельца 2026-09-02: минорные единицы плюс код
        валюты у КАЖДОЙ суммы, а не одна валюта на свадьбу — план §19.7 описывает
        свадьбу за границей, где сделка в евро, а бюджет в рублях.
        В MVP принимается только RUB; enum расширяется вместе с поддержкой курсов.
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: |
            Сумма в копейках. 85 000 ₽ = 8500000. Дробных значений не бывает.
            Потолок — предел точного целого в JSON: за ним число молча
            округляется, и «потрачено» перестаёт сходиться с суммой сделок.
          example: 8500000
        currency:
          type: string
          description: Код валюты по ISO 4217.
          enum:
            - RUB
          example: RUB
    Deal:
      type: object
      description: |
        Договорённость пары с конкретным исполнителем на конкретный слот.
        Носитель состояния: у слота собственного статуса нет (решение владельца
        2026-09-02) — раньше слот, сделка и фронтенд описывали одно понятие тремя
        разными наборами значений.
      properties:
        id:
          type: string
        state:
          $ref: '#/components/schemas/DealState'
        vendor:
          allOf:
            - $ref: '#/components/schemas/Vendor'
          nullable: true
          description: null у своего подрядчика не из каталога (§11)
        externalName:
          type: string
          nullable: true
          description: имя своего подрядчика
        externalPhone:
          type: string
          nullable: true
        packageName:
          type: string
          nullable: true
          description: |
            Снимок принятого названия, только couple: текст может содержать цену.
            Удаление живого пакета/предложения не меняет его. null — название неизвестно.
        packageIncludes:
          type: array
          nullable: true
          items:
            type: string
          description: Снимок состава, только couple; null — состав неизвестен, [] — известный пустой состав.
        price:
          $ref: '#/components/schemas/Money'
        paid:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |
            Сколько уже внесено по этой сделке: платежи `deposit` и `balance`
            минус возвраты, без отменённых. Считается на лету, в базе не
            хранится (§3.1: производное значение расходится с источником).

            Без него «оплачено 30 000 из 50 000» показать нечем, и человек
            держит остаток долга в голове. Уходит вместе с ценой — тому, кто
            видит деньги: помощник и координатор не видят ни того, ни другого.
        paidAt:
          type: string
          format: date-time
          nullable: true
          description: дата последнего платежа. Пусто — платежей не было
        negotiatingUntil:
          type: string
          format: date-time
          nullable: true
          description: 'срок мягкой брони: 72 ч на этапе negotiating (§18.3)'
        bookedAt:
          type: string
          format: date-time
          nullable: true
        doneAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
    DealState:
      type: string
      description: |
        Шесть состояний сделки (План §8.1, решение владельца 2026-09-02).
        Мягкая бронь на 72 часа — не отдельное состояние, а срок жизни `negotiating` (§18.3).
      enum:
        - candidate
        - contacted
        - negotiating
        - booked
        - paid_deposit
        - done
        - cancelled
    Gift:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
          maxLength: 16
          nullable: true
          description: |
            Значок подарка (§9). Плитка (`tile` в моках) сюда не входит: это
            цвет из палитры, он считается на клиенте по месту в списке —
            дизайн-токен, а не данные.
        desc:
          type: string
          nullable: true
        price:
          $ref: '#/components/schemas/Money'
        group:
          type: boolean
          description: можно скидываться
        funded:
          $ref: '#/components/schemas/Money'
        reserved:
          type: boolean
          description: кем именно — паре не отдаётся никогда
        mine:
          type: boolean
          readOnly: true
          description: |
            Резерв поставлен ЭТИМ гостем. Только в гостевом ответе; паре поле
            не отдаётся вовсе — иначе «занято мной» на её экране и означало бы
            того самого гостя, которого §9 обещает не показывать.
    Fund:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
          maxLength: 16
          nullable: true
        target:
          $ref: '#/components/schemas/Money'
        collected:
          $ref: '#/components/schemas/Money'
    BusRoute:
      type: object
      description: |
        Маршрут для гостей — работа перевозчика глазами гостей: точка сбора,
        время, места. Перевозчик — подрядчик (сделка в слоте «Транспорт»);
        маршрут может ссылаться на его сделку (фича 006), а может жить сам по
        себе (свой микроавтобус без сделки). Лимузин пары — сделка без маршрута.
      properties:
        id:
          type: string
        name:
          type: string
          example: Автобус №1
        from:
          type: string
          example: Уфа, ост. «Гостиный двор»
        time:
          type: string
          example: '14:30'
        seats:
          type: integer
        taken:
          type: integer
          readOnly: true
          description: занято ПЕРСОН (гость «с +1» — двое); считает база, переполнение запрещено
        dealId:
          type: string
          nullable: true
          description: |
            Сделка с перевозчиком этой свадьбы — только в слоте категории
            `transport` (иначе 422 `not_transport`) и живая: отменённая — 409
            `deal_cancelled`, кандидат или переговоры — 409 `deal_not_booked`
            (фича 014: «везёт перевозчик X» — обещание гостям, его не дают за
            подрядчика, который ничего не подтвердил). null — маршрут без
            перевозчика. Отмена сделки обнуляет поле, маршрут и записи гостей
            остаются.
        carrier:
          type: string
          nullable: true
          readOnly: true
          description: |
            Имя перевозчика по сделке: название анкеты из каталога или имя
            своего подрядчика. Видят пара, команда и гость (`GET /join/{t}/shuttle`)
            — только имя, без телефона и цены.
    HotelBlock:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        rooms:
          type: integer
        booked:
          type: integer
        price:
          $ref: '#/components/schemas/Money'
        deadline:
          type: string
          format: date
        promo:
          type: string
        mine:
          type: boolean
          readOnly: true
          description: |
            Только в `GET /join/{guestToken}/hotels`: гость уже занял номер
            в этом блоке. Без признака гость не видел своей брони и тап по
            другому блоку переносил её молча (D3-15).
    BroadcastResult:
      type: object
      description: |
        Что сделала «рассылка гостям»: гостям доставки нет (ни SMS, ни почты
        — «Хвосты»), запись уходит в журнал рассылок и команде в приложении.
      properties:
        broadcastId:
          type: string
        recipients:
          type: integer
          description: скольких гостей касается (по записям/ответам)
        notified:
          type: integer
          description: скольким членам команды ушло уведомление
        debounced:
          type: boolean
          description: true — та же рассылка уже была недавно, повторно не отправлялась
    TimelineShiftScope:
      oneOf:
        - type: object
          required:
            - kind
            - date
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - day
            date:
              type: string
              format: date
        - type: object
          required:
            - kind
            - eventId
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - event
            eventId:
              type: string
              format: uuid
    TimelineShiftPreview:
      type: object
      required:
        - scope
        - minutes
        - canConfirm
        - blocks
        - blockDetails
        - excluded
        - conflicts
        - affectedBlockIds
        - affectedReferences
        - referenceDetails
        - movements
        - guestsAffected
        - affectedGuestIds
        - affectedGuests
        - affectedVendorIds
        - affectedMemberIds
        - expiresAt
        - previewToken
        - sourceVersion
      properties:
        scope:
          type: object
          required:
            - kind
            - date
            - timeZone
          properties:
            kind:
              type: string
              enum:
                - day
                - event
            eventId:
              type: string
              format: uuid
            date:
              type: string
              format: date
            timeZone:
              type: string
        minutes:
          type: integer
        sourceVersion:
          type: string
        canConfirm:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        previewToken:
          type: string
          nullable: true
        blocks:
          type: array
          items:
            type: object
            required:
              - id
              - before
              - after
            properties:
              id:
                type: string
                format: uuid
              before:
                $ref: '#/components/schemas/TimelineShiftMoment'
              after:
                $ref: '#/components/schemas/TimelineShiftMoment'
        excluded:
          type: array
          items:
            type: object
            required:
              - id
              - reason
            properties:
              id:
                type: string
                format: uuid
              reason:
                type: string
                enum:
                  - undated
                  - other_day
                  - other_event
                  - fixed
                  - past
        conflicts:
          type: array
          items:
            type: object
            required:
              - kind
              - blockIds
            properties:
              kind:
                type: string
                enum:
                  - shifted_into_past
                  - crosses_day
                  - unknown_duration
                  - invalid_interval
                  - missing_dependency
                  - unknown_dependency_time
                  - dependency_timing
                  - unknown_participant_time
                  - participant_overlap
                  - travel_buffer_overlap
              blockIds:
                type: array
                items:
                  type: string
                  format: uuid
        affectedBlockIds:
          type: array
          items:
            type: string
            format: uuid
        affectedReferences:
          type: array
          items:
            $ref: '#/components/schemas/TimelineReference'
        blockDetails:
          type: array
          description: >-
            Имена и контекст блоков из того же авторизованного снимка; родительский список клиента не является
            источником подписанных последствий.
          items:
            $ref: '#/components/schemas/TimelineShiftBlockDetails'
        referenceDetails:
          type: array
          description: >-
            Минимальные имена затронутых назначений, без телефонов, финансов и скрытых vendor user IDs. Неизвестное имя
            остаётся null.
          items:
            $ref: '#/components/schemas/TimelineShiftReferenceDetails'
        affectedGuests:
          type: array
          description: Персоны из affectedGuestIds с именами, не доставка и не индивидуальные event invitations.
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - name
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
                nullable: true
        movements:
          type: array
          items:
            type: object
            required:
              - blockId
              - location
              - travelMinutes
              - bufferMinutes
              - beforeArrival
              - afterArrival
            properties:
              blockId:
                type: string
                format: uuid
              location:
                type: string
                nullable: true
              travelMinutes:
                type: number
              bufferMinutes:
                type: number
              beforeArrival:
                type: string
                format: date-time
                nullable: true
                description: Плановое начало блока с ручными travel/buffer до сдвига, не фактическое прибытие рейса
              afterArrival:
                type: string
                format: date-time
                nullable: true
                description: Плановое начало блока с ручными travel/buffer после сдвига, не фактическое прибытие рейса
        guestsAffected:
          type: integer
        affectedGuestIds:
          type: array
          items:
            type: string
            format: uuid
        affectedVendorIds:
          type: array
          items:
            type: string
            format: uuid
        affectedMemberIds:
          type: array
          items:
            type: string
            format: uuid
    TimelineShiftBlockDetails:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - eventId
        - eventName
        - eventDate
        - timeZone
        - location
        - startsAt
        - endsAt
      properties:
        id:
          type: string
          format: uuid
