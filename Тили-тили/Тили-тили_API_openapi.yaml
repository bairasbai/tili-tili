          properties:
            createdAt:
              type: string
              format: date-time
              description: когда анкета заведена
            publishedAt:
              type: string
              format: date-time
              nullable: true
              description: |
                Когда анкета опубликована. Именно от этой даты считается срок
                проверки, и именно её показывает очередь: дата заведения
                у анкеты, пролежавшей месяц в черновике, ответила бы не на тот вопрос.
    ModerationVendorPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModerationVendor'
        nextCursor:
          type: string
          nullable: true
    VendorDecision:
      type: object
      description: Что записано по анкете. Ответ подтверждает решение, а не состояние анкеты целиком.
      properties:
        vendorId:
          type: string
        action:
          type: string
          enum:
            - approve
            - reject
            - verify
    ComplaintDecision:
      type: object
      description: Что записано по жалобе.
      properties:
        complaintId:
          type: string
        action:
          type: string
          enum:
            - dismiss
            - warn
            - downrank
            - block
    ConciergeRequest:
      type: object
      description: 'Заявка консьержу в очереди панели: что искать, где, на какой бюджет и кому перезвонить.'
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - new
            - in_progress
            - done
            - cancelled
        categoryId:
          type: string
        categoryName:
          type: string
          description: название категории из справочника
        city:
          type: string
          nullable: true
          description: город поиска; пусто — заявка без города
        budget:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        comment:
          type: string
          nullable: true
        phone:
          type: string
          description: номер входа пары — она попросила связаться; сотрудник звонит по нему
        name:
          type: string
          nullable: true
          description: имя пары из профиля
        createdAt:
          type: string
          format: date-time
          description: когда подана — от неё считаются сутки
    ConciergePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConciergeRequest'
        nextCursor:
          type: string
          nullable: true
    ConciergeDecision:
      type: object
      description: Что записано по заявке консьержу.
      properties:
        requestId:
          type: string
        status:
          type: string
          enum:
            - in_progress
            - done
            - cancelled
    VerificationItem:
      type: object
      description: |
        Заявка в очереди. Ни ссылки на документ, ни ИНН здесь нет — только
        признак `hasFile`: документы отдаются в карточке одному сотруднику
        и с записью в журнал, а не страницами всем подряд.
      properties:
        id:
          type: string
        vendorId:
          type: string
        vendorName:
          type: string
        kind:
          type: string
          enum:
            - passport
            - ip
            - company
          description: 'что прислали: паспорт, документы ИП или документы компании'
        hasFile:
          type: boolean
          description: приложена ли ссылка на документ
        createdAt:
          type: string
          format: date-time
          description: когда подана
    VerificationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VerificationItem'
        nextCursor:
          type: string
          nullable: true
    VerificationRequest:
      type: object
      description: |
        Карточка заявки: то, по чему принимается решение. Единственный ответ,
        где ссылка на документ и ИНН выходят наружу, — и только сотруднику.
      properties:
        id:
          type: string
        vendorId:
          type: string
        vendorName:
          type: string
        vendorPublished:
          type: boolean
          description: |
            Есть ли анкета в каталоге сейчас (опубликована и не заблокирована).
            Решение по документам этим не задерживается — признак нужен, чтобы
            карточка не вела на анкету, которой в каталоге нет.
        kind:
          type: string
          enum:
            - passport
            - ip
            - company
        fileUrl:
          type: string
          nullable: true
          description: Ссылка на документ во внешнем хранилище. Пусто — документ не приложен.
        inn:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        createdAt:
          type: string
          format: date-time
        checkedAt:
          type: string
          format: date-time
          nullable: true
          description: когда разобрана
    VerificationDecision:
      type: object
      description: Что записано по заявке. Ответ подтверждает решение, а не состояние подрядчика целиком.
      properties:
        requestId:
          type: string
        action:
          type: string
          enum:
            - approve
            - reject
    VerificationStatus:
      type: object
      description: |
        Состояние последней заявки подрядчика. `none` — заявок не было.
        Причины отказа здесь нет: она приходит уведомлением.
      properties:
        status:
          type: string
          enum:
            - none
            - pending
            - approved
            - rejected
        kind:
          type: string
          enum:
            - passport
            - ip
            - company
          nullable: true
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: когда подана
        checkedAt:
          type: string
          format: date-time
          nullable: true
          description: когда разобрана
    AdminMetrics:
      type: object
      description: |
        Показатели платформы на сейчас. Каждое число считается сервером —
        клиент их не складывает и не досчитывает, иначе на двух экранах
        получились бы два разных ответа.
      properties:
        users:
          type: integer
          description: живые аккаунты
        weddings:
          type: integer
          description: неархивные свадьбы
        vendorsPublished:
          type: integer
          description: опубликованные и не заблокированные анкеты
        moderationQueue:
          type: integer
          description: анкеты, ждущие проверки
        verificationQueue:
          type: integer
          description: |
            Заявки на верификацию, ждущие решения. Считается тем же условием,
            что и очередь `GET /admin/verifications`: число на дашборде и длина
            очереди — одно и то же, иначе панель обещает работу, которой нет.
        complaintsOpen:
          type: integer
          description: нерассмотренные жалобы
        complaintsOverdue:
          type: integer
          description: |
            Из них старше суток. Срок разбора — 24 часа (§18.2); без отдельного
            счётчика он существует только на бумаге.
        deals:
          type: integer
          description: сделки в состояниях booked, paid_deposit, done
        gmv:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: оборот по тем же сделкам
        cities:
          type: array
          description: до двадцати городов по числу анкет
          items:
            type: object
            properties:
              city:
                type: string
              vendors:
                type: integer
              launchReady:
                type: boolean
                description: город готов к запуску — анкет 50 и больше
        llm:
          type: object
          description: |
            Расход Тиля на языковую модель за последние 30 дней — по строкам
            учёта `tilly_usage` (одна на каждый вызов, фича 010). `calls` —
            все обращения, включая отказы провайдера и ответы заглушкой;
            `answered` — сколько из них ответила модель; токены — только по
            ответам модели. Стоимость в рублях сервер не считает: цены у
            провайдеров и моделей разные и меняются — владелец умножает сам.
          required:
            - since
            - calls
            - answered
            - inputTokens
            - outputTokens
          properties:
            since:
              type: string
              format: date-time
              description: начало окна — 30 дней назад
            calls:
              type: integer
              minimum: 0
            answered:
              type: integer
              minimum: 0
            inputTokens:
              type: integer
              minimum: 0
            outputTokens:
              type: integer
              minimum: 0
        profiles:
          type: object
          description: |
            Заполненность живых опубликованных анкет (фича 012, План §19.10
            п. 4). Заполненность одной анкеты — доля заполненных из четырёх
            полей, которые подрядчик может заполнить сам: описание, рабочий
            телефон, цена «от», хотя бы один пакет. Фото и видео не считаются —
            загрузок нет до хранилища, и метрика штрафовала бы всех за
            инфраструктуру. `published` — тот же набор, что `vendorsPublished`;
            `complete` — 4 из 4; `averagePercent` — среднее по анкетам, 0…100.
            Пустой каталог — нули по факту ответа, не «неизвестно».
          required:
            - published
            - complete
            - averagePercent
          properties:
            published:
              type: integer
              minimum: 0
            complete:
              type: integer
              minimum: 0
            averagePercent:
              type: integer
              minimum: 0
              maximum: 100
    SupportDeal:
      type: object
      description: |
        Сделка глазами поддержки (фича 013): только то, что нужно для разбора
        спора о деньгах. Имена — есть, телефонов и переписки — нет.
      required:
        - id
        - slotLabel
        - categoryId
        - state
        - paid
        - events
      properties:
        id:
          type: string
        slotLabel:
          type: string
          description: подпись слота на мозаике пары («Фотограф»)
        categoryId:
          type: string
        vendorName:
          type: string
          nullable: true
          description: анкета каталога; null у своего подрядчика
        externalName:
          type: string
          nullable: true
          description: свой подрядчик пары (§11); null у сделки из каталога
        state:
          $ref: '#/components/schemas/DealState'
        price:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        paid:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: оплачено по платежам (возвраты вычтены, отменённые не считаются) — та же формула, что у пары и подрядчика
        bookedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        events:
          type: array
          description: 'история состояний по времени: кто (couple | vendor | system), откуда, куда, заметка'
          items:
            type: object
            required:
              - at
              - by
              - toState
            properties:
              at:
                type: string
                format: date-time
              by:
                type: string
                enum:
                  - couple
                  - vendor
                  - system
              fromState:
                type: string
                nullable: true
              toState:
                type: string
              note:
                type: string
                nullable: true
    WeddingSupportCard:
      type: object
      description: |
        Карточка, а не свадьба целиком: ни гостей, ни переписки, ни сумм.
        Для разбора обращения этого достаточно, а лишнее здесь — чужая свадьба
        на экране поддержки.
      properties:
        id:
          type: string
        title:
          type: string
        date:
          type: string
          format: date
          nullable: true
        city:
          type: string
          nullable: true
        style:
          type: string
          nullable: true
        guestsPlanned:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
    FinancialBalance:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        currency:
          type: string
          enum:
            - RUB
      description: Знаковый итог в копейках; при несогласованной истории возвратов отрицательные деньги не скрываются нулём.
    PaymentMethod:
      type: string
      enum:
        - cash
        - bank_transfer
        - card
        - other
    PaymentVisibility:
      type: string
      enum:
        - private
        - finance_members
        - vendor
      description: |
        private и finance_members не расширяют текущую RBAC-модель: финансовые endpoints свадьбы
        по-прежнему доступны только роли couple. vendor раскрывает запись только vendor этой сделки.
    PaymentSummary:
      type: object
      required:
        - committed
        - recorded
        - remaining
        - unallocated
        - inactiveDealRecorded
        - unknownPrices
        - unknownAmountPayments
        - amountIncomplete
      properties:
        committed:
          $ref: '#/components/schemas/FinancialBalance'
        recorded:
          $ref: '#/components/schemas/FinancialBalance'
        remaining:
          $ref: '#/components/schemas/FinancialBalance'
        unallocated:
          $ref: '#/components/schemas/FinancialBalance'
        inactiveDealRecorded:
          $ref: '#/components/schemas/FinancialBalance'
        unknownPrices:
          type: integer
          minimum: 0
        unknownAmountPayments:
          type: integer
          minimum: 0
        amountIncomplete:
          type: boolean
          description: true, если есть факты оплаты без сохранённой суммы; recorded — только известная нижняя граница.
      description: |
        Только сделки, не ручные статьи. committed — активные обязательства; recorded — сумма
        известных отметок минус возвраты; remaining — положительный числовой остаток по каждой
        активной сделке. Неизвестная сумма не считается нулём и не уменьшает remaining.
    PaymentInstallment:
      type: object
      required:
        - id
        - dealId
        - title
        - amount
        - paid
        - remaining
        - due
        - version
        - status
        - overdue
        - cancelReason
        - cancelledAt
        - allocated
        - unknownAmountPayments
      properties:
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        id:
          type: string
          format: uuid
        dealId:
          type: string
          format: uuid
        title:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        paid:
          $ref: '#/components/schemas/FinancialBalance'
        allocated:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |
            Сколько на этап легло неразнесённых известных денег сделки. Только для показа —
            привязки не меняются.
        remaining:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Сколько осталось по этапу с учётом известных оплат; неизвестная сумма его не уменьшает.
        due:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        status:
          $ref: '#/components/schemas/PaymentInstallmentStatus'
        overdue:
          type: boolean
        cancelReason:
          type: string
          nullable: true
        unknownAmountPayments:
          type: integer
          minimum: 0
          description: Факты оплаты этого этапа без сохранённой суммы.
    PaymentInstallmentStatus:
      type: string
      enum:
        - pending
        - partial
        - paid
        - covered
        - cancelled
      description: |
        paid — привязанные отметки закрыли этап; covered — закрыт неразнесёнными деньгами
        сделки (`allocated`), привязанных может не быть; partial — внесена часть; pending —
        ничего; cancelled — этап отменён. Одна схема на этап и на его строку в
        `PaymentSchedule.allInstallments`: копия перечисления уже разошлась однажды (ревью 018, ERR-0314).
    PaymentRecord:
      type: object
      required:
        - id
        - dealId
        - kind
        - amount
        - amountKnown
        - paymentMethod
        - visibility
        - paidOn
        - status
        - createdAt
        - installmentId
        - version
      properties:
        id:
          type: string
          format: uuid
        dealId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - deposit
            - balance
            - refund
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: null только когда amountKnown=false; неизвестная сумма никогда не кодируется нулём.
        amountKnown:
          type: boolean
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        visibility:
          $ref: '#/components/schemas/PaymentVisibility'
        paidOn:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        status:
          type: string
          enum:
            - recorded
            - confirmed
            - cancelled
        createdAt:
          type: string
          format: date-time
        installmentId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
    VendorPaymentRecord:
      allOf:
