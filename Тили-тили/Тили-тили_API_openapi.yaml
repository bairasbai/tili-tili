          type: string
        eventId:
          type: string
          format: uuid
        eventName:
          type: string
        eventDate:
          type: string
          format: date
          nullable: true
        timeZone:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Известное окончание из записи или точной durationMinutes, тем же расчётом что preview; неизвестное остаётся
            null
    TimelineShiftReferenceDetails:
      type: object
      additionalProperties: false
      required:
        - kind
