          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - reply
                    - hold
                    - decline
                    - reopen
                text:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  description: |
                    Сообщение паре в чат заявки. Обязателен при `action=reply`;
                    при `hold`/`decline`/`reopen` — по желанию: причина отказа
                    или холда (§3.13, R-48).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`lead_won` — лид уже выигран, действие не применяется'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          description: '`cold_outreach_limit` — непроверенный подрядчик исчерпал предел холодных обращений за день'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
