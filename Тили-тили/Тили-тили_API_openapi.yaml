      summary: Сохранить новую редакцию плана ресурсов
      description: >-
        Только текущий владелец исполнителя. Материальная замена создаёт неизменяемую редакцию и новую версию заказа,
        даже при одинаковых названиях ресурсов. Точный повтор не создаёт редакцию. Пустой массив явно очищает план,
        сохраняя историю. Производство не выводится из доставки; дорога, подготовка и демонтаж задаются явно. Сохранение
        не резервирует ресурсы и не меняет цену, оплаты, календарь, программу или used. Изменённый план требует нового
        предложения условий и новых ответов сторон.
      security:
        - bearerAuth: []
      parameters:
        - name: dealId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
