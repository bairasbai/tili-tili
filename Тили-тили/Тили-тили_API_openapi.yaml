  /vendor/weddings/{weddingId}/timeline:
    get:
      tags:
        - vendor
      summary: Разрешённый снимок программы для ознакомления
      description: >
        Только блоки с назначением на собственные действующие сделки этой свадьбы. Служебные блоки/скрытые dependency
        IDs, другие участники, legacy who, телефоны и деньги не раскрываются. Даты/пояса/места мероприятий фактические,
        неизвестные остаются null. GET не подтверждает ознакомление. ETag и sourceVersion относятся к одному снимку под
        lock; Cache-Control no-store. ReadToken подписан для wedding/vendor/user/session/version/content на 600 секунд.
        При отсутствии назначений readToken/expiresAt null.
