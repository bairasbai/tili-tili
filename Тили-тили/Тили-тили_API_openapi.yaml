  /vendor/deals:
    get:
      tags:
        - vendor
      summary: Сделки подрядчика
      description: |
        Экран «Сделки» кабинета: пара, дата, сумма, состояние. Заявка
        и сделка — разные вещи: у заявки нет ни суммы, ни мягкой брони,
        и показывать одно вместо другого нечестно.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - amountIncomplete
                properties:
                  expected:
                    allOf:
                      - $ref: '#/components/schemas/Money'
                    description: >-
                      остаток по ОТКРЫТЫМ броням (booked, paid_deposit): цена минус известные платежи с
                      visibility=vendor
                  shortfall:
                    allOf:
                      - $ref: '#/components/schemas/Money'
                    description: |
                      Недоплата по ЗАВЕРШЁННЫМ (done) сделкам: работа сдана, а
                      цена не закрыта платежами. В «ожидается» не входит — это
                      предмет спора, а не ожидания (решение владельца, В7).
                      Учитывает только известные платежи с visibility=vendor.
                  amountIncomplete:
                    type: boolean
                    description: Есть неотменённые vendor-visible платежи с неизвестной суммой; числовые итоги их не учитывают.
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - unknownAmountPayments
                      properties:
                        id:
                          type: string
                        coupleName:
                          type: string
                        weddingDate:
                          type: string
                          format: date
                          nullable: true
                        price:
                          allOf:
                            - $ref: '#/components/schemas/Money'
                          nullable: true
                        packageName:
                          type: string
                          nullable: true
                          description: снимок принятого названия; не зависит от удаления живого пакета
                        packageIncludes:
                          type: array
                          nullable: true
                          items:
                            type: string
                          description: снимок принятого состава; null — состав не был известен
                        state:
                          type: string
                          enum:
                            - candidate
                            - contacted
                            - negotiating
                            - booked
                            - paid_deposit
                            - done
                            - cancelled
                        paid:
                          allOf:
                            - $ref: '#/components/schemas/Money'
                          description: >-
                            известные суммы неотменённых платежей с visibility=vendor; возвраты с минусом,
                            private/finance_members исключены
                        unknownAmountPayments:
                          type: integer
                          minimum: 0
                          description: Число неотменённых vendor-visible платежей с неизвестной суммой этой сделки.
                        chatId:
                          type: string
                          nullable: true
                          description: 'чат с парой этой свадьбы (`kind: vendor`); null — пара ещё не писала'
                        contract:
                          type: object
                          nullable: true
                          description: последняя редакция договора по сделке — только заголовок, без полей сторон
                          properties:
                            id:
                              type: string
                            templateCode:
                              type: string
                            version:
                              type: integer
                            status:
                              type: string
                              enum:
                                - draft
                                - sent
                                - signed
                            createdAt:
                              type: string
                              format: date-time
                        holdUntil:
                          type: string
                          format: date-time
                          nullable: true
                        busRoutes:
                          type: array
                          description: |
                            Маршруты для гостей, привязанные к этой сделке (перевозчик,
                            фича 006): сколько машин и мест готовить. Только счётчики —
                            имён и телефонов гостей перевозчик не получает (152-ФЗ).
                            У сделок не из слота «Транспорт» — пустой список.
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              from:
                                type: string
                                nullable: true
                              time:
                                type: string
                                nullable: true
                              seats:
                                type: integer
                              taken:
                                type: integer
                                description: занято персон
