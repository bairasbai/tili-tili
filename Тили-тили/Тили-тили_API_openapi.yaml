          schema:
            type: number
            example: 54.7351
        - name: lon
          in: query
          required: true
          schema:
            type: number
            example: 55.9587
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
