  /weddings/{weddingId}/payment-schedule:
    get:
      tags:
        - budget
      summary: График платежей, актуальные итоги и отметки оплат
      description: >-
        Только couple. Один согласованный снимок. from/to включительно (до 366 дней, по умолчанию сегодня +30);
        includeOverdue добавляет непогашенные просроченные этапы вне окна, includeCancelled — отменённые в окне.
        Максимум 10000 записей: при превышении 409 financial_history_too_large, а не тихое обрезание. Даты графика
        фиксированы и не сдвигаются при переносе свадьбы. Отметка пользователя не подтверждает перевод банком.

        Коды: 422 bad_payment_range (начало позже конца или период длиннее 366 дней), bad_date (не календарная дата);
        409 financial_history_too_large, money_out_of_range (итог вне точного диапазона). Отменённая свадьба сразу
        уходит в архив, и её финансовые пути отвечают 404; `readOnly` — на случай отмены без архива.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: from
          in: query
          schema:
            type: string
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: to
          in: query
          schema:
            type: string
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: includeOverdue
          in: query
          schema:
            type: boolean
            default: true
        - name: includeCancelled
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Некорректные поля, дата или период
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - budget
      summary: Создать этап платежа
      description: >-
        Только couple. Этап не создаёт payment и не увеличивает смету. До 500 этапов на сделку; сумма активных этапов не
        выше цены. 409 stale_payment_plan / plan_over_price / payment_plan_limit. Обязателен Idempotency-Key.

        Коды: 422 validation_failed (пустое название; срок не календарный — отказ схемы с полем `due`), bad_date (срок
        вне 2000–2100); 409 not_booked, no_price (сделка не забронирована или без цены), payment_plan_limit (500
        активных этапов), plan_over_price (сумма активных этапов больше цены), wedding_cancelled; 400
        idempotency_key_required; 409 idempotency_key_reused (тот же ключ, другое тело), idempotency_in_progress.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInstallment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
