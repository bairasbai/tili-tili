            - booked
            - paid_deposit
            - done
            - cancelled
        price:
          $ref: '#/components/schemas/Money'
          nullable: true
        recorded:
          $ref: '#/components/schemas/FinancialBalance'
        remaining:
          $ref: '#/components/schemas/Money'
          nullable: true
        planned:
          $ref: '#/components/schemas/Money'
        unallocated:
          $ref: '#/components/schemas/FinancialBalance'
        needsReview:
          type: boolean
        active:
          type: boolean
        canPlan:
          type: boolean
        unknownAmountPayments:
          type: integer
          minimum: 0
    PaymentSchedule:
