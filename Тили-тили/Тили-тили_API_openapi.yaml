              - blockId
              - role
            properties:
              blockId:
                type: string
                format: uuid
              role:
                type: string
                enum:
                  - responsible
                  - participant
    TimelineShiftMoment:
      type: object
      required:
        - startsAt
        - endsAt
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
    DayXBroadcast:
      type: object
      description: Ответ на «+15 мин» и активацию плана Б.
      properties:
        minutes:
          type: integer
          description: только у сдвига
        shiftedBlocks:
          type: integer
          description: только у сдвига — сколько блоков сдвинуто
        scenario:
          type: string
          nullable: true
          description: только у плана Б
        guestsAffected:
          type: integer
          description: |
            Скольких гостей (ответивших «да») касается — им сообщает команда.
            Поле `notifiedGuests` (всегда 0, канала до гостей нет) снято в v0.30.0.
    MenuPoll:
      type: object
      required:
        - options
      properties:
        question:
          type: string
        sentAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: когда сводка ушла кейтерингу (POST …/menu-poll/remind); null — ещё не уходила
        expectedPortions:
          type: integer
          readOnly: true
          description: |
            На сколько ПЕРСОН готовить. Считается по подтвердившим гостям:
            запись с «+1» — двое. Кейтерингу нужны порции, а не строки
            списка, и считать их на клиенте значит получить два разных
            ответа на разных экранах.
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              icon:
                type: string
              votes:
                type: integer
    UserProfile:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        phone:
          type: string
          readOnly: true
        email:
          type: string
          nullable: true
          readOnly: true
          description: |
            Пока только читается: отправителя писем нет (хвост владельца), и
            принимать адрес, на который ничего не уйдёт, — обещать доставку.
            Правка появится вместе с отправителем и подтверждением адреса.
        isStaff:
          type: boolean
          readOnly: true
          description: |
            Сотрудник платформы: по этому признаку в меню «Мы» появляется
            «Админка». Только чтение и только про себя: списка сотрудников
            наружу нет, а признак ставится руками в базе при найме.
            PATCH /users/me берёт тело по этой же схеме — без readOnly контракт
            объявил бы права настраиваемыми, то есть «сделай меня админом»
            в один запрос.
        lang:
          type: string
          enum:
            - ru
            - en
        tz:
          type: string
          example: Asia/Yekaterinburg
          description: нужна для открытия чата дня X в 09:00 по местному
        push:
          type: object
          description: четыре независимых канала — тумблеры в настройках
          properties:
            tasks:
              type: boolean
            chats:
              type: boolean
            deals:
              type: boolean
            tips:
              type: boolean
        quietHours:
          type: object
          description: по умолчанию 22:00–09:00; день свадьбы не отключает тишину
          properties:
            from:
              type: string
              example: '22:00'
            to:
              type: string
              example: '09:00'
        urgentIncidents:
          type: boolean
          default: false
          description: >-
            Личное разрешение срочных push о подтверждённой проблеме своего события вне тихих часов; не включает
            отключённые каналы.
    Session:
      type: object
      properties:
        id:
          type: string
        device:
          type: string
          example: iPhone · Safari
        current:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Document:
      type: object
      properties:
        id:
          type: string
        dealId:
          type: string
        templateCode:
          type: string
        version:
          type: integer
        status:
          type: string
          enum:
            - draft
            - sent
            - signed
        pdfUrl:
          type: string
          nullable: true
          description: |
            Появляется после подключения объектного хранилища. До тех пор
            договор существует как запись с полями и версией, но файла нет:
            выдать ссылку в никуда хуже, чем честно вернуть null.
        docxUrl:
          type: string
          nullable: true
        fields:
          type: object
          additionalProperties: true
          description: 'Подставленные значения: стороны, дата, сумма, город.'
        createdAt:
          type: string
          format: date-time
    TimelineReference:
      type: object
      required:
        - kind
        - id
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - member
            - guest
            - deal
        id:
          type: string
          format: uuid
      description: >-
        Участник своей свадьбы: живой член команды, персона гостей или забронированная сделка (включая своего
        подрядчика). Только ID и тип, без финансовых данных.
    TimelineEvent:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
          description: ID существующего блока; для нового блока поле не передаётся
        eventId:
          type: string
          format: uuid
          description: >-
            Мероприятие своей свадьбы. Пропущено у существующего блока — связь сохраняется; у нового — основное
            мероприятие. В гостевой проекции отсутствует. Legacy guest day показывает только разрешённые блоки основной
            программы до подключения индивидуальных приглашений.
        name:
          type: string
          example: Выездная церемония
        location:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        who:
          type: string
          description: кто отвечает
        icon:
          type: string
          example: 🌅
          description: |
            Значок блока. Приходит с сервера, потому что шаблон тайминга
            собирается там при создании свадьбы: клиент не знает, что «Сборы
            невесты» — это рассвет, а «Первый танец» — музыка, и подбирать
            значок по названию значит гадать по строке.
        outdoor:
          type: boolean
          description: блок под открытым небом — к нему привязывается план Б
        forGuests:
          type: boolean
          default: true
          description: |
            Видят ли блок гости в день X (`GET /join/{guestToken}/day`). По
            умолчанию да — программа праздника; «Сборы невесты» и «Монтаж
            арки» пара снимает галочкой (План §8.8, фича 009).
        durationMinutes:
          type: number
          nullable: true
          minimum: 0
          maximum: 10080
          description: >-
            Длительность в минутах; допустима до назначения начала. При начале и длительности сервер вычисляет
            окончание; противоречащие значения отклоняются. Только в полном тайминге команды.
        fixed:
          type: boolean
          description: >-
            Фиксированное начало: нужно startsAt; автоматический сдвиг не двигает блок. Только в полном тайминге
            команды.
        travelMinutes:
          type: number
          minimum: 0
          maximum: 10080
          description: Ручное время переезда, без автоматической оценки маршрута. Только для команды.
        bufferMinutes:
          type: number
          minimum: 0
          maximum: 10080
          description: Ручной запас времени. Только для команды.
        dependsOn:
          type: array
          maxItems: 60
          items:
            type: string
            format: uuid
          description: >-
            Уникальные ID других блоков сохраняемой программы; чужие, удалённые, собственный ID и циклы запрещены. В
            гостевой проекции отсутствует.
        responsible:
          allOf:
            - $ref: '#/components/schemas/TimelineReference'
          nullable: true
          description: Один ответственный; null снимает назначение. В гостевой проекции отсутствует.
        participants:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/TimelineReference'
          description: >-
            Уникальные участники. В гостевой проекции отсутствует. Удаление персоны/членства, мягкое удаление аккаунта
            или отмена сделки снимает назначения и меняет версию.
    WeddingEventKind:
      type: string
      enum:
        - registration
        - nikah
        - ceremony
        - banquet
        - second_day
        - other
    WeddingEvent:
      type: object
      required:
        - id
        - name
        - kind
        - date
        - timeZone
        - location
        - isMain
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/WeddingEventKind'
        date:
          type: string
          format: date
          nullable: true
        timeZone:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        isMain:
          type: boolean
    EventInvitationRoster:
      type: object
