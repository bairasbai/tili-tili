      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: receiptId
          in: path
          required: true
          schema:
            type: string
            format: uuid
