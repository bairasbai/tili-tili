  /weddings/{weddingId}/payments/{paymentId}/receipts:
    get:
      tags:
        - payments
      summary: Приватные подтверждения оплаты
      description: |
        Список файлов к ручной отметке оплаты — без содержимого. Только пара.
        Подтверждение — файл пары, а не проверка банка: приложение не сверяет его
        с движением денег. `uploadEnabled` — включена ли загрузка новых на сервере
        (`RECEIPTS_STORAGE`); выключена — экран не предлагает загрузку, а уже
        загруженные файлы читаются и удаляются.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - uploadEnabled
                properties:
                  uploadEnabled:
                    type: boolean
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - filename
                        - mimeType
                        - sizeBytes
                        - createdAt
                      properties:
                        id:
                          type: string
                          format: uuid
                        filename:
                          type: string
                        mimeType:
                          type: string
                        sizeBytes:
                          type: integer
                        createdAt:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - payments
      summary: Прикрепить приватное подтверждение оплаты
      description: |
        Файл PDF, JPEG, PNG или WebP до 512 КиБ в base64; тип проверяется по
        содержимому, а не по `mimeType` браузера — несовпадение 422. Загрузка не
        включена на сервере (`RECEIPTS_STORAGE` пуст) — 501 `storage_not_configured`.
        К одной оплате — не больше 5 файлов: шестой — 409 `receipt_limit`; у свадьбы
        кончилась квота (по умолчанию 50 файлов и 25 МиБ) — 409 `receipt_quota`.
        Имя файла чистится: разделители пути и управляющие символы — в «_»,
        невидимые символы формата Unicode убираются, расширение приводится к
        проверенному типу; в ответе — имя, под которым файл сохранён. Без
        `Idempotency-Key` — 400 `idempotency_key_required`; тот же ключ с другим
        телом — 409 `idempotency_key_reused`, первый запрос ещё идёт — 409
        `idempotency_in_progress`. Ключ — на одну попытку загрузки: другой файл
        с тем же ключом — 409 `idempotency_key_reused`. Только пара.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filename
                - mimeType
                - contentBase64
              properties:
                filename:
                  type: string
                  minLength: 1
                  maxLength: 180
                mimeType:
                  type: string
                  enum:
                    - application/pdf
                    - image/jpeg
                    - image/png
                    - image/webp
                contentBase64:
                  type: string
                  maxLength: 720000
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - filename
                  - mimeType
                  - sizeBytes
                  - createdAt
                properties:
                  id:
                    type: string
                    format: uuid
                  filename:
                    type: string
                  mimeType:
                    type: string
                  sizeBytes:
                    type: integer
                  createdAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '501':
          $ref: '#/components/responses/NotConfigured'
  /weddings/{weddingId}/payments/{paymentId}/receipts/{receiptId}/content:
    get:
      tags:
        - payments
      summary: Скачать приватное подтверждение оплаты
