        Поиск prefix-first, ё→е, минимум 2 символа. Ответ отсортирован: точный префикс → население.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            example: сиб
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
            maximum: 50
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
