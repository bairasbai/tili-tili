openapi: 3.0.3
info:
  title: Тили-тили API
  version: 0.69.0
  description: >
    Контракт бэкенда для PWA «Тили-тили» (tili-tili.ru) — свадебный планировщик.

    Фронтенд (React) уже работает на моках; этот файл — единственный источник правды для бэкенда (Claude Code).


    ## Решения владельца 2026-09-02 (контракт v0.2)

    - Деньги — объект `{ amount: копейки, currency: ISO 4217 }` у КАЖДОЙ суммы.
      Не одна валюта на свадьбу: план §19.7 описывает свадьбу за границей, где
      сделка в евро, а бюджет в рублях. В MVP принимается только RUB.
    - У слота нет собственного статуса. Слот либо пуст, либо несёт сделку;
      состояние живёт в `Deal.state` — шесть значений. `Slot.tileState` —
      производная подпись для мозаики, только для чтения.
    - Гостевая ссылка опознаёт одно приглашение/семью (`guest_party`), а не
      одну строку человека. Внутри ссылки 1–10 отдельных персон со своими
      RSVP, меню, столом и автобусом; отель и подарки принадлежат приглашению.
      Токен семьи используется во всех гостевых путях (`/rsvp/{guestToken}`,
      `/gifts/{guestToken}`, `/join/{guestToken}/…`) и API пары его никогда
      не отдаёт напрямую (§9).
    - Переноса данных с localStorage-моков не будет: реальных пользователей не
      было, эндпоинт импорта не заводится.

    ## Роли

    - `couple` — молодожёны (владельцы свадьбы): полный доступ.

    - `helper` — помощник (друг/родственник): орг-разделы, без бюджета и сделок.

    - `coordinator` — координатор: командует днём X (тайминг, чаты подрядчиков), без бюджета и оплат.

    - `vendor` — подрядчик: свои сделки, лиды, чаты, анкета.

    - `guest` — гость: только RSVP по ссылке приглашения.


    ## Принципы

    - Все даты — ISO 8601 (`2027-06-14`), дата-время — UTC RFC 3339.

    - Деньги — integer в **копейках** (минорных единицах) + код валюты ISO 4217.
      Решение владельца 2026-09-02. Пример: 85 000 ₽ = `{ "amount": 8500000, "currency": "RUB" }`.
      Дробных сумм в JSON не бывает; показ рублей — задача клиента.
    - Пагинация: `?limit=20&cursor=...` → `{ items, nextCursor }`.

    - Живые обновления — WebSocket `wss://…/ws?token=<access>`. События: `message.created`,
      `deal.state_changed`, `timeline.shifted`, `seating.updated`, `menu.poll.updated`,
      `notification.created`. Клиент без WebSocket опрашивает REST раз в 30 с (§13.4).
      OpenAPI 3.0 не описывает WS-каналы — контракт событий ведётся здесь.
    - Ошибки: `{ "error": { "code": "string", "message": "string" } }`.

    - Идемпотентность мутаций оплаты/брони — через `Idempotency-Key` header.


    ## Общие коды ошибок (не привязаны к одной операции)

    Могут прийти у любой операции, если не сказано иное:

    - `unauthorized` (401) — любая операция за входом; у гостевых см. описание `GuestToken`.

    - `token_expired` (401) — просроченный access-токен; у живого канала — закрытие 4401.

    - `forbidden` (403) — живого согласия нет вовсе (не давали или отозвали), роли или стороны недостаточно; согласие
    под прежней редакцией — не `forbidden`, а `consent_outdated`.

    - `consent_outdated` (403) — согласие есть, но под прежней редакцией политики: нужно подтвердить новую (см. `POST
    /users/me/consent`); у живого канала чата — закрытие 4403 с тем же кодом.

    - `not_found` (404) — чужой или несуществующий идентификатор, либо неизвестный адрес.

    - `validation_failed` (422) — нарушение схемы запроса; поле-виновник — в `error.fields`.

    - `invalid_json` (422) — тело запроса не является JSON.

    - `invalid_character` (422) — NUL-байт в адресе, строке запроса или теле.

    - `payload_too_large` (413) — тело запроса больше 1 МиБ.

    - `unsupported_media_type` (415) — тело не `application/json`.

    - `bad_content_length` (400) — заголовок `Content-Length` не совпал с телом.

    - `rate_limited` (429) — превышен общий лимит запросов (кроме `/health*`); ответ несёт `Retry-After`.

    - `internal` (500) — необработанная ошибка сервера; тело несёт идентификатор запроса для поддержки.

    - `money_overflow` (500) — денежная сумма в базе вышла за пределы точного представления.

    - `db_unavailable` (503) — база данных недоступна.

    - `not_configured` (503) — секрет для отправки SMS-кодов не настроен на сервере.

    - `code_collision` (503) — генератор человекочитаемого кода исчерпал попытки подобрать свободный.


    ## Коды экосистемы: заказ, условия и ресурсы

    Относятся к соответствующим операциям; наличие кода не подтверждает бронь или готовность.

    - `additional_event_booking_pending` (409) — старый дневной способ брони ещё не представляет отдельное мероприятие.

    - `event_date_conflict` (409) — дата или пояс основного мероприятия отличаются от свадьбы.

    - `booking_date_required` (409) — замена дневной брони требует явно заданной даты свадьбы.

    - `slot_assigned` (409) — позиция уже связана с действующим назначением другого заказа.

    - `external_deal_changed` (409) — внешний заказ позиции изменился во время ожидания.

    - `order_part_cancelled` (409) — часть черновика уже отменена.

    - `order_version_conflict` (409) — версия заказа или его строки изменилась; обновить источник и проверить ввод.

    - `resource_capacity_used` (409) — заявленная мощность меньше уже записанного использования.

    - `resource_person_exists` (409) — ресурс этого аккаунта уже существует у компании, включая историю.

    - `resource_policy_empty` (409) — для выбранного учёта нет действующего реального ресурса.

    - `resource_plan_unavailable` (409) — выбранный ресурс, человек или компания недоступны для новой редакции плана.

    - `resource_retired` (409) — ресурс уже отключён.

    - `resource_source_changed` (409) — владелец компании изменился.

    - `resource_booking_conflict` (409) — ресурс или прежняя дневная занятость пересекаются с выбранным интервалом.

    - `resource_booking_required` (409) — дневная бронь недоступна: нужен согласованный заказ с бронью ресурсов.

    - `resource_capacity_exhausted` (409) — в выбранном окне недостаточно свободной мощности.

    - `resource_commitment_changed` (409) — версия или состав действующей брони изменились; обновить заказ.

    - `resource_commitment_invalid` (409) — история действующей брони недоступна или не соответствует источнику.

    - `resource_deal_finished` (409) — выполненный финансовый заказ не принимает новую бронь ресурсов.

    - `resource_initial_booking_required` (409) — первичная бронь требует заказа на этапе согласования.

    - `resource_order_slot_changed` (409) — выбор исполнителя позиции изменился во время подготовки заказа.

    - `resource_order_source_changed` (409) — выбранный заказ, его компания или источник подготовки изменились.

    - `resource_person_unavailable` (409) — участие выбранного человека в компании недоступно.

    - `resource_plan_changed` (409) — для брони нужен точный непустой согласованный план текущей редакции.

    - `resource_plan_invalid` (409) — сохранённый план не соответствует текущему заказу или исполнителю.

    - `resource_policy_required` (409) — операция требует действующего режима ресурсов компании.

    - `resource_replacement_required` (409) — для уже существующей брони нужна отдельная операция замены.

    - `resource_reschedule_requires_agreement` (409) — перенос свадьбы требует отдельного согласования уже
    забронированных ресурсов.

    - `resource_slot_changed` (409) — позиция или выбранный финансовый заказ изменились.

    - `resource_terms_not_agreed` (409) — выбранная редакция условий не имеет необходимого согласования обеих сторон.

    - `resource_terms_source_changed` (409) — условия или их источник изменились; требуется текущая редакция.

    - `resource_vendor_required` (409) — для брони нужен действующий исполнитель.

    - `vendor_profile_scope_changed` (409) — связанные заказы или отсутствие анкеты изменились во время сохранения;
    обновить данные.

    Внутренние операции освобождения и удаления дополнительно используют коды (409)

    `resource_erasure_scope_changed` — состав удаляемых обязательств изменился,

    `resource_release_source_missing` — источник удалён до освобождения ресурсов,

    `resource_release_requires_cancellation` — финансовый заказ ещё не отменён,

    `resource_release_requires_erasure` — источник ещё не подлежит удалению.

    Эти отказы не подтверждают освобождение ресурсов и не являются отдельными публичными операциями.

    - `resource_window_overlap` (409) — заявленные окна одной мощности пересекаются.

    - `terms_performer_unavailable` (409) — аккаунт исполнителя или выбранный ресурс недоступен для текущего
    согласования.

    - `terms_proof_unavailable` (503) — сервер не может выдать доказательство просмотра редакции.

    - `terms_read_expired` (409) — доказательство просмотра истекло; открыть редакцию снова.

    - `terms_source_changed` (409) — источник условий изменился после чтения.

    - `terms_superseded` (409) — выбранная редакция заменена новой предложенной.

    - `terms_external_performer` (409) — защитный отказ: внешний контакт не является аккаунтом стороны исполнителя.

    - `unknown_category` (422) — категория заказа не поддерживается каталогом полей.

    В `error.fields` ответа `validation_failed` могут находиться диагностические значения

    `invalid_brief`, `invalid_subtype`, `invalid_type`, `unknown_field`, `too_long`,

    `too_many_items`, `out_of_range`, `invalid_value`; это причины ошибки конкретного поля,

    а не самостоятельные HTTP статусы или обещание автоматического заполнения.

    Внутренние доменные команды, пока не опубликованные отдельными HTTP операциями, используют

    `slot_limit`, `staff_duty_exists`, `staff_member_exists`, `staff_source_changed`,

    `staff_version_conflict` для отказа при превышении лимита, повторном действующем назначении,

    уже существующем сотруднике или изменившемся источнике/версии. Эти имена не означают,

    что публичный интерфейс управления сотрудниками уже доступен.
servers:
  - url: https://api.tili-tili.ru/v1
  - url: http://localhost:8080/v1
tags:
  - name: auth
  - name: weddings
  - name: invites
  - name: geo
  - name: catalog
  - name: bookings
  - name: budget
  - name: guests
  - name: tasks
  - name: chats
  - name: vendor
  - name: notifications
paths:
  /auth/otp:
    post:
      tags:
        - auth
      security: []
      summary: Запросить код из SMS
      description: |
        Регистрация и вход — один и тот же шаг: аккаунт заводится при первой
        успешной проверке кода. Пароля в продукте нет (экран /auth во фронте).
        Ответ одинаков и для нового, и для известного номера — иначе по нему
        можно перебором узнать, зарегистрирован ли человек.

        Лимиты выдачи кода (фича 005): по паре «номер + адрес» — 3 в час, по
        номеру — 10 в час и 30 в сутки, по адресу — как прежде. Каждый 429
        `too_many_requests` несёт `Retry-After` в секундах. Чужой номер пятью
        запросами больше не закрыть: посторонний с одного адреса упирается в
        свой лимит, а владелец номера с другого адреса код получает. Номер не
        похож на телефон — 422 `bad_phone`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  example: '+79171234567'
                  description: E.164; на фронте вводятся 10 цифр после +7
      responses:
        '200':
          description: Код отправлен
          content:
            application/json:
              schema:
                type: object
                required:
                  - expiresIn
                  - resendAfter
                properties:
                  expiresIn:
                    type: integer
                    example: 300
                    description: сколько секунд код действителен
                  resendAfter:
                    type: integer
                    example: 60
                    description: через сколько секунд можно запросить повторно
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          description: SMS-провайдер не ответил или отказал — код не отправлен (sms_failed)
  /auth/otp/verify:
    post:
      tags:
        - auth
      security: []
      summary: Обменять код на токены
      description: |
        Аккаунт, удалённый через `DELETE /users/me` не больше 30 дней назад,
        при входе тем же номером восстанавливается: `deleted_at` снимается,
        в журнал аудита пишется `user.restored`, данные на месте. Отозванное
        при удалении согласие даётся заново — ответ несёт `consentRequired`
        как у нового аккаунта. Старше 30 дней строка стирается при входе (или
        уборкой раньше), и вход заводит новый аккаунт (фичи 005/014). Код
        сверяется со всеми живыми кодами номера: чужой запрос кода на ваш
        номер ваш код не отменяет; попытки считаются, после пяти неверных —
        429 `too_many_requests` (ревью 015). Номер не похож на телефон — 422
        `bad_phone`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                  example: '+79171234567'
                code:
                  type: string
                  example: '4821'
                device:
                  type: string
                  example: iPhone · Safari
                  description: подпись для экрана «Сессии и устройства»
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags:
        - auth
      security: []
      summary: Обновление access-token
      description: |
        Refresh одноразовый: при обмене старый гасится, выдаётся новый.
        Повторное предъявление уже погашенного — 401 `refresh_superseded`,
        признак кражи, и тогда гасятся ВСЕ сессии пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/oauth/{provider}:
    get:
      tags:
        - auth
      summary: OAuth-вход (VK, Yandex, Google, Telegram)
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - vk
              - yandex
              - google
              - telegram
      security: []
      responses:
        '302':
          description: Редирект на провайдера
        '501':
          $ref: '#/components/responses/NotConfigured'
  /weddings:
    get:
      tags:
        - weddings
      summary: Мои свадьбы
      description: |
        Единственный способ найти свою свадьбу после переустановки приложения:
        идентификатор хранится только на устройстве, и с чистым localStorage
        восстановить его больше неоткуда. Отдаёт и те свадьбы, куда человека
        позвали помощником или координатором, — с его ролью в каждой.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Wedding'
                    - type: object
                      properties:
                        role:
                          type: string
                          enum:
                            - couple
                            - helper
                            - coordinator
                            - vendor
    post:
      tags:
        - weddings
      summary: Создать свадьбу (после квиза)
      description: |
        Город не найден в справочнике — 404 (ARB-4). Дата свадьбы вне
        диапазона «год назад … пять лет вперёд» — 422 `date_out_of_range`;
        несуществующий день вроде 30 февраля — 422 `bad_date`.

        Ответы квиза (фича 018) — кодами, а не подписями вариантов: `format`
        и `planner` меняют состав мозаики и тайминг (см. `WeddingFormat`,
        `WeddingPlanner`), `prebooked` ставит слотам этих категорий отметку
        «уже забронировано вне приложения» (`Slot.prebooked`), а задачи шаблона
        «Забронировать площадку», «Найти фотографа», «Забронировать ведущего»
        заводит выполненными. Всё — в той же транзакции, что и сама свадьба.
        Неизвестный код, повтор или больше четырёх значений в `prebooked` —
        422 `validation_failed` с полем в `error.fields`. Без этих полей — как
        до фичи: 12 слотов шаблона и тайминг выездной церемонии.
        Название свадьбы — «имя из профиля ♥ `partnerName`» (без имени в
        профиле — только `partnerName`): квиз сохраняет имя в профиль
        (`PATCH /users/me`) до этого вызова.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - partnerName
                - city
              properties:
                partnerName:
                  type: string
                  example: Тимур
                date:
                  type: string
                  format: date
                  example: '2027-06-14'
                city:
                  $ref: '#/components/schemas/CityRef'
                budgetTotal:
                  $ref: '#/components/schemas/Money'
                guestsPlanned:
                  type: integer
                  example: 80
                style:
                  type: string
                  example: нежная классика
                format:
                  $ref: '#/components/schemas/WeddingFormat'
                planner:
                  $ref: '#/components/schemas/WeddingPlanner'
                attentionMode:
                  type: string
                  enum:
                    - essential
                    - coordinator
                    - detailed
                  default: essential
                  description: необязательный режим внимания; координатора выбирают из принятой команды позднее
                prebooked:
                  type: array
                  uniqueItems: true
                  maxItems: 4
                  items:
                    $ref: '#/components/schemas/PrebookedCategory'
                  description: что уже забронировано вне приложения; пустой массив — «Пока ничего»
                quizAnswers:
                  type: object
                  additionalProperties: true
                  description: >-
                    сырые ответы квиза подписями вариантов — сервер их принимает, но не хранит и не читает: значимые
                    ответы приходят кодами (`format`, `planner`, `prebooked`)
      responses:
        '201':
          description: Свадьба создана; создатель — `couple`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wedding'
        '404':
          description: город не найден в справочнике
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `wedding_exists` — у пары уже есть живая свадьба (не отменена и
            не в архиве); вторая заводится только после её отмены или
            завершения. Тело ошибки несёт `weddingId` существующей в `details`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Validation'
  /weddings/{weddingId}:
    get:
      tags:
        - weddings
      summary: Карточка свадьбы (данные для Home)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wedding'
    patch:
      tags:
        - weddings
      summary: Обновить (дата, город, бюджет, стиль)
      description: |
        Правка `date` — это ПЕРЕНОС: она проходит тот же путь, что
        `POST /weddings/{weddingId}/reschedule`, и тянет за собой занятость
        в календарях подрядчиков, сроки задач чек-листа, время блоков тайминга
        и час открытия чата дня X. Если кто-то из забронированной команды занят
        на новую дату — 409 `team_busy`, и не меняется ничего; дата уже
        занята у своего же подрядчика — 409 `date_taken`.

        Дата свадьбы принимается в диапазоне «год назад … пять лет вперёд»
        (решение владельца 2026-09-03); за его пределами — 422
        `date_out_of_range`. Несуществующий день вроде 30 февраля — 422 `bad_date`.
        Незнакомый `tz` (не из справочника IANA) — 422 `unknown_timezone`.
        Город не найден в справочнике — 404 (ARB-4).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                city:
                  $ref: '#/components/schemas/CityRef'
                budgetTotal:
                  $ref: '#/components/schemas/Money'
                guestsPlanned:
                  type: integer
                style:
                  type: string
                venue:
                  type: string
                  maxLength: 200
                tz:
                  type: string
                  maxLength: 64
                  description: явный пояс важнее пояса города
                inviteText:
                  type: string
                  maxLength: 2000
                  description: обращение пары в приглашении — его видит гость
                inviteThemeId:
                  type: integer
                  minimum: 0
                  maximum: 9
                  description: |
                    Сценарий оформления приглашения. Хранится у свадьбы, а не в
                    браузере пары: гость открывает приглашение со своего
                    устройства, и тема должна приехать к нему вместе с текстом.
                dressCode:
                  type: string
                  nullable: true
                  maxLength: 32
                  description: >-
                    идентификатор палитры дресс-кода (План ч. 295) — по той же причине, что и тема; null — снять
                    дресс-код
                dressNote:
                  type: string
                  nullable: true
                  maxLength: 300
                  description: 'пожелание словами: «дамы — без белого»; null — убрать пожелание'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wedding'
        '404':
          description: город не найден в справочнике
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
