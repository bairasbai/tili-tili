  /weddings/{weddingId}/guests/import:
    post:
      tags:
        - guests
      summary: Завести гостей списком
      description: |
        Пара вставляет список из заметок или таблицы; экран разбирает строки.
        Сервер принимает primary person плюс необязательные `members[]`;
        legacy `plusOne=true` остаётся совместимым, но материализуется как
        отдельная placeholder-персона, а не скрытый множитель. Всё заводится
        одной транзакцией (фича 008 + этап 020, План
        §20.1 экран 29). Дубликаты пропускаются, а не обновляются: совпадение
        имени (без учёта регистра и лишних пробелов) или телефона с уже
        существующим гостем свадьбы или с другой строкой того же запроса —
        `skipped` с причиной `duplicate`. Телефон нормализуется к `+7XXXXXXXXXX`
        (принимаются `8…`, `7…`, `+7…`); не распознанный — `invalid`, строка не
        заводится, остальные — заводятся. Повтор того же списка добавляет ноль.
        Права — как у `POST …/guests` (вся команда свадьбы).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WeddingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - guests
              properties:
                guests:
                  type: array
                  minItems: 1
                  maxItems: 300
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        minLength: 2
                        maxLength: 120
                      phone:
                        type: string
                        maxLength: 32
                      plusOne:
                        type: boolean
                        default: false
                        deprecated: true
                      members:
                        type: array
                        maxItems: 9
                        items:
                          type: object
                          required:
                            - name
                          additionalProperties: false
                          properties:
                            name:
                              type: string
                              minLength: 2
                              maxLength: 120
                      group:
                        type: string
                        maxLength: 60
      responses:
        '201':
          description: Список заведён; что пропущено — в `skipped`
          content:
            application/json:
              schema:
                type: object
                required:
                  - created
                  - skipped
                properties:
                  created:
                    type: array
                    items:
                      $ref: '#/components/schemas/Guest'
                  skipped:
                    type: array
                    items:
                      type: object
                      required:
                        - index
