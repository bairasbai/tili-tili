<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      /*
       * Deep-link шим для статического хостинга без SPA-fallback.
       * Прямой заход на /wedding/guests отдаёт index.html, но относительные пути
       * ассетов (сборка идёт с base: './') разрешились бы от /wedding/, а не от
       * корня приложения. Поэтому уводим на корень, а main.tsx восстанавливает
       * адрес из tt_redirect.
       *
       * Скрипт стоит первым в head: до него не должно быть ни одной загрузки.
       * Список сегментов обязан покрывать первые сегменты всех роутов App.tsx —
       * это закреплено тестом src/lib/deeplink.test.ts, иначе он молча разъедется.
       */
      (function () {
        var SEGMENTS = ['quiz', 'invite', 'i', 'auth', 'join', 'home', 'notifications', 'settings', 'support', 'search', 'legal', 'vendor-app', 'vendor', 'compare', 'favorites', 'notes', 'tools', 'wedding', 'gifts', 'deal', 'assistant', 'dayx', 'after', 'us', 'inspiration', 'venues', 'admin']
        var p = window.location.pathname
        if (p === '/' || /\/$/.test(p) || p === '/index.html' || /\.[a-z0-9]+$/i.test(p)) return
        try { sessionStorage.setItem('tt_redirect', p + window.location.search + window.location.hash) } catch (e) { /* приватный режим */ }
        var m = p.match(new RegExp('^(.*?)\\/(' + SEGMENTS.join('|') + ')(\\/|$)'))
        window.location.replace(m && m[1] ? m[1] + '/' : '/')
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF6F1" />
    <meta name="description" content="Тили-тили — вся свадьба в одном приложении" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <!-- iOS не понимает SVG в apple-touch-icon: без PNG на «экране Домой» стоял
         бы серый квадрат со скриншотом (аудит 2026-09-07, блок 9). -->
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Тили-тили" />
    <!-- Шрифты подключены здесь, а не @import внутри CSS: браузер начинает их
         качать сразу, не дожидаясь загрузки и разбора всего бандла стилей. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700;800&display=swap" />
    <title>Тили-тили — свадьба в одном приложении</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
