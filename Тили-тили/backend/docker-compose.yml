# Локальная разработка. В проде PostgreSQL — управляемая БД Timeweb,
# Redis живёт на VPS рядом с приложением (см. BACKEND-PLAN.md §1.1).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tili
      POSTGRES_PASSWORD: tili
      POSTGRES_DB: tili
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tili -d tili"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Секреты берутся из .env и в репозиторий не попадают. Файл необязателен,
    # иначе `docker compose up -d db redis` падал бы до того, как поднимет базу.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      DATABASE_URL: postgres://tili:tili@db:5432/tili
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "3000:3000"

volumes:
  db-data:
  redis-data:
