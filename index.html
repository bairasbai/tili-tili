<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF6F1" />
    <meta name="description" content="Тили-тили — вся свадьба в одном приложении" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Тили-тили" />
    <title>Тили-тили — свадьба в одном приложении</title>
    <script>
      // Deep-link шим для статического хостинга: /join/XXX → / → restore
      (function () {
        var p = window.location.pathname
        if (p !== '/' && p !== '/index.html' && !/\.[a-z0-9]+$/i.test(p)) {
          sessionStorage.setItem('tt_redirect', p + window.location.search + window.location.hash)
          window.location.replace('/')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
