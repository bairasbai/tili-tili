# Тили-тили — nginx перед приложением (блокер №19, фича 014).
#
# Один origin на всё: статика PWA с этого сервера, API — прокси на бэкенд по
# префиксу /api/. Так фронт собирается без VITE_API_URL (клиент по умолчанию
# ходит на /api), CORS не нужен, cookie-ключей нет, а сервис-воркер кэширует
# только свою сборку (app/public/sw.js кладёт в кэш лишь ./assets/ и оболочку).
#
# TLS здесь не описан намеренно: его снимает балансировщик Timeweb или certbot
# на хосте (DEPLOY.md, шаг 3). Этот файл слушает 80 внутри контейнера `web`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Заголовки безопасности. nginx не наследует add_header частично: location
    # со своим add_header (Cache-Control ниже) теряет все серверные — поэтому
    # эти три строки повторены в каждом static location (R-283). CSP здесь не
    # ставится: в index.html его нет (прежний комментарий был неверен) — список
    # источников для CSP остаётся решением владельца, а не текущей реализацией.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # ── API ────────────────────────────────────────────────────────────────
    # /api/чтото → бэкенд /чтото. Хвостовой слеш в proxy_pass снимает префикс.
    # Живой канал чатов — WebSocket (`/api/chats/{id}/ws`), поэтому Upgrade
    # прокидывается всегда; таймаут чтения — час, иначе nginx рвёт тихий сокет
    # через минуту и клиент падает обратно на опрос.
    location ^~ /api/ {
        # API ETag — точная версия для If-Match. gzip превращает strong ETag
        # в weak, который сервер обязан отвергать; сохраняем исходный ответ.
        gzip off;
        # Лог запросов к API — у бэкенда (он маскирует токены в пути и строке
        # запроса, backend/src/redact.ts). nginx писал бы `$request`
        # целиком: `/api/chats/{id}/ws?token=<JWT>`, `/api/join/<токен гостя>/…`
        # — действующие токены в stdout контейнера (ревью 015).
        access_log off;
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Бэкенд читает адрес клиента из X-Forwarded-For только при TRUST_PROXY=1
        # (число прокси впереди). Здесь прокси один — nginx; балансировщик
        # Timeweb перед ним — второй, тогда TRUST_PROXY=2.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        # Ответы API не кэшируются нигде — ни здесь, ни в браузере (сервер шлёт
        # Cache-Control: no-store сам). Тело до 1 МБ — как лимит бэкенда.
        proxy_buffering off;
        client_max_body_size 1m;
    }

    # ── Сборка Vite ─────────────────────────────────────────────────────────
    # Имена файлов несут хеш содержимого — кэшировать можно навечно.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Preload-сканер может запросить относительный файл сборки до редиректа
    # deep-link шима. /wedding/assets/name.css должен получить тот же CSS,
    # что /assets/name.css, а отсутствующий файл — 404 вместо index.html.
    # Внутренний rewrite сохраняет MIME, cache и security headers блока выше.
    # Канонические /api/ и /assets/ защищены ^~ от этого regex location.
    location ~ ^/(?:[^/]+/)+assets/([^/]+)$ {
        rewrite ^/(?:[^/]+/)+assets/([^/]+)$ /assets/$1 last;
    }

    # Сервис-воркер и манифест — всегда свежие: воркер сам решает, что кэшировать,
    # и новая версия должна доезжать при первом заходе, а не через сутки.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # ── SPA-fallback (блокер №19) ───────────────────────────────────────────
    # Любой путь приложения — /wedding/guests, /vendor/abc, /admin — отдаёт
    # index.html: маршруты живут в браузере (react-router). Файлы, которых нет,
    # тоже уходят в index.html — это ожидаемо для SPA, шим в index.html ведёт
    # на корень приложения и восстанавливает адрес.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
